  preconditions:
  - 已获得仅用于表单校验观察且不会产生业务写入的明确授权。
  steps:
  - action: 点击“新增设备”。
    expected: 新增设备表单打开，并显示设备名称输入框。
  - action: 保持设备名称为空，填写其他必要字段并点击“保存”。
    expected: 设备名称字段显示明确必填提示，提示定位在名称字段或其相邻校验区域，表单保持打开且未新增设备。
  - action: 查询设备列表。
    expected: 列表不出现名称为空的新设备记录。
