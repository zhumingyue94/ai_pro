  name: 登录并进入设备管理页面
  steps:
  - action: 完成应用门户登录，或复用已有的有效登录态。
    expected: 登录成功或已有登录态有效，可以正常访问应用门户。
  - action: 在应用门户选择“数据采集监控平台”。
    expected: 成功进入数据采集监控平台，并显示对应的平台菜单区域。
  - action: 展开“设备接入”菜单并点击“设备管理”菜单。
    expected: 设备管理页面成功加载，浏览器地址包含“/biopark-iot/iot/device/device”，确认已进入设备管理页面。
