  - 已记录删除前表单字段：插件名称、类型、端口及连接配置；删除后使用相同值，不使用原系统生成的唯一标识。
  steps:
  - action: 使用隔离数据创建一条插件并记录名称、类型、端口、重启策略和连接配置。
    expected: 创建成功，记录字段值完整。
  - action: 停用并删除该插件，刷新列表。
    expected: 删除成功，目标插件 ID不再出现在列表中。
  - action: 使用与首次创建相同的业务字段重新填写新建表单并点击“保存”。
    expected: 重建提交成功，显示新增成功提示。
  - action: 刷新列表并打开重建插件详情。
    expected: 名称、类型、端口、重启策略和连接配置与首次创建记录一致；插件 ID、创建时间等系统生成字段可按系统规则重新生成。
  - action: 按清理方案删除重建的测试插件。
    expected: 测试数据清理完成，列表不再显示测试记录。
  test_data:
    page_url: /biopark-iot/iot/device/device-protocol
    data_prefix: REQ-006-DELETE-RECREATE-

