  title: 新建规则时，检查停用依赖不可选
  type: interface
  auto: auto
  priority: P2
  feature: 依赖状态
  common_preconditions_ref: CP-REQ-007-001
  preconditions:
  - 已获得未发布产品、停用数据推送、停用告警配置及新建规则选择结果的批准证据。

  steps:
  - action: 在数据监听页面点击“新增监听规则”按钮。
    expected: 新建监听规则表单成功打开，并显示产品、触发器和执行动作等配置区域。
  - action: 在新建监听规则表单中展开产品选择框并查看未发布的产品。
    expected: 未发布的产品不出现在产品选择框的可选项中，或显示为不可选择。
  - action: 在配置监听器规则表单中展开产品选择框，查看已发布产品与未发布产品的选项状态。
    expected: 已发布产品可按权限正常选择；未发布产品保持不可选，不能被回填到规则表单。
  - action: 在配置触发器表单中选择执行类型“消息推送”，展开推送目标选择框并查看停用的数据推送。
    expected: 停用的数据推送不出现在推送目标选择框的可选项中，或显示为不可选择，不能被回填。
  - action: 在配置触发器表单中选择执行类型“触发告警”，展开告警配置选择框并查看停用的告警配置。
    expected: 停用的告警配置不出现在告警配置选择框的可选项中，或显示为不可选择，不能被回填。
  - action: 在配置触发器表单中选择执行类型“取消告警”，展开告警配置选择框并查看停用的告警配置。
