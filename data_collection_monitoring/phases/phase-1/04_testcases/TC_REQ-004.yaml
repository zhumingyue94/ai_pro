  common_preconditions_ref: null
  preconditions:
  - 已获得同一设备多分组及加入/移出后的批准脱敏回读证据。
  steps:
  - action: 切换到设备管理页面并定位隔离测试设备，打开编辑表单，在分组选择器中选择目标分组并点击“保存”。
    expected: 显示保存成功提示，设备编辑表单关闭或进入完成状态。
  - action: 返回设备分组页面并查询目标分组。
    expected: 目标分组设备数量增加 1，设备出现在该分组关联列表中。
  - action: 再次进入同一设备编辑表单，移除目标分组并点击“保存”。
    expected: 显示保存成功提示，设备不再关联目标分组。
  - action: 返回设备分组页面刷新并查询目标分组。
    expected: 设备数量恢复到变更前值，设备不再出现在目标分组关联列表中。
