  steps:
  - action: 等待列表加载完成。
    expected: 页面显示分类记录或明确空结果状态。
  - action: 查看列表表头。
    expected: 表头包含编号、分类名称、描述、状态、创建时间和操作列。
  - action: 查看空描述分类记录。
    expected: 描述为空时显示“-”或页面定义的统一空值占位符，不显示 `null`。
