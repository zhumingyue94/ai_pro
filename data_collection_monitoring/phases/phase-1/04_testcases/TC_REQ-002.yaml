common_preconditions:
- id: CP-REQ-002-001
  name: 登录并进入产品分类页面
  conditions:
  - 测试环境配置 UI_TEST_URL、UI_TEST_USERNAME、UI_TEST_PASSWORD 和 UI_TEST_TENANT。
  - 测试账号具备产品分类页面访问权限，浏览器为 Chromium。
  steps:
  - action: 完成应用门户登录，或复用已有的有效登录态。
    expected: 登录成功或已有登录态有效，可以正常访问应用门户。
  - action: 在应用门户选择“数据采集监控平台”。
    expected: 成功进入数据采集监控平台，并显示对应的平台菜单区域。
  - action: 展开“设备接入”菜单并点击“产品分类”菜单。
    expected: 产品分类页面成功加载，浏览器地址包含“/biopark-iot/iot/device/product-category”，确认已进入产品分类页面。
