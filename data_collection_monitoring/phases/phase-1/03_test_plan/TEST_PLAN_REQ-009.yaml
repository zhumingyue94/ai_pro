plan_id: TEST_PLAN-REQ-009
title: "数据采集监控平台数据采集测试计划"
status: draft
source_inputs:
  - "01_requirements/数据监控平台使用文档.pdf"
  - "01_requirements/需求变动.md"
  - "01_requirements/模块拆分清单.md"
  - "02_analysis/REQ-009.yaml"
  - "02_analysis/REQ-009.md"
  - "02_analysis/page_inventory/page.json"
  - "config.yaml"
  - "../../../.agents/references/test-plan.schema.json"
trace:
  story: "数据采集定时任务页面的只读验证计划，覆盖默认列表、任务名称/状态筛选、编辑字段契约、Cron/脚本/重启策略/内存限制、状态和执行异常边界、脱敏、排序、分页及权限；新建提交、控制动作、真实设备采集和接口验证被阻止"
  req: REQ-009
  project: "数据采集监控平台"
  version: 1
  status: draft
objective: "基于 REQ-009 最新确认项和 page.json 已采集事实，规划数据采集页面默认进入、任务名称/状态筛选、查询、重置、刷新、表头设置、表格、分页、排序、已创建/运行中/已停止业务状态、编辑表单字段、Cron/脚本/重启策略/内存限制、执行异常、引用变化、脱敏和权限租户边界的页面级验证。当前页面契约为 partial_blocked；新建弹窗、启动/停止/删除确认层、执行结果、权限/错误提示和稳定任务行数据不完整。本计划不执行保存、控制动作、真实调度、设备采集或接口验证。"
scope:
  in_scope:
    - "只读验证已登记 data_crawl 页面：运行时 URL /biopark-iot/iot/data/crawl、标题 数据采集 - 数据采集、菜单 数据中心→数据采集、默认状态 data_crawl_default。"
    - "只读验证已登记筛选 data_crawl_task_name、data_crawl_status，以及查询、重置、刷新、表头设置、新建、列表和分页元素。"
    - "只读验证已登记 data_crawl_table/data_crawl_table_element 及列：任务名称、插件 ID、状态、状态描述、创建时间、操作。"
    - "以已采集 data_crawl_status_options 记录页面观察到的已创建、运行中、已暂停、重启中、删除中、已停止、异常；正式业务状态只确认已创建、运行中、已停止，其余状态保持差异待确认。"
    - "只读检查已登记 data_crawl_edit 状态和编辑字段 data_crawl_edit_task_key、data_crawl_cron、data_crawl_common、data_crawl_script、data_crawl_restart、data_crawl_memory，以及取消/确定和内存调整控件；编辑值已脱敏，不提交。"
    - "规划新建任务标识、Cron、脚本必填，重启策略和内存限制可选；新建字段和确定/取消稳定 ID 尚不完整，不执行提交。"
    - "规划任务名称由系统自动前缀与用户填写任务标识拼接，自动前缀不可修改；不把缺失新建页面证据写成已验证事实。"
    - "规划仅创建定时任务，不包含采集协议/版本、设备范围、设备选择、批量/分组选择或字段映射；脚本负责采集字段、类型、单位、质量码和转换。"
    - "规划 Cron 默认时区、重复触发、批量/并发/互斥/错过调度、重启策略 no/on-failure/always/unless-stopped，以及设备离线、插件异常、脚本错误和部分成功的异常边界；不执行真实调度。"
    - "规划已创建→运行中→已停止、已停止再次启动/删除、引用变化继续使用原配置、引用失效导致执行失败及按重启策略处理；不执行启动、停止、删除或重跑。"
    - "规划采集值和设备标识按业务需要展示，认证信息、外部地址、消息和返回内容脱敏，日志不得明文保存。"
    - "规划默认/筛选/分页/刷新后的创建时间倒序、筛选回第一页、默认每页 10 条、无结果显示暂无数据及失败提示无页面重试入口；记录 page.json 观察每页 200 与公共默认 10 的差异。"
    - "规划数据采集管理员、插件/设备运维人员、平台运维人员和只读用户的角色、租户与跨租户边界；不从菜单、按钮或表单可见性推断写权限。"
  out_scope:
    - "新建提交、编辑提交、删除、启动、停止、重跑、真实任务执行、真实设备数据采集和跨模块写入。"
    - "采集协议/版本、设备范围、设备选择、批量/分组选择、字段映射及插件/设备/产品页面内部实现。"
    - "API endpoint、状态码、请求/响应结构、调度引擎实现、接口幂等和性能 SLA。"
    - "未确认的 Cron 默认值、时区细节、长度/内存上限、重试等待、断点续采、人工重跑和页面额外状态映射。"
    - "未登记的新建弹窗字段/操作 ID、启动/停止/删除确认层和异步状态 ID、执行详情/失败结果/权限/错误提示及稳定行数据定位器。"
    - "复用其他模块的 page/state/element/form/table/interaction/evidence ID；不得把其他模块事实写成数据采集页面契约。"
    - "测试点、测试用例、CSV、禅道数据和 UI 自动化脚本。"
strategy:
  - "采用黑盒、风险优先、限定范围只读规划；当前 readiness=blocked，页面执行项不得伪造通过或失败。"
  - "等价类覆盖任务标识合法/空/仅空白/超长/非法字符；Cron 合法/非法/系统默认时区；脚本合法/格式错误/缺失；重启策略 no/on-failure/always/unless-stopped；内存限制未配置/已配置/边界低/边界高/超限候选；任务状态已创建/运行中/已停止及观察额外状态；引用未变化/变化但可用/失效；执行成功/部分成功/设备离线/插件异常/脚本错误/失败；权限完整控制/只读/拒绝/跨租户；查询有结果/无结果/失败/超时/网络异常。"
  - "边界候选覆盖任务标识、Cron、脚本和内存限制的空/最小/最大/超限（具体上限待确认）；创建/启动/停止/再次启动/删除状态边界；空列表、单条、10 条、末页、无结果分页；精确/模糊/组合筛选及筛选回第一页；记录 page.json 观察 200 与公共默认 10 的差异，不将差异直接判为缺陷。"
  - "判定表覆盖任务标识/Cron/脚本缺失或非法时字段校验、保留输入且不保存；已创建启动、运行中停止、已停止再次启动/删除；设备离线/插件异常/脚本错误/部分成功按四种重启策略处理；引用可用继续原配置、引用失效本次执行失败；列表默认/筛选/分页/刷新创建时间倒序。"
  - "状态转换覆盖未认证->登录->门户->数据采集默认态、默认态->查询中->有结果/暂无数据/失败、新建表单->校验失败/保存成功/取消、已创建->编辑保存成功->配置回读或保存失败->原配置保持、已创建->启动->运行中->异步完成->结果回读、执行失败->失败反馈和重启策略、已创建->启动->运行中->停止->已停止、已停止再次启动/删除、运行异常按重启策略处理、引用变化和失效处理；当前只作为待验证模型。"
  - "本轮新增核心流程用例：TC-REQ-009-050/051 覆盖编辑保存成功与失败回读，TC-REQ-009-052/053 覆盖启动异步成功与执行失败回读；不新增未被模块事实确认的删除或其他功能用例。"
  - "Pairwise/2-way 评估 Auth、Permission、TaskIdentifier、Schedule、Script、RestartPolicy、MemoryLimit、TaskState、Reference、Execution、Result。约束：非有效认证对应权限错误；只读/拒绝/跨租户保护写入或控制失败；空/空白任务标识验证失败；脚本缺失/格式错误对应验证失败或执行失败；非法 Cron 验证失败；引用失效执行失败；设备离线/插件异常/脚本错误/部分成功按重启策略对应失败或处理中。模型不代表真实调度或接口验证。"
  - "Playwright Python/pytest-playwright 仅规划：复用公共登录和门户导航；以已确认 data_crawl_* ID 优先，其次 role/name、test_id、label、placeholder、稳定文本和稳定属性，CSS 最后兜底；列表先定位目标任务行再定位行内操作。不得从缺失状态创建 locator。"
  - "Web 执行先确认实际主机、运行时 URL、标题、data_crawl_default 和页面加载状态，再进行只读观察。配置缺失、登录失败、人工验证、路由/标题不符、权限失败、写操作提示、真实调度/设备连接或敏感信息暴露时停止。"
environment:
  client: "PC Web"
  os: "win32；正式执行前记录实际客户端版本"
  browser: "Chromium；Playwright Python 规划可视模式 headless=False"
  base_url: "${UI_TEST_URL}"
  page_path: "/biopark-iot/iot/data/crawl"
  portal_entry: "数据采集监控平台 / 数据中心 / 数据采集；对应 page_id=data_crawl，默认状态 data_crawl_default"
  login: "使用测试账号登录；凭据仅从 UI_TEST_USERNAME、UI_TEST_PASSWORD、UI_TEST_TENANT 运行时读取，不写入计划、日志或证据；当前权限状态 partial_blocked"
data:
  required:
    - "只读账号、角色和租户上下文；账号、密码、租户值不写入产物。"
    - "已授权可读的数据采集任务列表、状态、插件 ID、创建时间和脱敏列值；不创建任务、不修改任务、不启动或停止任务。"
    - "page.json 已登记的 data_crawl_default、data_crawl_status_options、data_crawl_edit、data_crawl_dialogs_partial 及其脱敏 evidence。"
    - "已登记筛选表单 data_crawl_filter_form/data_crawl_filter、编辑字段和表格/分页契约；新建、控制、执行结果、权限/错误和稳定任务行数据需补采。"
    - "补充角色、租户、跨租户权限矩阵，以及状态差异、异常处理和排序分页的安全页面证据。"
  preparation: "由测试、业务/产品、权限负责人、数据采集管理员、插件/设备运维和平台运维准备脱敏只读任务及页面契约；本计划不修改业务数据，清理状态为 not_applicable。"
roles:
  - "测试：执行已登记页面的只读观察，不保存任务、不提交表单、不执行控制动作、不读取真实设备数据。"
  - "数据采集管理员：确认任务字段、调度状态和重启策略边界，但本阶段不写入或控制。"
  - "插件/设备运维人员：提供已有插件、设备和引用上下文，但不进行真实采集联调。"
  - "平台运维人员：确认权限、调度和运行风险，但本阶段不启动任务。"
  - "只读用户：确认授权租户内任务可见性、状态和敏感信息脱敏。"
  - "权限负责人：提供角色、租户、跨租户矩阵；不允许绕过权限。"
  - "研发：补采新建、控制确认层、执行反馈、权限/错误提示和稳定行数据契约。"
  - "测试设计：在计划通过且阻塞项关闭后生成下游测试设计。"
dependencies:
  - "产品管理、设备管理、插件管理：提供依赖范围和引用责任；不得复用其页面定位器。"
  - "数据存储/时序库、消息队列、REQ-007 数据监听、REQ-008 数据推送、REQ-010 告警配置：仅为业务上下文和责任边界，不代表接口或数据契约已验证。"
  - "登录、门户、权限和租户上下文：控制页面可达性、角色范围和数据隔离。"
  - "已登记页面契约：data_crawl、/biopark-iot/iot/data/crawl、data_crawl_default、data_crawl_status_options、data_crawl_edit、data_crawl_dialogs_partial、data_crawl_table/data_crawl_table_element。"
  - "已登记元素：data_crawl_task_name、data_crawl_status、data_crawl_query、data_crawl_reset、data_crawl_refresh、data_crawl_columns、data_crawl_add、data_crawl_start、data_crawl_edit、data_crawl_delete、data_crawl_page_size、data_crawl_prev、data_crawl_next、data_crawl_jump。"
  - "已登记编辑字段：data_crawl_edit_task_key、data_crawl_cron、data_crawl_common、data_crawl_script、data_crawl_restart、data_crawl_memory、data_crawl_memory_decrease、data_crawl_memory_increase、data_crawl_edit_cancel、data_crawl_edit_confirm。"
  - "公共页面对象 07_ui_automation/pages/common/login_page.py、07_ui_automation/pages/common/portal_navigation.py。"
  - "运行时配置键 UI_TEST_URL、UI_TEST_USERNAME、UI_TEST_PASSWORD、UI_TEST_TENANT；只引用键名，不复制值。"
priority: "P0：权限阻塞与敏感信息脱敏、已登记路由/默认态、任务状态差异、脚本/引用失败风险、禁止控制动作；P1：筛选分页刷新排序、编辑字段只读性、必填字段、Cron/脚本/重启策略、状态边界；P2：表头设置、空结果、失败提示、内存边界、新建/控制/执行详情契约补采"
risks:
  - "错误脚本或任务引用造成错采、执行失败或下游数据污染；只读观察，不保存或执行任务，不读取真实设备数据。"
  - "启动、停止、删除和重启策略影响设备、插件资源和消息流；不执行控制动作，不绕过权限。"
  - "Cron、时区、重复触发、并发和错过调度造成重复、乱序或数据风暴；仅核对页面字段和契约，真实调度不在本阶段。"
  - "脚本、地址、认证、消息、设备标识或采集值进入页面产物；证据必须脱敏，不写入截图、日志、DOM、报告或下载文件。"
  - "页面观察状态与确认业务状态不一致；将已暂停、重启中、删除中、异常记录为差异，不擅自扩展业务状态。"
  - "页面每页观察 200 与公共默认 10 不一致；记录为待确认差异，不直接判为缺陷或改写规则。"
  - "新建、控制、执行结果和权限/错误页面契约缺失；不得编造定位器或断言。"
open_questions:
  - "正式 PDF REQ-009 章节逐条页码追溯是否完成？"
  - "页面观察到的已暂停、重启中、删除中、异常与已确认业务状态的映射是什么？"
  - "Cron、脚本、任务标识和内存限制的具体长度、格式边界和默认值是什么？"
  - "时区、重复触发、批量、并发、互斥和错过调度的实际页面反馈是什么？"
  - "设备离线、插件异常、脚本错误和部分成功在四种重启策略下的等待、最终失败和人工重跑反馈是什么？"
  - "新建弹窗字段、确定/取消控件和稳定 ID 是什么？"
  - "启动、停止、删除确认层、处理中状态和异步完成/失败反馈的实体及稳定 ID 是什么？"
  - "任务执行详情、失败结果、权限提示、错误提示和稳定任务行数据的页面实体及稳定 ID 是什么？"
  - "角色、租户、跨租户权限矩阵及无权限提示独立元素是什么？"
  - "列表默认每页 10 与页面观察 200 的差异是配置、权限、环境还是页面缺陷？"
entry_criteria:
  - "REQ-009.yaml、REQ-009.md、需求变动.md、模块拆分清单.md、page.json、config.yaml 和 ../../../.agents/references/test-plan.schema.json 可读取，REQ-ID 与模块身份一致。"
  - "已确认 page.json 中 data_crawl 页面、路由、标题、菜单、默认态、状态选项、编辑状态、部分新建状态、筛选/操作/行操作/分页 ID、表格和脱敏 evidence 的实际登记内容。"
  - "已确认状态选项同时存在页面观察值与业务确认值；已暂停、重启中、删除中、异常未升级为业务断言。"
  - "已确认新建、控制、执行结果、权限/错误和稳定行数据契约缺失或 partial；不凭按钮存在推断写权限。"
  - "只读账号/角色/租户、脱敏数据、权限阻塞责任和停止条件已准备，或缺失项明确标记 blocked。"
  - "等价类、边界、判定表、状态转换、Pairwise、自动化停止条件和禁止真实调度/采集边界已评审。"
exit_criteria:
  - "YAML 通过 test-plan.schema.json，未新增字段且不含 tp/tp_id；Markdown 与 YAML 的范围、策略、风险、准入/准出、证据和套件建议一致。"
  - "冒烟、定向、全量三个计划层级已定义；未生成测试点、测试用例、CSV、禅道数据或 UI 脚本。"
  - "已登记页面事实、partial 状态和缺失契约分离；业务状态与页面观察状态差异已交接。"
  - "只读执行不产生业务数据变更；出现意外保存/控制、真实设备或调度连接、未授权数据暴露、主机/路由不符或权限绕过迹象时停止。"
  - "不宣称任务保存成功、真实采集成功、调度执行成功、重启正确、删除成功或接口行为已验证。"
evidence:
  - "已登记页面事实：page_id=data_crawl；route=/biopark-iot/iot/data/crawl；title=数据采集 - 数据采集；menu_path=数据中心/数据采集；default=data_crawl_default。"
  - "已登记状态 evidence：data_crawl_default 截图 req009-default.png，data_crawl_status_options 截图 req009-status-options.png；均标记 available/sanitized；无 log/trace 路径。"
