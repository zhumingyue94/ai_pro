plan_id: TEST_PLAN-REQ-005
title: "数据采集监控平台设备管理测试计划"
status: draft
source_inputs:
  - "01_requirements/数据监控平台使用文档.pdf"
  - "01_requirements/需求变动.md"
  - "01_requirements/模块拆分清单.md"
  - "02_analysis/REQ-005.yaml"
  - "02_analysis/REQ-005.md"
  - "02_analysis/page_inventory/page.json"
  - "config.yaml"
  - "../../../.agents/references/test-plan.schema.json"
trace:
  story: "设备管理的页面身份、列表/筛选、设备字段、产品绑定、状态、排序/上线时间、父子关系、分组关系、引用删除限制、批量事务和权限边界的限定范围只读测试规划"
  req: REQ-005
  project: "数据采集监控平台"
  version: 1
  status: draft
objective: "基于 REQ-005 最新分析和需求变动，规划设备管理页面的运行时身份确认、只读默认页面观察、名称/序列号/备注/产品/上级设备/排序/状态/上线时间字段契约、筛选分页空状态、产品绑定联动、状态跨插件一致性、父子循环与删除前置、分组关系、业务引用删除限制、批量整体回滚、角色租户边界及页面级失败反馈验证；当前 page.json 未发现 REQ-005 专属 page_id、state、element、table、form 或 locator，计划保持 blocked_pending_req005_page_contract，不复用其他模块证据，不执行新增、编辑、删除、停用、激活、父子修改、分组变更、批量写入、导入导出或接口写入。"
scope:
  in_scope:
    - "运行时确认设备管理页面最终路由、标题、菜单路径和可达性；模块清单候选为 /iot/device/device 和 /biopark-iot/iot/device/device，不能作为已确认页面事实。"
    - "在 REQ-005 专属 page.json 页面契约补齐后，只读观察默认页面、设备列表、产品/分组/父子筛选、分页、空状态、刷新、表头和脱敏失败反馈；当前均保持待确认。"
    - "规划设备名称必填/同作用域唯一/编辑改名重校验，序列号必填/唯一/可修改，备注可空且支持换行/空白/常见特殊字符；长度和非法字符遵循系统默认规则，不虚构具体阈值。"
    - "规划新建设备必须选择可用产品、设备类型由产品带入且设备侧不可独立修改、绑定后不可换、停用/删除产品保留已有绑定但禁止新增关联。"
    - "规划未激活、在线、离线、连接、断开、重连状态及与插件管理设备数弹窗中对应设备状态的一致性；具体状态事件和跨模块页面证据待补。"
    - "规划同级排序升序与上线时间独立语义；上线时间为最近一次上线时间，重上线更新、离线保留，来源/时区/格式/并列排序待确认。"
    - "规划根/子/多级、不同产品类型、绑定/解绑/移动、循环阻止、父有子时删除阻止及跨租户/移动失败反馈。"
    - "规划单组/多组/批量加入、重复关系幂等、冲突失败明细、关系变更后数量和可见范围更新。"
    - "规划产品/插件/采集任务/其他引用存在时删除阻止、编辑和停用允许、全部解除后删除允许；父有子删除前置单独核验。"
    - "规划批量删除/分组任一项失败整体回滚、失败明细、无自动重试、用户修正后整体重试和无部分结果；只读阶段仅观察批准的既有结果/页面契约，不执行写操作。"
    - "规划设备查看人员、设备管理员、分组管理员、产品管理员的角色和租户边界；不以按钮可见性推断权限。"
  out_scope:
    - "真实新增、编辑保存、删除、停用、激活、父子绑定/解绑/移动、分组加入/移出、批量删除/分组和任何业务写入。"
    - "设备凭据、连接测试、凭据轮换/失效、导入、导出、下载、审计记录验收。"
    - "接口 endpoint、请求/响应字段、错误码、数据库、性能 SLA、并发实现和残留关系检查。"
    - "复用 REQ-004 的 device_group_*、REQ-003 的 product_*、REQ-005 以外的任何页面/状态/元素/表格/交互证据。"
    - "未确认的页面字段、表格列、筛选器、按钮、批量入口、分页、失败提示、定位器、具体长度、字符白名单、时区和错误码。"
    - "测试点、测试用例、CSV、禅道数据和 UI 自动化脚本。"
strategy:
  - "采用黑盒、风险优先、页面级只读策略；REQ-005 当前 readiness 为 blocked_pending_req005_page_contract，缺失页面契约时记录待确认/无法验证/blocked，不伪造通过或失败。"
  - "等价类覆盖 Name、Serial、Remark、Product、Status、Hierarchy、Group、Reference、BatchResult、Permission：名称/序列号唯一、空、重复、非法默认规则；备注空/空白/换行/特殊字符；产品可用/停用已有绑定/删除已有绑定/不可用于新增/缺失；状态未激活/在线/离线/重连；层级根/子/多级/跨产品/循环/父有子；分组单/多/批量/重复/冲突；引用无/产品/插件/采集任务/其他/全部解除；批量成功/单项失败/回滚/失败明细/整体重试；权限授权/未授权/跨租户。"
  - "边界值覆盖名称和序列号空、重复、非法字符和系统默认边界，备注空白/换行/特殊字符，产品绑定后换绑及停用/删除产品，未激活/连接/断开/重连，根/多级/跨产品/循环尝试，重复分组/批量冲突，任一引用/全部解除，批量单项失败整体回滚，排序相等值/升序与上线时间分离，未授权/跨租户；不指定未确认的最大长度或具体值。"
  - "判定表覆盖名称/序列号空或重复拒绝且唯一允许、编辑重新校验；已有产品绑定保留且停用/删除产品禁止新增；未激活保持未激活、连接在线、断开离线、重连在线；父有子删除拒绝且移动不得循环；有引用仅删除拒绝而编辑/停用允许；批量任一失败整体回滚并展示失败明细、用户整体重试；分组重复不新增关系且冲突有失败明细。"
  - "状态转换覆盖未激活->在线->离线->在线、根->子->多级->解绑/移动、设备->多分组->移出、无引用->有引用->删除拒绝->解除->删除允许、批量->失败->回滚->整体重试；由于 page.json 无专属状态，均为待采集目标，不当作已实现事实。"
  - "Pairwise/2-way 评估 Name、Serial、Product、Status、Hierarchy、Group、Reference、BatchResult、Permission。约束：名称为空时仅规划授权校验观察；循环尝试应为阻止/回滚结果；存在业务引用时删除不得成功；批量单项失败必须整体回滚；未授权或跨租户不得产生成功业务结果；产品停用/删除可保留既有绑定但不得支持新增关联。模型仅用于后续测试设计，不生成或执行真实写操作。"
  - "Playwright Python/pytest-playwright 仅规划：复用 07_ui_automation/pages/common/login_page.py 和 portal_navigation.py；在页面契约补齐后优先 role/name、accessible label、确认的 data-testid、可见文本和表格目标行上下文，CSS 仅最后手段；自动化范围限于登录态复用、导航、运行时路由/标题、默认页和已存在数据只读观察、筛选/分页/空状态/表头/脱敏反馈。当前因 page_id_missing 和 elements/forms/tables/filters/row_actions/batch_actions/pagination/feedback 缺失而 blocked，不冻结定位器。"
  - "Web 执行采用先导航、等待可观察状态、再读取 DOM/可访问性快照和脱敏截图；记录页面身份、状态和数据不变证据。禁止固定或猜测定位器、写操作、接口调用、绕过权限/安全验证；配置缺失、登录失败、主机不符、权限失败、页面契约缺失、写操作提示或未授权数据暴露时停止。"
environment:
  client: "PC Web"
  os: "win32；正式执行前记录实际客户端版本"
  browser: "Chromium；Playwright Python 规划可视模式 headless=False"
  base_url: "${UI_TEST_URL}"
  page_path: "/biopark-iot/iot/device/device"
  portal_entry: "数据采集监控平台 / 数据采集 / 设备接入 / 设备管理；模块清单导航基线，page.json 未确认 REQ-005 页面对象，正式执行以运行时身份确认结果为准"
  login: "使用测试账号登录；凭据仅从 UI_TEST_USERNAME、UI_TEST_PASSWORD、UI_TEST_TENANT 运行时读取，不写入计划、日志或证据；需确认正式路由、权限、租户和访问范围"
data:
  required:
    - "只读设备查看人员、设备管理员、分组管理员、产品管理员角色和当前租户上下文；账号、密码和租户值不写入产物。"
    - "经授权可读的唯一/重复名称与序列号、空备注/特殊备注、可用/停用/删除产品绑定、未激活/在线/离线设备、根/子/多级、单/多/冲突分组和有/无业务引用数据；本计划不造数。"
    - "批准的插件管理设备数弹窗对应设备状态、产品/分组/父子关系、业务引用、批量结果或脱敏既有页面回读证据；缺失时标记待确认。"
    - "REQ-005 专属页面采集应提供 page_id、state、state_parent、check_target、ready_condition、elements、forms、tables、filters、row_actions、batch_actions、pagination、feedback 和 page_evidence。"
  preparation: "由测试、业务/产品、平台权限、设备管理、插件管理、研发负责人准备脱敏只读数据、跨模块回读、正式路由和页面契约；本计划不修改业务数据，清理状态为 not_applicable。"
roles:
  - "测试：执行页面身份、默认页和批准的只读观察；不执行设备生命周期、关系或批量写入。"
  - "设备管理负责人：确认名称、序列号、备注、状态、排序、上线时间、父子、分组和引用删除语义。"
  - "产品管理员：确认产品可用/停用/删除与设备绑定的跨模块规则。"
  - "分组管理员：确认多分组、批量加入、重复关系、冲突明细和数量/可见范围回读。"
  - "插件管理负责人：提供设备状态与插件管理设备数弹窗一致性的批准证据。"
  - "平台权限负责人：准备角色、租户、业务范围和未授权/跨租户样本。"
  - "研发：补充 REQ-005 专属 page.json、稳定定位器、失败/回滚反馈和页面加载契约。"
  - "测试设计：在计划通过且页面契约补齐后消费范围和策略生成下游测试设计。"
dependencies:
  - "产品管理、设备分组、插件管理：提供产品绑定、分组关系和设备状态跨模块回读；不能复用其页面定位器或推断本模块已验收。"
  - "首页统计、数据采集、数据监听、数据推送、告警及其他业务引用：提供设备数量/状态/引用范围的批准回读证据。"
  - "登录、权限和租户上下文：控制页面可达性、角色范围和数据隔离。"
  - "REQ-005 专属 page.json 页面采集；当前 page_inventory_status=missing_req005_page_object，page_id=module_id_missing，confirmed_from_page_inventory=false。"
  - "公共页面对象 07_ui_automation/pages/common/login_page.py、07_ui_automation/pages/common/portal_navigation.py。"
  - "运行时配置键 UI_TEST_URL、UI_TEST_USERNAME、UI_TEST_PASSWORD、UI_TEST_TENANT；只引用键名，不复制值。"
priority: "P0：页面身份/路由/标题、默认列表和列表契约、名称/序列号必填唯一、产品必选、状态集合、删除保护、批量整体回滚规则和权限租户边界；P1：状态跨插件一致性、上线时间与排序、父子循环/删除、分组幂等/冲突、产品停用联动和失败反馈；P2：表头/分页/空状态、格式时区、并列排序、跨租户移动、审计和自动化定位器"
risks:
  - "REQ-005 专属 page.json 页面对象缺失，无法确认页面身份、状态、字段、表格、筛选、操作、分页和反馈，影响 critical；保持 blocked_pending_req005_page_contract，先补页面采集。"
  - "误用 REQ-004 device_group_*、REQ-003 product_* 或插件页面对象可能造成错误验收，影响 critical；禁止复用，仅接受 REQ-005 专属证据。"
  - "名称/序列号唯一性作用域错误或租户边界错误，影响 critical；确认作用域和页面字段反馈，不记录真实值。"
  - "父子关系或业务引用删除导致孤儿关系/数据损失，影响 critical；仅规划删除阻止矩阵，不执行删除。"
  - "批量操作部分成功，影响 critical；仅观察批准页面契约中的整体回滚、失败明细和整体重试，不提交批量写入。"
  - "状态与插件管理设备数弹窗不一致，或排序与上线时间语义混淆，影响 high；分离字段语义并补跨模块证据。"
  - "产品停用/删除后的已有绑定与新增关联规则错误，影响 high；准备批准的跨模块回读并保持只读。"
  - "跨租户访问、角色权限、异常提示、异步状态和稳定定位器待确认，影响 high/medium；缺失时记录无法验证或 blocked。"
  - ".env/config.yaml 及页面证据可能含敏感信息，影响 high；只引用配置键名，禁止保存地址、账号、密码、租户、Token、Cookie、设备/产品/分组名称和未授权业务数据。"
open_questions:
  - "正式 PDF 中 REQ-005 章节与 REQ-005-001 至 REQ-005-021 的逐条追溯是否完成？"
  - "运行时最终路由是 /iot/device/device 还是 /biopark-iot/iot/device/device，实际标题和菜单路径是否一致？"
  - "REQ-005 专属 page_id、state、表单、表格、筛选、行操作、批量操作、分页、空状态、失败反馈和稳定定位器是什么？"
  - "名称/序列号唯一作用域、默认长度、空白和非法字符规则如何从页面观察确认？"
  - "产品可用/停用/删除后的新增关联提示、已有绑定保留和绑定不可更换如何验证？"
  - "状态事件来源、插件管理设备数弹窗对应状态、更新时间和页面刷新反馈如何确认？"
  - "同级排序并列值、实际排序列、上线时间列/来源/用户时区/格式及离线保留如何确认？"
  - "父子跨产品移动、循环阻止、父有子删除阻止、移动失败反馈和跨租户边界如何确认？"
  - "分组冲突失败明细、数量/可见范围立即更新和重复关系幂等如何确认？"
  - "产品/插件/采集任务/其他引用的删除阻止提示，以及有引用时编辑/停用允许如何确认？"
  - "批量失败整体回滚、失败明细、无自动重试和用户整体重试的页面反馈是什么？"
  - "设备查看人员、设备管理员、分组管理员、产品管理员的角色/租户/业务范围矩阵是什么？"
entry_criteria:
  - "REQ-005.yaml、REQ-005.md、需求变动.md、模块拆分清单.md、page.json、config.yaml 和 ../../../.agents/references/test-plan.schema.json 可读取，REQ-ID 与模块身份一致。"
  - "已确认 page.json 当前没有 REQ-005 专属对象，记录 page_inventory_status=missing_req005_page_object、page_id=module_id_missing、confirmed_from_page_inventory=false；未将其他模块对象作为设备管理页面事实。"
  - "只读账号/角色/租户、批准设备与跨模块数据、正式路由确认责任和页面采集责任已准备，或转为 report_only/blocked 风险。"
  - "需求追溯、范围责任、等价类/边界/判定表/状态转换/Pairwise、自动化边界和停止条件已评审。"
exit_criteria:
  - "YAML 通过 test-plan.schema.json，未新增字段且不含 tp/tp_id；Markdown 与 YAML 范围、策略、风险、准入/准出、证据和套件建议一致。"
  - "冒烟、定向、全量三个计划层级已定义；未生成测试点、测试用例、CSV、禅道数据或 UI 脚本。"
  - "REQ-005 page_id/state/elements/forms/tables/filters/row_actions/batch_actions/pagination/feedback 缺失、权限 partial、跨模块、状态、上线时间、产品绑定、父子、分组和批量事务风险均已交接。"
  - "页面契约补齐后，范围内行为均有可观察结果和脱敏证据方案；当前缺页面事实、数据、权限或定位器时记录待确认/无法验证/blocked，不伪造通过或失败。"
  - "只读验证无业务数据变更；出现意外写入、未授权数据暴露、主机不匹配、登录/权限失败或关键内容缺失时停止并留证。"
evidence:
  - "页面事实基线：当前 page.json 未发现 REQ-005 专属对象；其状态为 page_inventory_status=missing_req005_page_object，page_id=module_id_missing，default_state=page_inventory_missing_req005_object，confirmed_from_page_inventory=false。"
  - "导航基线而非页面事实：候选路由 /iot/device/device、/biopark-iot/iot/device/device；标题‘数据采集 - 设备管理’；菜单路径数据采集/设备接入/设备管理。正式运行时须重新确认。"
  - "缺失契约登记：page_id、state、state_parent、check_target、ready_condition、elements、forms、tables、filters、row_actions、batch_actions、pagination、feedback、page_evidence；不得从其他模块补写。"
  - "分析证据：02_analysis/REQ-005.yaml、REQ-005.md、02_analysis/HANDOFF/REQ-005_HANDOFF.md；依赖页面只作为范围线索，不作为 REQ-005 页面事实。"
