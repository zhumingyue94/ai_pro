plan_id: TEST_PLAN-REQ-007
title: "数据采集监控平台数据监听测试计划"
status: draft
source_inputs:
  - "01_requirements/数据监控平台使用文档.pdf"
  - "01_requirements/需求变动.md"
  - "01_requirements/模块拆分清单.md"
  - "02_analysis/REQ-007.yaml"
  - "02_analysis/REQ-007.md"
  - "02_analysis/page_inventory/page.json"
  - "config.yaml"
  - "../../../.agents/references/test-plan.schema.json"
trace:
  story: "数据监听规则的页面列表、筛选排序、规则属性、触发条件、动作顺序、依赖边界、状态和权限的测试计划；页面契约尚未采集"
  req: REQ-007
  project: "数据采集监控平台"
  version: 1
  status: draft
objective: "基于 REQ-007 最新确认规则，规划数据监听规则列表、筛选、分页、刷新、创建时间倒序、系统生成编号、名称校验、启停状态、监听器 OR/AND、动作顺序与失败继续、依赖停用/引用/删除、重复事件和租户权限的页面级验证。当前 page.json 未登记 data_monitor 页面实体、状态、元素、表单、表格、交互或证据，计划只定义待补页面契约后的验证范围，不把候选控件或其他模块事实写成原型事实，不执行任何业务写操作。"
scope:
  in_scope:
    - "待补采确认运行时数据监听路由、页面标题、菜单路径、默认状态和页面专属证据；模块基线路由为 /iot/data/monitor，候选运行时路由为 /biopark-iot/iot/data/monitor，均不是已确认 page.json 事实。"
    - "待页面契约补齐后验证规则列表、名称/状态筛选、查询、重置、刷新、表头设置、分页、创建时间倒序和规则状态展示；当前不冻结任何 element_id、table_id 或分页定位器。"
    - "规划系统生成规则编号唯一、创建后不可修改、生成异常/冲突阻止保存、重复请求不重复生成；不执行创建或重复提交。"
    - "规划规则名称必填、同租户允许重复、非法字符限制及空白/默认校验待页面确认；不虚构长度、字符集或提示文案。"
    - "规划启用/停用立即生效，以及处理中事件使用触发时规则状态快照；本阶段不执行启停。"
    - "规划设备属性、设备事件、设备状态三类触发；多监听器 OR，单监听器多条件 AND；表达式、转换和阈值按系统默认且待页面确认。"
    - "规划推送、触发告警、取消告警按配置顺序执行，单动作失败记录并继续后续动作；本阶段不触发真实动作。"
    - "规划停用依赖不可被新规则选择、已有引用继续使用原配置、被引用依赖不可删除；不执行依赖停用或删除。"
    - "规划每次事件上报均执行、重复事件不去重不节流无时间窗口、失败不自动重试；页面可观察证据和失败记录位置待补。"
    - "规划当前用户时区的 YYYY-MM-DD HH:mm:ss 展示以及默认/筛选/分页/刷新后的创建时间倒序。"
    - "规划数据监听查看人员、数据监听管理员、设备/产品管理员、推送/告警管理员、平台运维/审计人员的角色、租户和跨租户边界；不从菜单或候选按钮可见性推断权限。"
  out_scope:
    - "页面契约补齐前的新增、编辑、启用、停用、删除和任何真实动作。"
    - "真实推送、触发告警、取消告警、接口写入、接口状态码、错误码、审计、幂等、异步和性能测试。"
    - "表达式语法、数据类型转换、阈值、动作参数格式和条件失败细节等未确认规则。"
    - "复用其他模块的 page/state/element/form/table/interaction/evidence ID；特别禁止复用 alert_record、data_push、plugin_management、device_group。"
    - "测试点、测试用例、CSV、禅道数据和 UI 自动化脚本。"
strategy:
  - "采用黑盒、风险优先、页面级只读规划；REQ-007 页面契约缺失时所有页面执行项标记 blocked 或待确认，不伪造通过/失败。"
  - "等价类覆盖规则编号、名称、状态、触发类型、监听器逻辑、动作序列、依赖状态、重复事件、时间排序和权限：系统生成/异常/重复请求/编辑尝试；必填/空白/非法字符/同租户重复；启用/停用/状态快照；属性/事件/状态；单监听器 AND 与多监听器 OR；单动作/多动作/中间失败；依赖可选/停用/已有引用/被引用删除；唯一/重复/无节流/失败不重试；时区/默认/筛选/分页/刷新倒序；授权/未授权/跨租户。"
  - "边界候选覆盖编号生成异常与重复请求、名称空值/空白/非法字符/重复/不限长度、启停切换和状态快照、单监听器条件 AND、多监听器任一满足 OR、动作顺序/中间失败/后续继续、依赖停用/已有引用/删除、重复事件/无节流/不重试、用户时区和秒级格式、筛选/分页/刷新倒序、角色租户边界；未确认阈值和提示不虚构。"
  - "判定表覆盖任一监听器全部条件满足触发、单监听器任一条件不满足不满足、动作失败记录并继续且不重试、停用依赖不可新选、已有引用继续使用、被引用依赖不可删除、重复事件每次执行、事件处理开始后沿用触发时状态、各列表状态均创建时间倒序。"
  - "状态转换覆盖不存在->已创建、已创建->启用、启用<->停用、启用/停用->编辑、依赖被引用->停用请求、依赖被引用->删除请求、事件上报->状态快照->监听器匹配->动作顺序执行、重复事件->重复执行、动作失败->失败记录->不重试、列表初始->筛选/分页/刷新->创建时间倒序；当前仅为待验证目标。"
  - "Pairwise/2-way 评估 RuleStatus、TriggerType、ListenerLogic、ActionSequence、DependencyState、EventRepeat、ActionFailure、Ordering、Permission。约束：中间动作失败对应记录并继续；停用依赖不可新选；重复事件对应不自动重试；未授权/跨租户不得成功切换规则状态。模型仅用于下游测试设计，不执行规则写入或真实动作。"
  - "Playwright Python/pytest-playwright 仅规划：可复用公共登录和门户导航对象；页面契约补齐后，先确认真实主机、运行时路由、标题和菜单，再只读查看列表/空态/加载状态、筛选/重置/刷新/表头设置。当前无 REQ-007 稳定 locator，禁止从 observed_unverified_clues 创建 locator。"
  - "Web 执行采用先导航后检查的侦察模式；保存脱敏 URL/标题/菜单、状态、可访问性快照和截图。配置缺失、登录失败、人工验证、主机不符、权限失败、写操作提示、未授权数据暴露或页面契约仍缺失时停止。"
environment:
  client: "PC Web"
  os: "win32；正式执行前记录实际客户端版本"
  browser: "Chromium；Playwright Python 规划可视模式 headless=False"
  base_url: "${UI_TEST_URL}"
  page_path: "/iot/data/monitor；候选运行时路径 /biopark-iot/iot/data/monitor，均待运行时确认"
  portal_entry: "数据采集监控平台 / 数据中心 / 数据监听；模块清单基线，page.json 未登记 REQ-007 页面实体"
  login: "使用测试账号登录；凭据仅从 UI_TEST_USERNAME、UI_TEST_PASSWORD、UI_TEST_TENANT 运行时读取，不写入计划、日志或证据；需确认正式角色、租户和业务范围"
data:
  required:
    - "只读账号、角色和租户上下文；账号、密码、租户值不写入产物。"
    - "经授权可读的监听规则列表、状态、编号、名称、触发条件、动作和创建时间；当前不造规则、事件、设备、推送目标或告警配置。"
    - "补采 data_monitor 专属 page/state/element/form/table/interaction/evidence、稳定分页和排序信息；不得从其他模块迁移。"
    - "补充名称/编号校验、启停权限、状态快照、表达式/阈值/动作参数、依赖生命周期、重复事件和失败不重试的页面可观察证据。"
    - "补充数据监听查看人员、管理员、设备/产品管理员、推送/告警管理员和平台运维/审计人员的权限租户矩阵。"
  preparation: "由测试、业务/产品、权限负责人、设备/产品管理、推送/告警管理、研发和平台运维准备脱敏只读数据及页面契约；本计划不修改业务数据，清理状态为 not_applicable。"
roles:
  - "测试：执行页面身份和补采后的只读观察，不提交规则或执行真实动作。"
  - "数据监听查看人员：确认授权租户和业务范围内规则、状态及运行结果可见性。"
  - "数据监听管理员：提供创建、编辑、启停、删除权限语义和页面证据，但本阶段不写入。"
  - "设备/产品管理员：提供监听条件引用对象的批准回读。"
  - "推送/告警管理员：提供推送目标及告警配置依赖的批准回读。"
  - "平台运维/审计人员：确认异常、依赖保护、租户边界和操作追溯页面证据，不扩展接口验收。"
  - "研发：补采专属页面契约、稳定定位器、规则校验和页面反馈。"
  - "测试设计：在计划通过并完成页面契约后生成下游测试设计。"
dependencies:
  - "设备管理、产品管理、推送目标、告警配置：提供条件和动作依赖的批准跨模块回读；不得复用其页面定位器。"
  - "设备事件接入、消息推送、告警记录、运行审计：作为范围依赖线索，不代表接口或数据已验证。"
  - "登录、权限和租户上下文：控制页面可达性、角色范围和数据隔离。"
  - "REQ-007 当前页面契约：page_inventory_status=missing，page_id=data_monitor 为 page.json 缺失候选值，default_state=data_monitor_default 缺失，check_target=data_monitor_state 仅候选，elements/forms/tables/interactions/evidence 均为空。"
  - "公共页面对象 07_ui_automation/pages/common/login_page.py、07_ui_automation/pages/common/portal_navigation.py。"
  - "运行时配置键 UI_TEST_URL、UI_TEST_USERNAME、UI_TEST_PASSWORD、UI_TEST_TENANT；只引用键名，不复制值。"
priority: "P0：页面契约补采、监听器 OR/AND、动作失败继续且不重试、依赖保护、租户/权限边界；P1：编号唯一与状态、启停即时生效和状态快照、重复事件语义、时间格式与倒序；P2：筛选分页刷新、表头设置、并列排序、页面反馈和稳定定位器"
risks:
  - "监听器 OR/AND 错误导致漏触发或误触发；页面契约和运行证据缺失，保持 blocked。"
  - "动作失败后未继续或自动重试造成重复副作用；需补页面失败记录和后续动作证据，当前不执行真实动作。"
  - "停用/删除依赖破坏已有规则引用；需验证停用不可新选、已有引用继续、被引用不可删除。"
  - "状态未立即生效或处理中事件未使用触发时状态；需补状态快照页面证据。"
  - "编号重复、可编辑或重复请求重复生成；需补编号字段只读和页面反馈证据。"
  - "用户时区、时间格式或筛选/分页/刷新排序错误；分页、排序字段和并列值处理未确认。"
  - "租户隔离或角色权限缺失；当前 permission_status=blocked_pending_matrix。"
  - "page.json 未登记 data_monitor，自动化误用其他模块 locator；严格禁止复用 alert_record、data_push、plugin_management、device_group 或其他模块 ID。"
  - "需求规则存在未确认表达式、转换、阈值、动作参数细节；不在计划中推断具体语法或数值。"
open_questions:
  - "正式 PDF REQ-007 章节与 REQ-007-001 至 REQ-007-013 的逐条追溯是否完成？"
  - "数据监听实际运行时路由、标题、菜单、page_id、默认状态和检查目标是什么？"
  - "页面专属 element/form/table/interaction/evidence、稳定分页和排序定位器何时补采？"
  - "名称空白、首尾/连续空白、非法字符、长度和默认校验的实际规则及提示是什么？"
  - "编号生成异常、冲突、只读和重复请求页面反馈是什么？"
  - "启停、编辑、删除的角色租户矩阵，以及处理中事件状态快照的可观察反馈是什么？"
  - "表达式、数据类型转换、阈值、动作参数、部分成功和失败记录位置是什么？"
  - "停用依赖、已有引用和被引用删除的页面反馈是什么？"
  - "重复事件每次执行、无节流时间窗口和失败不重试的运行证据如何安全提供？"
  - "用户时区来源、时间格式、分页、并列创建时间排序和筛选/分页/刷新后的倒序如何确认？"
entry_criteria:
  - "REQ-007.yaml、REQ-007.md、需求变动.md、模块拆分清单.md、page.json、config.yaml 和 test-plan.schema.json 可读取，REQ-ID 与模块身份一致。"
  - "已确认 page.json 未登记 data_monitor 页面实体，且 REQ-007 专属 page/state/element/form/table/interaction/evidence 为空；不得把全局 partial 或其他模块证据当作 REQ-007 事实。"
  - "已确认候选控件、列、状态、触发类型、动作和分页线索仅为未验证线索，不作为稳定 locator、断言或自动化契约。"
  - "只读账号/角色/租户、脱敏数据、页面契约补采责任和正式路由责任已准备，或缺失项明确标记 blocked。"
  - "等价类、边界值、判定表、状态转换、Pairwise、自动化停止条件和禁止复用边界已评审。"
exit_criteria:
  - "YAML 通过 test-plan.schema.json，未新增字段且不含 tp/tp_id；Markdown 与 YAML 的范围、策略、风险、准入/准出、证据和套件建议一致。"
  - "冒烟、定向、全量三个计划层级已定义；未生成测试点、测试用例、CSV、禅道数据或 UI 脚本。"
  - "页面缺失、路由候选、权限矩阵、规则校验、OR/AND、动作失败、依赖保护、重复事件、时间排序和稳定定位器风险均已交接。"
  - "需求规则、页面事实、候选线索和待确认项分离；页面契约缺失时只记录 blocked，不伪造通过或失败。"
  - "本阶段无业务数据变更；出现意外写入、未授权数据暴露、主机不匹配、登录/权限失败或关键页面内容缺失时停止并留证。"
