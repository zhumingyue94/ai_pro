  Smoke: "在页面契约补齐后使用可视 Chromium 登录，确认实际主机、数据监听路由、标题、菜单、默认页/空态和列表可读性；当前因 page.json 缺失，执行状态为 blocked，不冻结定位器。"
  Targeted: "定向验证编号/名称校验、启停和状态快照、监听器 OR/AND、动作顺序与失败继续、依赖停用/引用/删除、重复事件不重试、时间格式/倒序和权限租户边界；依赖补采页面证据及批准只读数据，禁止真实写入。"
  Full: "覆盖 REQ-007-001 至 REQ-007-013 的完整追溯、等价类、边界值、判定表、状态转换、Pairwise/2-way、列表筛选分页刷新、规则字段、触发逻辑、动作语义、依赖保护、重复事件、排序和权限回归；接口、性能、审计、真实动作和未确认页面事实不纳入。"
next_stage: testcase-generation-agent
