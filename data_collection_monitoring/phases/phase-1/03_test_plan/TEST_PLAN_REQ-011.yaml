  Full: "覆盖 REQ-011-001 至 REQ-011-017 追溯、记录身份/事件/时间/时区/快照/状态/级联、权限租户、脱敏、异步/幂等、错误保留输入、归档删除契约和 Pairwise；真实事件生成、处理提交、归档删除、通知、接口、性能和留存清理不纳入。"
