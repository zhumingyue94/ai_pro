plan_id: TEST_PLAN-REQ-011
title: "告警记录测试计划"
status: draft
source_inputs:
  - "01_requirements/数据监控平台使用文档.pdf"
  - "01_requirements/需求变动.md"
  - "01_requirements/模块拆分清单.md"
  - "02_analysis/REQ-011.yaml"
  - "02_analysis/REQ-011.md"
  - "02_analysis/page_inventory/page.json"
  - ".env/config.yaml（仅引用配置键名，不记录值）"
  - "../../../.agents/references/test-plan.schema.json"
trace:
  story: "告警记录列表、筛选、详情查看、处理结果、对象权限和脱敏的限定范围只读测试计划；page.json 已登记 alert_record 页面及默认/高级筛选状态，但页面清单整体状态为 partial，详情/处理/归档/删除契约和权限矩阵不足，因此不升级为完整验收结论"
  req: REQ-011
  project: "数据采集监控平台"
  version: 1
  status: draft
objective: "基于 REQ-011 最新确认项和实际 page.json 证据，规划告警记录路由、默认列表、配置/级别/产品/设备/是否处理/日期筛选、查询/重置/展开/刷新/表头/分页、创建时间倒序、查看与处理入口、历史快照、对象级联、时区、事件去重、权限租户和敏感信息脱敏验证；当前仅允许限定范围只读观察，不提交处理、不归档、不删除、不触发告警、不验证接口或留存实现。"
scope:
  in_scope:
    - "验证已采集页面事实：page_id=alert_record、运行时路由 /biopark-iot/iot/alert/record、默认状态 alert_record_default；菜单路径和标题以 page.json 的实际证据为准，当前页面清单为 partial，不把分析文本未在 page.json 确认的内容当作原型事实。"
    - "只读规划默认列表、告警配置/告警级别/产品筛选，查询、重置、展开、刷新、表头设置、分页和默认创建时间倒序。"
    - "只读规划高级筛选状态 alert_record_filter_expanded 的设备、是否处理、开始日期、结束日期字段；仅使用 page.json 已登记的元素 ID，不编造 locator。"
    - "规划列表列：编号、告警名称、告警级别、产品名称、设备名称、触发消息、是否处理、处理人、处理时间、处理结果、创建时间、操作；敏感内容必须脱敏。"
    - "规划查看和处理入口可见性、取消边界及处理表单契约确认；补充处理成功后状态回读、失败保持未处理、归档成功列表/留存回读和删除成功不可见/不可恢复回读；alert_record_dialogs_partial 的详情字段、提交/取消/反馈/异步状态不完整，实际执行仍不提交。"
    - "规划记录编号唯一不可修改、事件标识去重、触发/创建/来源时间口径、当前用户时区、历史告警配置快照、是否处理仅是/否、否到是处理记录的契约确认；页面无法单独证明的接口/持久化语义保留为待确认。"
    - "规划产品/设备级联筛选、失效/删除/无权限对象不可选择、历史记录保留原对象信息；不跨租户、不绕过权限。"
    - "规划查看者、处理者、管理员、只读用户的权限与租户隔离；按钮或入口可见不等于写权限已验证。"
    - "规划有记录/无记录、失败/超时/网络异常/权限不足、重复提交、处理中禁止重复、刷新最新数据、取消关闭、校验失败/保存失败保留输入等公共边界；页面反馈契约缺失项标记 blocked。"
    - "仅打开并取消查看/处理弹窗或归档/删除确认层，且入口和稳定定位器已确认时；不确认归档、删除或不可恢复行为。"
    - "Playwright Python/pytest-playwright 仅规划已采集 alert_record 页面；复用已配置公共登录和门户导航，定位优先使用已确认 alert_record_* ID，不复用其他模块 locator。"
  out_scope:
    - "告警配置规则维护、告警对象/条件/阈值/触发策略和数据监听实现。"
    - "确认、关闭、重开、转派、批量操作、导出、恢复和其他处置状态。"
    - "详情中的阈值、实际值、单位、时间序列、位置、质量码、原始消息、通知状态和处理备注详情展示。"
    - "通知发送、自动回复、外部通道、接口 endpoint/状态码/载荷、性能 SLA。"
    - "提交处理、真实告警或事件生成、归档、删除、跨租户访问、不可恢复操作和真实留存/清理确认。"
    - "测试点、测试用例、CSV、禅道数据和 UI 自动化脚本。"
strategy:
  - "采用黑盒、风险优先、限定范围只读规划；整体 page_inventory 为 partial，REQ-011 readiness 为 blocked。已采集的 alert_record_default 和 alert_record_filter_expanded 可用于只读页面准备与观察；alert_record_dialogs_partial 仅允许确认入口/取消边界，不能推断完整表单或反馈。"
  - "等价类覆盖有记录/无记录、已处理/未处理、配置/级别/产品/设备有效/失效/删除/无权限、日期空/同日/跨日/非法范围、默认/展开筛选、查看/处理/归档/删除、完整/只读/拒绝/跨租户权限、新/重复事件、当前时区/跨时区、成功/无数据/权限失败/校验失败/超时。"
  - "边界候选覆盖时间空/同一时刻/同日/开始晚于结束/跨日跨月跨年/时区边界，分页空/1条/10条/末页/无结果，状态否→是及重复提交，处理备注空/最小/最大/非法字符；具体备注限制待页面契约确认。"
  - "判定表覆盖权限与动作、未处理/已处理与处理提交、事件标识与刷新、对象状态/权限与筛选、删除权限与记录状态；删除仅规划进入确认层并取消，不执行。"
  - "状态转换覆盖未认证→登录→门户→告警记录默认态、默认态→展开筛选→查询/重置、未处理→处理表单→处理成功为已处理或失败保持未处理、查看/处理弹窗→取消关闭、记录→归档/删除（仅契约观察）。"
  - "Pairwise/2-way 评估 Permission、Tenant、RecordState、EventIdentity、Timezone、ObjectAccess、FilterMode、Action、Result。约束：其他租户或拒绝权限的受保护操作对应权限错误；已处理再次处理仅允许可见/阻止；重复事件对应无重复；失效/删除/无权限对象筛选被阻止；删除仅管理员；展开筛选显示高级字段。该模型不授权接口、事件生成或删除行为。"
  - "自动化仅规划：页面 ready 需确认运行时 URL、标题、alert_record_default、body 可见且无失败提示。使用已确认 alert_record_* ID，其次 role/name、test_id、label、稳定属性，CSS 最后兜底；列表行操作必须先定位稳定目标行。详情/处理/归档/删除 locator 缺失时停止，不生成猜测选择器。"
  - "Web 执行先确认实际主机、登录态、页面证据和权限；仅保存脱敏 URL、标题、状态、截图、可视快照和必要日志。禁止捕获 endpoint、认证、载荷、联系人、触发消息原文、通知内容、设备敏感数据和未经授权业务值。"
environment:
  client: "PC Web"
  os: "win32；正式执行前记录实际客户端版本"
  browser: "Chromium；Playwright Python 规划可视模式 headless=False"
  base_url: "${UI_TEST_URL}"
  page_path: "/biopark-iot/iot/alert/record"
  portal_entry: "数据采集监控平台 / 告警中心 / 告警记录；page_id=alert_record，页面清单整体状态为 partial"
  login: "使用测试账号登录；凭据仅从 UI_TEST_USERNAME、UI_TEST_PASSWORD、UI_TEST_TENANT 运行时读取，不写入计划、日志或证据；权限状态 partial_blocked"
data:
  required:
    - "只读查看者、处理者、管理员和拒绝/跨租户角色的权限矩阵；账号、密码、租户值不写入产物。"
    - "脱敏的告警记录列表、无结果状态、筛选字段、分页/排序和页面状态证据；不得保存真实告警值。"
    - "补采详情字段、处理表单、取消/提交反馈、异步状态、归档/删除确认层、权限提示和稳定目标行定位器。"
    - "事件标识去重、三类时间字段、当前时区、历史配置快照、对象级联和留存/删除责任的脱敏契约证据。"
    - "对象有效/失效/删除/无权限的隔离上下文；不制造事件、不跨租户、不提交处理。"
  preparation: "由测试、告警记录负责人、数据监听负责人、产品/设备负责人和权限/租户负责人准备脱敏只读上下文与页面契约；本阶段不修改业务数据，清理状态为 not_applicable。"
roles:
  - "测试：执行已采集页面的只读观察，打开可确认弹窗后取消，不提交处理、归档或删除。"
  - "告警记录查看者：确认授权范围列表、详情入口和脱敏规则。"
  - "告警处理者：确认否到是的处理表单契约，但本阶段不提交。"
  - "告警记录管理员：确认归档/删除入口和不可恢复边界，但本阶段不确认。"
  - "只读用户：确认查询和查看，不执行任何写操作。"
  - "数据监听管理员：确认事件、时间和触发责任边界，不把接口契约带入 UI 结论。"
  - "产品/设备管理员：确认级联和对象状态/权限边界。"
  - "权限负责人：提供角色、租户、跨租户矩阵和无权限提示。"
  - "研发：补齐详情、处理、归档、删除、异步和稳定定位器契约。"
  - "测试设计：阻塞关闭后生成下游测试设计。"
dependencies:
  - "REQ-007 数据监听、REQ-009 数据采集、REQ-010 告警配置、REQ-003 产品管理、REQ-005 设备管理及用户/权限/租户管理：仅提供数据和责任边界。"
  - "通知渠道与运维处置流程：仅为下游依赖，不验证通知或外部通道。"
  - "page.json 已登记 alert_record：/biopark-iot/iot/alert/record、alert_record_default、alert_record_filter_expanded、alert_record_dialogs_partial。"
  - "公共页面对象 07_ui_automation/pages/common/login_page.py、07_ui_automation/pages/common/portal_navigation.py。"
  - "运行时配置键 UI_TEST_URL、UI_TEST_USERNAME、UI_TEST_PASSWORD、UI_TEST_TENANT；只引用键名，不复制值。"
priority: "P0：partial 页面契约、权限/租户、脱敏、处理/归档/删除副作用和详情定位缺失；P1：列表筛选分页排序、无结果/失败、对象级联、状态/时间/快照语义和查看处理入口；P2：表头设置、日期时区边界、事件去重、留存责任和补充反馈契约"
risks:
  - "page_inventory 整体状态为 partial，详情/处理/归档/删除证据不足；新增成功闭环用例保持 blocked，不编造 locator 或验收结论。"
  - "处理、归档和删除可能改变或不可恢复地删除告警记录；只打开并取消，不提交。"
  - "真实告警、触发消息、联系人、通知内容、设备位置或测量值泄露；证据严格脱敏。"
  - "角色/租户矩阵缺失可能导致越权结论失真；缺失则阻塞，不绕过权限。"
  - "事件去重、三类时间、历史快照和长期留存无法由页面独立证明；标记为接口/契约待确认。"
  - "详情/处理反馈定位器不稳定可能导致自动化误操作；稳定定位器缺失时停止。"
  - "删除、归档、处理异步/幂等语义不完整；不执行真实副作用操作。"
open_questions:
  - "page.json 整体状态为 partial，alert_record_dialogs_partial 的详情和处理字段、提交/取消/反馈/异步状态何时补齐？"
  - "归档/删除入口、确认层、不可恢复提示、权限和结果的实际页面状态与稳定元素 ID 是什么？"
  - "角色、租户、跨租户查看/详情/处理/归档/删除矩阵是什么？"
  - "事件标识、重复事件、规则版本和触发/创建/来源时间的可观察脱敏证据是什么？"
  - "当前用户时区及日期筛选的边界、夏令时/跨时区规则是什么？"
  - "产品/设备级联中失效、删除、无权限对象的页面反馈和历史对象展示规则是什么？"
  - "处理备注字段的空值、长度、非法字符和保存失败提示是什么？"
  - "重复提交、处理中禁止重复、刷新不重复和处理失败保留输入的实际可观察反馈是什么？"
  - "长期保存、归档、删除清理责任和正式 PDF REQ-011 逐条页码追溯是什么？"
entry_criteria:
  - "REQ-011 分析、需求变动、模块清单、page.json、config.yaml 和 test-plan.schema.json 可读取，REQ-ID 与模块身份一致。"
  - "已确认 page.json 采集 alert_record 页面、运行时路由、默认态、筛选状态、已登记元素和脱敏截图；整体页面清单状态为 partial。"
  - "已将 alert_record_dialogs_partial 的 locator/evidence 缺失、详情/处理/归档/删除反馈不完整和权限矩阵缺失记录为阻塞；未编造按钮、字段或 locator。"
  - "只读账号/角色/租户、脱敏策略、权限阻塞责任和停止条件已准备，或缺失项明确标记 blocked。"
  - "等价类、边界、判定表、状态转换、Pairwise、自动化停止条件和禁止真实副作用边界已评审。"
exit_criteria:
  - "YAML 通过 test-plan.schema.json，未新增字段且不含 tp/tp_id；Markdown 与 YAML 范围、策略、风险、准入/准出、证据和套件建议一致。"
  - "冒烟、定向、全量三个计划层级已定义；未生成测试点、测试用例、CSV、禅道数据或 UI 自动化脚本。"
  - "已采集页面事实、partial 状态、分析规则、待补契约和业务确认规则分离；不得宣称详情、处理、归档、删除、事件生成、快照、留存或权限已验收。"
  - "只读规划不产生业务数据变更；出现处理提交、归档/删除确认、真实告警触发、敏感信息暴露、权限绕过或路由不符时停止。"
  - "不宣称处理持久化成功、事件去重正确、历史快照正确、时区筛选正确、长期留存正确、删除不可恢复正确或接口行为已验证。"
