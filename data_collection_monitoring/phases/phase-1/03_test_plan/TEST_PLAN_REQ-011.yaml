  - "page.json 已登记状态 alert_record_default：告警配置、告警级别、产品、查询、重置、展开、刷新、表头设置、查看、处理和分页元素；表格 alert_record_table / alert_record_table_element。"
  - "page.json 已登记状态 alert_record_filter_expanded：设备、是否处理、开始日期、结束日期；可只读核验该状态。"
  - "page.json 已登记 alert_record_dialogs_partial 与 alert_record_dialog，但详情/处理 locator 缺失、evidence partial，不得扩展为完整弹窗契约。"
  - "已登记脱敏截图：02_analysis/page_inventory/screenshots/req011-default.png、02_analysis/page_inventory/screenshots/req011-filter-expanded.png；主体 DOM 未保存，日志和 trace 路径为空。"
  - "执行证据仅可保存脱敏 URL、标题、状态、截图、可视快照、浏览器版本、时间和必要日志；禁止保存账号、租户、Token、Cookie、设备标识、位置、测量值、联系人、触发消息、通知内容和内部响应。"
suites:
