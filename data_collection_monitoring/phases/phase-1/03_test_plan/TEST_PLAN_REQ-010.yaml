plan_id: TEST_PLAN-REQ-010
title: "告警配置测试计划"
status: draft
source_inputs:
  - "01_requirements/数据监控平台使用文档.pdf"
  - "01_requirements/需求变动.md"
  - "01_requirements/模块拆分清单.md"
  - "02_analysis/REQ-010.yaml"
  - "02_analysis/REQ-010.md"
  - "02_analysis/page_inventory/page.json"
  - "config.yaml"
  - "../../../.agents/references/test-plan.schema.json"
trace:
  story: "告警配置基础字段、级别、状态、接收用户和接收类型的限定范围只读测试计划；实际 page.json 未登记 alarm_config 页面，页面执行和自动化定位保持 blocked，不把分析文件中的页面契约升级为已采集原型事实"
  req: REQ-010
  project: "数据采集监控平台"
  version: 1
  status: draft
objective: "基于 REQ-010 最新确认项和实际 page.json 内容，规划告警配置列表、配置名称/状态/日期筛选、查询、重置、刷新、表头、分页、创建时间倒序、新增/编辑字段契约、基础必填校验、引用限制、状态边界、权限租户、脱敏和取消边界验证；补充新增、编辑、删除及启停的成功反馈和结果回读闭环；当前页面证据不足，计划不得执行真实保存、删除、启停、告警触发或通知发送。"
scope:
  in_scope:
    - "规划运行时路由 /biopark-iot/iot/alert/config、标题 数据采集 - 告警配置、菜单 告警中心→告警配置和默认态 alarm_config_default 的只读到达核验；这些内容来自 REQ-010 分析契约，当前不视为 page.json 已采集事实。"
    - "规划配置名称、状态、开始日期、结束日期筛选，查询、重置、刷新、表头设置、列表、分页、创建时间倒序和无结果边界。"
    - "规划新增/编辑字段：名称、描述、级别、状态、接收用户、接收类型，以及取消边界；分析中登记的 alarm_* ID 只能作为待补页面契约，未因 page.json 缺失而创建定位断言。"
    - "规划告警级别 INFO/WARN/ERROR、状态开启/停用、接收类型短信/邮箱/站内信的业务等价类；页面样例仅观察到部分枚举，站内信证据缺失。"
    - "规划配置名称必填、描述可空且单行、级别/接收用户/接收类型必填、接收用户和类型多选、同租户名称可重复、编辑规则一致。"
    - "规划被引用配置不可删除但可停用和编辑，停用后已有监听继续使用旧配置，历史告警保留触发时快照；补充未引用删除成功、删除后列表不可见、编辑保存回读和启停状态回读；本阶段只验证契约，不执行写操作或触发。"
    - "规划角色、租户、只读/完整权限、跨租户数据隔离和无权限提示；不得从按钮、菜单或表单可见性推断写权限。"
    - "规划查询有结果/无结果/失败/超时/网络异常/权限不足、重复提交、处理中禁止重复操作、刷新重新加载最新数据、取消无需二次确认、校验错误保留输入、保存失败保留输入和软删除列表不显示等公共边界；因页面反馈缺失仅作为待验证模型。"
    - "规划通知模板变量、送达结果的页面归属和脱敏确认，不执行真实通知，不读取手机号、邮箱、联系人、模板变量、通知载荷或送达结果。"
    - "以分析文件列出的 alarm_config_*、alarm_add_*、alarm_edit_*、alarm_delete_*、alarm_columns_* 作为待补采契约清单；不得将其写成 page.json 已确认 locator。"
  out_scope:
    - "告警对象、条件表达式、多条件、采样窗口、数据缺失、阈值、单位、精度、滞回、持续时间、恢复条件。"
    - "连续触发、频率限制、冷却、抑制、升级、规则版本、草稿、审批、发布、回滚和生效时间。"
    - "告警生命周期、通知失败/重试/限流/熔断/死信/人工重发、沙箱、模拟数据、虚拟接收人和真实通知发送。"
    - "API endpoint、状态码、请求/响应、规则引擎、性能 SLA、接口幂等和真实写操作。"
    - "REQ-011 告警记录及短信/邮箱/站内信通道内部实现；依赖仅表示责任边界。"
    - "测试点、测试用例、CSV、禅道数据和 UI 自动化脚本。"
strategy:
  - "采用黑盒、风险优先、限定范围只读规划；readiness=blocked。由于实际 page.json pages 仅包含 plugin_management、data_crawl、home、product_category、product_management、device_group、alert_record、data_push，未登记 alarm_config，不能执行页面定位、交互或自动化断言。"
  - "等价类覆盖名称有效/空/非法字符/同租户重复，描述空/单行/换行，级别未选/INFO/WARN/ERROR，状态开启/停用，接收用户空/单选/多选/越权，接收类型短信/邮箱/站内信/不支持 Webhook/队列，未引用/已引用，完整/只读/拒绝/跨租户权限和有结果/无结果/失败。"
  - "边界候选覆盖名称和描述空/最小/最大/非法字符，接收用户数量 0/1/最大/超限，日期空/同日/开始晚于结束/跨月跨年，分页空/单条/10 条/末页/无结果；具体系统上限待确认。"
  - "判定表覆盖基础必填缺失禁止保存且字段提示/保留输入；未引用删除与已引用删除；已引用停用或编辑；开启/停用即时生效；支持与不支持接收类型；默认/筛选/分页/刷新保持创建时间倒序且筛选回第一页。"
  - "状态转换覆盖未认证→登录→门户→告警配置默认态、默认态→新增/编辑→校验失败或保存成功、开启↔停用、未引用/已引用→删除允许或阻止、配置触发→历史快照；仅作待验证模型，不触发真实告警。"
  - "Pairwise/2-way 评估 Permission、Tenant、RequiredFields、Severity、Status、ReceiverCount、ReceiveType、Reference、Action、Result。约束：只读/拒绝/跨租户保护写操作对应权限错误；必填缺失、级别未选、接收人数为零或不支持渠道对应校验错误；已引用删除对应阻止；异租户数据/操作对应权限错误。模型不代表真实通知或接口行为。"
  - "Playwright Python/pytest-playwright 仅规划：复用公共登录和门户导航；在 page.json 补采 alarm_config 页面、状态、元素和脱敏证据前，不生成 alarm_config locator、不执行页面操作。补采后按已确认 ID、role/name、test_id、label、稳定文本/属性、CSS 最后兜底，列表先定位目标配置行再定位行内操作。"
  - "Web 执行先确认实际主机、运行时 URL、标题和新增页面契约；当前 page.json 缺页，直接停止。不得捕获 endpoint、认证、载荷、联系人、接收地址、通知结果或未经授权业务数据。"
environment:
  client: "PC Web"
  os: "win32；正式执行前记录实际客户端版本"
  browser: "Chromium；Playwright Python 规划可视模式 headless=False"
  base_url: "${UI_TEST_URL}"
  page_path: "/biopark-iot/iot/alert/config"
  portal_entry: "数据采集监控平台 / 告警中心 / 告警配置；分析契约标记 page_id=alarm_config，但当前 page.json 未登记该页面"
  login: "使用测试账号登录；凭据仅从 UI_TEST_USERNAME、UI_TEST_PASSWORD、UI_TEST_TENANT 运行时读取，不写入计划、日志或证据；权限状态 partial_blocked"
data:
  required:
    - "只读账号、角色、租户和权限矩阵；账号、密码、租户值不写入产物。"
    - "脱敏的告警配置列表、字段枚举、筛选/分页/排序和页面状态证据；当前 page.json 无 alarm_config 证据，需补采。"
    - "补采 alarm_config 页面路由、标题、菜单、默认态、列表、筛选、表头、分页、新增、编辑、删除确认、停用/启用、保存/校验/异步/权限/引用反馈稳定 ID。"
    - "补采站内信选项、模板变量和通知送达结果页面归属；不提供真实接收人或触发通知。"
    - "角色/租户矩阵、引用标识和隔离测试数据；数据必须脱敏且只读。"
  preparation: "由测试、告警配置负责人、数据监听负责人、用户/通知管理员和权限负责人准备脱敏页面契约与只读上下文；本阶段不修改业务数据，清理状态为 not_applicable。"
roles:
  - "测试：执行页面契约补采后的只读观察，不保存、不删除、不启停、不触发告警、不发送通知。"
  - "告警配置管理员：确认名称、描述、级别、状态、接收用户和接收类型边界。"
  - "数据监听管理员：确认对象、条件、触发和规则版本属于外部模块，不在本计划内。"
  - "用户/通知管理员：提供脱敏用户/渠道上下文，不提供真实接收地址或发送。"
  - "只读用户：确认授权租户内可见性、筛选和敏感信息脱敏。"
  - "权限负责人：提供角色、租户、跨租户矩阵和无权限提示。"
  - "研发：补采 alarm_config 页面及保存、校验、异步、引用、权限和错误反馈契约。"
  - "测试设计：在 page.json 缺页阻塞关闭后生成下游测试设计。"
dependencies:
  - "REQ-003 产品管理、REQ-005 设备管理、REQ-007 数据监听、REQ-009 数据采集、用户管理、登录/门户/权限/租户上下文：仅提供责任边界。"
  - "REQ-011 告警记录、短信/邮箱/站内信通知渠道：仅提供下游上下文，不代表接口或通知已验证。"
  - "分析文件声明的运行时页面：/biopark-iot/iot/alert/config；实际 page.json 当前未登记 alarm_config。"
  - "公共页面对象 07_ui_automation/pages/common/login_page.py、07_ui_automation/pages/common/portal_navigation.py。"
  - "运行时配置键 UI_TEST_URL、UI_TEST_USERNAME、UI_TEST_PASSWORD、UI_TEST_TENANT；只引用键名，不复制值。"
priority: "P0：page.json 缺页阻塞、权限/租户、接收人和渠道脱敏、被引用删除风险、真实通知风险；P1：列表筛选分页排序、基础字段必填、级别/状态/接收类型、取消和错误保留输入；P2：表头设置、空结果、日期边界、模板变量/送达结果归属、补充页面契约"
risks:
  - "实际 page.json 未登记 alarm_config，若误将分析契约当作页面事实会产生虚假定位器、断言和执行结果；保持 blocked，先补采。"
  - "错误接收用户或渠道配置可能向真实人员发送通知；不保存、不触发、不发送。"
  - "被引用配置删除或停用行为影响监听和历史快照；仅规划证据，不执行写操作。"
  - "手机号、邮箱、联系人、模板变量、通知载荷或送达结果泄露；证据、日志、DOM、报告和下载文件严格脱敏。"
  - "模板变量和送达结果页面归属不清；记录待确认，不复用其他模块契约。"
  - "权限和租户矩阵缺失导致越权结论失真；记录阻塞，不绕过权限。"
  - "站内信页面选项和保存/校验/异步/引用反馈缺少稳定契约；不能编造 selector 或期望结果。"
open_questions:
  - "为什么 REQ-010 分析及其 HANDOFF 声明 alarm_config 页面，而实际 page.json pages 未登记 alarm_config？应补采还是修正分析契约？"
  - "正式 PDF REQ-010 章节逐条页码追溯是什么？"
  - "alarm_config 页面实际路由、标题、菜单、默认态和状态是否与分析文件一致？"
  - "新增、编辑、删除、停用/启用和表头设置的稳定元素 ID、弹窗状态和行数据定位器是什么？"
  - "保存成功/失败、字段校验、异步处理中、权限不足和被引用删除阻止的稳定提示与状态是什么？"
  - "名称/描述非法字符、接收用户数量和日期范围的系统默认边界是什么？"
  - "站内信选项、模板变量和通知送达结果的实际页面归属及展示规则是什么？"
  - "角色、租户、跨租户查看/查询/新增/编辑/删除/启停权限矩阵是什么？"
  - "页面每页、刷新、筛选回第一页和创建时间排序的实际观察证据是什么？"
entry_criteria:
  - "REQ-010 分析文件、需求变动、模块清单、page.json、config.yaml 和 test-plan.schema.json 可读取，REQ-ID 与模块身份一致。"
  - "已确认实际 page.json 当前不含 page_id=alarm_config；该缺口已记录为 P0 阻塞，未将 alarm_config_* 写成已采集页面事实。"
  - "已确认分析文件列出的路由、状态、元素和 evidence 只能作为待补契约；不能据此执行 UI 或生成 locator。"
  - "只读账号/角色/租户、脱敏策略、权限阻塞责任和停止条件已准备，或缺失项明确标记 blocked。"
  - "等价类、边界、判定表、状态转换、Pairwise、自动化停止条件和禁止真实写入/通知边界已评审。"
exit_criteria:
  - "YAML 通过 test-plan.schema.json，未新增字段且不含 tp/tp_id；Markdown 与 YAML 范围、策略、风险、准入/准出、证据和套件建议一致。"
  - "冒烟、定向、全量三个计划层级已定义；未生成测试点、测试用例、CSV、禅道数据或 UI 自动化脚本。"
  - "实际 page.json 缺页、分析契约、待补证据和业务确认规则分离；不得宣称 alarm_config 页面已验证。"
  - "只读规划不产生业务数据变更；出现保存/删除/启停、真实告警触发、通知发送、敏感数据暴露、权限绕过或路由不符时停止。"
  - "不宣称配置保存成功、状态即时生效、引用删除阻止正确、历史快照正确、模板变量正确、通知送达成功或接口行为已验证。"
evidence:
  - "实际 page.json 解析出的 pages 为 plugin_management、data_crawl、home、product_category、product_management、device_group、alert_record、data_push；未发现 page_id=alarm_config。"
  - "page.json 中仅发现 alert_record_config（告警记录页面的告警配置筛选字段），不得将其复用为告警配置页面。"
  - "分析文件声明的待补页面契约：alarm_config、alarm_config_default、alarm_config_add、alarm_config_edit、alarm_config_delete、alarm_config_columns，以及 alarm_config_*、alarm_add_*、alarm_edit_*、alarm_delete_*、alarm_columns_*。"
  - "分析文件列出的 alarm-config DOM、日志和截图路径在当前计划中只作为待确认输入，不作为 page.json 已采集证据；需核对文件是否存在、是否属于本页面且已脱敏。"
  - "执行证据仅可保存补采后的脱敏 URL、标题、菜单、页面状态、截图、可访问性/可视快照、浏览器版本、时间和必要日志；禁止保存账号、租户、接收地址、联系人、模板变量、通知载荷、送达结果和内部响应。"
