scope:
  in_scope:
    - "告警记录列表查询、配置/级别/产品筛选、设备/是否处理/日期高级筛选。"
    - "查询、重置、展开、刷新、表头设置、分页、默认创建时间倒序和最新记录展示。"
    - "告警记录编号、事件标识、触发/创建/来源时间、历史告警配置快照和处置状态契约。"
    - "查看与处理入口；补充处理成功‘否→是’状态回读、失败保持‘否’、操作人、操作时间和备注的处理结果契约。"
    - "有权限归档后的列表/留存回读，以及删除后的列表不可见和不可恢复边界回读；实际副作用操作仍禁止。"
    - "产品/设备级联筛选、失效或无权限对象不可选择、历史记录保留原对象信息。"
    - "角色、租户、脱敏、异步反馈、留存/归档/删除责任边界。"
  out_of_scope:
    - "告警配置规则维护、告警对象/条件/阈值/触发策略配置。"
    - "确认、关闭、重开、转派、批量操作、导出、恢复和其他处置状态。"
    - "详情中的阈值、实际值、单位、时间序列、位置、质量码、原始消息、通知状态和处理备注详情展示。"
    - "通知发送、自动回复、数据监听实现、接口 endpoint/状态码/载荷、性能 SLA 和外部通道。"
    - "真实环境处理提交、归档、删除、跨租户访问及不可恢复操作。"
  acceptance_boundary:
    - "需求变动.md 的 REQ-011 最新回答是业务基准。"
    - "page.json 页面、状态、元素 ID 和脱敏 evidence 是页面事实基准。"
    - "列表或处理入口可见不等于详情完整、权限正确、处理持久化、审计、留存或跨租户隔离已验收。"
