      elements: ["alert_record_config", "alert_record_level", "alert_record_product", "alert_record_query", "alert_record_reset", "alert_record_expand", "alert_record_refresh", "alert_record_columns", "alert_record_view", "alert_record_handle", "alert_record_page_size", "alert_record_prev", "alert_record_next", "alert_record_jump"]
