test_design:
  equivalence_partitions:
    name:
    - non_empty
    - empty
    - whitespace_only
    - duplicate_same_tenant
    description:
    - empty
    - multiline
    - whitespace
    - special_chars
    status:
    - enabled
    - disabled
    - deleted
    sort:
    - positive_integer
    - invalid_type
    - empty
    association:
    - none
    - product
    - device_group
    - homepage_statistic
    action:
    - query
    - reset
    - refresh
    - add
    - edit
    - disable
    - delete
    result:
    - success
    - validation_error
    - load_failure
    - save_failure
    - conflict
    - blocked_by_reference
    - permission_error
  boundary_candidates:
  - 名称空/仅空白/任意字符/同租户重名
  - 描述空/换行/空白/特殊字符
  - 排序正整数/非法类型/空值/重复
  - 时间格式和用户时区
  - 分页首末页和空结果
  - 关联阻断和跨模块刷新
  - 保存中重复点击和并发冲突
  decision_table:
  - 空名称=>校验失败
  - 同租户重名=>允许且不提示
  - 停用=>新产品不可选且既有产品保留
  - 有关联删除=>阻止
  - 空字段=>显示-
  - 加载失败=>失败提示
  - 保存中=>禁用并只处理一次
  state_transitions:
  - 未认证->登录页->门户->product_category_default
  - 默认->筛选->结果->重置/刷新
  - 默认->新增/编辑->校验或取消
  - 默认->删除确认->取消
  - 启用->停用->关联产品保留/新产品阻断
  pict_model:
    parameters:
    - Auth
    - Permission
    - Name
    - Description
    - Status
    - Sort
    - Association
    - Action
    - Result
    constraints:
    - IF [Permission] = read_only THEN [Action] IN {query, reset, refresh};
    - IF [Action] IN {add, edit} AND [Name] IN {empty, whitespace_only} THEN [Result]
      = validation_error;
    - IF [Action] IN {add, edit} AND [Name] = duplicate_same_tenant THEN [Result]
      = success;
    - IF [Action] = delete AND [Association] != none THEN [Result] = blocked_by_reference;
    - IF [Sort] = invalid_type THEN [Result] = validation_error;
