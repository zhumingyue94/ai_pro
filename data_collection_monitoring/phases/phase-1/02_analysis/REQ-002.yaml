requirements:
  confirmed:
    REQ-002-001: 分类名称必填；长度和字符不限制，仅校验不能为空；同租户内允许重名且不提示。
    REQ-002-002: 分类描述非必填，可为空；支持换行、空白和常见特殊字符。
    REQ-002-003: 状态含启用、停用、删除；停用分类不可被新产品选择；已有产品保留原分类。
    REQ-002-004: 创建时间按当前用户时区保存和显示，格式YYYY-MM-DD HH:mm:ss；列表按排序字段升序；不支持按创建时间筛选。
    REQ-002-005: 产品数量统计当前分类下全部未删除产品，包含停用、不包含已删除；进入页面或手动刷新时更新；不一致时重查实际关联数据。
    REQ-002-006: 已被产品使用的分类允许改名，历史记录同步新名称；停用保留已有产品原分类；删除前处理全部关联产品。
    REQ-002-007: 列表展示编号、名称、描述、状态、创建时间、操作；空字段显示-；加载失败显示失败提示。
    REQ-002-008: 新增默认启用、编辑回显、取消关闭直接返回、保存中禁用提交、重复提交一次、失败保留输入、并发提示刷新重试、删除失败保留数据并说明原因。
    REQ-002-009: 分类与产品、设备分组及首页统计通过分类唯一编号关联；相关页面和统计在重新进入或手动刷新时更新。
    REQ-002-010: 表头设置保存到当前用户，重新进入、切换页面或重新登录后保留。
    REQ-002-011: 确认表用于补充PDF和页面探索未明确内容，不与正式PDF逐条对应。
    REQ-002-012: 排序为数字输入框，只允许正整数，不限最大值，允许重复；按排序字段升序；标题按系统默认规则。
    REQ-002-013: 本模块不要求产品数量列或对应列表接口字段，当前六列表格保持不变。
    REQ-002-014: 需以截图或日志验证停用分类的既有产品显示、新产品选择阻断和分类改名后的跨模块刷新。
  pending:
  - 正式PDF REQ-002章节逐条追溯
  - 排序正整数输入的页面/接口一致性和升序稳定性
  - 产品数量统计规则与当前六列表格无数量列之间的追踪证据
  - 删除/停用关联阻断及跨模块运行证据
