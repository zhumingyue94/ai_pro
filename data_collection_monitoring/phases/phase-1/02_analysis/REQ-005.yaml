requirements:

  confirmed:

    REQ-005-001: "名称必填、同作用域唯一、编辑改名重新校验；其他边界按默认规则。"

    REQ-005-002: "备注可空，支持换行/空白/常见特殊字符；长度按默认限制。"

    REQ-005-003: "无设备标识字段；序列号用户录入且可修改；其他边界按默认规则。"

    REQ-005-004: "类型由产品属性决定，设备侧不可独立修改。"

    REQ-005-005: "新建必须选产品，绑定后不可换；停用/删除产品不影响已有绑定且阻止新增关联。"

    REQ-005-006: "状态为未激活/在线/离线，连接和断开按确认规则转换。"

    REQ-005-007: "同级排序可设置，列表按排序升序。"

    REQ-005-008: "支持多级父子、不同产品类型、绑定/解绑/移动，父有子时不能直接删除。"

    REQ-005-009: "支持多分组和批量加入，重复关系幂等，冲突保留失败明细，关系变更后数量/范围立即更新。"

    REQ-005-010: "任一业务引用禁止删除，但允许编辑/停用；全部解除后允许删除。"

    REQ-005-011: "批量删除/分组任一失败整体回滚，失败后整体手动重试。"

    REQ-005-012: "当前页面无设备凭据字段。"

    REQ-005-016: "名称和序列号必填唯一，不限长度但限制非法字符；备注可空且不限长度；错误定位到字段。"

    REQ-005-017: "设备管理状态应与插件管理设备数弹窗中的对应设备状态一致。"

    REQ-005-018: "上线时间为最近一次上线时间，重上线更新，离线保留。"

    REQ-005-019: "禁止父子循环；不设固定最大深度；允许移动和跨产品类型；父有子时先处理子设备。"

    REQ-005-020: "批量任一失败整体回滚，显示失败明细，用户整体重试；残留关系检查不纳入本阶段功能测试。"

    REQ-005-021: "产品停用不影响已有绑定；存在绑定的产品不得删除；具体阻止提示按实际页面记录。"

  pending: ["PDF REQ-005 章节逐条追溯", "运行时最终路由和标题", "REQ-005 专属 page/state/element/table 证据", "默认排序并列值和上线时间时区/格式/来源", "状态事件来源和插件弹窗一致性页面证据", "产品停用/删除后的新增关联页面反馈", "父子移动失败提示和跨租户边界", "批量失败明细、回滚和整体重试页面证据", "角色/租户矩阵和页面反馈稳定定位器"]

