scope:

  confirmed:

    - "名称必填，同租户或业务范围内唯一；编辑允许改名并重新校验唯一性；长度、空白和特殊字符按系统默认规则。"

    - "备注非必填，可为空，支持换行、空白和常见特殊字符；长度按系统默认限制。"

    - "页面无设备标识字段；序列号由用户录入且可修改，相关字符、长度、唯一性和重复处理按系统默认规则。"

    - "设备类型属于产品属性；新建设备选择产品后自动带入，设备侧不可单独修改。"

    - "创建设备必须选择产品；绑定后不可更换；产品停用或删除不影响已有绑定，但不得新增关联。"

    - "状态仅为未激活、在线、离线；连接建立即在线，断开立即离线，未激活保持未激活，激活后可通过连接恢复在线。"

    - "新增/编辑支持同级排序，列表按排序字段升序；上线时间语义另有最新确认，需与排序字段分开核对。"

    - "支持父子设备和多级层级；父子产品类型可不同；支持绑定、解绑、移动；父设备有子设备时不能直接删除。"

    - "设备可加入多个分组，支持批量加入；重复关系不重复；冲突保留失败明细；加入/移出后数量和可见范围立即更新。"

    - "存在产品、插件、采集任务或其他业务引用时仅禁止删除，仍允许编辑和停用；解除全部引用后才允许删除。"

    - "批量删除或批量分组任一失败则整体回滚，展示失败明细；用户修正后整体重试，不保留部分结果或残留关系。"

    - "当前页面无设备凭据字段，本项不适用。"

    - "父子关系禁止循环，不设固定最大层级；允许跨产品类型移动但不得形成循环。"

    - "最近一次上线时间在重新上线时更新，离线后保留；具体来源、时区和展示格式需按页面记录。"

  public_rules_confirmed:

    - "沿用公共权限、列表匹配、分页、空结果、失败提示、异步处理、删除/停用、字段空值、排序、表头设置和定位器规则。"

    - "本阶段仅进行页面级 UI/行为验证，不进行接口测试；不将页面可见性推断为权限结论。"

    - "账号、租户和测试数据按 .env 运行时读取；敏感信息及未经授权业务数据不得进入页面清单、截图、日志、DOM、报告或下载文件。"

  in_scope: ["设备列表与筛选", "新增/编辑/停用/激活/删除边界", "产品绑定", "状态展示", "父子层级", "分组关系", "引用删除限制", "批量事务规则", "租户和角色边界", "页面定位和只读自动化规划"]

