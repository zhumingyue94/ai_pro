test_design:

  equivalence_partitions:

    name: [unique, empty, duplicate_same_scope, invalid_default_rule]

    serial: [unique, empty, duplicate, invalid_default_rule]

    remark: [empty, whitespace, multiline, special_chars]

    product: [active_available, inactive_existing_binding, deleted_existing_binding, unavailable_new, missing]

    status: [unactivated, online, offline, reconnect]

    hierarchy: [root, child, multi_level, different_product_type, cycle_attempt, parent_with_children]

    group: [single, multiple, batch, duplicate_relation, conflict]

    reference: [none, product, plugin, collection_task, other, all_cleared]

    batch: [all_success, one_failure, rollback, failure_detail, whole_retry]

    permission: [authorized, unauthorized, cross_tenant]

  boundary_candidates: ["名称/序列号空、重复、非法字符和默认边界", "备注空白/换行/特殊字符", "产品绑定后换绑及停用/删除产品", "未激活/连接/断开/重连", "根/多级/跨产品/循环尝试", "重复分组/批量冲突", "任一引用/全部解除", "批量单项失败整体回滚", "排序相等值/升序与上线时间分离", "未授权/跨租户"]

  decision_table: ["名称空或重复拒绝，唯一允许；编辑重新校验", "已有产品绑定保留，停用/删除产品不得新增关联", "未激活保持未激活，连接在线，断开离线，重连在线", "父有子删除拒绝，移动不得循环", "有引用仅删除拒绝，编辑/停用允许", "批量任一失败整体回滚并整体重试", "分组重复不新增关系，冲突有失败明细"]

  state_transitions: ["未激活->在线->离线->在线", "根->子->多级->解绑/移动", "设备->多分组->移出", "无引用->有引用->删除拒绝->解除->删除允许", "批量->失败->回滚->整体重试"]

  pict_model:

    parameters: ["Name", "Serial", "Product", "Status", "Hierarchy", "Group", "Reference", "BatchResult", "Permission"]

    constraints: ["IF [Name] = empty THEN [Permission] = authorized;", "IF [Hierarchy] = cycle_attempt THEN [BatchResult] = rollback;", "IF [Reference] IN {product, plugin, collection_task, other} THEN [BatchResult] <> success;", "IF [BatchResult] = one_failure THEN [BatchResult] = rollback;", "IF [Permission] IN {unauthorized, cross_tenant} THEN [BatchResult] <> success;"]

    note: "仅为候选参数和约束，不生成或执行真实写操作。"

