requirements:

  confirmed:

    REQ-006-001: "名称由系统默认名称与端口拼接生成，默认名称不可编辑。"

    REQ-006-002: "类型代表协议，包含 emqx、mqtt、http，不单独选择协议。"

    REQ-006-003: "端口为合法数字端口，禁止保留端口；创建时同协议和跨协议均不可重复。"

    REQ-006-004: "编号系统生成、创建后不可修改、全局唯一，重复拒绝创建。"

    REQ-006-005: "支持创建/启动/停止/删除；状态为已创建/运行中/已停止；停止后可启动；创建时间倒序。"

    REQ-006-006: "设备数统计未删除设备，包含停用设备，按唯一编号去重；进入页面/刷新重新查询。"

    REQ-006-007: "创建后配置不可修改且无编辑功能；不涉及升级/灰度/回滚/设备兼容。"

    REQ-006-008: "运行中不可删除但可停用，停用后可删除；其他关系规则按页面记录。"

    REQ-006-009: "地址按业务需要展示；证书、密钥和敏感配置全链路脱敏，旧值清理。"

    REQ-006-010: "确认表用于补充 PDF 和页面探索内容，不与 PDF 逐条直接对应。"

    REQ-006-011: "名称是否实际只读、默认名称生成和端口变化结果按页面确认。"

    REQ-006-012: "新增支持 emqx、mqtt、http；列表和筛选含已创建；枚举按页面实际记录。"

    REQ-006-013: "端口合法数字、禁用保留端口；创建时检查同协议和跨协议冲突；具体范围和提示按页面记录。"

    REQ-006-014: "只记录创建、启动、停止、再次启动、重启、故障恢复、删除和停用的页面按钮、状态和反馈。"

    REQ-006-015: "分页、筛选、刷新、排序和表头设置控件定位沿用 PUB-015，具体字段和持久化范围按页面记录。"

    REQ-006-016: "按角色验证查看、创建、启动、停止和删除等页面权限；插件管理列表不需要针对不同租户进行管理，不将租户差异作为列表管理、筛选或隔离条件；接口细节不测试。"

  pending: ["PDF REQ-006章节逐条追溯", "名称只读实现和端口变化后的派生显示", "emqx与已创建选项的页面证据", "端口具体范围、保留端口和错误提示", "完整生命周期页面反馈及异步失败表现", "设备数刷新/去重/删除排除/停用包含的页面证据", "稳定分页定位器、并列排序处理和表头设置持久化", "详情/运行日志/错误提示中的敏感信息脱敏与旧值清理", "角色权限矩阵和无权限页面反馈"]

roles:

  - {name: "插件查看人员", responsibility: "查看授权范围内插件、状态、设备数和详情"}

  - {name: "插件管理员", responsibility: "按权限创建、启动、停止、停用和删除插件"}

  - {name: "设备/产品管理员", responsibility: "维护插件关联设备和产品依赖"}

  - {name: "平台运维/审计人员", responsibility: "维护运行状态、安全保护和异常处置"}

