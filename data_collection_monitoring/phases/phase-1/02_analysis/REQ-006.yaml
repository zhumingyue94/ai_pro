  downstream: ["设备消息", "采集/连接链路", "运行监控", "告警和审计"]

risks:

  - {id: "R-006-01", level: "critical", description: "证书、密钥或敏感配置明文泄露", control: "表单/详情/日志/错误提示全链路脱敏，禁止记录真实值"}

  - {id: "R-006-02", level: "critical", description: "运行中插件被删除或停用后状态不一致", control: "只读确认状态按钮和反馈，本阶段不写入"}

  - {id: "R-006-03", level: "high", description: "端口重复规则与最新确认不一致", control: "覆盖同协议、跨协议、保留端口和创建时冲突"}

  - {id: "R-006-04", level: "high", description: "名称、编号或状态选项与确认规则冲突", control: "保留 page.json 差异，不强行覆盖"}

  - {id: "R-006-05", level: "high", description: "设备数统计未去重或未按刷新重查", control: "记录页面可见刷新行为，不推断接口结果"}

test_design:

  equivalence_partitions:

    name: [system_generated, derived_from_port, attempted_edit]

    type: [emqx, mqtt, http, unsupported]

    port: [valid_unique, same_protocol_duplicate, cross_protocol_duplicate, reserved, out_of_range, invalid_format]

    lifecycle: [created, running, stopped, stop_then_start, restart, fault_recovery, async_failure]

    device_count: [active_included, disabled_included, deleted_excluded, duplicate_id_deduped, refreshed]

    security: [address_allowed, certificate_masked, key_masked, secret_masked, old_value_cleared, plaintext_forbidden]

    permission: [authorized, unauthorized, tenant_not_management_scope]

  boundary_candidates: ["端口最小/最大/保留/越界/格式", "同协议与跨协议重复", "名称派生和端口变化", "已创建/运行中/已停止", "运行中删除与停用", "设备删除排除/停用包含/编号去重", "进入页面和刷新", "四类敏感展示位置", "筛选/分页/刷新后的创建时间倒序", "未授权", "租户差异不作为插件列表管理条件"]

  decision_table: ["同协议或跨协议端口重复均拒绝；合法唯一端口按页面反馈处理", "运行中删除拒绝但停用允许；停用后删除允许", "设备数包含停用、排除删除、唯一编号去重", "敏感字段全链路脱敏且旧值清理", "默认/筛选/分页/刷新均创建时间倒序", "未授权不允许执行超出角色权限的操作；租户差异不作为插件列表管理条件"]

  state_transitions: ["不存在->已创建->运行中->已停止->运行中", "运行中->停用->删除允许", "运行中->删除请求->拒绝", "关联变化->进入页面/刷新->重新查询->设备数更新", "敏感值存在->删除/替换->旧值清理"]

  pict_model:

    parameters: ["Type", "PortRelation", "Lifecycle", "DeviceSet", "SecurityLocation", "Ordering", "Permission"]

    values: {Type: [emqx, mqtt, http, unsupported], PortRelation: [unique, same_protocol_duplicate, cross_protocol_duplicate, reserved, out_of_range, invalid], Lifecycle: [created, running, stopped, restart, fault_recovery], DeviceSet: [active, disabled, deleted, duplicate_id, refreshed], SecurityLocation: [form, detail, log, error], Ordering: [default, filtered, paged, refreshed], Permission: [authorized, unauthorized, tenant_not_management_scope]}

    constraints: ["IF [PortRelation] IN {same_protocol_duplicate, cross_protocol_duplicate, reserved, out_of_range, invalid} THEN [Lifecycle] <> created;", "IF [SecurityLocation] IN {form, detail, log, error} THEN [Permission] = authorized;", "IF [Permission] = unauthorized THEN [Lifecycle] <> restart;"]

    note: "候选模型，不执行真实创建、启动、停止、删除或敏感配置提交。"

