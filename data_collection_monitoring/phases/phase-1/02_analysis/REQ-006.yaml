scope:

  confirmed:

    - "名称由系统默认名称与端口拼接生成，默认名称不可修改，最终名称随端口确定。"

    - "新增仅选择插件类型，不单独选择协议；类型包括 emqx、mqtt、http。"

    - "同协议端口不可重复；最新确认补充同协议和跨协议均不允许重复。端口必须为合法数字端口且禁止保留端口。"

    - "插件编号由系统生成，创建后不可修改且全局唯一；重复时拒绝创建。"

    - "支持创建、启动、停止、删除；状态为已创建、运行中、已停止；停止后可再次启动；列表创建时间倒序。"

    - "设备数统计全部未删除设备，包含停用设备，按设备唯一编号去重；进入页面或手动刷新重新查询，不使用缓存。"

    - "创建后不支持配置编辑，不涉及配置升级、灰度、回滚及设备类型兼容规则。"

    - "运行中禁止删除但允许停用；停用后允许删除。"

    - "地址按业务需要展示；证书、密钥和敏感配置在表单、运行详情、日志、错误提示中脱敏，删除或替换后清理旧值。"

    - "仅按页面行为记录生命周期按钮、状态变化和反馈，不纳入接口契约或接口测试。"

    - "按角色验证页面操作权限；插件管理列表不需要针对不同租户进行管理，不将租户差异作为列表管理、筛选或隔离条件，接口细节不纳入测试。"

  in_scope: ["插件列表、筛选、刷新、表头设置、分页", "新建字段和类型状态选项", "端口和名称派生规则", "编号、生命周期、设备数和排序", "详情/运行/错误反馈的敏感信息脱敏", "停用和删除边界", "角色、租户和页面权限边界"]

  out_of_scope: ["接口状态码、错误码、审计字段和性能指标", "配置升级、灰度、回滚和设备类型兼容", "真实创建/启动/停止/停用/删除", "敏感配置提交", "导入导出", "绕过权限或安全控制"]

