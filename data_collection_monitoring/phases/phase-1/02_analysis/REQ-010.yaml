    - "列表、配置名称/状态/日期筛选、查询、重置、刷新、表头设置、分页和创建时间倒序。"
    - "新增、编辑、删除、启用/停用的字段、基础必填校验、引用限制、权限和取消边界；本阶段不提交写操作。"
    - "配置名称、描述、告警级别、配置状态、接收用户、接收类型、模板变量和通知送达结果的页面契约识别。"
    - "角色、租户、脱敏、异步反馈、字段错误、引用阻止和数据变更责任边界。"
  out_of_scope:
