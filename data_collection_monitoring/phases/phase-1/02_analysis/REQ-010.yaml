    - "连续触发、频率限制、冷却、抑制、升级、规则版本、草稿、审批、发布、回滚和生效时间。"
    - "告警生命周期、通知失败/重试/限流/熔断/死信/人工重发、沙箱和真实通知发送。"
    - "API endpoint、状态码、请求/响应、规则引擎、性能 SLA、真实写操作和接口验收。"
  acceptance_boundary:
    - "业务基准为需求变动.md 最新 REQ-010 和公共确认项。"
    - "页面事实以 page.json 页面、状态、元素、交互和脱敏 evidence 为准。"
    - "控件可见或表单打开不等于保存成功、状态生效、引用校验完成或通知送达。"
