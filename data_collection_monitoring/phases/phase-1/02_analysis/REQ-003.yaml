risks:

  - {id: "R-003-01", level: "critical", description: "有关联产品误删可能丢失设备、采集、推送或告警链路", mitigation: "只读核验删除阻止和提示；写操作需授权和隔离数据"}

  - {id: "R-003-02", level: "critical", description: "状态/版本/物模型发布失败未回滚可能影响在线设备", mitigation: "核验状态、版本、兼容性、回退；本阶段不发布"}

  - {id: "R-003-03", level: "high", description: "租户内名称或ProductKey唯一性及并发处理不一致", mitigation: "待确认唯一性、幂等和并发契约；不写入真实数据"}

  - {id: "R-003-04", level: "high", description: "分类启停/改名/删除处理错误造成产品分类失联", mitigation: "核验启用选择、已有产品保留、删除阻止和改名同步"}

  - {id: "R-003-05", level: "high", description: "导出泄露隐藏敏感字段或临时文件未清理", mitigation: "只读核对导出契约；未经授权不下载业务文件"}

  - {id: "R-003-06", level: "medium", description: "建立后修改设备类型造成协议和物模型解释错误", mitigation: "核验编辑禁用；不提交更新"}

  - {id: "R-003-07", level: "high", description: "页面证据泄露ProductKey、产品数据或内部地址", mitigation: "字段级脱敏，不保存凭据、Cookie、Token或未授权数据"}

test_design:

  equivalence_partitions: {product_name: [valid, empty, duplicate_same_tenant, duplicate_other_tenant, whitespace_only, special_chars, default_limit], product_key: [auto_generated, edited, duplicate_same_tenant, duplicate_other_tenant, whitespace_only, special_chars, default_limit, concurrency_conflict], category: [enabled, disabled, missing, renamed, referenced], device_type: [direct, gateway_sub_device, gateway, immutable_after_creation], media: [none, valid_icon, valid_image, invalid_format, duplicate_type, replacement], state: [unpublished, published, withdrawn, disabled, transition_failure], model_version: [draft_editable, published_new_version, compatible, incompatible, publish_failure_rollback], associations: [none, device, collection_task, push_config, alarm_rule, multiple], export: [filtered, unfiltered, hidden_sensitive, over_limit, failed, cleanup_pending], permission: [full, read_only, denied, expired]}

  boundary_candidates: ["名称/ProductKey空、空白、特殊字符、Unicode、系统默认边界、同租户重复", "启用/停用/删除/改名分类与产品关联", "三种设备类型建立前选择与建立后不可编辑", "图片/图标为空、合法格式、非法格式、替换和传输边界", "未发布/已发布/撤回/停用/再发布、失败回退", "物模型发布前编辑、兼容/不兼容、失败回滚和在线设备保护", "各种关联下删除阻止和其他操作允许", "筛选0/1/多条、导出字段、敏感过滤、上限、失败和清理", "分页首末页/空列表及筛选刷新后创建时间倒序"]

  decision_table: ["名称空=>校验失败", "同租户名称/ProductKey重复=>按唯一性规则阻止或提示", "停用分类=>新产品不可选且已有产品保留", "建立后改设备类型=>不可修改", "存在关联删除=>禁止删除但其他确认允许", "物模型不兼容/发布失败=>阻止或回滚且不影响在线设备", "当前筛选导出=>字段与表格一致且不含隐藏敏感信息", "筛选/分页/刷新=>创建时间倒序", "无权限/会话过期=>提示并停止"]

  state_transitions: ["未认证->登录页->门户->product_management_default", "产品草稿->校验失败/保存成功/取消", "未发布->已发布->撤回->停用->再发布", "物模型草稿->编辑->发布新版本->兼容通过/失败回滚", "无关联->关联资源->删除阻止/其他操作允许", "无筛选->筛选->分页/刷新->创建时间倒序", "导出准备->浏览器下载/失败提示->临时清理"]

  pict_model:

    parameters: [Auth, Permission, Name, ProductKey, Category, DeviceType, Media, State, Model, Association, Action, Result]

    constraints: ["IF [Permission] = read_only THEN [Action] IN {query, view, reset, refresh};", "IF [Permission] = denied OR [Auth] != valid THEN [Result] = permission_error;", "IF [Action] IN {add, edit} AND [Name] = empty THEN [Result] = validation_error;", "IF [Action] = delete AND [Association] != none THEN [Result] = blocked_by_reference;", "IF [Action] = model AND [Model] = incompatible THEN [Result] IN {incompatible, rollback};", "IF [Action] = export AND [Permission] != full THEN [Result] = permission_error;", "IF [Action] = edit AND [DeviceType] = immutable_after_creation THEN [Result] IN {success, validation_error};", "IF [Action] = refresh THEN [Result] = success;"]

automation_plan:

  framework: "Playwright Python sync API / pytest-playwright"

  shared_pages: ["07_ui_automation/pages/common/login_page.py", "07_ui_automation/pages/common/portal_navigation.py"]

  safe_actions: ["复用登录态", "进入门户产品管理", "只读观察默认/表头/编辑/更多配置状态", "读取脱敏字段和表头", "定位稳定时打开并取消安全弹窗"]

  forbidden_actions: ["提交新增", "保存编辑", "发布", "撤回", "停用", "确认删除", "上传媒体", "修改物模型", "导出/下载业务数据", "接口写入", "绕过权限/安全验证"]

  locator_priority: ["role/name", "accessible label", "confirmed data-testid", "page.json元素映射", "行上下文", "可见文本", "CSS最后"]

  missing_or_partial: ["新增/查看/物模型/删除弹窗稳定ID", "状态转换/发布失败/回滚提示", "导出成功失败提示", "权限认证网络失败提示", "加载状态", "文件上传控件"]

  stop_conditions: ["运行配置缺失", "登录失败/人工验证", "主机不匹配", "权限失败", "关键内容缺失", "加载失败", "内容不稳定", "意外写入提示", "未授权数据暴露"]

