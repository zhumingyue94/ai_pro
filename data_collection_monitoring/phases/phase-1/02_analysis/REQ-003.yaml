requirements:

  confirmed:

    REQ-003-001: "产品名称必填；长度、大小写、空白和特殊字符按系统默认；同租户唯一；编辑允许修改但需继续校验唯一性。"

    REQ-003-002: "ProductKey自动生成但允许修改；长度、字符、租户范围、唯一性和并发创建冲突按系统默认。"

    REQ-003-003: "产品分类必填且只能选择启用分类；分类停用保留已有产品原分类；分类删除前处理关联；分类改名同步产品关联名称。"

    REQ-003-004: "支持直连设备、网关子设备、网关设备；建立后设备类型不可修改。"

    REQ-003-005: "产品图标和图片选填可为空；支持常见图片格式；数量、大小和尺寸按系统默认；允许替换。"

    REQ-003-006: "状态按未发布→已发布→撤回→停用；停用后可再次发布；状态关联当前版本；失败回退原状态。"

    REQ-003-007: "物模型支持查看、编辑和按版本发布；发布前可编辑，发布后新版本；新版本兼容已有设备；失败回滚且不影响在线设备。"

    REQ-003-008: "有关联设备、采集任务、推送配置或告警规则时仅禁止删除；仍允许编辑、停用、改分类和发布。"

    REQ-003-009: "导出字段与浏览器表格展示一致，按当前筛选导出；隐藏敏感信息不导出；浏览器下载；失败提示；不单独记录下载；临时文件使用后清理。"

    REQ-003-010: "默认按创建时间倒序；筛选、分页和刷新后保持该排序。"

    REQ-003-011: "沿用PUB-009页面级UI/行为验收范围，不做接口测试；补充实际字段、筛选结果、状态反馈、物模型入口和导出控件验证。"

    REQ-003-012: "确认表用于补充PDF和页面探索未明确内容，不与正式PDF逐条对应。"

    REQ-003-013: "新产品分类下拉只显示启用分类；图片和图标只允许常见图片格式；上传失败提示错误信息；上传控件按页面实际行为记录。"

    REQ-003-014: "当前页面只有产品状态字段和物模型是否发布信息；不记录产品版本号、兼容性检查结果和失败回滚反馈。"

    REQ-003-015: "有关联产品不允许删除；允许撤回发布、编辑和再次发布；本模块没有停用功能；删除阻止时记录页面实际提示。"

  pending: ["正式PDF REQ-003章节逐条追溯", "系统默认名称/ProductKey规则、分类选项、图片格式及上传失败反馈", "状态、物模型发布、兼容性与失败回滚的页面证据", "产品关联删除阻止及编辑/撤回/改分类/再次发布反馈", "导出文件字段、筛选、默认上限、失败提示和临时清理证据", "权限、租户、接口字段、错误码、幂等、并发和审计契约"]

