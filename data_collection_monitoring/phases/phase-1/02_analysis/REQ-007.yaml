scope:

  confirmed:

    - "规则编号由系统自动生成，创建后不可修改且必须唯一；重复或生成异常时提示并阻止保存；重复请求不重复生成编号。"

    - "规则名称必填，同一租户内允许重复；限制非法字符，不限制字段长度；其他空白和修改规则按系统默认。"

    - "状态包括启用和停用；切换后立即生效；处理中事件按触发时确定的规则状态执行。"

    - "触发条件支持设备属性、设备事件和设备状态；多监听器为 OR，单监听器多条件为 AND。"

    - "动作支持推送、触发告警和取消告警；按配置顺序执行；某动作失败时记录失败并继续后续动作。"

    - "创建时间按当前用户时区显示，格式为 YYYY-MM-DD HH:mm:ss；默认、筛选、分页、刷新后均按创建时间倒序。"

    - "停用的推送目标或告警配置不可被新规则选择；已有引用继续使用原配置；被引用依赖不可删除。"

    - "每次设备事件上报都执行一次动作；重复事件不去重、不节流、不设置时间窗口；失败不自动重试。"

  in_scope: ["规则列表、筛选、排序、分页、刷新和状态展示", "规则编号、名称、状态、触发条件、执行动作和创建时间", "监听器 OR/AND、多动作顺序、失败继续和不重试语义", "依赖停用/引用/删除边界", "租户隔离和角色权限风险"]

  out_of_scope: ["具体表达式语法、数据类型转换、阈值和动作参数格式的未确认细节", "未补齐页面契约前的新增、编辑、启停、删除和真实动作", "真实推送、触发告警、取消告警和接口写入", "其他模块页面 ID、状态、元素、表单、表格、交互或证据的复用", "接口、错误码、审计、幂等、异步和性能测试"]

