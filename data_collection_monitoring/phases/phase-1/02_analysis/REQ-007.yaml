risks:

  - {id: "R-007-01", level: "critical", description: "监听规则重复触发、漏触发或 OR/AND 逻辑错误", mitigation: "覆盖多监听器 OR、单监听器多条件 AND 和每次事件语义"}

  - {id: "R-007-02", level: "critical", description: "动作失败导致后续动作未执行或自动重试造成重复副作用", mitigation: "验证顺序执行、失败继续、失败记录和禁止自动重试"}

  - {id: "R-007-03", level: "high", description: "停用/删除依赖破坏已有监听规则", mitigation: "验证停用不可新选、已有引用继续、被引用不可删除"}

  - {id: "R-007-04", level: "high", description: "状态未立即生效或处理中事件使用错误状态", mitigation: "明确切换时机和触发时状态快照"}

  - {id: "R-007-05", level: "high", description: "规则编号重复、可编辑或重复请求重复生成", mitigation: "唯一约束、生成异常阻止保存和编号只读"}

  - {id: "R-007-06", level: "high", description: "时区/格式/排序错误", mitigation: "验证用户时区、秒级格式、筛选分页刷新后的倒序"}

  - {id: "R-007-07", level: "high", description: "租户隔离或权限边界缺失", mitigation: "补充权限矩阵、租户过滤和未授权反馈"}

  - {id: "R-007-08", level: "medium", description: "页面库存缺失导致自动化使用错误定位器", mitigation: "补采 data_monitor 专属页面契约，禁止复用其他模块 ID"}

test_design:

  equivalence_partitions:

    rule_id: [system_generated_unique, duplicate_or_generation_failure, duplicate_request_idempotent, attempted_edit]

    rule_name: [required_valid, empty, whitespace, illegal_characters, duplicate_allowed, unlimited_length]

    rule_status: [enabled, disabled, toggle_immediate, in_flight_event_snapshot]

    trigger_type: [device_property, device_event, device_status]

    listener_logic: [single_listener_all_true, single_listener_condition_false, multiple_listeners_one_true, multiple_listeners_all_false]

    action_sequence: [push, alarm_trigger, alarm_cancel, ordered_multiple_actions, middle_action_failure, all_actions_failure]

    dependency: [active_selectable, disabled_not_selectable, existing_reference_retained, referenced_delete_forbidden]

    event_processing: [unique_event, repeated_event, no_throttle_window, action_failure_no_retry]

    time_ordering: [user_timezone_format, default_desc, filtered_desc, paged_desc, refreshed_desc]

    permission: [authorized, unauthorized, cross_tenant]

  boundary_candidates: ["规则编号生成/冲突/异常/重复请求", "规则名称空白/非法字符/重复/不限长度", "启停切换和状态快照", "单监听器条件 AND", "多监听器任一满足 OR", "动作顺序/中间失败/后续继续", "依赖停用/已有引用/删除", "重复事件/无节流/不重试", "用户时区和时间格式", "筛选/分页/刷新倒序", "租户和角色边界"]

  decision_table:

    - {id: "DT-007-01", conditions: ["监听器数量", "每个监听器条件结果"], expected: "任一监听器全部条件满足则触发；单监听器任一条件失败则该监听器不满足"}

    - {id: "DT-007-02", conditions: ["动作顺序", "某动作失败"], expected: "按配置顺序执行；记录失败；继续后续动作；不自动重试"}

    - {id: "DT-007-03", conditions: ["依赖状态", "是否已被引用", "操作"], expected: "停用依赖不可新选；已有引用继续使用；被引用依赖不可删除"}

    - {id: "DT-007-04", conditions: ["事件是否重复", "是否在时间窗口内"], expected: "每次上报均执行；不去重；不节流；无时间窗口"}

    - {id: "DT-007-05", conditions: ["规则状态", "事件处理是否已开始"], expected: "新处理立即使用新状态；已处理事件沿用触发时状态"}

    - {id: "DT-007-06", conditions: ["列表操作", "排序结果"], expected: "默认、筛选、分页、刷新均创建时间倒序"}

  state_transitions: ["不存在->已创建", "已创建->启用", "启用->停用", "停用->启用", "启用/停用->编辑", "被引用依赖->停用请求->禁止新选但旧引用继续", "被引用依赖->删除请求->拒绝", "设备事件上报->规则状态快照->监听器匹配->动作顺序执行->成功/部分失败", "重复事件上报->重复执行", "动作失败->失败记录->不重试"]

  pict_model:

    parameters: ["RuleStatus", "TriggerType", "ListenerLogic", "ActionSequence", "DependencyState", "EventRepeat", "ActionFailure", "Ordering", "Permission"]

    values: {RuleStatus: [enabled, disabled, toggle_immediate, in_flight_snapshot], TriggerType: [device_property, device_event, device_status], ListenerLogic: [single_all_true, single_one_false, multi_one_true, multi_all_false], ActionSequence: [single_push, single_alarm_trigger, single_alarm_cancel, ordered_multiple, middle_failure], DependencyState: [active_selectable, disabled_not_selectable, existing_reference, referenced_delete], EventRepeat: [unique, repeated, no_throttle_window], ActionFailure: [none, recorded_continue, no_auto_retry], Ordering: [default_desc, filtered_desc, paged_desc, refreshed_desc], Permission: [authorized, unauthorized, cross_tenant]}

    constraints: ["IF [ActionSequence] = middle_failure THEN [ActionFailure] = recorded_continue;", "IF [DependencyState] = disabled_not_selectable THEN [Permission] = authorized;", "IF [EventRepeat] = repeated THEN [ActionFailure] = no_auto_retry;", "IF [Permission] IN {unauthorized, cross_tenant} THEN [RuleStatus] <> toggle_immediate;"]

    note: "PICT 为候选模型；页面库存缺失，不执行真实动作、规则写入或接口调用。"

