requirements:

  confirmed:

    REQ-007-001: "系统生成规则编号，创建后不可修改且必须唯一；重复或生成异常提示并阻止保存。"

    REQ-007-002: "规则名称必填，同租户允许重复；限制非法字符，不限制长度；其他默认校验待页面确认。"

    REQ-007-003: "状态为启用/停用，切换立即生效；处理中事件使用触发时确定的状态。"

    REQ-007-004: "支持属性、事件、状态触发；多监听器 OR，单监听器多条件 AND；转换、表达式、阈值按系统默认。"

    REQ-007-005: "支持推送、触发告警、取消告警；按顺序执行；单动作失败记录并继续。"

    REQ-007-006: "创建时间按用户时区显示，格式 YYYY-MM-DD HH:mm:ss；默认创建时间倒序。"

    REQ-007-007: "停用依赖不可被新规则选择；已有规则继续使用原配置；被引用依赖不可删除。"

    REQ-007-008: "每次事件上报执行动作；重复不去重、不节流、无时间窗口；失败不自动重试。"

    REQ-007-009: "确认表补充 PDF 和页面探索内容，不与正式 PDF 逐条直接对应。"

    REQ-007-010: "名称限制非法字符且不限制长度；编号系统生成且唯一；冲突提示；重复请求不重复生成编号。"

    REQ-007-011: "启停、编辑、删除按角色权限和租户范围控制；状态立即生效；处理中事件使用触发时状态快照。"

    REQ-007-012: "补采数据监听专属页面、状态、元素、表单、表格、交互和证据；不得复用其他模块定位器；分页排序按实际页面记录。"

    REQ-007-013: "本阶段只做页面级 UI/行为验证，不纳入接口、错误码、审计、幂等、异步和性能测试。"

