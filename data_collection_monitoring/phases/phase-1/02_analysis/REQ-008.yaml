scope:

  in_scope:

    - "页面级只读：默认进入、目标名称/状态/类型/日期筛选、查询、重置、刷新、表头设置、列表和分页。"

    - "推送目标必填/非必填字段、HTTP/MQTT/RocketMQ 类型差异、超时/重连、顺序、重复消息、失败死信、人工重发、引用限制、脱敏和排序规则。"

    - "REQ-008-015：新增/编辑表单字段与新增表单一致；HTTP 包含目标名称、目标描述、目标类型、请求地址、请求方法、请求头、请求参数、请求体和目标状态；MQTT 包含目标名称、目标描述、目标类型、服务地址、用户名、密码、客户端 ID、主题和目标状态；RocketMQ 包含目标名称、目标描述、目标类型、NameServer、AccessKey、SecretKey、消费组、主题、标签和目标状态；各表单提供确定/取消操作。"

    - "REQ-008-016：RocketMQ 与 HTTP/MQTT 的页面字段差异按截图确认项记录；格式/长度/特殊字符/组合校验、编辑可修改范围、提交反馈、重复提交、列表回显和稳定定位器仍待页面证据确认。"

    - "新增、编辑、删除、停用及权限边界的契约分析；本阶段不提交写操作。"

    - "RocketMQ 表单、死信列表、失败详情、人工重发入口和结果提示的页面范围识别。"

  out_of_scope:

    - "API endpoint、状态码、请求/响应结构、接口幂等、审计、异步实现和性能 SLA。"

    - "真实 HTTP/MQTT/RocketMQ 联调、连接测试、消息发送、重放或外部系统污染。"

    - "其他模块页面内部实现；仅保留依赖和责任边界。"

  acceptance_boundary:

    - "业务基准为需求变动.md 最新 REQ-008 和公共确认项。"

    - "页面事实以 page.json 的页面、状态、元素和脱敏 evidence 为准。"

    - "页面可见不等于保存成功、真实投递成功或接口契约已验证。"

    - "REQ-008-011 在当前需求变动、分析产物和 page.json 中均未出现，记录为追溯缺口，不假定其语义。"

