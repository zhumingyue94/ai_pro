scope:
  in_scope:
    - "页面级只读：默认列表、任务名称/状态筛选、查询、重置、刷新、表头设置、表格、分页和排序。"
    - "新建/编辑任务字段、必填性、只读性、取消/保存边界的契约分析；本阶段不提交。"
    - "启动、停止、删除、状态和异步处理中页面边界分析；本阶段不执行控制动作。"
    - "Cron 调度、脚本、重启策略、内存限制、引用变化、脱敏、执行异常和排序规则。"
    - "任务执行详情、失败结果、权限/错误反馈和稳定行数据的页面契约识别。"
  out_of_scope:
    - "采集协议/版本、设备范围、设备选择、字段映射及插件/设备/产品页面内部实现。"
    - "API endpoint、状态码、请求/响应结构、调度引擎实现、接口幂等和性能 SLA。"
    - "真实设备数据采集、任务真实执行、启动/停止/删除/重跑、跨模块写入和接口联调。"
  acceptance_boundary:
    - "业务基准为需求变动.md 最新 REQ-009 及公共确认项。"
    - "页面事实以 page.json 的页面、状态、元素、交互和脱敏 evidence 为准。"
    - "页面可见表单不等于任务已保存；状态展示不等于真实调度执行已验证。"
    - "当前 page.json 观察到的额外状态不直接升级为业务状态规则。"
