requirements:

  confirmed:

    - id: "REQ-004-001"

      rule: "分组名称必填；同一层级允许重复。长度、空白、特殊字符和修改规则以 REQ-004-011 的最新确认为准。"

    - id: "REQ-004-010"

      rule: "当前确认表用于补充 PDF 和页面探索中未明确的内容，与正式 PDF 不存在直接逐条对应关系。"

    - id: "REQ-004-011"

      rule: "分组名称和描述长度不限制，允许特殊字符；分组名称不允许仅输入空格并按页面规则处理首尾空格，分组描述不要求处理空格；名称和描述均允许修改；必填错误在字段下提示，其他校验错误通过提示框显示。"

    - id: "REQ-004-012"

      rule: "停用或恢复立即生效；新设备按确认规则归属；设备可同时属于多个分组；分组编辑允许；有关联设备时禁止删除并记录页面实际阻止提示。"

    - id: "REQ-004-013"

      rule: "沿用公共筛选、分页、空结果、失败、重复提交和刷新规则；分组名字模糊匹配不区分大小写但不忽略首尾/连续空格，日期与名称同时生效，筛选后回第一页，失败无重试入口，处理中禁用重复操作，证据以页面反馈记录。"

    - id: "REQ-004-002"

      rule: "分组描述非必填可为空；支持换行、空白和常见特殊字符；长度和修改规则以 REQ-004-011 的最新确认为准。"

    - id: "REQ-004-003"

      rule: "分组仅有启用和停用；停用后禁止新设备归属，已有设备保留原分组；停用分组允许恢复启用。"

    - id: "REQ-004-004"

      rule: "仅支持一级分组，不建立上下级关系；多级层级、每层数量、上下级关系和循环引用不适用。"

    - id: "REQ-004-005"

      rule: "一台设备可以同时属于多个分组；设备加入或移出分组后立即生效。"

    - id: "REQ-004-006"

      rule: "统计当前分组下全部未删除设备，包含停用设备，按设备唯一编号去重；受当前用户权限影响；进入页面或刷新重新查询，无缓存；不一致以最新实际关联数据为准。"

    - id: "REQ-004-007"

      rule: "创建时间按当前用户时区显示，格式 YYYY-MM-DD HH:mm:ss；时间筛选起止均包含；默认创建时间倒序；默认每页10条。"

    - id: "REQ-004-008"

      rule: "存在关联设备时仅禁止删除；允许停用、改名和恢复，无需先解绑；设备及历史记录保留。"

    - id: "REQ-004-009"

      rule: "验证当前页面实际字段、筛选结果、设备数量、状态和操作反馈；与确认规则不一致时记录缺陷。"

  public_rules_confirmed:

    - "本模块无公共规则差异：搜索框模糊匹配且不区分大小写，首尾空格和连续空格不忽略。"

    - "多个筛选条件同时生效；筛选后回第一页；无结果显示暂无数据。"

    - "请求失败、超时、网络异常或权限不足显示失败提示且无重试入口。"

    - "重复提交只生效一次，处理中禁用重复操作；完成后通过重新查询或手动刷新获取最新数据。"

    - "权限由系统管理角色配置；无权限时按页面实际显示无操作权限提示；本阶段不进行接口测试。"

  pending:

    - "正式 PDF 的 REQ-004 章节与需求变动.md逐条差异。"

    - "日期控件实际时区、起止边界、最大跨度、默认排序及分页交互。"

    - "设备数量去重、停用设备计入、权限过滤、刷新无缓存和一致性结果。"

    - "停用/恢复、新设备归属、多分组、编辑和关联删除阻止的稳定页面反馈。"

    - "REQ-004-013 更新后的公共规则与页面实际筛选、空状态、失败提示、重复提交禁用和刷新结果的稳定证据。"

    - "编辑、删除确认、异常、权限和异步提示的稳定元素定位契约。"

roles:

  - role: "设备分组查看人员"

    responsibility: "在授权租户范围内查询、筛选和查看分组及设备数量。"

  - role: "设备分组维护人员"

    responsibility: "按授权新增、编辑、停用、恢复或处理分组关联。"

  - role: "设备管理员"

    responsibility: "维护设备与多个分组的归属关系，处理分组引用约束。"

  - role: "平台/审计人员"

    responsibility: "按权限查看操作反馈、历史记录、审计及留存结果。"

permission_status: "partial_pending_matrix"

candidate_actions: ["查询", "新增", "编辑", "停用", "恢复", "删除", "设备加入", "设备移出", "跨租户查看"]

rule: "不得从按钮可见性推断权限，不得绕过菜单、接口、租户或安全验证。"

