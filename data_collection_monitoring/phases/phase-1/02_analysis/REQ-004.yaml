  upstream: ["REQ-001 首页", "REQ-003 产品管理", "登录/权限/租户上下文"]

  downstream: ["REQ-005 设备管理", "REQ-007 数据监听", "REQ-008 数据推送", "REQ-009 数据采集", "REQ-010 告警配置", "首页统计"]

  note: "依赖仅用于范围分析，不代表跨模块链路或接口联动已验证。"

risks:

  - id: "R-004-01"

    level: "critical"

    description: "关联设备时误删分组可能造成设备归属和历史记录丢失。"

    mitigation: "只读核验删除阻止；任何删除操作需授权、隔离数据和明确不可恢复边界。"

  - id: "R-004-02"

    level: "high"

    description: "停用分组、恢复和多分组立即生效规则错误可能导致新设备错误归属或设备不可见。"

    mitigation: "核验状态迁移、已有设备保留、新设备禁止和多分组关系，不提交真实变更。"

  - id: "R-004-03"

    level: "high"

    description: "设备数量未去重、遗漏停用设备或未按权限过滤会导致分组统计错误。"

    mitigation: "补充只读数据样本或接口契约；以设备唯一编号、未删除范围和当前权限作为核验条件。"

  - id: "R-004-04"

    level: "high"

    description: "时区、包含边界、排序或分页错误可能导致分组记录漏查或错序。"

    mitigation: "使用边界日期和当前用户时区设计只读验证；确认筛选后回第一页及创建时间倒序。"

  - id: "R-004-05"

    level: "medium"

    description: "分组名称/描述输入限制未明确，可能产生校验不一致或敏感内容留存。"

    mitigation: "按最新确认处理名称/描述字段规则；不写入真实分组名、设备编号或租户值。"

  - id: "R-004-06"

    level: "high"

    description: "截图、DOM、日志或错误信息可能泄露租户、分组、设备或内部地址。"

    mitigation: "字段级脱敏；不保存业务原文、凭据、Cookie、Token 或未授权数据。"

test_design:

  equivalence_partitions:

    group_name: [valid, empty, duplicate_same_level_allowed, whitespace_only, special_chars, default_limit]

    group_description: [empty, valid, multiline, whitespace, special_chars, default_limit]

    date_filter: [none, single_day, valid_range, inclusive_edges, reversed, invalid, timezone_boundary]

    group_state: [enabled, disabled, unknown]

    device_relation: [none, one, many, device_in_other_group, unavailable]

    permission: [full_write, read_only, denied, session_expired]

  boundary_candidates:

    - "名称不限制长度；覆盖名称空、全空白、首尾/连续空格、Unicode、特殊字符和修改；描述为空、换行、空白、特殊字符和修改。"

    - "日期当天00:00:00、23:59:59、单日、跨日、跨月/年、最大跨度、反向区间和时区边界。"

    - "设备数量0、1、单页容量、容量+1、大规模统计和重复设备唯一编号。"

    - "分页第1/10/11条、首末页、空列表和筛选后回第一页。"

    - "并发新增同名、并发编辑、设备加入/移出与删除竞态。"

    - "搜索大小写、首尾/连续空格、日期组合筛选、筛选回第一页、空结果、失败无重试和处理中按钮禁用。"

  decision_table:

    - id: "DT-004-001"

      conditions: ["分组名称为空", "新增或编辑"]

      expected: "校验失败，不提交；编辑时保留输入。"

    - id: "DT-004-002"

      conditions: ["同一层级同名", "新增或编辑"]

      expected: "按确认规则允许保存；同一层级重复名称不作为唯一性错误。"

    - id: "DT-004-003"

      conditions: ["分组停用", "新设备归属"]

      expected: "禁止新设备归属；已有设备保留原分组。"

    - id: "DT-004-004"

      conditions: ["分组存在关联设备", "删除"]

      expected: "禁止删除；停用、改名和恢复允许；设备及历史记录保留。"

    - id: "DT-004-005"

      conditions: ["设备加入或移出分组", "查询或刷新"]

      expected: "立即生效；设备数量按未删除设备唯一编号去重并受权限过滤。"

    - id: "DT-004-006"

      conditions: ["日期筛选起止值", "合法含边界"]

      expected: "起止时间均纳入，按当前用户时区显示与筛选。"

    - id: "DT-004-007"

      conditions: ["无权限或会话过期", "任意业务操作"]

      expected: "显示权限/认证失败提示并停止验证。"

  state_transitions:

    - "未认证 -> 登录页 -> 门户 -> device_group_default"

    - "默认列表 -> 查询中 -> 有结果/暂无数据/失败"

    - "分组草稿 -> 校验失败/保存成功/取消"

    - "启用 -> 停用 -> 恢复启用；停用禁止新设备归属，已有设备保留"

    - "无设备 -> 关联设备 -> 移出/设备删除；设备可同时属于多个分组"

    - "有关联设备 -> 删除阻止；停用、改名、恢复允许"

    - "无日期条件 -> 合法日期范围 -> 无结果/失败/非法范围"

  pict_model:

    parameters:

      Auth: [valid, expired, security_blocked]

      Permission: [full_write, read_only, denied]

      Name: [valid, empty, duplicate_allowed, whitespace_only, special_chars, default_boundary]

      Description: [empty, valid, multiline, whitespace, special_chars, default_boundary]

      DateFilter: [none, single_day, valid_range, inclusive_edges, reversed, invalid, timezone_boundary]

      DeviceRelation: [none, one, many, in_other_group, unavailable]

      GroupState: [enabled, disabled]

      Membership: [single_group, multi_group]

      Action: [query, add, edit, toggle, delete, move_device, reset, refresh]

      Result: [success, validation_error, blocked_by_reference, membership_error, timeout, permission_error]

    constraints:

      - "IF [Permission] = read_only THEN [Action] IN {query, reset, refresh};"

      - "IF [Permission] = denied OR [Auth] != valid THEN [Result] = permission_error;"

      - "IF [Action] IN {add, edit} AND [Name] = empty THEN [Result] = validation_error;"

      - "IF [Action] = delete AND [DeviceRelation] != none THEN [Result] = blocked_by_reference;"

      - "IF [Action] = toggle AND [DeviceRelation] != none THEN [Result] = success;"

      - "IF [Action] = move_device AND [GroupState] = disabled THEN [Result] = membership_error;"

      - "IF [Action] = query AND [DateFilter] = reversed THEN [Result] = validation_error;"

      - "IF [Membership] = multi_group THEN [Result] IN {success, membership_error};"

      - "IF [Action] = refresh THEN [Result] = success;"

      - "IF [DateFilter] = inclusive_edges THEN [Result] IN {success, timeout};"

    note: "PICT 仅用于候选场景设计；具体错误码、并发和接口结果待契约确认。"

