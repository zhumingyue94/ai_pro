scope:

  confirmed:

    - "设备分组支持一级分组，不建立上下级关系。"

    - "分组名称必填，同一层级允许重复；长度不限制，允许特殊字符；名称不得仅输入空格，按页面规则处理首尾空格，且允许修改。"

    - "分组描述非必填，支持为空、换行、空白和常见特殊字符；长度不限制，允许修改，描述不要求处理空格。"

    - "分组状态仅有启用和停用；停用后禁止新设备归属，已有设备保留；停用分组可恢复启用。"

    - "一台设备可同时属于多个分组；加入或移出后立即生效。"

    - "设备数量统计当前分组下全部未删除设备，包含停用设备，按设备唯一编号去重，并受当前用户权限范围影响。"

    - "每次进入页面或手动刷新重新查询设备数量，不设置缓存；不一致时以最新实际关联数据为准。"

    - "创建时间按当前用户时区显示，格式为 YYYY-MM-DD HH:mm:ss；时间起止均包含；列表默认创建时间倒序；默认每页10条。"

    - "存在关联设备时仅禁止删除；允许停用、改名和恢复，无需解绑；设备及历史记录保留。"

  in_scope:

    - "列表默认进入、分组名称与创建时间筛选、查询、重置、刷新、表头设置、分页和排序。"

    - "分组名称、状态、描述、创建时间、设备数量和操作列。"

    - "新增、编辑、停用/恢复、删除限制、设备多分组和数量统计的页面级规则边界。"

    - "权限、租户隔离、异常提示、加载/异步状态、接口契约和数据安全责任。"

  out_of_scope:

    - "设备管理页面内部的设备生命周期、产品绑定和设备属性实现。"

    - "多级分组、上下级关系、循环引用和每层数量限制。"

    - "真实环境新增、编辑、删除、停用、恢复、设备加入/移出、批量关联、导出和接口写入。"

    - "接口 endpoint、请求/响应字段、错误码、性能 SLA 和跨模块实现细节。"

  acceptance_boundary:

    - "以需求变动.md 的 REQ-004-001 至 REQ-004-011、REQ-004-012、REQ-004-013 确认回答作为业务规则基准；未登记编号不作为正式源需求。"

    - "以 page.json 的页面、状态、元素 ID 和脱敏证据作为页面事实基准。"

    - "页面存在、列表有数据或弹层可见，不等于 CRUD、关联统计、删除限制、权限和接口契约已验收。"

