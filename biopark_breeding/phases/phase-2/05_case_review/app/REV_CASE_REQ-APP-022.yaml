      remediation: 绑定页面清单中的页面/区域/element_id 或明确业务键、计划号、发货单号和数据基线；TC-APP-022-073、TC-APP-022-074 已改为直接指向目标执行单执行页及页面顶部状态，其他用例无法确认时标记为待补充，不使用泛化模板。
