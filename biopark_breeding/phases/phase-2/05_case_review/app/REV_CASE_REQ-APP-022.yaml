      category: design_violation
      result: failed
      gate_reason: true
      reason: TC-APP-022-003、TC-APP-022-011、TC-APP-022-016、TC-APP-022-023 等将多个互斥输入、并发结果、状态转换、统计回读和跨服务记录放在一个判定链中；部分用例单步包含多个独立分支。
      remediation: 按等价类、状态转换和业务结果拆为连续步骤或独立用例；每一步只保留同一数据基线下的一个可判定结果。
    - code: SYSTEMATIC_COVERAGE
      category: design_violation
      result: warning
      gate_reason: false
      reason: 等价类和边界值覆盖较完整，数量包含空/0/负数/小数/1/等于待发/超过待发/并发后超发，备注包含 15 字边界；但列层空值、无效列层、网络超时、权限撤销和自动出库失败仍存在契约未确认或 blocked 状态。
      remediation: 补齐每个边界的具体输入、错误文案、按钮状态、请求结果和业务数据回读；将服务端契约未确认项列为阻塞，不计入通过覆盖。
    - code: PAIRWISE_REVIEW
      category: evidence_risk
      result: warning
      gate_reason: false
      reason: 按测试计划识别计划状态、列、层、数量类别、备注长度、权限和网络结果等参数；当前仅完成模型级 Pairwise 覆盖审查，未运行 PICT。用例中存在状态/权限/网络与数量组合的覆盖意图，但无可核对的组合矩阵和约束证据。
      remediation: 形成不落盘的 PICT 参数模型并核对每一对组合；至少明确无效列层、权限撤销、并发最新数量与库存不足之间的约束，随后把缺失组合映射到原子用例。
    - code: AUTOMATION_EXECUTION_BLOCKED
      category: execution_blocker
