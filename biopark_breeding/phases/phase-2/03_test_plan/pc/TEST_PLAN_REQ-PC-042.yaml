- 正式环境证据与原型证据分开存放；不得保存账号、密码、Token、Cookie、真实业务敏感数据或持久化登录状态。
suites:
  Smoke: 规划可视 Chromium 进入已采集对应页面状态、查看发货单与计划、筛选/查询/重置可达、一个可执行计划进入发货模式、位置有效录入、完成确认和提交结果可观察验证；正式提交必须有授权数据和清理责任，定位器未确认时只执行人工或标记阻塞。
  Targeted: 规划计划进度/发货状态/关键字筛选、未出雏/终止/待发货为零入口边界、模式锁定、数量等价类与边界、同位置累加/多位置暂存、无草稿/有草稿退出、完成时零与非零确认、权限、空态、重复提交、并发最新剩余和刷新证据；保留 partial、数据和定位器风险。
  Full: 规划本 REQ 全部页面板块、字段/状态、计划与发货单状态矩阵、等价类/边界值、判定表、状态转换、Pairwise/2-way 组合、计算来源、提交联动、权限/异常、兼容性和与 REQ-PC-041/043/045/046 的范围回归；接口契约、库存联动、明细和导出实际执行由对应需求承接。
