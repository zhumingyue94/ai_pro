- 既有状态证据引用 page.json 的 st-default、st-filter-progress、st-status-filter、st-ship-mode、st-location-dialog、st-location-overlimit、st-draft、st-exit-draft-confirm、st-complete-confirm、st-submitted、st-reset 及对应 DOM/截图路径；不将 mock 值作为正式结果。
- 正式执行阶段按 REQ、页面路由、state_id、运行标识保存脱敏截图、DOM 快照、浏览器控制台/网络日志（按需）、Playwright trace、客户端/浏览器版本和时间。
- 对筛选、进入模式、位置录入、校验、草稿、退出/完成确认和提交结果保存操作前后页面状态、可见文案、进度/状态/记录变化；对权限、重复/并发和计算保存授权数据键与回读比对，不保存敏感值。
