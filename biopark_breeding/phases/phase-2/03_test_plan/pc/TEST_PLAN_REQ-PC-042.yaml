trace:
  story: REQ-002 发货单发货执行
  req: REQ-PC-042
  project: 种禽孵化管理系统
  version: 1
  status: draft
objective: 基于 REQ-PC-042 分析事实、需求说明书和 page.json 已采集的 pc-chick-shipping-ship、pc-chick-shipping-ship-bl02 页面状态，规划发货执行页面的功能、边界、权限、证据和自动化准备；保留 page.json partial、正式环境数据与权限未准备的风险；仅输出测试计划，不生成测试点、测试用例或脚本。
scope:
  in_scope:
  - 从计划管理 / 雏苗发货上下文进入发货执行页，并验证正式路由 /biopark-breeding/breeding/delivery/execute/{id} 的页面承接；原型路由仅作为 page.json 已采集证据引用。
  - 发货单主表、实际可发数、发货进度、发货状态、关联上孵计划、栋舍工作区和发货记录的可见展示。
  - 上孵计划进度、发货状态、计划号关键字筛选、查询和重置，以及无数据/加载失败可见态。
  - 已出雏且待发货数大于零的计划进入发货模式；终止计划不在发货执行列表展示，未出雏或待发货数为零的计划入口不可用。
  - 发货模式下当前计划进入编辑状态、其他计划入口不可用，以及退出发货和完成发货确认状态。
  - 位置录入弹窗中的栋舍/列/层位置、发货数量和备注可见交互；0/负数、小数、超剩余数失焦自动校正，汉字/字母等非数字字符不可输入。
  - 同一位置再次打开时数量和备注回显，修改后按最新值保存；覆盖多位置暂存及剩余待发货数重算。
  - 无草稿退出、有草稿退出确认、完成确认在未发货数为零或大于零时的可见行为，以及取消不提交、确定提交并退出。
  - 确认结束后的提交成功可见结果：位置、计划、发货单进度/状态和发货记录联动；刷新后 mock 初始态恢复仅作为既有页面证据，不等同正式持久化结论。
  - 待发货、发货中、已发货、已签收发货单状态下的编辑入口可用性；权限不足、重复提交和并发最新数量校验的页面可观察结果。
  out_scope:
  - REQ-PC-041 雏苗发货列表查询、状态卡、分页和列表导出。
  - REQ-PC-043 发货单明细、来源明细和只读追溯。
  - REQ-PC-044 实际导出文件生成、下载和文件内容校验。
  - APP 发货执行、移动端刷新/返回/签收展示规则。
  - 发货草稿持久化保存规则、商品禽养殖端签收回写、操作人/操作时间审计要求。
  - 库存查询、出入库记录、库存扣减和其他外部系统联动。
  - 具体接口路径、HTTP 方法、请求/响应字段、错误码、权限编码和接口独立测试。
  - 未由需求或 page.json 已采集状态确认的按钮、字段、菜单、定位器和视觉实现结论。
strategy:
- 以需求说明书和 REQ-PC-042 分析 YAML 为业务规则依据，以 page.json 的 capture_id、页面路由、page_id、state_id、元素和 evidence 为页面事实边界；page.json capture.status=partial，正式页面结构不得视为已完整确认。
- 使用等价类划分覆盖计划进度、发货单状态、日期可执行性、实际可发/待发货数、草稿、位置和提交状态；使用边界值覆盖实际可发为 0、待发货为 0/1/最大值、数量 0/负数/小数/1/等于剩余/超过剩余。
- 使用判定表评估已出雏、计划日期、待发货数、发货单状态、是否处于发货模式、是否有草稿、数量有效性、自动校正、重复提交和并发最新剩余数量的组合。
- 使用状态转换覆盖 page.json 已采集的 st-default、st-filter-progress/st-status-filter、st-ship-mode、st-location-dialog、st-location-overlimit、st-draft、st-exit-draft-confirm、st-complete-confirm、st-submitted、st-reset；页面状态缺失或正式环境不一致时记录阻塞，不补造状态。
- 使用 Pairwise/2-way 评估计划进度、发货状态、日期资格、实际可发、累计量、待发货、草稿、位置、数量类别、提交状态、当前计划和操作状态的组合；约束包括不可执行计划不得进入、编辑中其他计划不可操作、无效数量不得形成有效提交、重复提交后一次失败、并发超最新剩余不得提交。
- 按页面/板块、字段/列/操作、业务来源/计算/联动三层规划；不以 page.json mock 数值替代正式数据验证，不输出测试点或测试用例。
- 自动化仅规划 Playwright Python 可视 Chromium headless=False；优先使用 page.json 已记录的 role/label/placeholder/区域语义定位。el-row1-ship、el-row2-ship、el-house-cell 和上孵计划状态筛选存在重复或区域作用域风险，正式执行前必须确认计划号/栋舍/列/层唯一作用域或正式 data-testid；不得编造定位器。
- Web 执行按先导航/等待可观察状态，再操作并保存前后状态证据；不使用固定 sleep，不写入账号、密码、Token、Cookie 或真实业务值；正式提交仅在授权测试数据和清理责任明确后执行。
environment:
  client: PC Web
  os: win32；正式执行前记录实际客户端版本
  browser: Chromium visible mode；Playwright Python 规划 headless=False
  base_url: ${UI_TEST_URL}
  page_path: /biopark-breeding/breeding/delivery/execute/{id}
  portal_entry: 种禽孵化管理系统 / 计划管理 / 雏苗发货 / 发货执行（page.json 原型菜单路径）
  login: 原型采集无需登录；正式环境凭据仅从 .env 或运行时安全配置读取，不写入计划、日志或证据；需确认正式环境菜单与接口权限
data:
  required:
  - 可进入发货执行页的安全测试发货单及关联上孵计划。
  - 已出雏、未出雏、终止计划；待发货、发货中、已发货、已签收发货单状态。
  - 实际可发为零、正数、部分发货、全部发货、多位置及同一位置重复录入数据。
  - 数量为空、0、负数、小数、正整数、等于剩余、超过剩余、汉字/字母等非数字及失焦自动校正的输入样本。
  - 首次提交、2 秒内重复提交、并发未超过最新剩余和超过最新剩余的数据/执行条件。
  - 无关联计划、全部计划终止、无数据和加载失败的可观察响应条件。
  preparation: 执行前由测试、业务/产品和平台权限责任人准备脱敏测试数据、角色菜单/接口权限、自然唯一业务键及创建/修改/回收/清理责任；正式页面提交前确认 page.json partial 风险、稳定唯一定位器和服务端最新数量校验；原型 mock 仅做页面状态参考，不作为正式数据或接口契约。
roles:
- 测试：执行页面功能、边界、状态转换和证据采集，保持数据脱敏。
- 产品/业务负责人：确认实际可发、待发货、进度、计划状态和完成/退出规则。
- 平台权限/实施负责人：准备菜单、接口权限、租户和数据权限样本。
- 研发：确认正式路由、字段来源、并发/幂等校验、异常提示和稳定定位器。
- 测试设计：在计划通过后消费计划范围和策略生成下游测试设计产物。
dependencies:
- REQ-PC-041 雏苗发货列表与筛选：提供进入发货执行页的发货单和入口上下文。
- 排程计划：形成发货单及计划日期；正式契约和数据状态待确认。
- 上孵计划与实际出雏结果：提供计划进度、实际可发和待发货数；正式数据未提供。
- 历史发货记录、位置结果和栋舍基础数据：提供累计量、位置工作区、剩余量和提交后记录；正式数据未提供。
- 平台角色权限配置：决定菜单显示和无权限接口结果；具体角色和权限编码未提供。
- REQ-PC-043/045/046：分别承接明细追溯和库存/出入库等范围外联动。
priority: P0：进入执行页、可执行计划判定、数量与剩余校验、模式锁定、退出/完成确认和提交结果；P1：筛选、状态矩阵、累计计算、空态、权限、重复/并发提交和刷新证据；P2：视觉一致性、兼容性和跨系统联动待确认目标
risks:
- page.json capture.status=partial，且正式路由 confirmed_not_explored；正式页面入口、状态和元素可能不同；影响 high；执行前重新采集正式页面并保留差异。
- 原型为公开 mock，已采集状态和截图不能证明正式接口、持久化、权限、并发或跨模块联动；影响 high；使用授权真实测试数据并回读验证。
- 正式测试数据、权限配置和清理责任尚未提供；影响 high；以 report_only 门禁登记，未满足前禁止业务提交。
- 重复计划发货入口和栋舍位置格定位器存在 ambiguous/作用域风险；影响 high；执行前补充唯一业务键作用域或正式 data-testid，否则自动化阻塞并转人工。
- 草稿页面暂存与持久化边界可能混淆；影响 medium；只验证页面内暂存、退出确认和完成提交可见行为，持久化规则保持范围外。
- 重复提交、并发提交和最新待发货数规则尚未在正式页面执行；影响 high；保留为正式环境可观察结果与服务端协调验证前提，不编写接口契约。
- 实际可发为零、未出雏按零、无关联计划和全部终止的正式口径/错误提示未提供；影响 high；准备专用数据并由业务确认。
open_questions:
- 确认正式环境 URL、菜单权限、接口权限、租户和可执行测试角色。
- 确认已出雏/未出雏/终止、待发货/发货中/已发货/已签收以及实际可发为零的正式可回读数据。
- 确认实际可发、已完成数量、页面暂存数量、待发货数和进度的正式字段来源与精度。
- 确认 2 秒内重复提交、并发最新剩余校验和服务端失败结果的页面可见提示。
- 确认正式页面是否提供计划号、栋舍/列/层作用域或 data-testid 稳定定位器。
- 确认加载失败、无匹配、无关联计划和全部终止时各表格的正式空态文案。
- 确认提交测试数据的创建、回收、清理责任及失败回滚安排。
entry_criteria:
- DOCX、REQ-PC-042.yaml、page.json、.env 和 test-plan.schema.json 可读取，需求、分析、分区和模块身份一致。
- page.json 已检查并登记 capture_id PAGE-PC-REQ041-REQ042-20260903、状态 partial、页面 pc-chick-shipping-ship/pc-chick-shipping-ship-bl02 及已采集状态；未采集事实不写入计划。
- 正式环境 URL、角色权限、脱敏数据、唯一业务键、定位器确认和数据清理责任已准备；未准备项转为阻塞。
- 需求范围、非范围、依赖、风险、待确认项、证据方案及三类套件已评审。
exit_criteria:
- YAML 通过 test-plan.schema.json，未新增字段且不含 tp/tp_id；Markdown 与 YAML 的范围、策略、风险、准入/准出、证据和套件一致。
- 已定义冒烟、定向、全量三个计划层级套件，未生成测试点、测试用例、CSV、禅道数据或 UI 脚本。
- page.json partial、正式路由未探索、mock 边界、定位器风险、权限/数据/清理前提均在计划和交接中保留。
- 高风险开放问题已确认、转为明确阻塞，或由下阶段测试数据/权限准备承接；未授权正式业务写入不作为通过条件。
- 计划范围内页面行为均有可观察结果和证据类型定义，范围外责任已交接至对应 REQ。
evidence:
