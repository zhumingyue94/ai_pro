  login: 原型采集无需登录；正式环境凭据仅从 .env 或运行时安全配置读取，不写入计划、日志或证据；需确认正式菜单和查看接口权限
data:
  required:
  - 可进入明细页的安全测试发货单，覆盖待发货、发货中、已发货和已签收状态。
  - 有效上孵计划、终止计划、无关联计划、筛选单条/多条/无结果数据。
  - 栋舍总览、当前计划、网格、列表、位置来源和发货记录展开数据。
  - 有菜单和查看权限、无菜单权限、无查看接口权限/加载失败的授权测试条件。
  - 支持只读回读的顶部信息、计划字段、栋舍字段、来源数量和发货记录字段样本。
  preparation: 执行前由测试、业务/产品和平台权限责任人准备脱敏测试数据、角色菜单/查看接口权限、自然唯一业务键、正式路由确认和数据访问/清理责任；本需求只读操作不应修改业务数据，任何异常写入须由责任人回滚并留证；原型 mock 仅作页面状态参考，不作为正式数据或接口契约。
roles:
- 测试：执行只读页面、筛选、状态转换和证据采集，验证无业务数据变更。
- 产品/业务负责人：确认只读字段口径、默认第一条规则、终止计划排除、无数据口径和来源明细行为。
- 平台权限/实施负责人：准备菜单权限、查看接口权限、租户和数据权限样本。
- 研发：确认正式路由、字段来源、异常表现和稳定唯一定位器。
- 测试设计：在计划通过后消费本计划范围和策略生成下游测试设计产物。
dependencies:
- REQ-PC-041 雏苗发货列表与筛选：提供明细入口和返回列表承接；列表实现不属于本需求。
- REQ-PC-042 发货单发货执行：提供发货计划、位置结果、发货记录和结果口径；执行实现不属于本需求。
- 雏苗发货单：提供顶部基础信息、状态、数量和进度；正式测试数据未提供。
- 上孵计划：提供计划筛选、计划状态和计划字段；正式测试数据未提供。
- 栋舍位置结果和来源关系：提供栋舍总览、当前计划、位置列表和来源明细；正式测试数据未提供。
- 发货记录：提供历史批次、位置明细和展开结果；正式测试数据未提供。
- 平台角色菜单/接口权限配置：控制菜单显示和明细查看权限；具体角色与权限编码未提供。
priority: P0：明细进入、顶部/计划只读展示、筛选联动、默认第一条、无数据三块联动、栋舍范围切换、只读边界；P1：网格/列表、位置来源、记录展开、状态矩阵、权限、终止排除和返回列表；P2：视觉一致性、兼容性和正式性能目标待确认
risks:
- page.json capture.status=partial，正式明细路由 confirmed_not_explored；正式入口、状态、字段和元素可能不同；影响 high；执行前重新采集正式页面并保留差异。
- 需求变动与历史原型在筛选无数据、重置默认第一条和来源明细呈现上存在偏差；影响 high；以需求变动和 REQ-PC-043 当前契约为准，page.json 偏差作为风险证据。
- 来源明细弹窗是业务行为但 page.json 未采集独立弹窗元素/定位器；影响 high；正式执行前确认可观察结构和稳定定位器，否则自动化阻塞并转人工。
- 位置明细和记录展开按钮可能重复，必须按栋舍/列/层、位置或批次行作用域定位；影响 high；未确认唯一作用域或 data-testid 前不得生成脚本定位。
- mock 数据不能证明正式数据范围、权限、字段来源和只读行为；影响 high；使用授权测试数据并在操作前后回读比对。
- 无数据、加载失败和无权限统一暂无数据/无操作权限表现尚未在正式环境验证；影响 high；准备专用权限和空态条件并记录页面可见结果。
- 计划和发货记录的跨模块口径可能不一致；影响 medium；由业务负责人确认字段来源和联动口径，不扩展为接口契约。
open_questions:
- 确认正式环境 URL、明细菜单权限、查看接口权限、租户和测试角色。
- 确认正式发货单状态矩阵及有效/终止/无关联计划数据。
- 确认筛选无数据时计划、栋舍和发货记录的正式空态文案与联动范围。
- 确认清空筛选后默认第一条的正式定义，以及终止计划排除规则。
- 确认来源明细弹窗的正式可见入口、内容、关闭方式和稳定定位器；page.json 未出现的元素不得提前写成事实。
- 确认位置明细和记录展开的行级唯一作用域或正式 data-testid。
- 确认顶部、计划、栋舍、来源和发货记录字段的正式来源、精度和只读权限。
- 确认无查看权限、加载失败和无数据时页面可见提示，以及只读操作的数据不变更证据。
entry_criteria:
- DOCX、REQ-PC-043.yaml、page.json、.env 和 test-plan.schema.json 可读取，需求、分析、分区和模块身份一致。
- page.json 已检查并登记 capture_id PAGE-PC-REQ041-REQ042-20260903、状态 partial、页面 pc-chick-shipping-detail 及已采集状态；未采集事实不写入计划。
- 正式环境 URL、菜单/查看权限、脱敏只读数据、唯一业务键、正式路由和定位器确认责任已准备；未准备项转为阻塞或 report_only 风险。
- 需求差异、范围责任、策略、数据边界、证据方案和三类套件已评审。
exit_criteria:
- YAML 通过 test-plan.schema.json，未新增字段且不含 tp/tp_id；Markdown 与 YAML 的范围、策略、风险、准入/准出、证据和套件一致。
- 已定义冒烟、定向、全量三个计划层级套件，未生成测试点、测试用例、CSV、禅道数据或 UI 脚本。
- page.json partial、正式路由未探索、原型偏差、mock 边界、弹窗/定位器风险和权限/数据前提均在计划与交接中保留。
- 高风险开放问题已确认、转为明确阻塞，或由下阶段测试数据/权限准备承接；只读验证期间无业务数据变更或异常变更已可证明。
- 计划范围内页面行为均有可观察结果和证据类型定义，REQ-PC-041/042/044 等范围外责任已交接。
