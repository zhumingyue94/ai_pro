trace:
  story: REQ-003 发货单明细与结果追溯
  req: REQ-PC-043
  project: 种禽孵化管理系统
  version: 1
  status: draft
objective: 基于 REQ-PC-043 分析、需求说明书和 page.json 已采集的 pc-chick-shipping-detail 页面及状态，规划发货单明细只读展示、上孵计划筛选联动、栋舍范围/视图切换、来源明细与发货记录追溯、权限和证据验证；保留 page.json capture.status=partial、正式路由未探索、原型与需求变动差异、数据权限和定位器风险；仅输出测试计划，不生成测试点、测试用例或脚本。
scope:
  in_scope:
  - 从雏苗发货列表进入发货单明细页并承接正式路由 /biopark-breeding/breeding/delivery/detail/{id}；原型入口和路由仅按 page.json/分析文件已采集事实引用。
  - 顶部发货单基础信息、计划信息、数量、进度和状态的只读展示，以及返回列表。
  - 上孵计划表格的计划进度、发货进度、待发货数、实际苗重、养殖场、批次、周龄、蛋重、日期、备注等已由需求定义的只读信息展示；不把 page.json 未出现的具体控件写成原型事实。
  - 上孵计划发货状态、计划进度和计划号关键字筛选、查询和重置；筛选后默认选择第一条有效计划并同步栋舍分布和发货记录。
  - 清空筛选后恢复全部有效上孵计划并默认选择第一条；筛选无数据时计划、栋舍分布和发货记录均显示暂无数据。
  - 雏苗发货执行页面不显示终止的上孵计划；该规则来源于需求变动.md 2026.09.20 13:30 第1条。其余不计入总条数、不参与筛选、选择、发货和记录查看的断言属于测试分析扩展，待产品/研发确认。
  - 栋舍总览加载当前发货单下全部有效计划记录，当前上孵计划只加载当前计划记录。
  - 栋舍总览/当前上孵计划与网格/列表视图切换；列表中已由分析定义的栋舍、列、层、总数量、关联计划数和来源计划展示。
  - 位置明细按钮产生位置筛选并联动发货记录；位置其他区域的来源明细弹窗作为需求行为待正式页面确认，不能使用 page.json 未出现的弹窗元素或定位器。
  - 发货记录展示操作时间、上孵计划号、操作人、本次发货数量、位置数、剩余未发货数、位置累计数量、备注，并支持批次位置明细展开/收起。
  - 待发货、发货中、已发货、已签收发货单状态下的只读展示和查看权限边界；明细页不提供发货、补录、修改、删除或结果提交能力。
  - 查看、筛选、重置、范围/视图切换、位置来源联动、清空位置筛选、记录展开和返回列表均不得修改业务数据。
  out_scope:
  - 发货、补录、修改、删除、完成发货和结果提交；由 REQ-PC-042 承接执行流程。
  - REQ-PC-041 雏苗发货列表查询、状态卡、分页和列表入口实现；本需求只承接从列表进入明细及返回列表的页面承接。
  - REQ-PC-042 发货执行、位置录入、草稿和提交联动的业务实现。
  - REQ-PC-044 导出文件生成、下载和文件内容校验。
  - APP 发货记录和移动端专属交互。
  - 库存、出入库及商品禽养殖端签收回写。
  - 具体接口路径、HTTP 方法、请求/响应字段、错误码、分页和大数据量性能策略。
  - 未由需求、REQ-PC-043 分析或 page.json 已采集状态确认的按钮、字段、菜单、弹窗细节和定位器。
strategy:
- 以 REQ-PC-043 分析和需求说明书为业务契约，以 page.json capture_id、page_id、已采集 route、state_id、element_id、DOM/截图路径为页面事实边界；page.json capture.status=partial，正式页面结构、接口、权限和数据不视为已完整确认。
- 使用等价类划分覆盖发货单状态、计划进度、筛选结果、关键字匹配、权限、栋舍范围、视图模式、位置来源和记录数量；使用边界值覆盖有效计划为 0/1/多条、来源计划为 0/1/多条、记录为 0/1/多条、筛选有结果/无结果和终止计划排除。
- 使用判定表评估查看权限、有效计划存在性、筛选结果、是否终止、栋舍范围、视图模式、位置来源、发货记录和重置/清空动作的组合，重点确认只读和空态规则。
- 使用状态转换覆盖 page.json 已采集的 st-default、st-house-overview、st-house-current、st-house-list、st-source-detail、st-filter-dropdown、st-filter-shipped、st-filter-empty、st-filter-reset、st-doc-01/st-doc-03/st-doc-04/st-doc-05/st-doc-06/st-doc-07/st-doc-08；未采集或正式环境不一致的状态记录为待确认，不补造结构。
- 使用 Pairwise/2-way 评估 OrderStatus、PlanProgress、FilterResult、HouseScope、ViewMode、PositionSource、RecordState、FilterAction、PermissionState 的组合；约束包括终止计划排除、无结果时三块均暂无数据、筛选/重置默认第一条、总览/当前计划范围不同和所有允许操作只读。
- 需求变动优先于历史原型偏差：筛选无数据时发货记录也应无数据，重置后默认第一条；历史 page.json 证据中的偏差单独保留为风险，不作为当前通过结论。
- 自动化规划采用 Playwright Python 可视 Chromium headless=False；优先使用 page.json 已记录的 role、label、placeholder 和页面区域语义定位。位置明细、记录展开和来源明细弹窗存在重复/未采集定位器风险，正式执行前必须确认行级唯一作用域或 data-testid，不得编造定位器。
- Web 执行按导航、可观察状态等待、操作前后状态比对和证据采集执行；不使用固定 sleep，不执行任何业务写入，不保存账号、密码、Token、Cookie 或真实敏感数据。
