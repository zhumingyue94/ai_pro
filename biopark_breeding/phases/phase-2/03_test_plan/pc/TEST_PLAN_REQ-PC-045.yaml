trace:
  story: PC 存发苗间库存查询
  req: REQ-PC-045
  project: 种禽孵化管理系统
  version: 1
  status: draft
objective: 基于 REQ-PC-045 分析、需求说明书和 page.json 已登记的 pc-inventory-query 页面事实，规划存发苗间库存查询的页面进入、一期继承的查询交互、库存计算口径、关联存发苗间顺序分配、空态/异常态、菜单权限、只读边界和跨 REQ 联动验证；保留 page.json 当前批次 partial、REQ-PC-045 既有采集 blocked/未执行、页面无结构化元素/表单/表格/交互、正式数据和定位器未提供等风险；仅输出测试计划，不生成测试点、测试用例或脚本。
scope:
  in_scope:
  - 进入库存管理 / 存发苗间 / 库存查询菜单，并承接正式路由 /biopark-breeding/breeding/stock/chick/chick-inventory；页面结构和控件仅在正式执行重新确认，不把 page.json 空结构写成原型事实。
  - 按一期继承口径规划筛选、查询、重置、分页、排序、展开和表格结果的验证；本期不重新定义字段、控件和具体交互细节。
  - 验证雏苗发货确认后自动生成存发苗间出库记录对库存查询结果的可见业务影响，出库数量等于本次发货数量，类型为出库、方式为自动、单位为只。
  - 验证出库批次取上孵计划批次，操作人和时间取雏苗发货记录，养殖客户取当前园区，出库存发苗间由上孵计划关联关系决定。
  - 验证本期库存数量按原库存数量减去本存发苗间发货出库数计算，其他入库、出库操作不纳入本期计算。
  - 验证当前存发苗间库存不足时按上孵计划关联的排列顺序继续分配至后续存发苗间，且不产生负库存。
  - 覆盖库存正数、零、足够、不足、部分出库、全部出库、无关联、多关联按序、有数据、无数据、加载失败和库存计算异常等业务边界。
  - 覆盖有菜单权限、无菜单权限及一期继承的查询/数据权限前置；不写死具体角色、权限编码或账号。
  - 验证查询、展开、刷新和只读展示不得执行手工库存调整、人工出入库、库存盘点或业务数据修复。
  out_scope:
  - REQ-PC-042 发货执行页面、发货提交本身及其页面操作。
  - REQ-PC-046 存发苗间出入库记录页面及其他一期入库、出库操作。
  - APP 库存查询及移动端专属规则。
  - 手工库存调整、人工出入库、库存盘点和业务数据修复。
  - 正式库存查询页面的原型重新探索、业务提交和真实数据变更；本计划仅规划授权执行。
  - 导出、列设置和库存明细入口。
  - 具体接口路径、HTTP 方法、请求体、响应体、错误码、分页协议和接口测试。
  - 未由需求、REQ-PC-045 分析或 page.json 已采集状态确认的按钮、字段、菜单、弹窗、表格列、定位器和视觉实现结论。
strategy:
- 以 REQ-PC-045 分析、需求说明书和需求变动为业务契约，以 page.json 的 capture_id、page_id、route、state_id、DOM/截图路径为页面事实边界；当前全量 capture.status=partial，REQ-PC-045 页面状态虽有证据路径，但 elements/forms/tables/interactions 均为空，不补造 UI 契约。
- 需求来源冲突按需求变动优先；本需求仅确认一期页面行为继承口径，正式字段、筛选项、空态和权限表现需在授权环境核对，不能将一期常见控件写成已采集原型事实。
- 使用等价类划分覆盖库存正数/零/异常、原库存足够/不足、出库零/部分/全部/异常、单个/多个/无关联、查询有数据/无数据/加载失败、默认/单条件/多条件/无匹配和菜单权限；使用边界值关注计算结果为 0、刚好足够、差 1 和潜在负数。
- 使用判定表评估有效关联、库存是否足够、是否继续分配、原库存与出库数是否可计算、查询是否成功、菜单/查询权限和展示结果之间的组合。
- 使用状态转换覆盖分析候选“页面进入→默认查询”“设置条件→查询结果”“有结果→库存展示”“无数据/加载失败→空态或错误表现”“库存不足→顺序分配”“刷新→重新加载”；page.json 已登记的 st-inventory-query-nanjing 和 st-inventory-query-nanjing-expanded 仅作既有状态证据，不代表存在可操作控件。
- 使用 Pairwise/2-way 评估 HatcheryState、StorageRelation、OriginalInventory、CurrentStorageOutboundQty、CalculatedInventory、AllocationState、QueryState、PermissionState、ViewState 的合法组合；约束包括库存=原库存-本存发苗间出库数、库存不得小于零、库存不足才进入下一存发苗间、无菜单不可见和异常/无数据按正式口径展示。
- 自动化仅规划 Playwright Python 可视 Chromium headless=False；当前 page.json 没有 REQ-PC-045 element_id 或 locator_candidates，正式页面提供可访问 role/label、行级唯一键、展开状态标识后再绑定定位器，不生成猜测定位器。
- Web 执行按导航、networkidle/可观察状态等待、查询前后结果比对、刷新回读和证据采集规划；不使用固定 sleep，不执行未经授权的写入，不保存账号、密码、Token、Cookie 或真实业务数据。
environment:
  client: PC Web
  os: win32；正式执行前记录实际客户端版本
  browser: Chromium visible mode；Playwright Python 规划 headless=False
  base_url: ${UI_TEST_URL}
  page_path: /biopark-breeding/breeding/stock/chick/chick-inventory
  portal_entry: 种禽孵化管理系统 / 库存管理 / 存发苗间 / 库存查询（菜单路径来自分析和 page.json 页面登记；正式可见性需确认）
  login: 原型未执行且既有采集包含登录阻塞；正式环境凭据仅从 .env 或运行时安全配置读取，不写入计划、日志或证据；需确认菜单和一期查询/数据权限
data:
  required:
  - 可安全回收的库存查询授权测试数据，覆盖正数、零、原库存足够、不足、部分出库、全部出库和异常计算候选。
  - 单个关联、多个按排列顺序关联、无关联的上孵计划与存发苗间关系。
  - 发货确认后可回读的自动出库记录及其批次、操作人、操作时间、养殖客户、数量、类型、方式和单位样本。
  - 默认查询、单条件、多条件、无匹配、有数据、无数据和加载失败的页面执行条件；正式筛选项和字段由一期继承页面核对确认。
  - 有菜单权限、无菜单权限及一期查询/数据权限条件；具体角色和编码由平台责任人提供。
  - 业务数据基线、查询结果快照、关联排序和库存计算回读责任；不得使用生产数据或未经授权的真实业务数据。
  preparation: 执行前由测试、业务/产品、平台权限和研发责任人准备脱敏业务数据、发货联动数据、菜单/查询权限、正式路由、唯一业务键、页面结构和定位器确认、数据回读及清理责任；任何库存或发货写入必须在授权数据和可回滚方案具备后执行，原型空页面和 mock 证据不作为正式功能结论。
roles:
- 测试：执行只读查询、边界、状态和证据采集；仅在授权数据及回滚责任明确时验证跨模块联动。
- 产品/业务负责人：确认库存计算、出库字段来源、关联顺序分配、空态和零库存口径。
- 平台权限/实施负责人：准备菜单权限、查询/数据权限、租户和测试角色。
- 研发：确认正式路由、一期继承页面字段/控件、异常表现和稳定唯一定位器。
- 测试设计：在计划通过后消费本计划范围和策略生成下游测试设计产物。
dependencies:
- REQ-PC-042 发货单发货执行：提供本存发苗间发货出库数及自动出库触发。
- REQ-PC-046 存发苗间出入库记录：一期模块承接出库记录追溯；其他出入库不纳入本期计算。
- 上孵计划与存发苗间关联关系：决定出库目标和不足时的排列顺序；正式数据未提供。
- 原库存数据和存发苗间基础数据：提供库存计算和查询展示基础；正式数据未提供。
- 平台角色菜单/查询/数据权限：控制页面可见和查询结果；本期具体配置未提供。
priority: P0：菜单/页面可进入、库存计算不为负、足够与不足分配、自动出库关键字段、查询结果和只读边界；P1：筛选/查询/重置/分页/排序/展开继承、零库存、无数据、加载失败、权限和刷新回读；P2：视觉一致性、兼容性和正式性能目标待确认
risks:
- page.json 当前批次为 partial，REQ-PC-045 历史采集 blocked/未执行；影响 high；正式授权环境重新执行并分开保存证据。
- page.json 中 REQ-PC-045 两个状态的 elements/forms/tables/interactions 均为空；影响 high；不写入按钮、字段、菜单细节或定位器，正式页面结构确认前自动化阻塞。
- PC 需求将二期存发苗间页面列为本次不在范围，页面行为依赖一期继承；影响 high；由业务/研发确认一期正式页面和本期承接边界。
- 库存计算和按关联顺序分配依赖 REQ-PC-042、存发苗间关系和真实数据；影响 high；准备可回读、可清理的授权数据，不以接口契约替代页面验证。
- 当前无正式测试数据、菜单/查询权限、页面执行环境和清理责任；影响 high；report_only 门禁，未满足前不作正式通过结论。
- 登录阻塞和空页面历史证据不能证明正式页面可用；影响 high；记录为未执行/阻塞，不将截图或 DOM 路径当作功能通过。
- 页面字段、查询条件、分页、排序、展开和空态沿用一期但未在本期结构化采集；影响 medium；执行前核对正式页面并登记差异。
open_questions:
- 确认正式环境 URL、菜单权限、查询/数据权限、租户和测试角色。
- 确认一期继承的正式筛选项、查询/重置、分页、排序、展开控件、表格字段和空态文案。
- 确认库存计算字段来源、精度、零库存表现和异常计算表现。
- 确认自动出库记录字段的正式可见名称、出库批次/操作人/时间/养殖客户取值口径。
- 确认多个存发苗间的排列顺序、库存不足时继续分配的触发和终止条件。
- 确认无菜单、无查询/数据权限、加载失败和无数据时的页面可见提示。
- 确认正式页面 role/label/data-testid、重复库存行唯一作用域和展开状态标识。
- 确认跨 REQ 发货联动测试数据的创建、回收、清理和异常回滚责任。
entry_criteria:
- DOCX、REQ-PC-045.yaml、page.json、.env 和 test-plan.schema.json 可读取，需求、分析、分区和模块身份一致。
- page.json 已检查并登记 capture_id PAGE-PC-REQ047-20260904-HEADED-CAPTURED、全局 capture.status=partial、页面 pc-inventory-query、状态 st-inventory-query-nanjing/st-inventory-query-nanjing-expanded 及对应 DOM/截图路径；已确认结构化元素为空，未采集事实不写入计划。
- 正式环境 URL、菜单/查询权限、脱敏库存及联动数据、唯一业务键、正式页面结构/定位器确认和清理责任已准备；未准备项转为阻塞或 report_only 风险。
- 需求继承边界、依赖责任、业务计算规则、策略、证据方案和冒烟/定向/全量套件已评审。
exit_criteria:
- YAML 通过 test-plan.schema.json，未新增字段且不含 tp/tp_id；Markdown 与 YAML 的范围、策略、风险、准入/准出、证据和套件一致。
- 已定义冒烟、定向、全量三个计划层级套件，未生成测试点、测试用例、CSV、禅道数据或 UI 脚本。
- partial、blocked/未执行、空结构化页面、正式页面/路由/权限/数据/定位器未确认和一期继承风险均在计划和交接中保留。
- 高风险开放问题已确认、转为明确阻塞，或由下阶段测试数据/权限准备承接；未经授权不执行库存或发货写入。
- 计划范围内页面行为、库存计算和业务联动均有可观察结果及证据类型定义；发货执行、出入库记录、APP和接口契约由对应范围承接。
evidence:
- 既有页面证据：page.json capture_id PAGE-PC-REQ047-20260904-HEADED-CAPTURED，页面 pc-inventory-query，菜单路径库存管理/存发苗间/库存查询，状态 st-inventory-query-nanjing、st-inventory-query-nanjing-expanded；对应 DOM/截图路径为分析文件登记的 req-pc-045-nanjing-inventory-data 及 expanded 文件。该证据不包含结构化控件或业务可执行证明。
- 页面清单历史阻塞证据：未加载 .env 时重定向登录，加载后页面为空且无可交互表单，未进入门户、菜单或库存页面；正式执行前不得将其判定为通过。
- 正式执行阶段按 REQ、页面路由、state_id、运行标识保存脱敏截图、DOM 快照、必要控制台/网络日志、Playwright trace、客户端/浏览器版本和时间。
- 对进入、默认查询、筛选/查询/重置、分页/排序/展开、零库存/空态/加载失败、权限和刷新保存前后页面状态与可见文案；对库存计算和关联分配保存授权数据键、计算基线、结果回读和不产生负库存证据。
- 对自动出库联动保存发货前后库存/出库记录回读、数量/类型/方式/单位/批次/操作人/时间/养殖客户等脱敏字段比对；不保存凭据、Cookie、真实敏感数据或未授权业务值。
- 自动化执行前记录正式页面 locator 发现结果；当前无 element_id/locator_candidates，未确认时保留人工/自动化阻塞证据，不以脚本通过替代确认。
- 正式证据与现有 blocked/空页面证据分开存放，历史页面清单仅作为风险和追溯依据。
suites:
  Smoke: 规划可视 Chromium 进入正式库存查询页面、确认菜单/页面可见、默认查询结果可观察、执行一次继承查询并验证零/非负库存及只读边界；正式路由、权限、结构和定位器未确认时标记阻塞，不执行写入。
  Targeted: 规划库存正数/零、足够/不足、部分/全部出库、单/多/无关联、顺序分配、筛选/查询/重置、空态/加载失败、分页/排序/展开、菜单/查询权限、刷新回读和 REQ-PC-042 自动出库字段联动；重点覆盖一期继承与二期业务规则交界。
  Full: 规划本 REQ 全部页面继承行为、库存计算边界、判定表、状态转换、Pairwise/2-way 组合、跨模块回读、只读数据不变更、兼容性和与 REQ-PC-042/046 的责任边界回归；APP、手工出入库、接口契约和导出由对应范围承接。
