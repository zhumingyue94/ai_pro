trace:
  story: REQ-004 雏苗发货导出
  req: REQ-PC-044
  project: 种禽孵化管理系统
  version: 1
  status: draft
objective: 基于 REQ-PC-044 分析、需求说明书和 page.json 已采集的 pc-chick-shipping 页面及导出相关证据，规划雏苗发货列表导出入口、当前筛选结果导出、最新确认提示、固定全部字段、Excel 文件属性、空结果、权限、只读不变更和下载证据验证；保留 page.json 全局 capture.status=partial、页面引用可用但当前需求确认框未单独采集、正式路由未探索、正式权限/数据/下载环境未准备等风险；仅输出测试计划，不生成测试点、测试用例或脚本。
scope:
  in_scope:
  - 从 pc-chick-shipping 雏苗发货列表页进入导出流程；页面入口、筛选控件、列表和导出按钮仅引用 page.json 已采集事实。
  - 读取当前已应用的计划发货日期、状态卡、栋舍、品种和关键字筛选条件，确认导出范围与列表当前结果一致。
  - 点击已采集的导出按钮后显示当前需求确认提示“是否确认导出全部数据项？”；系统确认框未在 page.json 单独采集，不补造其 element_id 或定位器。
  - 确认后导出当前筛选结果中的全部字段，字段、顺序和显示名称与页面表格一致；不支持自定义字段。
  - 有筛选条件时只导出筛选结果，无筛选条件时导出全部列表数据。
  - 取消确认后关闭提示且不导出，列表、状态统计和已应用筛选条件保持不变。
  - 导出文件固定为中文文件名发货单.xls，验证下载触发、扩展名、文件名可读性和在授权测试目录中的清理责任；二进制生成接口不在范围内。
  - 筛选无数据时执行与有数据相同的确认和导出交互，确认后下载仅包含表头的发货单.xls。
  - 有菜单和导出权限、无菜单权限、无导出权限时的可见性和页面可观察结果；无导出权限点击导出显示“没有操作权限”。
  - 导出确认、取消和下载不改变列表数据、状态统计或已应用筛选条件；导出流程为只读业务操作。
  out_scope:
  - 自定义字段选择、字段勾选、简版字段方案和历史导出范围选择。
  - 导出配置弹窗、历史处理状态、导出结果预览、再次导出和预览关闭；最新需求变动已取消或不考虑这些能力，page.json 历史状态仅作为偏差证据。
  - 导出失败、接口超时和重复点击专属反馈；需求变动明确不作为当前需求能力。
  - 具体接口路径、HTTP 方法、请求体、响应体、错误码和文件生成接口契约。
  - APP 导出和移动端专属规则。
  - REQ-PC-041 列表筛选、状态统计和分页本身的实现；本需求只承接当前已应用条件的读取和导出联动。
  - 发货执行、发货单明细、库存和出入库联动。
  - 未由需求、REQ-PC-044 分析或 page.json 已采集状态确认的按钮、字段、菜单、弹窗细节和定位器。
strategy:
- 以 REQ-PC-044 分析和需求说明书/需求变动为业务契约，以 page.json 的 capture_id、page_id、route、state_id、element_id、DOM/截图路径为页面事实边界；全局 capture.status=partial，正式页面、权限、接口和下载行为不视为已完整确认。
- 需求变动优先于历史原型：取消导出配置弹窗和字段方案选择，确认提示改为“是否确认导出全部数据项？”，导出全部页面字段；历史 st-export-dialog、st-export-scope-options、st-export-field-options、st-export-result 等只作为偏差证据，不作为当前能力结论。
- 使用等价类覆盖筛选条件、状态卡、数据结果、权限、确认动作和文件属性；使用边界值覆盖无筛选/单条件/多条件/无结果、0/1/多条、中文文件名、扩展名和空文件表头。
- 使用判定表评估菜单权限、导出权限、是否有已应用筛选条件、筛选结果是否为空、是否确认、是否发生下载和页面业务数据是否保持不变。
- 使用状态转换覆盖 page.json 已采集的 st-default、st-export-dialog、st-export-scope-options、st-export-field-options、st-export-processing、st-export-result、st-export-reopen、st-export-filter-status、st-export-filter-keyword；当前需求新的系统确认框和下载结果未单独采集，正式执行前确认其可观察状态，不补造状态/元素。
- 使用 Pairwise/2-way 评估 MenuPermission、ExportPermission、FilterState、StatusCard、ConfirmAction、DataState、FileProperty 的合法组合；约束包括无菜单时入口不可见、无导出权限无下载、取消不下载、无结果仍确认并下载仅表头、导出字段固定等。
- 自动化规划采用 Playwright Python 可视 Chromium headless=False；优先使用 page.json 已记录的 role/label/placeholder 和区域语义定位。导出按钮已登记为 el-btn-export；系统确认框和下载成功结果没有当前 page.json 独立定位器，正式执行前必须确认稳定 role/label/data-testid，不得编造定位器。
- Web 执行按列表导航、应用筛选、点击导出、等待确认框可观察状态、确认/取消、监听受控下载和校验前后列表状态执行；不使用固定 sleep，不注入接口，不保存账号、密码、Token、Cookie 或真实业务数据。下载文件使用临时受控目录并由责任人清理。
environment:
  client: PC Web
  os: win32；正式执行前记录实际客户端版本
  browser: Chromium visible mode；Playwright Python 规划 headless=False
  base_url: ${UI_TEST_URL}
  page_path: /biopark-breeding/breeding/hatchingplans/delivery
  portal_entry: 种禽孵化管理系统 / 计划管理 / 雏苗发货（page.json 已采集菜单路径）
  login: 原型采集无需登录；正式环境凭据仅从 .env 或运行时安全配置读取，不写入计划、日志或证据；需确认正式菜单和导出权限
data:
  required:
  - 可安全清理的雏苗发货列表测试数据，覆盖无筛选、单条件、多条件、状态卡筛选和关键字筛选。
  - 有结果、单条、多条和筛选无结果的数据条件；无结果导出需验证文件仅含表头。
  - 有菜单和导出权限、无菜单权限、无导出权限的授权测试配置。
  - 页面表格字段、顺序、显示名称以及中文文件名发货单.xls的正式可回读样本。
  - 受控浏览器下载目录、文件清理责任和下载验证环境；不得使用生产数据或未经授权的真实业务数据。
  preparation: 执行前由测试、业务/产品和平台权限责任人准备脱敏数据、菜单/导出权限、自然唯一业务键、正式路由、下载目录和清理责任；确认导出仅为只读结果生成，不改变业务数据；原型 mock 和历史导出预览仅作证据参考，不作为正式数据或当前需求结论。
roles:
- 测试：执行导出入口、筛选联动、确认/取消、下载属性、权限和数据不变更验证，采集脱敏证据并清理下载文件。
- 产品/业务负责人：确认全部字段、字段顺序/名称、筛选结果范围、空结果表头和文件命名口径。
- 平台权限/实施负责人：准备菜单权限、导出权限、租户和数据权限样本。
- 研发：确认正式路由、确认提示可观察契约、下载触发、文件属性和异常表现。
- 测试设计：在计划通过后消费本计划范围和策略生成下游测试设计产物。
dependencies:
- REQ-PC-041 雏苗发货列表：提供导出入口、已应用筛选条件、状态卡和列表结果；列表本身不属于本需求。
- 平台角色菜单/接口权限配置：控制菜单可见性和导出操作权限；具体角色与权限编码未提供。
- 页面表格字段和固定文件命名规则：确认下载内容、顺序、显示名称和发货单.xls口径。
- 正式环境下载能力：支持 Excel 文件下载、中文文件名验证和受控目录清理；正式环境未提供。
priority: P0：导出入口、当前筛选结果范围、确认/取消、全部字段、文件名/格式、无结果仅表头和无权限边界；P1：多筛选组合、状态卡、中文文件名、数据不变更、菜单权限和下载证据；P2：视觉一致性、兼容性和正式性能目标待确认
risks:
- page.json 全局 capture.status=partial；pc-chick-shipping 导出引用虽标记 available，但正式页面和路由未探索；影响 high；执行前重新确认正式页面并保留差异。
- 最新需求取消历史配置弹窗、字段方案、结果预览，而 page.json 保留这些历史状态；影响 high；以当前需求为准，历史状态只记录为偏差，不将其写入当前测试事实。
- 系统确认框未在 page.json 单独采集，当前不可写出其元素 ID 或定位器；影响 high；正式执行前确认 role/label/data-testid，否则自动化阻塞并转人工。
- mock 导出结果不能证明正式发货单.xls下载、中文文件名和实际字段；影响 high；使用授权数据、受控下载目录和文件内容/属性回读验证。
- 正式测试数据、平台导出权限、下载环境和清理责任尚未提供；影响 high；以 report_only 门禁登记，未满足前禁止正式下载验证。
- 无导出权限和筛选无结果分支尚未正式执行；影响 high；准备对应权限和空结果数据并保存页面及文件证据。
- page.json 同批次包含其他模块且公共 Schema 存在外部采集元数据问题；影响 medium；本计划仅引用 pc-chick-shipping 的导出事实，不修改 page.json，不把其他模块问题归入本需求。
open_questions:
- 确认正式环境 URL、菜单权限、导出权限、租户和测试角色。
- 确认正式列表表格的全部字段、字段顺序、显示名称与发货单.xls文件内容口径。
- 确认系统确认提示框的正式可见结构、确认/取消可观察文案和稳定定位器。
- 确认中文文件名“发货单.xls”是否为严格固定文件名，以及浏览器实际下载扩展名/编码口径。
- 确认筛选无结果时文件仅包含哪些表头、是否保留同样的确认交互和筛选条件。
- 确认无菜单权限和无导出权限时菜单/按钮/提示的正式表现。
- 确认下载目录、文件清理责任、正式下载审计和失败回滚安排。
entry_criteria:
- DOCX、REQ-PC-044.yaml、page.json、.env 和 test-plan.schema.json 可读取，需求、分析、分区和模块身份一致。
- page.json 已检查并登记 capture_id PAGE-PC-REQ045-20260903-ENV-RETRY、页面 pc-chick-shipping、页面导出元素 el-btn-export/el-table/筛选元素及历史导出状态；全局状态 partial，当前确认框未单独采集。
- 正式环境 URL、菜单/导出权限、脱敏数据、正式路由、受控下载目录、唯一业务键和清理责任已准备；未准备项转为阻塞或 report_only 风险。
- 需求变动、历史原型差异、范围责任、策略、数据边界、证据方案和三类套件已评审。
exit_criteria:
- YAML 通过 test-plan.schema.json，未新增字段且不含 tp/tp_id；Markdown 与 YAML 的范围、策略、风险、准入/准出、证据和套件一致。
- 已定义冒烟、定向、全量三个计划层级套件，未生成测试点、测试用例、CSV、禅道数据或 UI 脚本。
- page.json partial、页面引用状态、正式路由未探索、需求与历史原型差异、确认框/下载定位器风险、权限/数据/清理前提均在计划和交接中保留。
- 高风险开放问题已确认、转为明确阻塞，或由下阶段测试数据/权限准备承接；未授权正式下载验证不作为通过条件。
- 计划范围内导出行为均有可观察结果和证据类型定义，列表、发货执行、明细、库存和接口契约等范围外责任已交接。
evidence:
- 既有页面证据：page.json capture_id PAGE-PC-REQ045-20260903-ENV-RETRY，页面 pc-chick-shipping，原型路由 http://43.143.148.114:18885/biopark-breeding/，菜单路径计划管理/雏苗发货，页面已采集 el-btn-export、el-table、el-filter-date-start、el-filter-date-end、el-filter-house、el-filter-breed、el-filter-keyword。
- 历史状态证据引用 page.json/分析文件登记的 st-export-dialog、st-export-scope-options、st-export-field-options、st-export-processing、st-export-result、st-export-reopen、st-export-filter-status、st-export-filter-keyword 及对应 DOM/截图路径；这些状态仅用于记录与当前需求的差异，不作为当前需求能力。
- 正式执行阶段按 REQ、页面路由、state_id、运行标识保存脱敏页面截图、DOM 快照、必要控制台/网络日志、Playwright trace、下载事件摘要、文件名/扩展名/表头校验结果、客户端/浏览器版本和时间。
- 对无筛选、单/多条件、有结果/无结果、状态卡、关键字、确认/取消、权限分支保存操作前后列表、统计、筛选条件和提示文案；验证导出不改变业务数据。
- 下载验证使用受控临时目录，仅保留必要的文件属性和脱敏表头比对结果；下载文件按责任人清理，不将真实业务数据写入报告。
- 自动化执行前记录系统确认框和下载结果定位器确认；未确认时保留人工/自动化阻塞证据，不以脚本通过替代定位器确认。
- 正式环境证据与原型历史证据分开存放，历史预览和配置弹窗不得误报为当前需求正式通过。
suites:
  Smoke: 规划可视 Chromium 进入已采集对应列表页状态、确认导出入口可达、打开当前需求确认提示、取消提示不下载；在授权条件具备时确认一次有结果数据下载及文件名/扩展名可观察，定位器或权限未确认时标记阻塞。
  Targeted: 规划无筛选/单条件/多条件/状态卡/关键字筛选、确认与取消、无结果仅表头、全部字段/顺序/名称、中文文件名、无菜单/无导出权限、列表与筛选条件不变、受控下载和清理证据；重点覆盖当前需求与历史原型差异。
  Full: 规划本 REQ 全部筛选范围、状态转换、等价类/边界值、判定表、Pairwise/2-way 组合、权限、空结果、文件属性、数据不变更、浏览器兼容性和与 REQ-PC-041/042/043 的责任边界回归；接口契约、导出失败/超时/重复点击专属反馈和移动端由对应范围承接。
