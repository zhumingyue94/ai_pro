  status: draft
objective: 基于 REQ-PC-041 分析事实、需求说明书和 pc-chick-shipping 页面采集证据，规划雏苗发货列表与筛选的功能测试范围、系统化测试策略、环境与数据前提、风险、准入准出、执行证据及冒烟/定向/全量套件；仅输出测试计划，不生成测试点、测试用例或执行脚本。
scope:
  in_scope:
  - 计划管理 / 雏苗发货列表页入口、默认当天日期条件、页面状态和页面级可达性。
  - 计划发货日期开始/结束条件：默认当天、有效单日、有效跨日范围、结束日期早于开始日期和无匹配结果。
  - 栋舍、品种、发货单号/孵化计划号关键字筛选，以及筛选条件组合、查询和重置。
  - 全部、待发货、发货中、已发货、已签收状态统计卡的展示、切换、零值展示和统计口径。
  - 发货单列表字段、状态、计划发货日期升序及同日期按发货单号升序排序、计划上苗数、发货进度、待发货数、计划苗重、创建时间、最后更新时间、孵化计划号、孵化场和操作入口。
  - 实际可发数、已发货数、待发货数和发货进度的规则级验证目标，包括实际可发数为零及异常边界待确认目标。
  - 查询后列表/统计/分页刷新并回到第一页，重置后恢复默认条件并回到第一页，分页后保持已应用筛选条件。
  - 按发货状态与计划日期判定发货入口可用性，以及明细入口按页面规则保留的边界确认。
  - 验证搜索框占位文字为“请输入发货单号或孵化需求号”，以及无任何上孵计划的发货单不显示“发货”和“明细”入口。
  - REQ-PC-041 对 REQ-PC-044 的边界：仅规划导出入口、当前筛选上下文和配置弹窗可达性，不执行确认导出、文件生成、下载或文件内容校验。
  - 页面证据边界：已采集 pc-chick-shipping、路由 http://43.143.148.114:18885/biopark-breeding/、菜单路径“计划管理 / 雏苗发货”及 st-default、st-stat-pending、st-filter-keyword、st-pagination-page2；采集状态为 partial。
  out_scope:
  - 发货执行、栋舍位置录入、草稿、完成发货、提交、防重复和发货状态持久化。
  - 发货单明细页只读追溯及上孵计划/栋舍/来源明细联动，由 REQ-PC-043 承接。
  - 导出确认、实际导出、文件生成、下载、失败/超时和文件内容校验，由 REQ-PC-044 承接；st-export-dialog 仅作为跨需求边界和依赖风险。
  - 库存查询、出入库记录、发货确认后的库存联动、接口路径/方法/参数/响应契约和接口注入。
  - 未由需求、分析 YAML 或可验证页面证据确认的权限实现、源系统实现、异常持久化和状态视觉规范结论。
  - 测试点、测试用例、CSV、禅道数据、注册表和 Playwright UI 自动化脚本。
