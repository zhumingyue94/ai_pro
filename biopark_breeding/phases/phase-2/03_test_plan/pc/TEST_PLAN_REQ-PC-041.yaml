strategy:
- 以当前需求说明书及用户补充答案为业务规则最高优先级，以 REQ-PC-041 分析 YAML 为追溯和阻塞基线，以 page.json/DOM/截图仅证明已采集的页面板块、字段和可观察交互；不得把历史状态下拉或原型 mock 数据写成当前实现结论。
- 使用等价类划分覆盖日期范围、栋舍/品种、关键字、五类状态卡和有结果/多页/空结果；使用边界值覆盖结束日期等于开始日期、结束日期早于开始日期、第一页/最后一页/越界页码、关键字空值/单字符/完整编号/200 字以内/超过 200 字及统计数量为零。
- 使用判定表独立评估计划日期是否达到、订单状态、实际可发数是否大于零、是否存在发货记录、是否已签收和是否存在筛选结果，分别规划待发货、发货中、已发货、已签收和未来日期的发货入口判定。
- 使用状态转换覆盖默认列表到查询结果、查询结果到重置默认条件、状态卡切换、第一页与后续页互切换、列表到导出配置弹窗再关闭/取消；导出确认不属于本需求执行范围。
- 使用 Pairwise/2-way 评估计划日期、栋舍、品种、关键字类型、状态卡、结果集、权限和浏览器的组合，应用结束日期不得早于开始日期、实际可发数为零时进度为 0%、未来日期不得展示可执行发货入口及状态统计不重复叠加状态卡等约束。
- 按 L1 页面/板块出现、L2 字段/列/按钮/状态展示、L3 字段来源/格式/值/计算/跨系统一致性分别规划，不以页面可见 mock 值替代真实数据验证；OI-041-01 至 OI-041-06 均作为待确认或阻塞目标保留。
- 自动化范围按 Playwright Python、可视 Chromium（headless=False）规划；优先角色、占位符、标签和唯一文本定位，日期分段控件、通用下拉和重复行内入口需执行前确认稳定定位器；不使用固定 sleep，不在脚本中写入凭据或业务数据。
- 执行证据按页面状态、截图、DOM 快照、浏览器日志和 trace 规划，并区分既有 page.json 证据与正式环境执行阶段待采集证据；采集状态 partial 时不得宣称页面证据完整。
environment:
  client: PC Web
  os: win32；正式环境执行前记录实际客户端版本
  browser: Chromium visible mode；Playwright Python 执行时 headless=False
  base_url: ${UI_TEST_URL}
  page_path: /biopark-breeding/breeding/hatchingplans/delivery；原型入口 http://43.143.148.114:18885/biopark-breeding/
  portal_entry: 种禽孵化管理系统 / 计划管理 / 雏苗发货
  login: 原型采集无需登录；正式环境凭据仅从 .env 或运行时环境读取，不写入计划、日志或证据
data:
  required:
  - 正常发货单、空结果、单页结果、多页结果及分页边界数据。
  - 计划发货日期为当天、历史、未来、有效跨日和结束日期早于开始日期的数据条件。
  - 全部、待发货、发货中、已发货、已签收五类状态及状态统计为零的数据。
  - 栋舍和品种全部选项、有效单项、无匹配组合，发货单号和孵化计划号完整/部分/无匹配关键字及 200 字以内与超过 200 字输入。
  - 实际可发数为零、正数、已发货数为零、待发货数为零及超发/空值/未同步/重复记录等 OI-041-05 待确认边界样本。
  - 执行前批准的测试角色、菜单/接口权限、租户、孵化场映射、跨租户隔离样本及跨系统关联样本；无数据权限和无导出权限场景仅按授权准备。
  preparation: 执行前由测试、产品/业务和平台权限责任人准备脱敏测试数据、自然唯一业务键、角色权限和数据清理责任；确认 OI-041-01 至 OI-041-06 的解除条件或明确阻塞。真实环境只读验证优先，本阶段不写入业务数据；不得在计划中保存账号、密码、Token、Cookie 或持久化登录状态。
roles:
- 测试：按计划执行页面功能和边界验证，保存脱敏截图、DOM、日志和 trace 证据。
- 产品/业务负责人：确认孵化计划号、日期时间来源、计算异常、状态视觉和业务数据样本。
- 平台权限/实施负责人：准备菜单/接口权限、租户、孵化场映射及无权限数据。
- 研发：确认字段来源、聚合计算、分页/排序、异常提示和页面定位器。
- 测试设计：在计划通过后消费 coverage_id、planned_item_id 和 atomic_purpose_id 生成下游测试设计产物。
dependencies:
- 排程计划：形成雏苗发货单、计划发货日期、计划上苗数和计划苗重；真实契约及正式数据待确认。
- 上孵计划：提供实际出雏、实际可发和关联孵化计划信息；真实契约及正式数据待确认。
- 栋舍、品种基础数据：提供筛选选项和列表业务维度；需提供全量有效选项及隔离数据。
- 商品禽养殖端签收结果：参与已签收状态判断；需提供可核对关联样本。
- REQ-PC-042：承接发货执行、草稿、完成发货和提交行为。
- REQ-PC-043：承接发货单明细与结果追溯。
- REQ-PC-044：承接导出确认、文件生成、下载和结果校验；本计划不执行 st-export-dialog 的确认导出。
priority: P0：列表入口、查询/重置、状态统计、分页、筛选结果和发货入口条件；P1：字段排序、计算展示、权限/异常/空态；P2：跨系统来源、租户隔离、状态视觉和兼容性待确认目标
risks:
- 页面采集状态为 partial，正式环境入口、路由、页面状态和元素实现可能与原型不同；影响：high；执行前必须重新确认页面和证据。
- 原型数据为公开 mock，已采集截图/DOM 不能证明真实接口、分页、统计、计算、权限或持久化；影响：high；使用授权真实测试数据并保留回读证据。
- OI-041-01：孵化计划号正式格式与校验口径未确认；影响：high。
- OI-041-02：创建时间、最后更新时间来源和更新时间点未确认；影响：high。
- OI-041-03：当前租户默认孵化场和跨租户隔离口径未确认；影响：high。
- OI-041-04：发货单号与商品禽养殖系统补栏计划号对应关系未确认；影响：high。
- OI-041-05：实际可发数、已发货数、待发货数和进度的零值、空值、超发、重复记录及同步异常口径未确认；影响：high。
- OI-041-06：五类状态标签正式颜色和样式映射未确认；影响：medium。
- 行内发货和明细入口为重复按钮，缺少稳定唯一定位器；日期为 antd 分段输入，栋舍/品种为通用下拉；影响：high；执行前补充正式 data-testid 或按唯一业务键作用域定位。
- 历史原型存在状态下拉和待发货证据，但当前需求仅保留状态卡切换；影响：medium；以最新需求和执行环境为准。
- st-export-dialog 属于 REQ-PC-044；若将导出确认或文件校验纳入本计划会造成范围泄漏；影响：medium；仅保留入口/弹窗边界。
open_questions:
- OI-041-01：确认孵化计划号正式格式、合法性校验和异常展示口径；未确认前仅设计等价类/边界目标，不作已验证结论。
- OI-041-02：确认创建时间、最后更新时间的源字段、触发事件、时区和状态变更样本。
- OI-041-03：确认测试租户、默认孵化场、跨租户隔离键和授权样本。
- OI-041-04：确认发货单号与补栏计划号的关联字段、业务键和跨系统可核对样本。
- OI-041-05：确认实际可发数为零、空值、未同步、超发、重复发货记录时的待发货数、进度和入口口径。
- OI-041-06：确认待发货、发货中、已发货、已签收及全部状态的文字、颜色和样式规范。
- 确认正式环境页面是否提供稳定唯一定位器，以及行内发货/明细入口的权限和可观察行为。
- 确认正式环境接口超时、基础数据加载失败、权限不足及无结果的提示和证据采集口径。
entry_criteria:
- DOCX、REQ-PC-041.yaml、page.json、项目配置和 test-plan.schema.json 可读取，REQ、平台和业务模块身份一致。
- 测试范围、非范围、依赖、优先级、风险和 OI-041-01 至 OI-041-06 已登记，历史原型与当前需求差异已明确。
- 正式环境 URL、页面权限、测试角色、脱敏数据、数据清理责任和证据保存位置已准备；未准备项必须转为阻塞。
- 计划中的所有页面引用均来自已采集路由、页面状态、元素和定位器边界，不猜测稳定定位器或导出执行结果。
exit_criteria:
- 范围/非范围、策略、环境、数据、角色、依赖、优先级、风险、开放问题、准入/准出和证据要求完整。
- Smoke、Targeted、Full 三类套件已定义，且内容仍处于测试计划层面，不包含测试点编号、测试用例步骤或执行结果。
- YAML 已通过 test-plan.schema.json 校验，Markdown 与 YAML 的关键范围、风险和套件内容一致。
- 页面 partial 状态、正式环境执行风险、行内入口 ambiguous 风险及 REQ-PC-044 导出边界均在交接中保留。
- 高风险开放问题已确认、转为阻塞，或由下阶段在测试数据/权限准备中承接；未执行真实业务写入。
evidence:
- 既有证据：page.json capture_id PAGE-PC-REQ041-REQ042-20260903、pc-chick-shipping 页面、st-default/st-stat-pending/st-filter-keyword/st-pagination-page2 对应 DOM 和截图；采集状态 partial。
