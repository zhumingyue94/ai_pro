- element_id：exec-page、exec-summary-card、exec-progress、exec-stat-actual、exec-stat-accum、exec-stat-pending、plan-list、plan01-record-btn、plan01-ship-btn、plan02-ship-btn、ship-dialog、ship-dialog-column、ship-dialog-row、ship-dialog-quantity、ship-dialog-remark、ship-dialog-cancel、ship-dialog-confirm、ship-dialog-error-no-qty、ship-dialog-error-exceed、ship-success-toast、ship-dialog-remark-truncated。
- 既有截图：02_analysis/app/page_inventory/screenshots/req-app-022-execute-default.png、req-app-022-ship-dialog.png、req-app-022-validation-error-no-quantity.png、req-app-022-validation-exceed-quantity.png、req-app-022-no-position-validation.png、req-app-022-remark-15.png、req-app-022-execute-shipped-full.png。
- 正式执行对数据变更保存脱敏前后状态、回读结果、清理记录；不得保存凭据或 Cookie。
suites:
  Smoke: 规划进入执行页、计划统计可见、合法计划弹窗可达、数量正整数校验和取消回退；不提交未授权业务数据。
  Targeted: 规划数量/列层/备注边界、待分配上限、服务端刷新、重复/并发、状态更新、自动出库、不负库存和失败重查。
  Full: 规划全部已采集执行状态、判定表、状态转换、Pairwise 组合、跨服务一致性、权限/异常/兼容性及与列表和记录模块回归。
