plan_id: TEST_PLAN-REQ-APP-025
title: APP测试计划 - 存发苗间出入库记录
status: draft
source_inputs:
- 01_requirements/种禽孵化管理系统二期_需求说明书_合并版.docx
- 01_requirements/需求变动.md
- 02_analysis/app/REQ-APP-025.yaml
- 02_analysis/app/page_inventory/page.json
- .env
- ../../../../.agents/references/test-plan.schema.json
trace:
  story: REQ-009 存发苗间出入库记录
  req: REQ-APP-025
  project: 种禽孵化管理系统
  version: 1
  status: draft
objective: 在二期缺少专属 APP 页面证据的前提下，规划发货确认触发自动出库记录的数据联动、契约补充、风险、环境和证据边界；不虚构页面、元素或接口事实。
scope:
  in_scope:
  - 发货确认成功后的自动出库记录生成和与发货记录/上孵计划的关联。
  - 数量、类型、方式、单位、批次、操作人、操作时间、养殖客户和存发苗间的数据一致性规划。
  - 库存不足时按关联排列顺序分配和不产生负库存的联动验证规划。
  out_scope:
  - page.json 未出现的 APP 页面、路由、状态、字段、按钮、菜单、定位器和接口错误码。
  - 手工库存调整、非发货入库和未授权业务数据。
strategy:
- 使用等价类/边界值覆盖发货数量、单/多存发苗间、库存充足/不足、关联存在/缺失和重复/重试结果。
- 使用判定表评估发货确认结果、自动出库触发、库存可用量、关联排列顺序和幂等状态。
- 使用状态转换规划发货成功、出库生成、出库部分分配、失败补偿和重试；具体可观察状态待服务端契约确认。
- 使用 Pairwise/2-way 评估数量类别、库存状态、关联数量、重试结果和授权角色，未定义组合标记待确认。
- Playwright/Web 仅规划从 app022 已采集确认入口到可核对记录的证据边界，不创建不存在的页面定位器或脚本。
- 证据规划为授权回读、脱敏记录摘要、变更前后库存和清理日志；确认发货属于业务变更，必须经责任人批准。
environment:
  client: APP移动端Web/移动端模拟
  os: win32；正式执行记录实际客户端版本
  browser: Chromium headed；仅规划已采集 APP-022 入口证据
  base_url: ${UI_TEST_URL}
  page_path: 二期未提供专属 APP 页面路由，当前阻塞
  portal_entry: 种禽孵化管理系统 / APP / 发货执行后的存发苗间出库记录
  login: 原型和 page.json 未提供本模块专属登录/页面证据；正式环境凭据仅从 .env 或运行时环境读取，不写入计划、日志或证据
data:
  required:
  - 发货记录、上孵计划批次、存发苗间关联和库存充足/不足样本。
  - 自动出库成功、失败、重复请求、重试和多存发苗间分配样本。
  - 可回读出库记录且不含未经授权业务数据。
  preparation: 发货服务、库存服务和测试数据负责人共同准备脱敏样本、授权变更窗口、幂等/补偿方案和清理状态；在专属页面/契约补齐前保持 blocked。
roles:
- 测试：规划跨服务证据和阻塞项，不生成脚本。
- 发货服务负责人：确认触发、幂等和来源字段。
- 库存服务负责人：确认分配、不负库存和补偿。
- 业务负责人：确认批次、园区、客户和存发苗间规则。
- 测试数据负责人：登记变更责任和清理状态。
dependencies:
- REQ-APP-022 发货执行
- 上孵计划关联
- 存发苗间库存服务
- 园区和养殖客户基础数据
priority: P1：自动出库、数量和不负库存；P2：分配顺序、补偿、查询和兼容性
risks:
- page.json input_missing 且未发现本模块二期专属页面证据，范围、环境、证据和自动化均 blocked。
- 自动出库与发货记录可能重复或不一致。
- 库存不足分配、失败补偿、重试和幂等协议未定义。
open_questions:
- 一期页面入口/复用范围、字段、路由、权限和接口契约。
- 出库失败可见状态、补偿、重试和幂等键。
- 多存发苗间分配结果的回读字段和排序。
entry_criteria:
- 需求、变动、REQ-APP-025.yaml、page.json、.env 和 Schema 可读取。
- 缺失页面证据、未定义契约和业务变更责任已登记为阻塞/待确认。
- 脱敏数据、授权变更窗口和清理责任准备完成后才可进入执行。
exit_criteria:
- 计划明确不虚构页面事实，自动出库范围、风险、依赖、数据和证据完整。
- 三类套件保留为计划级边界，不生成测试点/用例/脚本。
- YAML 通过 Schema，页面和契约阻塞交接到下阶段。
evidence:
- 02_analysis/app/page_inventory/page.json：仅引用已采集的 app-chick-shipment-execute/app022-* 确认入口，不宣称存在 APP-025 专属页面。
- 需求分析：02_analysis/app/REQ-APP-025.yaml 的自动出库字段和 mutation_boundary。
- 正式执行前补充授权回读、变更前后库存、出库记录和清理状态证据；不得保存凭据、Cookie 或未授权业务数据。
suites:
  Smoke: 仅规划确认发货到自动出库可核对链路的入口和契约可达性；当前因缺少专属页面/接口证据保持 blocked。
  Targeted: 规划数量一致、出库属性、批次/操作人/时间/园区来源、多存发苗间分配、库存不足、不负库存、重复和失败重试。
  Full: 规划全量跨服务状态、判定表、边界、Pairwise、幂等/补偿、权限、性能、兼容性和与发货执行/库存查询边界回归；缺失契约项保持 blocked。
next_stage: testcase-generation-agent
