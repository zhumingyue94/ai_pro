- element_id：notfound-page、notfound-text、pending-page、pending-back、pending-plan-no、pending-status、pending-progress、pending-empty、shipping-page、shipping-status、shipping-progress、shipping-records、record1-status、record1-pos1、shipped-page、shipped-status、shipped-progress、shipped-record、record-complete、position-detail、hp072-records、hp072-position-accum、shipping-record-no-collapse-btn、hp011-notfound-page。
- 映射：02_analysis/app/page_inventory/lanhu_page_mapping/REQ-APP-024_lanhu_page_mapping.json。
