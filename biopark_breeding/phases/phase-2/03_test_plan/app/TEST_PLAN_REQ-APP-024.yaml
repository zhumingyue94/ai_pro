suites:
  Smoke: 规划有效计划进入、待发货/发货中/已发货状态可见、数量进度可见、未找到空态可达和返回执行页可达。
  Targeted: 规划签收判定、状态数量口径、多位置、记录数量边界、排序、折叠冲突、HP-011 未找到和服务端刷新/错误边界。
  Full: 规划全部已采集状态、判定表、状态转换、Pairwise、跨服务签收/数量一致性、性能、兼容性及与发货执行/发货单记录回归。
