systematic_boundary_analysis:
  equivalence_partitions:
    plan_progress: ["未达到已出雏", "已出雏", "终止"]
    order_status: ["待发货", "发货中", "已发货", "已签收"]
    date_eligibility: ["未到计划日期", "已到计划日期"]
    available_and_pending: ["实际可发为 0", "实际可发大于 0 且待发货大于 0", "待发货为 0"]
    draft: ["无草稿", "有单个位置草稿", "有多个位置草稿"]
    position: ["新位置", "同一位置重复录入", "多个位置"]
    quantity: ["空", "0", "负数", "小数", "正整数", "等于剩余", "超过剩余", "汉字/字母等非数字", "失焦自动校正"]
    submission: ["首次提交", "2秒内重复提交", "并发提交且未超最新剩余", "并发提交且超过最新剩余"]
  boundary_values:
    - "计划进度从未出雏到已出雏"
    - "待发货数 = 0、1、最大剩余值、最大剩余值 + 1"
    - "发货数量 = 0、负数、小数、1、等于剩余、超过剩余"
    - "同一位置首次录入与第二次回显修改的覆盖边界"
    - "实际可发数 = 0 时进度显示 0%"
    - "无关联计划或全部计划终止"
  decision_table_dimensions:
    - "计划是否已出雏"
    - "计划日期是否已到"
    - "待发货数是否大于零"
    - "发货单是否待发货/发货中"
    - "当前是否已进入发货模式"
    - "是否存在页面草稿"
    - "完成时未发货数量是 0 还是大于 0（仅影响确认文案，不影响是否弹窗）"
    - "数量和位置输入是否有效"
    - "是否触发前端自动校正"
    - "是否为 2 秒内重复提交"
    - "并发提交时是否超过最新待发货数"
  state_transition_dimensions:
    - "st-default → st-filter-progress/st-status-shipped"
    - "查看模式 → st-ship-mode"
    - "st-ship-mode → st-location-dialog"
    - "st-location-dialog → st-location-overlimit 或 st-draft"
    - "st-draft → st-exit-draft-confirm 或 st-complete-confirm"
    - "确认结束 → st-submitted"
    - "提交结果 → st-reset"
  design_boundary_status: "analysis_candidate_only"

pict_candidate_analysis:
  status: "candidate_only_no_test_cases_generated"
  parameters:
    PlanProgress: ["NotHatched", "Hatched", "Terminated"]
    ShipStatus: ["Pending", "Shipping", "Shipped", "Signed"]
    DateEligibility: ["BeforePlanDate", "PlanDateReached"]
    AvailableQty: ["Zero", "Positive"]
    AccumulatedQty: ["Zero", "Partial", "EqualsAvailable"]
    PendingQty: ["Zero", "Positive"]
    DraftState: ["None", "OnePosition", "MultiplePositions"]
    PositionState: ["New", "Repeated", "Multiple"]
    InputQtyClass: ["Empty", "Zero", "Negative", "Decimal", "PositiveWithin", "EqualRemaining", "OverRemaining", "NonNumeric"]
    SubmissionState: ["First", "DuplicateWithin2Seconds", "ConcurrentWithinLatestPending", "ConcurrentOverLatestPending"]
    CurrentPlan: ["Selectable", "Editing", "OtherPlan"]
    ActionState: ["ShipEnabled", "ShipDisabled", "Complete", "Exit"]
  constraints:
    - "IF [PlanProgress] = NotHatched OR [PlanProgress] = Terminated THEN [ActionState] != ShipEnabled"
    - "IF [PendingQty] = Zero THEN [ActionState] != ShipEnabled"
    - "IF [CurrentPlan] = Editing THEN other plan ship actions are disabled"
    - "IF [InputQtyClass] = PositiveWithin OR [InputQtyClass] = EqualRemaining THEN location input may be accepted"
    - "IF [InputQtyClass] = Zero OR Negative THEN blur quantity to 1 before save"
    - "IF [InputQtyClass] = Decimal THEN blur quantity to the rounded integer before save"
    - "IF [InputQtyClass] = OverRemaining THEN blur quantity to the current remaining quantity before save"
    - "IF [InputQtyClass] = NonNumeric THEN non-numeric characters cannot be entered or pasted"
    - "IF [SubmissionState] = DuplicateWithin2Seconds THEN the later submission is rejected"
    - "IF [SubmissionState] = ConcurrentOverLatestPending THEN submission is rejected against the latest pending quantity"
    - "IF [ActionState] = Complete THEN confirmation is required regardless of [PendingQty]"
    - "IF [PositionState] = Repeated THEN quantity and note are recalled and the latest completed values replace the previous position values"
    - "IF [AvailableQty] = Zero THEN progress displays 0% and no positive pending quantity is derived"
    - "IF [DraftState] != None AND [ActionState] = Exit THEN exit confirmation is required"

