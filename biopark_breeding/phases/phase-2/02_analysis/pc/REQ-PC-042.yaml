scope:
  in_scope:
    - "从雏苗发货列表进入发货执行页的页面承接"
    - "发货单主表信息、实际可发数、发货进度和发货状态展示"
    - "上孵计划列表、计划进度/发货状态/关键字筛选、查询和重置"
    - "已出雏且待发货数大于零的计划进入发货模式"
    - "发货模式下的当前计划锁定和其他计划发货入口状态"
    - "栋舍位置选择、数量和备注录入"
    - "同一位置数量和备注回显、修改保存及多位置暂存"
    - "数量输入自动校正：0/负数校正为1，小数四舍五入，超剩余校正为剩余数；汉字、字母等非数字字符不可输入"
    - "无草稿退出、有草稿退出确认和完成发货确认"
    - "确认提交后位置、计划、发货单进度、状态和发货记录的页面联动"
    - "不同发货单状态及上孵计划状态下的入口可用性"
    - "页面刷新后 mock 初始状态恢复的既有证据"
  out_of_scope:
    - "REQ-PC-041 雏苗发货列表查询、状态卡、分页和列表导出"
    - "REQ-PC-043 发货单明细、来源明细和只读追溯"
    - "REQ-PC-044 实际导出文件生成和下载"
    - "APP 发货执行、移动端刷新、返回及签收展示规则"
    - "发货草稿的持久化保存规则"
    - "商品禽养殖端签收结果的回写和外部系统联动"
    - "操作人、操作时间和备注的审计要求"
    - "库存查询、出入库记录和库存扣减联动"
    - "具体接口路径、方法、请求体、响应体、权限编码和接口独立测试"
    - "未开放的孵化排程计划、上孵计划和生产报表管理页面"

requirements_facts:
  - id: "FR-042-01"
    statement: "发货执行页展示发货单基础信息、实际可发数、进度、关联上孵计划、栋舍工作区和发货记录。"
    source: "requirement"
    source_ref: "REQ-002 1.2.2.1-1.2.2.2"
  - id: "FR-042-02"
    statement: "上孵计划区支持计划进度、发货状态和计划号关键字筛选，并展示计划进度、发货进度、待发货数及计划基础信息。"
    source: "requirement"
    source_ref: "REQ-002 1.2.2.2"
  - id: "FR-042-03"
    statement: "仅计划进度为已出雏且待发货数大于零的上孵计划允许进入发货模式；终止计划不参与发货。"
    source: "requirement"
    source_ref: "REQ-002 1.2.2.3；1.3.2"
  - id: "FR-042-04"
    statement: "进入发货模式后当前计划进入发货中状态，其他计划的发货入口暂不可用，以避免未提交草稿时切换计划。"
    source: "requirement"
    source_ref: "REQ-002 1.2.2.3"
  - id: "FR-042-05"
    statement: "剩余待发货数量 = 实际可发数 - 所有发货位置累计数量；累计数量包含已完成发货和本次暂存但尚未完成发货的数量。"
    source: "change_log"
    source_ref: "需求变动.md：PC 独有需求 REQ-PC-042"
  - id: "FR-042-06"
    statement: "发货数量输入框仅允许数字；0 或负数失焦后自动校正为 1，小数失焦后四舍五入为整数，超过当前剩余数失焦后自动校正为剩余数，点击完成按校正后的数量保存。"
    source: "requirement"
    source_ref: "需求变动.md：发货提交的共同约束；REQ-002 1.3.3"
  - id: "FR-042-07"
    statement: "点击栋舍/列/层位置格打开位置录入弹窗；再次打开同一位置时回显发货数量和备注，修改后点击完成按最新数量和备注保存，不叠加旧值。"
    source: "requirement"
    source_ref: "REQ-002 1.2.2.3"
  - id: "FR-042-08"
    statement: "无草稿时退出发货直接退出；存在草稿时先提示继续发货或继续退出，继续退出不保留未完成页面草稿。"
    source: "requirement"
    source_ref: "REQ-002 1.2.2.3；page.json 状态证据"
  - id: "FR-042-09"
    statement: "无论当前未发货数量为 0 还是大于 0，点击完成发货均展示结束确认；点击确认结束后才提交当前计划暂存结果并刷新位置、计划、发货单进度、状态和发货记录；点击继续发货不提交。"
    source: "requirement"
    source_ref: "REQ-002 1.2.2.3；page.json 状态证据"
  - id: "FR-042-10"
    statement: "发货单处于待发货或发货中时开放编辑；已发货或已签收时不开放发货编辑。多个上孵计划的列表顺序不限制。"
    source: "requirement"
    source_ref: "REQ-002 1.2.2.3；需求变动.md"
  - id: "FR-042-11"
    statement: "实际可发数来自关联上孵计划实际出雏总数；未达到已出雏的计划按零处理，实际可发数为零时进度不得发生除零错误。"
    source: "requirement"
    source_ref: "术语定义；REQ-002 1.3.1"
  - id: "FR-042-12"
    statement: "页面层保留提交成功、超量、无匹配数据和刷新恢复等可见表现；不依据 mock 数据补写正式接口契约。"
    source: "analysis_boundary"
    source_ref: "本阶段范围约束"
  - id: "FR-042-13"
    statement: "上孵计划列表待发货数为 0 时不可进入发货模式；该规则不等同于栋舍分布完成发货文字中的未发货数为 0。"
    source: "supplemented_requirement"
    source_ref: "用户补充答案 2；REQ-002 1.2.2.3"
  - id: "FR-042-14"
    statement: "2 秒内重复提交时后一次提交失败；并发提交按上孵计划最新待发货数校验，超出最新数量时不得提交。"
    source: "supplemented_requirement"
    source_ref: "用户补充答案 3；需求变动.md 2026.9.3 共用提交约束"
  - id: "FR-042-15"
    statement: "无关联计划、全部计划终止、加载失败和无数据时，相关表格均显示暂无数据。"
    source: "supplemented_requirement"
    source_ref: "用户补充答案 4"
  - id: "FR-042-16"
    statement: "正式页面路由为 /biopark-breeding/breeding/delivery/execute/{id}；测试环境地址来源于 .env，具体配置值不写入分析产物。"
    source: "supplemented_requirement"
    source_ref: "用户补充答案 1"
  - id: "FR-042-17"
    statement: "菜单和接口权限由平台角色权限配置；无菜单权限时菜单不显示，无接口权限时页面操作返回无操作权限。"
    source: "supplemented_requirement"
    source_ref: "需求变动.md 2026.9.3；用户补充答案 1"

