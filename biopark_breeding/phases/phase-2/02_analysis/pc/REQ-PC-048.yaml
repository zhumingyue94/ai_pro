      source_ref: "需求变动.md REQ-PC-048；用户补充答案；page.json / st-req-047-view-plan-jump"
  business_rules:
    - id: "BR-048-01"
      rule: "需求号是孵化需求与上孵计划之间的关联上下文；创建来源为孵化需求的计划必须可按该需求号识别。"
    - id: "BR-048-02"
      rule: "需求号筛选采用模糊匹配，输入长度和格式均不限制；命中时展示匹配范围内的关联计划，无匹配时展示无数据。"
    - id: "BR-048-03"
      rule: "孵化需求号列位于养殖批次列之前，空值显示‘-’，显示格式与孵化需求页面中的需求号一致，本需求不单独校验格式。"
    - id: "BR-048-04"
      rule: "重置需求号筛选后恢复默认列表范围；默认排序等一期行为不在本期新增定义。"
    - id: "BR-048-05"
      rule: "一个需求号对应多个上孵计划时，筛选结果应包含全部关联计划，不要求排序；分页沿用一期且不纳入本期测试；状态按计划状态筛选框过滤。"
    - id: "BR-048-06"
      rule: "从孵化需求跳转时自动查询触发跳转的当前需求号，其他筛选条件不保留，不得使用全局首行或历史残留值。"
    - id: "BR-048-07"
      rule: "需求号为空、重复或来源异常时显示‘-’；上孵计划仍可正常创建但不关联孵化需求。本期暂时保留新增和导入按钮，后期规划隐藏。"
    - id: "BR-048-08"
      rule: "无菜单权限时菜单不显示；无查询或查看接口权限时由平台返回‘无操作权限’，正式页面提示待授权环境核对。"
  roles_and_permissions:
