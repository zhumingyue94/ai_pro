        - name: "EntryContext"
          values: ["DirectPlanPage", "DemandRowJump"]
        - name: "DemandNoState"
          values: ["Empty", "FuzzyMatch", "NoMatch", "DuplicateOrSourceAnomaly"]
        - name: "RelatedPlanCount"
          values: ["Zero", "One", "Multiple", "CrossPageExcludedFromCurrentTest"]
        - name: "PermissionState"
          values: ["MenuAndQueryAllowed", "MenuDenied", "QueryDenied", "ViewDenied"]
        - name: "FilterAction"
          values: ["Query", "Reset", "Refresh", "NotExecuted"]
        - name: "JumpRefillState"
          values: ["CorrectCurrentDemandNo", "WrongDemandNo", "NotRefilled", "StaleValue"]
      constraints:
        - "EntryContext=DemandRowJump时，JumpRefillState应为CorrectCurrentDemandNo"
        - "DemandNoState=NoMatch时，RelatedPlanCount必须为Zero"
        - "PermissionState=MenuDenied时，不应可进入上孵计划菜单"
        - "PermissionState=QueryDenied时，查询结果应为权限提示而非业务空数据"
        - "FilterAction=Reset时，不应继续使用已提交的需求号筛选条件"
