      source: "module_split_and_change_log"
      source_ref: "模块拆分清单.md REQ-PC-048；需求变动.md REQ-PC-048"
    - id: "FR-048-02"
      statement: "上孵计划提供需求号筛选条件，采用模糊匹配，输入长度和格式均不限制。"
      source: "module_split_and_change_log"
      source_ref: "模块拆分清单.md REQ-PC-048；需求变动.md REQ-PC-048"
    - id: "FR-048-03"
      statement: "上孵计划承接由孵化需求创建的计划，并保留需求号关联。"
