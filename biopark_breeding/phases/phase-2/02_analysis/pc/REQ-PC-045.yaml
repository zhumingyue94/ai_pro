systematic_boundary_analysis:
  equivalence_and_boundary_candidates:
    - "库存数量：正数、零、计算后不得为负数"
    - "原库存数量：足够、不足、为空或未加载"
    - "本存发苗间发货出库数：零、部分出库、全部出库、超过原库存的异常数据"
    - "存发苗间关联：单个关联、多个按顺序关联、无关联"
    - "查询结果：有数据、无数据、加载失败"
    - "查询条件：默认条件、单条件、多条件、无匹配"
    - "权限：有菜单权限、无菜单权限、无查询权限"
  decision_table_dimensions:
    - "是否存在有效存发苗间关联"
    - "当前库存是否足够"
    - "是否需要继续分配到下一个存发苗间"
    - "原库存与本存发苗间发货出库数是否可计算"
    - "查询是否成功"
    - "是否拥有菜单和查询权限"
  state_transition_candidates:
    - "页面进入 → 默认查询状态"
    - "查询条件设置 → 查询结果"
    - "有结果 → 库存展示"
    - "无结果/加载失败 → 空状态或错误表现"
    - "库存不足 → 关联存发苗间顺序分配"
    - "页面刷新 → 重新加载库存结果"
  pict_parameter_candidates:
    parameters:
      - name: "HatcheryState"
        values: ["Available", "Unavailable", "NotProvided"]
      - name: "StorageRelation"
        values: ["Single", "OrderedMultiple", "None", "NotProvided"]
      - name: "OriginalInventory"
        values: ["Positive", "Zero", "Missing", "NotProvided"]
      - name: "CurrentStorageOutboundQty"
        values: ["Zero", "Partial", "Full", "NotProvided"]
      - name: "CalculatedInventory"
        values: ["Positive", "Zero", "NegativeCandidate", "NotCalculated"]
      - name: "AllocationState"
        values: ["SingleStorage", "ContinueNextStorage", "NoAllocation", "NotProvided"]
      - name: "QueryState"
        values: ["HasData", "Empty", "LoadFailed", "NotExecuted"]
      - name: "PermissionState"
        values: ["MenuAllowed", "MenuDenied", "QueryDenied", "NotProvided"]
      - name: "ViewState"
        values: ["Default", "Expanded", "NotProvided"]
    constraints:
      - "CalculatedInventory = OriginalInventory - CurrentStorageOutboundQty"
      - "CalculatedInventory 不得小于零"
      - "当前存发苗间不足时才进入下一个关联存发苗间"
      - "无菜单权限时页面不可见"
      - "库存为零、无数据、加载失败、权限不足和库存计算异常时显示暂无数据"
      - "其他入库、出库操作属于一期内容，本期不纳入计算"
    design_boundary_status: "analysis_candidate_only; not test cases"
