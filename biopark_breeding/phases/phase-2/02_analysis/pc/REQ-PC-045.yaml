  - id: "FR-045-01"
    statement: "存发苗间库存查询属于 PC 与 APP 共用业务能力。"
    source: "change_log"
    source_ref: "需求变动.md 两端共用需求 / 存发苗间业务能力"
  - id: "FR-045-02"
    statement: "上孵计划确认发货后，自动生成存发苗间出库记录。"
    source: "change_log"
    source_ref: "需求变动.md 雏苗发货与存发苗间联动"
  - id: "FR-045-03"
    statement: "出库数量等于本次发货数量；出入库类型为出库，方式为自动，单位为只。"
    source: "change_log"
    source_ref: "需求变动.md 雏苗发货与存发苗间联动"
  - id: "FR-045-04"
    statement: "出库批次取上孵计划批次，操作人和操作时间取雏苗发货记录，养殖客户取当前园区。"
    source: "change_log"
    source_ref: "需求变动.md 雏苗发货与存发苗间联动"
  - id: "FR-045-05"
    statement: "出库存发苗间由上孵计划关联关系决定；当前存发苗间库存不足时，按关联排列顺序继续分配至下一个存发苗间。"
    source: "change_log"
    source_ref: "需求变动.md 雏苗发货与存发苗间联动"
  - id: "FR-045-06"
    statement: "不允许产生负库存；本期对应存发苗间库存 = 原库存数量 - 本存发苗间发货出库数，其他入库、出库操作属于一期内容。"
    source: "change_log"
    source_ref: "需求变动.md 雏苗发货与存发苗间联动"
  - id: "FR-045-07"
    statement: "REQ-PC-045 是一期已开发、二期无原型的既有库存查询功能延续。"
    source: "module_split"
    source_ref: "模块拆分清单.md REQ-PC-045"
