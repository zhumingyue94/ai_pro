pict_candidate_analysis:
  status: "candidate_only_no_test_cases_generated"
  parameters:
    OrderStatus: ["Pending", "Shipping", "Shipped", "Signed"]
    PlanProgress: ["NotHatched", "Hatched", "Terminated"]
    FilterResult: ["All", "Single", "Multiple", "Empty"]
    HouseScope: ["Overview", "CurrentPlan"]
    ViewMode: ["Grid", "List"]
    PositionSource: ["None", "SinglePlan", "MultiplePlans"]
    RecordState: ["None", "SingleBatch", "MultipleBatches", "Expanded", "Collapsed"]
    FilterAction: ["Initial", "StatusFilter", "KeywordFilter", "Reset", "ClearPositionFilter"]
    PermissionState: ["MenuAndViewAllowed", "MenuDenied", "ViewDenied"]
  constraints:
    - "IF [PermissionState] = MenuDenied THEN detail menu is not visible"
    - "IF [PermissionState] = ViewDenied THEN page operation returns 无操作权限"
    - "IF [PlanProgress] = Terminated THEN the plan is excluded from display, filter, selection and records"
    - "IF [FilterResult] = Empty THEN plan table, house distribution and records show 暂无数据"
    - "IF [FilterAction] = StatusFilter OR KeywordFilter THEN the first valid plan is selected by default"
    - "IF [FilterAction] = Reset THEN all valid plans are restored and the first valid plan is selected"
    - "IF [HouseScope] = Overview THEN all valid plan records are included"
    - "IF [HouseScope] = CurrentPlan THEN only the selected plan records are included"
    - "IF [ViewMode] = List THEN position columns and source-plan information are shown"
    - "All allowed actions are read-only and must not mutate business data"

