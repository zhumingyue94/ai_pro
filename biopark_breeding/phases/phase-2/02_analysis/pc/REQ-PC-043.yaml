    - "库存、出入库及商品禽养殖端签收回写"
    - "具体接口路径、方法、字段、分页和大数据量性能策略"
    - "未开放的孵化排程计划、上孵计划和生产报表管理页面"
    - "需求说明弹窗本身的业务实现"

requirements_facts:
  - id: "FR-043-01"
    statement: "发货单明细页以只读方式展示发货单基础信息、上孵计划、栋舍分布、来源明细和发货记录，数据口径与列表页、发货执行页一致。"
    source: "requirement"
    source_ref: "REQ-003 1.2.3.1"
  - id: "FR-043-02"
    statement: "顶部信息区展示发货单基础字段、计划信息、数量、进度和状态，仅支持返回列表，不提供编辑。"
    source: "requirement"
    source_ref: "REQ-003 1.2.3.2"
  - id: "FR-043-03"
    statement: "上孵计划区展示计划进度、发货进度、待发货数、实际苗重、养殖场、批次、周龄、蛋重、日期和备注，不展示发货操作列。"
    source: "requirement"
    source_ref: "REQ-003 1.2.3.2"
  - id: "FR-043-04"
    statement: "栋舍总览加载全部有效计划记录；当前上孵计划只加载当前计划记录；两种范围切换只改变展示范围，不改变业务数据。"
    source: "requirement"
    source_ref: "需求变动.md REQ-PC-043；REQ-003 1.2.3.2-1.2.3.3"
  - id: "FR-043-05"
    statement: "栋舍分布支持栋舍总览/当前上孵计划和网格/列表两种查看方式；位置列表展示栋舍、列、层、总数量、关联计划数和来源计划。"
    source: "requirement"
    source_ref: "REQ-003 1.2.3.2；page.json 状态证据"
  - id: "FR-043-06"
    statement: "位置行点击明细按钮时显示位置筛选标签，联动筛选发货记录；点击位置格其他区域时显示来源明细弹窗，展示当前位置的上孵计划来源及对应数量。"
    source: "requirement"
    source_ref: "REQ-003 1.2.3.2"
  - id: "FR-043-07"
    statement: "发货记录展示操作时间、上孵计划号、操作人、本次发货数量、位置数、剩余未发货数、位置累计数量和备注，并支持展开批次位置明细。"
    source: "requirement"
    source_ref: "REQ-003 1.2.3.2"
  - id: "FR-043-08"
    statement: "明细页不提供发货、补录、修改、删除或结果提交能力；返回、筛选、视图切换和展开操作均不得修改业务数据。"
    source: "requirement"
    source_ref: "REQ-003 1.2.3.3"
  - id: "FR-043-09"
    statement: "明细入口和查看权限由平台角色的菜单权限、接口权限配置；无菜单权限时菜单不显示，无查看接口权限、加载失败或无数据时页面显示暂无数据。"
    source: "change_log"
    source_ref: "需求变动.md REQ-PC-043；2026.9.3 权限规则"
  - id: "FR-043-10"
    statement: "筛选后默认选择第一条上孵计划，并同步更新栋舍分布和发货记录；清空筛选后恢复全部上孵计划并默认选择第一条。"
    source: "change_log"
    source_ref: "需求变动.md REQ-PC-043"
  - id: "FR-043-11"
    statement: "筛选无数据时，上孵计划表格、栋舍分布和发货记录均显示暂无数据。"
    source: "change_log"
    source_ref: "需求变动.md REQ-PC-043"
  - id: "FR-043-12"
    statement: "雏苗发货执行页面不显示终止的上孵计划。"
    source: "change_log"
    source_ref: "需求变动.md 2026.09.20 13:30 第1条"
    traceability_note: "原始补充仅明确终止计划不显示；不计入总条数、不参与筛选、选择、发货和记录查看属于测试分析扩展，需产品/研发确认。该需求与 PI-043-07（发货单基础信息回读）无直接关系。"
  - id: "FR-043-13"
    statement: "发货记录页的记录范围按当前发货单包含全部有效上孵计划，不受执行页当前选中的单个计划限制；REQ-PC-043 明细页只读承接该结果。"
    source: "requirement"
    source_ref: "REQ-003 1.2.3.2；需求变动.md"
  - id: "FR-043-14"
    statement: "正式明细页面路由为 /biopark-breeding/breeding/delivery/detail/{id}；测试环境地址来源于 .env，具体配置值不写入分析产物。"
    source: "supplemented_requirement"
    source_ref: "用户补充答案 1"

