data_contract:
  source_entities:
    - entity: "雏苗发货单"
      responsibility: "提供顶部基础信息、状态、数量和进度"
      fields: ["发货单基础信息", "计划日期", "栋舍", "品种", "计划上苗数", "实际可发数", "状态", "进度"]
    - entity: "上孵计划"
      responsibility: "提供计划列表、计划进度、发货状态和计划基础信息"
      fields: ["计划号", "计划进度", "发货进度", "待发货数", "实际苗重", "养殖场", "批次", "周龄", "蛋重", "日期", "备注"]
    - entity: "栋舍位置结果"
      responsibility: "提供栋舍总览、当前计划和位置列表展示"
      fields: ["栋舍", "列", "层", "总数量", "关联计划数", "来源计划"]
    - entity: "发货记录"
      responsibility: "提供历史批次和位置明细"
      fields: ["操作时间", "上孵计划号", "操作人", "发货结果", "本次发货数量", "位置数", "剩余未发货数", "位置累计数量", "备注", "位置明细"]
    - entity: "位置来源关系"
      responsibility: "提供当前位置关联的上孵计划及对应数量"
      fields: ["位置", "来源计划", "来源数量"]
  derived_views:
    house_overview: "当前发货单下全部有效计划的位置结果"
    house_current: "当前选中上孵计划的位置结果"
    filtered_plan: "按已应用的计划进度、发货状态和关键字条件展示的有效计划"
    filtered_records: "按当前位置或当前计划联动后的发货记录展示范围"
  query_fields:
    - "发货状态"
    - "计划进度"
    - "上孵计划号关键字"

