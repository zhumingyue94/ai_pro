  equivalence_and_boundary_candidates: ["筛选条件：无条件、单条件、多条件、筛选无结果", "状态卡：全部、待发货、发货中、已发货、已签收", "日期范围：单日、跨日、空日期范围；日期筛选边界由 REQ-PC-041 列表筛选契约承接", "关键字：空、完整匹配、部分匹配、无匹配；长度边界由 REQ-PC-041 列表筛选契约承接", "导出权限：有菜单和导出权限、无菜单权限、无导出接口权限", "确认操作：确认、取消、关闭系统提示", "结果数据：有数据、无数据", "文件属性：发货单.xls、中文文件名、无数据时仅表头"]
  decision_table_dimensions: ["是否显示雏苗发货菜单", "是否拥有导出权限", "是否存在已应用筛选条件", "筛选结果是否为空", "是否点击确认", "是否发生下载"]
  pict_parameter_candidates:
    parameters:
      - name: "MenuPermission"
        values: ["Allowed", "Denied"]
      - name: "ExportPermission"
        values: ["Allowed", "Denied"]
      - name: "FilterState"
        values: ["None", "SingleCondition", "MultipleConditions", "NoResult"]
      - name: "StatusCard"
        values: ["All", "Pending", "Shipping", "Shipped", "Signed"]
      - name: "ConfirmAction"
        values: ["Confirm", "Cancel"]
      - name: "DataState"
        values: ["HasData", "Empty"]
      - name: "FileProperty"
        values: ["ExcelChineseName", "HeaderOnlyWhenEmpty"]
    constraints: ["IF MenuPermission = Denied THEN export entry is not visible", "IF ExportPermission = Denied THEN clicking export shows 没有操作权限 and no download occurs", "IF ConfirmAction = Cancel THEN no download occurs", "IF FilterState = NoResult THEN the same confirmation flow is used and the downloaded 发货单.xls contains headers only", "Export fields, order and display names equal the page table; custom field selection is excluded"]
  design_boundary_status: "analysis_candidate_only; not test cases"
