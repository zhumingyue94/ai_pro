scope:
  in_scope:
    - "从 pc-chick-shipping 列表页进入导出流程"
    - "读取当前已应用的日期、状态卡、栋舍、品种和关键字筛选条件"
    - "点击导出后展示系统确认提示：是否确认导出全部数据项？"
    - "确认后导出当前筛选结果中的全部字段，字段、顺序和显示名称与页面表格一致"
    - "有筛选条件时只导出筛选结果，无筛选条件时导出全部列表数据"
    - "取消确认后关闭提示且不导出数据"
    - "导出文件名固定为发货单.xls"
    - "筛选无数据时仍执行相同确认和导出交互，文件仅包含表头"
    - "导出权限由平台角色菜单/接口权限配置，不写死具体角色"
    - "无导出权限时点击导出显示没有操作权限"
    - "导出操作不得改变列表、状态统计和已应用筛选条件"
  out_of_scope:
    - "自定义字段选择和简版字段方案"
    - "导出配置弹窗中的导出范围选择"
    - "导出结果预览、再次导出和预览关闭"
    - "导出失败、接口超时和重复点击专属反馈；需求变动已标记为不考虑"
    - "具体接口路径、HTTP 方法、请求体、响应体、错误码和文件生成接口契约"
    - "APP 导出和移动端专属规则"
    - "REQ-PC-041 列表筛选、状态统计和分页本身的实现"
    - "发货执行、发货单明细、库存和出入库联动"
