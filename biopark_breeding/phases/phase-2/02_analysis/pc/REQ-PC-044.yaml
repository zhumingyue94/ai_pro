  - id: "FR-044-04"
    statement: "导出列表全部字段，不支持自定义字段；字段、顺序和显示名称均与页面表格一致。"
    source: "change_log"
    source_ref: "需求变动.md REQ-PC-044"
  - id: "FR-044-05"
    statement: "下载文件固定为发货单.xls；字段、顺序和显示名称与页面表格一致。"
    source: "change_log"
    source_ref: "需求变动.md REQ-PC-044"
  - id: "FR-044-06"
    statement: "导出权限由平台角色权限树配置；无导出权限时点击导出显示没有操作权限。"
