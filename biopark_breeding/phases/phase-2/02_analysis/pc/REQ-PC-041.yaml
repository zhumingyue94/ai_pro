requirements_facts:
  - id: "FR-041-01"
    statement: "页面展示由排程计划下发形成的雏苗发货单，并提供组合筛选、状态统计、结果列表、分页以及发货/明细入口。"
    source: "requirement"
    source_ref: "REQ-001 1.2.1.1"
  - id: "FR-041-02"
    statement: "计划发货日期默认当天；结束日期不得早于开始日期。"
    source: "requirement"
    source_ref: "REQ-001 1.2.1.2"
  - id: "FR-041-03"
    statement: "最新需求仅保留全部、待发货、发货中、已发货、已签收状态卡切换，不再提供状态下拉筛选；栋舍和品种提供全部及基础数据选项；关键字同时匹配发货单号和孵化计划号，支持模糊匹配。"
    source: "supplemented_requirement"
    source_ref: "REQ-001 1.2.1.2；用户补充答案 5"
  - id: "FR-041-04"
    statement: "状态统计数量按当前日期、栋舍、品种和关键字条件计算，不重复叠加当前状态卡；数量为零时仍展示对应状态卡。"
    source: "requirement"
    source_ref: "REQ-001 1.2.1.3"
  - id: "FR-041-05"
    statement: "列表展示发货单号、计划发货日期、栋舍、品种、状态、计划上苗数、发货进度、待发货数、计划苗重、创建时间、最后更新时间、孵化计划号和孵化场。"
    source: "requirement"
    source_ref: "REQ-001 1.2.1.4"
  - id: "FR-041-06"
    statement: "实际可发数为关联上孵计划实际出雏总数，未达到已出雏的计划按零处理；已发货数为发货记录数量总和；待发货数为实际可发数减已发货数；实际可发数为零时进度显示为零。"
    source: "requirement"
    source_ref: "REQ-001 术语定义、字段计算规则"
  - id: "FR-041-07"
    statement: "点击查询后使用本次提交条件刷新状态统计、列表和分页，并回到第一页；点击重置后恢复当天、全部状态、全部栋舍、全部品种和空关键字，并回到第一页。"
    source: "requirement"
    source_ref: "REQ-001 1.2.1.5"
  - id: "FR-041-08"
    statement: "列表按计划发货日期升序排序；日期相同时按发货单号升序排序，状态不参与排序。"
    source: "requirement"
    source_ref: "REQ-001 1.2.1.5"
  - id: "FR-041-09"
    statement: "查询、状态卡切换和分页不得修改原始发货单数据。"
    source: "requirement"
    source_ref: "REQ-001 1.2.1.5"
  - id: "FR-041-10"
    statement: "待发货或发货中且已到计划发货日期时显示发货入口；已发货、已签收或未到计划日期时不允许提前发货，明细入口按页面规则保留。"
    source: "requirement"
    source_ref: "REQ-001 表格：状态/条件与操作"
  - id: "FR-041-11"
    statement: "计划发货日期按 YYYY-MM-DD 格式展示和交互，例如 2026-03-13；关键字长度不设业务上限，输入不超过 200 字时不得报错。"
    source: "supplemented_requirement"
    source_ref: "用户补充答案 3"
  - id: "FR-041-12"
    statement: "无结果、接口超时、基础数据加载失败和权限不足时页面不展示数据；权限不足提示“暂无操作权限”。非法日期前端无可输入方式，接口传入非法日期时由后台校验不通过。"
    source: "supplemented_requirement"
    source_ref: "用户补充答案 3-4"
  - id: "FR-041-13"
    statement: "平台通过菜单权限-接口权限权限树为角色配置权限，不在需求中写死角色。导出依赖导出接口权限；无导出权限时点击导出提示“没有操作权限”。发货和明细按钮无独立权限要求，进入后无数据权限时提示“暂无操作权限”并展示暂无数据。"
    source: "supplemented_requirement"
    source_ref: "用户补充答案 1、6、7"
  - id: "FR-041-14"
    statement: "导出对象为当前筛选结果，导出权限沿用平台导出接口权限。"
    source: "supplemented_requirement"
    source_ref: "用户补充答案 7"

