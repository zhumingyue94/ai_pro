    out_of_scope_rule: "out_of_scope_with_owner 必须有 owner_req_id、owner，且不承担本需求的必测目标。"
    downstream_mapping_rule: "测试计划阶段以 coverage_id、planned_item_id、atomic_purpose_id 消费本产物，再生成测试用例并建立 case_ids 映射。"
