    - element_id: "el-btn-row-detail"
      reason: "每行重复按钮；必须按行唯一业务键、表格行文本或正式 data-testid 作用域定位"
  execution_constraints:
    - "自动化规划使用可视浏览器 headless=False"
    - "使用 networkidle 或显式可观察状态等待，不使用固定 sleep 作为稳定性策略"
