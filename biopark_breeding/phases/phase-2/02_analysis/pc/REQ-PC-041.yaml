pict_candidate_analysis:
  status: "candidate_only_no_test_cases_generated"
  parameters:
    PlanDate: ["Today", "Earlier", "Later", "ValidMultiDay", "InvalidEndBeforeStart", "NoMatch"]
    Status: ["All", "Pending", "Shipping", "Shipped", "Signed"]
    House: ["All", "ValidBaseData", "NoMatch"]
    Breed: ["All", "ValidBaseData", "NoMatch"]
    Keyword: ["Empty", "ShipmentOrderMatch", "HatchPlanMatch", "PartialMatch", "NoMatch", "Within200Chars", "Over200Chars"]
    ResultSet: ["SinglePage", "MultiplePages", "Empty"]
    AvailableData: ["ActualAvailableZero", "ActualAvailablePositive", "ShippedZero", "PendingZero"]
  constraints:
    - "IF [ResultSet] = MultiplePages THEN pagination must preserve all applied filters"
    - "IF [Keyword] = Empty THEN keyword filtering must not reduce the result set"
    - "IF [Keyword] = Within200Chars THEN the input must not produce a validation error"
    - "IF [AvailableData] = ActualAvailableZero THEN progress must be 0% and no positive pending quantity may be derived"
    - "Status statistics use the applied date/house/breed/keyword conditions and do not add the selected status as a second aggregation condition"
    - "A future PlanDate must not expose an executable shipping action"

automation_boundary_plan:
  locator_priority:
    - "get_by_role"
    - "get_by_placeholder"
    - "get_by_label"
    - "get_by_text for unique headings or menu labels"
    - "scoped CSS only when semantic locators are unavailable"
  stable_locator_candidates:
    - element_id: "el-filter-keyword"
      preferred: "get_by_placeholder('请输入发货单号或孵化计划号')"
    - element_id: "el-btn-query"
      preferred: "get_by_role('button', name='查询')"
    - element_id: "el-btn-reset"
      preferred: "get_by_role('button', name='重置')"
    - element_id: "el-stats-all"
      preferred: "get_by_role('button', name matching /^全部/)"
    - element_id: "el-stats-pending"
      preferred: "get_by_role('button', name matching /^待发货/)"
    - element_id: "el-stats-shipping"
      preferred: "get_by_role('button', name matching /^发货中/)"
    - element_id: "el-stats-shipped"
      preferred: "get_by_role('button', name matching /^已发货/)"
    - element_id: "el-stats-signed"
      preferred: "get_by_role('button', name matching /^已签收/)"
    - element_id: "el-btn-export"
      preferred: "get_by_role('button', name matching /导出/)"
    - element_id: "el-dialog-export"
      preferred: "get_by_role('dialog', name='导出发货单数据')"
    - element_id: "el-pagination"
      preferred: "get_by_role('list') scoped to pagination; exact implementation to confirm"
  unstable_or_ambiguous:
    - element_id: "el-filter-date-start"
      reason: "antd segmented date input；日期格式已确认 YYYY-MM-DD，优先使用控件交互"
    - element_id: "el-filter-date-end"
      reason: "antd segmented date input；日期格式已确认 YYYY-MM-DD，优先使用控件交互"
    - element_id: "el-filter-house"
      reason: "通用 antd select，需按筛选区域作用域定位"
    - element_id: "el-filter-breed"
      reason: "通用 antd select，需按筛选区域作用域定位"
    - element_id: "el-btn-row-ship"
