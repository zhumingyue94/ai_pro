scope:
  in_scope:
    - "计划管理 / 孵化需求列表的页面范围和只读列表行为"
    - "产业链生产排程系统推送孵化需求后的需求行展示前提"
    - "需求行级创建计划入口及一期上孵计划新增计划弹窗继承关系"
    - "创建计划多步抽屉的页面字段、默认值、明细子表和操作边界"
    - "需求行级查看计划跳转上孵计划及需求号默认回填"
    - "需求号、上孵品种、上孵日期、计划状态等筛选边界候选"
    - "REQ-PC-048 对上孵计划需求号字段和筛选的依赖关系"
    - "page.json 页面、状态、元素 ID、表单、表格和交互链路追溯"
  out_of_scope:
    - "产业链生产排程系统的推送接口实现、协议和重试机制"
    - "上孵计划页面自身的完整新增、编辑、删除、终止、任务下发、导入导出实现"
    - "创建计划暂存后的持久化草稿规则和有效确认后的正式数据落库"
    - "雏苗发货执行、库存扣减、出入库记录和 APP 页面"
    - "数据库字段、接口路径、HTTP 方法、请求/响应体和错误码"
    - "测试点、测试用例、CSV、禅道同步和 UI 自动化脚本"
    - "账号、密码、Token、Cookie、真实业务数据和未经授权的数据变更"

