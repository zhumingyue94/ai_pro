systematic_boundary_analysis:
  equivalence_and_boundary_candidates:
    - "需求列表数据：有数据、无数据、加载失败"
    - "需求号：有效命中、无匹配、空值、重复需求号"
    - "计划状态：草稿、正常、延迟、终止；状态枚举来自 page.json"
    - "分页：第 1 页、中间页、末页、无分页"
    - "行级操作：创建计划、查看计划、无权限或操作不可用"
    - "孵化场：默认值、可选其他值、缺失"
    - "上孵日期：需求行带入、修改后合法、缺失或非法"
    - "明细行：首行自动带入、新增、复制、删除、空行、必填缺失"
    - "创建结果：有效创建成功、校验拦截、暂存、取消关闭、重复操作"
    - "跳转筛选：需求号正确回填、回填后有数据、回填后无数据"
  decision_table_dimensions:
    - "需求行是否存在且可操作"
    - "当前用户是否具备列表/查看/创建权限"
    - "创建入口是否为当前行作用域"
    - "孵化场和上孵日期必填项是否完整"
    - "明细首行自动带入是否成功"
    - "是否执行暂存或确认"
    - "查看计划跳转后需求号是否回填"
    - "回填需求号是否存在关联上孵计划"
  state_transition_candidates:
    - "页面进入 → 默认孵化需求列表"
    - "展开筛选 → 高级筛选展开 → 重置/收起"
    - "需求号筛选 → 命中/无匹配列表"
    - "第 1 页 → 第 2 页 → 上一页返回"
    - "需求行 → 创建计划抽屉第一步 → 第二步明细 → 校验拦截/关闭"
    - "需求行 → 查看计划 → 上孵计划页面 → 需求号回填 → 查询结果"
  pict_parameter_candidates:
    parameters:
      - name: "DemandDataState"
        values: ["HasData", "Empty", "LoadFailed", "NotProvided"]
      - name: "DemandNoFilter"
        values: ["ExactMatch", "NoMatch", "Empty", "DuplicateDemandNo", "NotProvided"]
      - name: "PlanStatus"
        values: ["Draft", "Normal", "Delayed", "Terminated", "NotProvided"]
      - name: "PaginationState"
        values: ["FirstPage", "MiddlePage", "LastPage", "NoPagination", "NotProvided"]
      - name: "UserPermission"
        values: ["ListViewCreateAllowed", "ListOnly", "ViewDenied", "CreateDenied", "MenuDenied"]
