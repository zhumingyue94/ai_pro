business_rules:
  - id: "BR-047-01"
    rule: "孵化需求来源为产业链生产排程系统推送；本阶段不定义推送接口契约"
  - id: "BR-047-02"
    rule: "创建计划是需求列表的逐行操作，行级操作必须保持当前需求行上下文"
  - id: "BR-047-03"
    rule: "创建计划弹窗沿用一期上孵计划新增计划流程；page.json 记录为多步抽屉"
  - id: "BR-047-04"
    rule: "创建计划第一步孵化场为必填且已有默认值；第二步上孵日期为必填，并从需求行带入"
  - id: "BR-047-05"
    rule: "明细子表首行自动带入需求行的品种、周龄、平均蛋重；新增、复制、删除行属于抽屉内交互"
  - id: "BR-047-06"
    rule: "必填项未完整填写时点击确认应被校验拦截，不能产生提交或跳转；本次观察未验证有效确认成功路径"
  - id: "BR-047-07"
    rule: "查看计划跳转目标为上孵计划页面，并自动回填触发需求行的需求号"
  - id: "BR-047-08"
    rule: "需求号回填后查询结果由上孵计划页面数据决定；当前采集状态记录为该需求尚未创建上孵计划时 0 条"
  - id: "BR-047-09"
    rule: "筛选、分页、表头设置和刷新只改变展示范围或页面配置；本次未修改表头配置"

