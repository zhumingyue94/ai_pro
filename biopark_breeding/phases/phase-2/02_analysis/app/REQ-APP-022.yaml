id: REQ-APP-022
title: APP发货执行
source_mapping:
  module_split: REQ-APP-022
  requirements_spec: REQ-006
  priority: P0
scope:
  in_scope: [执行页计划汇总, 上孵计划选择, 列层位置选择, 数量与备注录入, 服务端校验, 发货确认后的刷新和状态更新]
  out_of_scope: [列表筛选, 发货记录查询页面, 存发苗间页面维护]
actors: [现场发货填报人, 发货组长, 场长, 系统管理配置的授权角色]
rules:
  - 发货列、层来自园区基础数据，列和层必须有效选择。
  - 发货数量为正整数且不得超过提交时服务端最新实际可发/待分配数量。
  - 备注最多支持15字；超出15字时前端截断或拒绝提交。
  - 后端必须执行防抖、重复提交和并发最新数量校验，不允许超发。
  - 确认后刷新页面、统计、进度和状态；刷新失败或结果未知时允许重新查询。
  - 成功发货自动生成存发苗间出库记录，数量等于本次发货数量。
page_contract:
  page_id: app-chick-shipment-execute
  route: /m/orders/{发货单号}/execute
  states: [app022-exec-default, app022-ship-dialog, app022-validation-no-quantity, app022-validation-exceed-quantity, app022-validation-no-position, app022-remark-15-limit, app022-execute-shipped, app022-execute-bl02, app022-bl02-ship-dialog]
  element_ids: [exec-page, exec-back, exec-summary-card, exec-progress, exec-stat-actual, exec-stat-accum, exec-stat-pending, plan-list, plan-card-01, plan-card-02, plan-card-03, plan-card-04, plan01-record-btn, plan01-ship-btn, plan02-ship-btn, ship-dialog, ship-dialog-plan-no, ship-dialog-pending, ship-dialog-column, ship-dialog-row, ship-dialog-accum, ship-dialog-quantity, ship-dialog-remark, ship-dialog-cancel, ship-dialog-confirm, ship-dialog-error-no-qty, ship-dialog-error-exceed, ship-success-toast, ship-dialog-remark-truncated]
interface_contract:
  request_fields: [发货单标识, 上孵计划标识, 列, 层, 数量, 备注]
  server_rules: [最新实际可发数量, 正整数, 防重复提交, 并发校验, 不允许负库存]
  response_effects: [发货记录, 统计刷新, 进度刷新, 状态刷新, 自动出库]
boundaries:
  quantity: [空, 0, 负数, 小数, 正整数下限, 等于待发, 超过待发, 并发后超发]
  position: [空列, 空层, 园区基础数据有效列层, 任意有效列层]
  remark: [空, 15字以内, 15字, 超过15字截断/拒绝]
risks:
  - 原型允许默认列层提交，与列层必选规则冲突。
  - 成功提示与服务端落库结果不一致。
  - 重复点击或并发导致超发或重复出库。
dependencies: [园区列层基础数据, 发货单服务, 上孵计划服务, 存发苗间库存服务, 外部签收/业务状态服务]
environment_data:
  prerequisites: [授权角色, 待分配数量大于零的计划, 有效列层, 可核对的库存关联]
  mutation_boundary: 确认发货属于业务数据变更；责任人为授权发货操作人和测试数据负责人，必须记录请求结果、清理责任及清理状态。
security: 不记录账号、密码、Token、Cookie 或未经授权业务数据。
evidence: page_inventory/page.json
open_questions: [接口幂等键和刷新失败重查协议, 列层空值后端错误码, 自动出库分配明细返回契约]
