id: REQ-APP-023
title: APP发货单发货记录
source_mapping:
  module_split: REQ-APP-023
  requirements_spec: REQ-007
  page_mapping_note: 页面清单相关状态存在 app023/app024 编号交叉，以业务模块映射文件为准
  priority: P1
scope:
  in_scope: [当前发货单全部发货记录, 空状态, 提交时间倒序, 记录汇总和位置明细, 返回条件保留, 大数据量加载行为]
  out_of_scope: [创建发货记录, 修改记录, 库存维护, 外部签收处理]
actors: [现场发货填报人, 发货组长, 场长, 授权查询角色]
rules:
  - 展示当前发货单全部有效发货记录，按提交时间倒序。
  - 展示发货单号、累计发货、记录数量、计划号、本次数量、剩余未发和位置明细。
  - 默认折叠3条，点击展开全部展示全部有效或历史记录；返回列表保留日期、栋舍、状态、搜索关键字和页签。
  - 大数据量查询不得长时间阻塞页面。
page_contract:
  page_id: app-plan-shipment-records
  states: [app023-records-empty, app023-records-populated]
  element_ids: [pending-page, shipping-records, record1-status, record1-pos1, shipped-record, record-complete, position-detail]
  mapping_note: page.json的页面结构与REQ-APP-024共享，需通过发货单上下文和状态确认归属
interface_contract:
  request_fields: [发货单标识]
  response_fields: [发货单号, 累计发货, 记录数量, 上孵计划号, 本次数量, 剩余未发, 位置明细, 提交时间]
  assumptions: [服务端分页/分段加载策略待确认, 排序由服务端或明确客户端统一实现]
boundaries:
  - 空记录、1-3条、超过3条、全部记录。
  - 多位置记录、位置累计数量、时间相同记录排序。
risks:
  - 原型默认全部展开且无展开/折叠控件，与需求变动冲突。
  - 页面清单状态编号交叉造成追踪误判。
  - 大数据量加载阻塞或记录顺序不稳定。
dependencies: [雏苗发货记录服务, 上孵计划服务, 列层基础数据, 列表筛选条件上下文]
environment_data:
  prerequisites: [授权查询角色, 空记录和多记录数据集]
  mutation_boundary: 本模块只读，不执行数据变更；若使用联调记录，测试数据负责人负责清理并记录状态。
security: 不记录账号、密码、Token、Cookie 或未经授权业务数据。
evidence: page_inventory/page.json; page_inventory/lanhu_page_mapping/REQ-APP-023_lanhu_page_mapping.json
