- id: TC-APP-022-010
  title: 重复提交同一发货动作时仅产生一次业务结果
  type: interface
  auto: auto
  priority: P3
  feature: 发货数量校验
  common_preconditions_ref: app_shipment_execution_access
  coverage_ids:
  - COV-APP022-QTY-LATEST
  - COV-APP022-QTY-ATOMIC
  plan_item_ids:
  - PLAN-APP022-QTY-LATEST
  atomic_purpose_ids:
  - AP-APP022-QTY-LATEST-REPEAT
  preconditions:
  - 已准备目标发货单 FD-APP022-BASE 和目标上孵计划 PLAN-APP022-BASE；提交前待分配数量 R=4200，库存数量 I=5000；有效列
    A、层 1；本次发货数量 q=100
  - 已准备待分配数量大于零且库存充足的上孵计划
  - 已通过独立数据夹具准备待分配数量已减少的初始状态；不将运行时成功结果写入静态前置条件
  steps:
  - action: 在「发货执行」页点击上孵计划卡片的「发货」按钮
    expected: 弹出标题为"确认发货"的弹窗
    target_element_id: ship-dialog
    locator_ref:
      element_id: ship-dialog
      strategy: role
      value: dialog
  - action: 在「确认发货」弹窗选择列 A、层 1，输入发货数量 100
    expected: 弹窗字段显示列 A、层 1、发货数量 100，且未显示数量校验错误
  - action: 首次点击「确认提交」按钮
    expected: 页面显示提交成功反馈；真实服务端提交未执行，自动化状态保持 blocked
  - action: 立即再次点击同一发货动作的「确认提交」按钮
    expected: 页面不产生第二次成功业务结果；具体幂等反馈文案待服务端契约确认，自动化状态保持 blocked
  - action: 重新查询目标发货单并读取库存数量
    expected: 库存数量应为 4900，即提交前库存 I=5000 仅扣减一次 q=100
    target_element_id: ship-dialog-confirm
    locator_ref:
      element_id: ship-dialog-confirm
      strategy: text
      value: 确认提交
  - action: 重新查询目标上孵计划并读取待分配数量
    expected: 待分配数量应为 4100，即提交前待分配数量 R=4200 仅扣减一次 q=100
    target_element_id: ship-dialog-confirm
    locator_ref:
      element_id: ship-dialog-confirm
      strategy: text
      value: 确认提交
  - action: 重新查询统计区域累计发货
    expected: 累计发货相较提交前基线仅增加 q=100，不重复累加
  - action: 查询本次发货关联的出库记录
    expected: 仅生成一条出库记录，数量与发货数量 q=100 一致；不重复生成出库记录
