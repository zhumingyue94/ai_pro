- id: TC-APP-022-011
  title: 并发提交按最新待发货数校验并阻止超发
  type: interface
  auto: auto
  priority: P1
  feature: 发货数量校验
  common_preconditions_ref: app_shipment_execution_access
  coverage_ids:
  - COV-APP022-QTY-LATEST
  - COV-APP022-QTY-ATOMIC
  - COV-APP022-CONCURRENCY-OVER
  plan_item_ids:
  - PLAN-APP022-QTY-LATEST
  - PLAN-APP022-QTY-ATOMIC
  - PLAN-APP022-QTY-EMPTY
  atomic_purpose_ids:
  - AP-APP022-CONCURRENT-ONCE
  - AP-APP022-QTY-CONCURRENT-BOUNDARY
  - AP-APP022-SR-051-97
  - AP-APP022-DT-CONCURRENCY-OVER
  preconditions:
  - 已准备目标发货单 FD-APP022-BASE 和目标上孵计划 PLAN-APP022-BASE；提交前待分配数量 R=4200，库存数量 I=5000；有效列
    A、层 1。
  - 已准备同一上孵计划、两个授权发货账号和可控并发测试窗口。
  - 场景一中两个账号各提交 q=100，场景二设置后提交账号的 q 大于并发操作后的最新待发货数，并保留可回读的待发货数、发货记录和库存基线。
  steps:
  - action: 使用两个授权发货账号并行打开小程序首页，切换到正确的孵化场，点击雏苗发货板块下的「雏苗发货」
    expected: 两个账号均进入雏苗发货首页（雏苗发货列表页），页面标题为“雏苗发货”
  - action: 两个账号并行在目标发货单卡片点击「去发货」
    expected: 两个账号均到达发货执行页
  - action: 场景一中两个账号同时填写有效列层和 q=100 并点击「确认提交」
    expected: 后提交请求在最新待发货数仍足够时成功；前后提交合计不超过最新待发货数，最多生成两条对应发货记录，待发货数量按实际成功数量扣减且库存保持非负。
    target_element_id: ship-dialog-confirm
    locator_ref:
      element_id: ship-dialog-confirm
      strategy: text
      value: 确认提交
  - action: 场景二中先让一个账号成功扣减待发货数，再由后提交账号填写大于最新待发货数的 q 并点击「确认提交」
    expected: 后提交请求因 q 超过最新待发货数被阻止，页面显示待发货数不足或超发提示；不生成超出最新待发货数的发货记录，待发货数量、库存和既有成功记录保持一致。
  trace:
    req: REQ-APP-022
    project: 种禽孵化管理系统
    version: 6
    status: two_concurrency_scenarios
    tp: TEST_PLAN-REQ-APP-022
    source_review: REV_CASE_REQ-APP-022
    overlap_repair:
      decision: merge
      merged_from:
      - TC-APP-022-051
