- id: TC-APP-022-003
  title: 确认发货弹窗对零值、负数和小数发货数量统一阻止提交
  type: feature
  auto: auto
  priority: P2
  feature: 发货确认弹窗
  common_preconditions_ref: app_shipment_execution_access
  coverage_ids:
  - COV-APP022-QTY-EMPTY
  - COV-APP022-POSITION-REQUIRED
  - COV-APP022-QTY-ZERO
  - COV-APP022-QTY-NEGATIVE
  - COV-APP022-QTY-NONNUMERIC
  plan_item_ids:
  - PLAN-APP022-QTY-EMPTY
  - PLAN-APP022-POSITION-REQUIRED
  atomic_purpose_ids:
  - AP-APP022-QTY-INVALID-NO-SUBMIT
  preconditions:
  - 授权发货角色可用
  - 已准备待分配数量大于零的上孵计划
  steps:
  - action: 在「发货执行」页点击上孵计划卡片的「发货」按钮
    expected: 弹出标题为"确认发货"的弹窗
    state_id: app022-ship-dialog
    target_element_id: ship-dialog
    locator_ref:
      element_id: ship-dialog
      strategy: role
      value: dialog
  - action: 在「发货数量」输入0并点击「确认提交」
    expected: 输入 0 并点击确认提交后，显示“发货数量需为大于 0 的整数”提示，弹窗保持打开，提交被阻止，发货单、计划、库存和出库记录不变。
    state_id: app022-validation-no-quantity
    target_element_id: ship-dialog-error-no-qty
    locator_ref:
      element_id: ship-dialog-error-no-qty
      strategy: text
      value: 发货数量需为大于 0 的整数
  - action: 在「发货数量」输入负数并点击「确认提交」
    expected: 输入负数后点击确认提交，显示“发货数量需为大于 0 的整数”提示，弹窗保持打开，提交被阻止，发货单、计划、库存和出库记录不新增或扣减。
    state_id: app022-validation-no-quantity
    target_element_id: ship-dialog-error-no-qty
    locator_ref:
      element_id: ship-dialog-error-no-qty
      strategy: text
      value: 发货数量需为大于 0 的整数
  - action: 在「发货数量」输入小数并点击「确认提交」
    expected: 输入小数后点击确认提交，显示“发货数量需为大于 0 的整数”提示，弹窗保持打开，提交被阻止，发货单、计划、库存和出库记录不新增或扣减。
    state_id: app022-validation-no-quantity
    target_element_id: ship-dialog-error-no-qty
    locator_ref:
      element_id: ship-dialog-error-no-qty
      strategy: text
      value: 发货数量需为大于 0 的整数
  trace:
    req: REQ-APP-022
    project: 种禽孵化管理系统
    version: 4
    status: designed_after_responsibility_split_v2
    tp: TEST_PLAN-REQ-APP-022
