  title: 查看有效上孵计划时展示计划字段和出雏结果
  type: feature
  auto: auto
  priority: P2
  feature: 上孵计划字段展示
  preconditions:
  - 已准备一个包含字段基线完整有效上孵计划的孵化需求
  - 该孵化需求已创建上孵计划，并已生成关联发货单
  - 测试账号具备访问「计划管理-上孵计划」和「计划管理-雏苗发货」菜单及查看详情的权限
  steps:
  - action: 使用已分配所需权限的测试账号登录系统
    expected: 登录成功，进入系统门户或应用入口页
  - action: 打开应用门户并选择「种禽孵化管理系统」
    expected: 进入种禽孵化管理系统主框架，页面显示系统名称或应用标识：智孵管家管理平台
  - action: 在左侧菜单中展开「计划管理」，点击「上孵计划」菜单项
    expected: 进入上孵计划列表页，页面显示计划号搜索框和上孵计划表格
  - action: 在上孵计划列表中定位目标上孵计划，记录其孵化需求号、上孵计划号、计划进度、发货状态、发货进度、待发货数、实际苗重、种禽养殖场、养殖批次、周龄、平均蛋重、蛋重类型、产蛋日期、出雏时间和备注
    expected: 成功记录目标上孵计划的孵化需求号、上孵计划号及其他计划字段值，作为后续核对的基线数据
  - action: 在左侧菜单中展开「计划管理」，点击「雏苗发货」菜单项
    expected: 进入雏苗发货列表页，页面显示发货日期筛选条件和单号搜索框
  - action: 在发货日期筛选条件中选择从今天往前半年的时间范围
    expected: 发货日期起始时间设置为今天前六个月，结束时间设置为今天，筛选条件显示的日期区间正确
  - action: 在单号搜索框输入前面记录的孵化需求号并执行查询
    expected: 查询结果展示与该孵化需求号关联的目标发货单
  - action: 定位目标发货单并点击「明细」
    expected: 进入目标发货单明细页面，页面显示发货单信息、上孵计划、栋舍分布和发货记录区域
  - action: 查看发货记录区域的上孵计划表格
    expected: 页面显示上孵计划搜索框及上孵计划记录列表，列表可能包含多条上孵计划记录
  - action: 在发货记录区域的上孵计划搜索框中输入前面记录的上孵计划号并执行查询
    expected: 发货记录列表展示或明确定位到与该上孵计划号匹配的目标上孵计划记录
  - action: 核对查询结果中的目标上孵计划号
    expected: 查询结果中的上孵计划号与前面在「计划管理-上孵计划」页面记录的上孵计划号一致
  - action: 查看目标上孵计划记录中的计划字段
    expected: 目标记录显示计划号、计划进度、发货状态、发货进度、待发货数、实际苗重、种禽养殖场、养殖批次、周龄、平均蛋重、蛋重类型、产蛋日期、出雏时间和备注
  - action: 将目标上孵计划记录中的计划字段与前面记录的上孵计划基线逐项对照
    expected: 各字段名称、列顺序和字段值与基线一致；实际苗重、平均蛋重、蛋重类型、产蛋日期和出雏时间按正式字段口径展示；页面没有发货操作入口
