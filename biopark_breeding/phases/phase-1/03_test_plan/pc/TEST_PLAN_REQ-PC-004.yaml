  - "02_analysis/pc/REQ-PC-004.yaml"
trace:
  story: null
  req: REQ-PC-004
  project: "种禽孵化管理系统"
  version: 1
  status: draft
objective: "基于 PC 端原型需求说明书和 REQ-PC-004 分析结果，规划 孵化管理 / 种蛋照蛋 的测试范围、策略、环境、数据、风险、准入/准出和 Smoke/Targeted/Full 套件；不生成测试点或测试用例。"
scope:
  in_scope:
    - "依据分析文件覆盖 3 个观察页面和 12 组页面板块规格，规划页面、字段、状态、交互和数据一致性。"
    - "分析摘要：孵化管理 / 种蛋照蛋基于当前 PC 5500 原型与需求章节重新分析。"
    - "覆盖 L1 页面/弹窗/Tab、L2 字段/列/按钮/状态、L3 数据正确性/回读/跨模块一致性规划。"
  out_scope:
    - "未由需求文档、分析 YAML 或实际执行证据确认的页面、接口、角色、权限和业务结论。"
    - "测试点、测试用例、CSV、注册表、UI 自动化脚本、远程同步和实际业务数据写入。"
strategy:
  - "以需求和页面契约为基线，采用黑盒、正向/负向、边界、状态、权限、集成和回归规划。"
  - "按 L1/L2/L3 分层覆盖；复杂页面按页面板块、弹窗、Tab 和字段组拆分覆盖方向。"
  - "以分析文件中的观察页面和页面板块规格为准，不扩展未观察到的页面事实。"
environment:
  client: "PC Web"
  os: "以项目测试环境实际配置为准"
  browser: "使用项目环境指定的受支持浏览器，执行前记录版本"
  base_url: "${UI_TEST_URL}"
  page_path: "孵化管理 / 种蛋照蛋"
  portal_entry: "种禽孵化管理系统"
  login: "使用测试账号登录；凭据仅从项目根目录 .env 读取"
data:
  required:
    - "合成或项目批准的正常、空、边界、重复、非法和跨模块关联数据"
    - "模块依赖的基础数据、状态数据和可回读记录"
  preparation: "执行前准备自然唯一键数据；创建型数据记录清理状态；不在产物中写入账号、密码、Token、Cookie 或真实敏感数据。"
roles:
  - "分析文件未提供完整角色矩阵；执行前使用已批准的测试角色，不猜测权限。"
dependencies:
  - "REQ-PC-003"
  - "REQ-PC-033"
  - "live prototype"
priority: "P0-04"
risks:
  - "静态需求/原型证据不能证明真实接口、权限、异常提示、字段校验和持久化行为。"
  - "分析文件登记 2 项风险、1 项待确认项，其中 1 项为阻塞项。"
open_questions:
  - "真实接口、权限、异常提示、字段校验和持久化回读规则需在执行前确认。"
entry_criteria:
  - "PC 端需求说明书和对应分析 YAML 可读取、可解析，且 REQ-ID 一致。"
  - "范围、依赖、角色、环境和测试数据已准备，或阻塞项已明确登记。"
  - "未确认事实不得以猜测替代。"
exit_criteria:
  - "范围内/范围外、策略、环境、数据、角色、依赖、优先级和风险均已规划。"
  - "准入/准出、证据要求及 Smoke/Targeted/Full 套件建议完整。"
  - "所有阻塞和待确认项已解决，或在阶段交接中明确传递。"
evidence:
  - "执行阶段保留关键页面/区域截图、控制台或接口日志及必要的结果回读证据，并脱敏。"
  - "涉及写操作时记录前后状态、清理状态和清理回读；本阶段不执行写操作。"
suites:
  Smoke: "规划模块入口、核心页面板块、最高风险查询/主流程和关键状态可达性。"
  Targeted: "规划业务规则、边界值、异常、角色权限、跨模块依赖和数据回读。"
  Full: "规划全部页面板块、字段、状态、正负向、边界、集成和回归影响。"
next_stage: "testcase-generation-agent"

