plan_id: TEST_PLAN-REQ-APP-001
title: App 测试计划 - 首页
status: draft
source_inputs:
- 01_requirements/app/种禽孵化管理系统-APP端原型需求说明书.docx
- 02_analysis/app/REQ-APP-001.yaml
- config.yaml
trace:
  story: null
  req: REQ-APP-001
  project: 种禽孵化管理系统
  version: 1
  status: draft
objective: 基于 App 端原型需求说明书、REQ-APP-001 分析 YAML 和项目配置，规划 首页 的测试范围、策略、环境、数据、风险、准入/准出、证据和 Smoke/Targeted/Full 套件；不生成测试点或测试用例。
scope:
  in_scope:
  - 分析摘要：APP 首页导航与工作台入口的页面契约，依据 P001 需求页表、实时原型和已留存 Axure 证据整理。
  - 页面板块规划：P001 首页（证据：observed+static）；入口/返回：原型根入口 http://127.0.0.1:5500/；DOCX 页面表 P001。；从各模块入口返回首页的路径在静态页面链接中存在；返回手势/返回按钮未在
    P001 明确观察到。；查询区：当前孵化场/养殖场切换选择器；不是业务查询区，具体绑定关系未明确。；列表/卡片：孵化任务入口（种蛋上孵、种蛋照蛋、种蛋出雏）；合格蛋蛋库、二级蛋蛋库、孵化器、出雏器、存发苗间、次品库入口；库存查询、出入库记录、盘点记录、仓库全景等子入口；可见待执行提示数字
    6、3。；表单：场区选择器可见选项为“一号孵化场/二号孵化场/三号孵化场”和“养殖场一号/养殖场二号/养殖场三号”；未观察到登录表单或业务提交表单。；弹窗：未观察到实际弹窗；图文公告区和常用功能区在原型注释中标记为功能待定/一期可不做。；按钮/动作：孵化任务、库存/设备/苗间菜单跳转；底部“工作台”“我的”固定入口；设置、通讯录、占位入口可见；未执行任何业务动作。；状态：默认展示第一个孵化场的注释为
    static；模块展示受账号配置菜单权限的注释为 static；底部入口存在选中效果注释为 static；具体状态转换未观察到。
  - 按 L1 页面/弹窗/Tab、L2 字段/列/按钮/状态、L3 可观察值/计算关系/跨模块一致性规划覆盖。
  out_scope:
  - 登录、权限后端实现、公告/通讯录业务、库存和任务内部页面、真实接口、数据库持久化。
  - 新增、编辑、删除、入库、出库、任务执行及任何远程业务写操作。
  - 未由需求文档、分析 YAML 或可验证证据确认的接口、权限、异常、状态和持久化结论。
  - 测试点、测试用例、CSV、禅道数据、注册表、UI 脚本和本阶段实际业务写入。
strategy:
- 以需求文档和分析 YAML 的页面契约及证据等级为基线，采用黑盒测试规划。
- 按页面/板块覆盖入口与返回、字段/列/指标、按钮/动作、状态、空态、异常和跨模块一致性；不把 inferred/open_question 写成确认事实。
- 结合正向、负向、边界、查询/搜索/筛选、权限和回读方向；真实写操作仅在后续授权和契约确认后规划。
environment:
  client: App
  os: 以项目测试环境实际配置为准
  browser: 使用项目指定的移动端运行容器/浏览器，执行前记录版本
  base_url: ${UI_TEST_URL}
  page_path: 首页
  portal_entry: 种禽孵化管理系统
  login: 使用测试账号登录；凭据仅从项目根目录 .env 或系统环境读取，不写入计划
data:
  required:
  - 与分析页面/板块对应的正常、空结果、边界、状态和跨模块关联数据
  - 执行前批准的测试角色与只读数据；不在计划中写入真实账号或敏感值
  - 本阶段仅规划验证，不执行远程业务写入
  preparation: 执行前准备自然唯一键和可回读数据；数据清理遵循 config.yaml 的 cleanup_status= pending_user_confirmation；不得在计划中写入账号、密码、Token、Cookie
    或持久化登录状态。
roles:
- 测试：按计划执行并保存脱敏证据。
- 产品/研发：确认接口、权限、状态、异常、字段和持久化待确认项。
- 测试设计：在计划通过后生成后续测试设计产物。
dependencies:
- REQ-APP-002（关系：首页入口；证据：observed+static）
- REQ-APP-003（关系：首页入口；证据：observed+static）
- REQ-APP-004（关系：首页入口；证据：observed+static）
- app / 合格蛋库、二级蛋库、孵化器、出雏器、存发苗间、次品库（关系：首页菜单入口；未分配本次 REQ；证据：observed+static）
- 接口/交互 UI-APP-HOME-NAV（方向：未提供；证据：observed+static）
- 接口/交互 UI-APP-SITE-SWITCH（方向：未提供；证据：observed+static）
priority: P0-P2（核心入口/主链路优先）
risks:
- 开放问题风险：场区切换器的“孵化场”和“养殖场”是否为同一上下文，切换后哪些首页数据和下游列表必须刷新？（影响：影响首页状态、下游接口参数和返回后的上下文保持。）
- 开放问题风险：菜单权限由哪个权限接口提供，隐藏、禁用和无权限提示分别如何表现？（影响：影响入口渲染与权限验收。）
- 开放问题风险：图文公告、常用功能、通讯录、全景图和占位入口一期是否实现，若实现其数据源和空态是什么？（影响：影响首页范围和页面验收。）
- 开放问题风险：首页待执行数字 6、3 的统计口径、刷新时机和离线/接口异常表现是什么？（影响：影响提示一致性和异常规则。）
open_questions:
- 场区切换器的“孵化场”和“养殖场”是否为同一上下文，切换后哪些首页数据和下游列表必须刷新？（影响：影响首页状态、下游接口参数和返回后的上下文保持。）
- 菜单权限由哪个权限接口提供，隐藏、禁用和无权限提示分别如何表现？（影响：影响入口渲染与权限验收。）
- 图文公告、常用功能、通讯录、全景图和占位入口一期是否实现，若实现其数据源和空态是什么？（影响：影响首页范围和页面验收。）
- 首页待执行数字 6、3 的统计口径、刷新时机和离线/接口异常表现是什么？（影响：影响提示一致性和异常规则。）
entry_criteria:
- DOCX、对应分析 YAML 和项目配置可读取，且 REQ-ID、平台和模块身份一致。
- 范围、页面/板块、依赖、风险和待确认项已记录；未确认事实不得用猜测替代。
- 测试环境、角色、数据和证据保存方式已准备，或阻塞项已明确登记。
exit_criteria:
- 范围/非范围、策略、环境、数据、角色、依赖、优先级、风险和证据要求完整。
- Smoke、Targeted、Full 三类套件建议完整，且不包含测试用例步骤或测试点编号。
- YAML 已通过 test-plan.schema.json 校验，Markdown 与 YAML 的关键内容一致。
- 未解决的高风险开放问题已确认、转为阻塞或在阶段交接中保留。
evidence:
- 执行阶段保留与 REQ、页面/板块和运行标识可追溯的截图、结果、DOM/网络/控制台/Trace 证据（按需）。
- 证据脱敏，不保存账号、密码、Token、Cookie 或持久化登录状态。
- 写操作如获授权，记录前后状态、清理状态和清理回读；本阶段不执行写操作。
suites:
  Smoke: 规划模块入口、核心页面/板块、主链路和最高风险状态的快速可达性。
  Targeted: 规划受变更影响的页面板块、字段、查询/筛选、边界、异常、权限、依赖和数据回读。
  Full: 规划本 REQ 全部页面板块、字段、状态、正负向、边界、集成、兼容性和已确认的回归影响。
next_stage: testcase-generation-agent
