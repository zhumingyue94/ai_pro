objective: 基于 App 端原型需求说明书、REQ-APP-005 分析 YAML 和项目配置，规划 合格蛋库 / 库存查询 的测试范围、策略、环境、数据、风险、准入/准出、证据和 Smoke/Targeted/Full 套件；不生成测试点或测试用例。
scope:
  in_scope:
  - 库存查询主流程及其搜索、筛选、筛选结果、库位详情页面契约。
  - 页面板块规划：P026 蛋库列表（证据：observed,static,inferred,open_question）；入口/返回：入口 首页的合格蛋蛋库-库存查询入口指向蛋库列表；页面表将首页列为入口。；返回 页面树/静态链接可返回首页；原型未观察到可复现的真实页面内点击导航。；查询区：搜索、筛选、全景、库位状态：全部（66）、空位（5）、未满（53）、满容（53）、超容（3）、停用（5）；列表/卡片：普通库位卡片：库位号、养殖场-批次-品种、周龄、蛋重/蛋重类型、产蛋日期、蛋数、库位状态、种蛋状态。、空位：库位号、空位状态、种蛋数量
    0。、停用：库位号、停用/空位表现、种蛋数量 - -；不可进入详情。、拼车：主库位显示库位号、拼车种类数/库位总数、库位状态；子库位显示种蛋信息。；按钮/动作：搜索、筛选、全景、入库、盘点、记录、批量入库、批量盘点、右滑、普通/空位库位右滑：记录、盘点、入库；记录带库位
    ID 进入记录查询，盘点/入库进入操作页。、拼车主库位：记录、入库；点击主库位展开/收缩，不进入详情；拼车子库位：盘点并进入详情。；状态：全部、空位、未满、满容、超容、停用、待排期、待孵期、待上孵、已超期
  - 页面板块规划：P028 蛋库库位详情（证据：observed,static,inferred,open_question）；入口/返回：入口 由 P026 普通库位或拼车子库位进入；停用库位无详情。；返回 返回蛋库列表；入库/盘点为操作页入口，实际返回刷新策略仅有静态注释。；列表/卡片：库位信息、种蛋信息、当前库存、托盘数、散装数、库位状态、仓库、库位、孵化场、关联计划；按钮/动作：入库、盘点、复制、展开/收缩关联计划、复制计划号；状态：未满、空位、满容、超容、待上孵
  - 页面板块规划：P029 种蛋搜索（证据：observed,static,inferred,open_question）；入口/返回：入口 由 P026 的搜索入口进入；页面表也列出返回蛋库列表及详情/操作相关静态链接。；返回 有结果进入库存结果列表，空结果展示无库存；返回路径未在实时点击中验证。；查询区：搜索输入框、搜索、历史搜索、计划号、库位号、养殖场、批次、品种；按钮/动作：搜索、选择历史搜索词、进入库位详情、入库、盘点、返回蛋库列表；状态：搜索有结果、搜索无结果
  - 页面板块规划：P030 种蛋筛选（证据：observed,static,inferred,open_question）；入口/返回：入口 由 P026 的筛选入口进入。；返回 确认进入 P031 筛选结果，重置恢复默认筛选；实际点击未执行。；查询区：库位状态：全部/空位/满容/超容/停用、种蛋状态：待排期/待孵期/待上孵/已超期、上孵日期、养殖场、品种、蛋重类型、确认、重置；表单：上孵日期范围、养殖场选择、品种选择、蛋重类型选择、库位状态选择、种蛋状态选择；按钮/动作：确认、重置、进入筛选结果、返回搜索/列表；状态：全部、空位、满容、超容、停用、待排期、待孵期、待上孵、已超期
  - 页面板块规划：P031 筛选结果（证据：observed,static,inferred,open_question）；入口/返回：入口 由 P030 确认进入；也可由静态页面链接返回搜索、筛选或列表。；返回 可返回蛋库列表、搜索、筛选或进入库位详情；真实页面内导航未观察到。；查询区：搜索、筛选、全景、合格蛋仓库一号；按钮/动作：搜索、筛选、全景、入库、盘点、记录、进入库位详情、返回蛋库列表；状态：空位、未满、满容、超容、停用、待孵期、待上孵、已超期
  - 按 L1 页面/弹窗/Tab、L2 字段/列/按钮/状态、L3 可观察值/计算关系/跨模块一致性规划覆盖。
  out_scope:
  - P027 蛋库缩略（作废）；入库、盘点确认表单的执行提交；接口实现、权限实现、数据持久化实现。
  - 未由需求文档、分析 YAML 或可验证证据确认的接口、权限、异常、状态和持久化结论。
  - 测试点、测试用例、CSV、禅道数据、注册表、UI 脚本和本阶段实际业务写入。
strategy:
- 以需求文档和分析 YAML 的页面契约及证据等级为基线，采用黑盒测试规划。
- 按页面/板块覆盖入口与返回、字段/列/指标、按钮/动作、状态、空态、异常和跨模块一致性；不把 inferred/open_question 写成确认事实。
- 结合正向、负向、边界、查询/搜索/筛选、权限和回读方向；真实写操作仅在后续授权和契约确认后规划。
