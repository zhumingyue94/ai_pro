risks:
- 开放问题风险：合格蛋库与二级蛋库是否共用记录页面并通过库 ID/类型隔离？（影响：high）
- 开放问题风险：入库/出库记录与任务、库存、盘点的关联键及一致性规则是什么？（影响：high）
- 开放问题风险：自动/手动、原因枚举、计划号必填条件和记录可见权限是什么？（影响：high）
- 开放问题风险：日期范围、分页、排序、模糊搜索、空结果和接口异常如何处理？（影响：medium）
- 开放问题风险：是否允许撤销/冲正记录，详情是否可导出或复制全部字段？（影响：medium）
