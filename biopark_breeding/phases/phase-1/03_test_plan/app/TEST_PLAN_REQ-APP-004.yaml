objective: 基于 App 端原型需求说明书、REQ-APP-004 分析 YAML 和项目配置，规划 种蛋出雏 的测试范围、策略、环境、数据、风险、准入/准出、证据和 Smoke/Targeted/Full 套件；不生成测试点或测试用例。
scope:
  in_scope:
  - 分析摘要：种蛋出雏任务列表、搜索、筛选、详情和执行流程的 APP 页面契约。
  - 页面板块规划：P018 出雏任务列表（证据：observed+static）；入口/返回：首页“种蛋出雏”入口。；首页→列表；进入搜索、筛选、详情、执行，返回来源列表。；查询区：搜索种蛋出雏任务、筛选入口、待执行/已完成/已取消/已超期状态切换。；列表/卡片：养殖场-批次-品种、计划出雏日期、出雏数量、种蛋类型、周龄、平均蛋重/蛋重类型、产蛋日期、出雏器名称、状态；待执行出雏数按照蛋任务受精结果展示的注释为
    static。；表单：不适用。；弹窗：筛选入口可进入 P020；实际弹窗形态未确认。；按钮/动作：搜索、筛选、执行、查看、卡片查看、出雏器全景入口。；状态：待执行/已完成/已取消；待执行超时为已超期告警。
  - 页面板块规划：P019 出雏任务搜索（证据：observed+static）；入口/返回：P018 搜索入口。；返回 P018；结果进入 P022/P023/P024/P025。；查询区：计划号/任务号/养殖场/批次/品种关键字；历史搜索和搜索按钮。；列表/卡片：出雏结果卡片，显示照蛋/出雏数量、出雏器、状态及执行/查看。；表单：搜索输入；搜索历史最多三行的注释为
    static。；弹窗：未观察到。；按钮/动作：搜索、历史项、垃圾筐删除、执行/查看、卡片查看。；状态：有结果/无结果；待执行、已超期、已完成、已取消排序规则为 static。
  - 页面板块规划：P020 出雏任务筛选（证据：observed+static）；入口/返回：P018 筛选入口。；确认→P021；重置清空项；返回 P018/P019。；查询区：计划出雏日期快捷范围/日期项、养殖场、种蛋类型、品种、蛋重类型、周龄、平均蛋重、任务状态、告警状态。；列表/卡片：背景任务卡片；确认后结果在
    P021。；表单：选择项和周龄/平均蛋重录入；日期选择单选注释可见。；弹窗：未确认是弹层还是独立页。；按钮/动作：确认、重置、返回列表/搜索。；状态：全部/待执行/已完成/已取消与正常/已超期组合。
  - 页面板块规划：P021 出雏任务筛选结果（证据：observed+static）；入口/返回：P020 确认后。；返回 P018/P019/P020 或进入详情/执行。；查询区：搜索、筛选入口。；列表/卡片：按条件调整的出雏任务卡片，含执行/查看、出雏器和鸡苗仓库信息。；表单：不适用。；弹窗：未观察到。；按钮/动作：搜索、筛选、执行/查看、卡片查看、出雏器入口。；状态：与
    P018 状态/告警规则相同。
  - 页面板块规划：P022 出雏任务详情-待执行（证据：observed+static）；入口/返回：P018/P019/P021 待执行任务。；返回 P018；执行成功后的来源页返回规则为 static。；查询区：未观察到。；列表/卡片：种蛋信息、计划号/任务号；出雏器、出雏车数量、库位列表；计划出雏日期和出雏数量。出雏数来自照蛋任务结果受精蛋数的注释为
    static。；表单：只读展示，未观察到可编辑字段。；弹窗：未观察到。；按钮/动作：复制计划号/任务号、执行、出雏器入口。；状态：待执行可带已超期；执行进入 P023。
  - 页面板块规划：P023 执行出雏任务（证据：observed+static）；入口/返回：P022 或列表待执行执行按钮。；保存留本页；执行成功返回来源列表/结果/详情为 static。；查询区：未观察到。；列表/卡片：种蛋/计划/任务信息；出雏器来源；出雏结果和目标库存。；表单：健雏、平均苗重、弱雏、毛蛋、淘汰雏数值；存发苗间/次品库选择；执行人和备注；损失、入健率、受健率、淘汰率、毛蛋率、达成率等计算展示。；弹窗：原型注释提到保存成功/执行成功提示和二次确认；未执行验证。；按钮/动作：数量加减、存发苗间/次品库选择、保存、立即执行、出雏入口。；状态：待执行→已完成预期；已超期告警可并存；受健率标准注释为待定。
  - 页面板块规划：P024 出雏任务详情-已完成（证据：observed+static）；入口/返回：P018/P019/P021 已完成查看。；返回来源列表。；查询区：未观察到。；列表/卡片：种蛋/计划/任务信息；出雏器已出库；健雏、平均苗重、存发苗间、受健率、入健率、弱雏、毛蛋、次品库、淘汰雏、损失和达成率等结果；完成时间/超期信息。；表单：不适用，只读。；弹窗：未观察到。；按钮/动作：复制、出雏器/苗间入口、返回列表；执行未观察到。；状态：已完成；结果比率的公式来自
    static 注释。
  - 页面板块规划：P025 出雏任务详情-已取消（证据：observed+static）；入口/返回：P018/P019/P021 已取消查看。；返回来源列表。；查询区：未观察到。；列表/卡片：种蛋/计划/任务信息；出雏器、出雏车及库位；取消时间/操作人字段未在当前页面稳定展示。；表单：不适用，只读。；弹窗：未观察到。；按钮/动作：复制、出雏器入口、返回列表；执行未观察到。；状态：已取消；可保留历史已超期告警。
  - 按 L1 页面/弹窗/Tab、L2 字段/列/按钮/状态、L3 可观察值/计算关系/跨模块一致性规划覆盖。
  out_scope:
  - 不执行保存、立即执行、出雏器出库、苗间/次品入库、任务状态变更或任何业务写入。
  - 不创建测试点、用例、脚本、截图、Trace 或 CSV。
  - 未由需求文档、分析 YAML 或可验证证据确认的接口、权限、异常、状态和持久化结论。
  - 测试点、测试用例、CSV、禅道数据、注册表、UI 脚本和本阶段实际业务写入。
strategy:
- 以需求文档和分析 YAML 的页面契约及证据等级为基线，采用黑盒测试规划。
- 按页面/板块覆盖入口与返回、字段/列/指标、按钮/动作、状态、空态、异常和跨模块一致性；不把 inferred/open_question 写成确认事实。
- 结合正向、负向、边界、查询/搜索/筛选、权限和回读方向；真实写操作仅在后续授权和契约确认后规划。
environment:
  client: App
  os: 以项目测试环境实际配置为准
  browser: 使用项目指定的移动端运行容器/浏览器，执行前记录版本
  base_url: ${UI_TEST_URL}
  page_path: 种蛋出雏
  portal_entry: 种禽孵化管理系统
  login: 使用测试账号登录；凭据仅从项目根目录 .env 或系统环境读取，不写入计划
data:
  required:
  - 与分析页面/板块对应的正常、空结果、边界、状态和跨模块关联数据
  - 执行前批准的测试角色与只读数据；不在计划中写入真实账号或敏感值
  - 本阶段仅规划验证，不执行远程业务写入
  preparation: 执行前准备自然唯一键和可回读数据；数据清理遵循 config.yaml 的 cleanup_status= pending_user_confirmation；不得在计划中写入账号、密码、Token、Cookie
    或持久化登录状态。
roles:
- 测试：按计划执行并保存脱敏证据。
- 产品/研发：确认接口、权限、状态、异常、字段和持久化待确认项。
- 测试设计：在计划通过后生成后续测试设计产物。
dependencies:
- REQ-APP-001（关系：首页入口；证据：observed+static）
- REQ-APP-003（关系：出雏数量来自照蛋任务受精蛋结果；证据：static+inferred）
- app / 出雏器 / 库存查询（关系：出雏来源设备/库位；证据：observed+static）
- app / 存发苗间 / 库存查询（关系：健雏入库目标；证据：observed+static）
- app / 次品库 / 库存查询（关系：弱雏/淘汰等次品去向展示；证据：observed+static）
- 接口/交互 APP-HATCH-TASK-QUERY（方向：未提供；证据：observed+static）
- 接口/交互 APP-HATCH-RESULT-READ（方向：未提供；证据：observed+static）
- 接口/交互 APP-HATCH-EXECUTE（方向：未提供；证据：static+open_question）
priority: P0-P2（按核心入口、主链路、数据风险和待确认项分级）
risks:
- 开放问题风险：受健率标准由哪个模块/接口提供，标准按养殖场、品种、批次还是其他维度匹配？（影响：影响受健率、达成率和页面计算。）
- 开放问题风险：健雏、弱雏、毛蛋、淘汰雏的数量上限、合计约束、平均苗重单位/精度和负数/空值校验是什么？（影响：影响执行表单与结果一致性。）
- 开放问题风险：存发苗间/次品库多行分配、库位容量、库存出入库和失败回滚如何定义？（影响：影响跨模块写入和异常恢复。）
- 开放问题风险：出雏任务取消入口、权限、取消后出雏器库存与照蛋结果如何处理？（影响：影响已取消详情和状态机。）
- 开放问题风险：保存是草稿还是仅前端临时状态，保存后是否允许继续编辑、谁可见、何时持久化？（影响：影响页面状态和权限设计。）
open_questions:
- 受健率标准由哪个模块/接口提供，标准按养殖场、品种、批次还是其他维度匹配？（影响：影响受健率、达成率和页面计算。）
- 健雏、弱雏、毛蛋、淘汰雏的数量上限、合计约束、平均苗重单位/精度和负数/空值校验是什么？（影响：影响执行表单与结果一致性。）
- 存发苗间/次品库多行分配、库位容量、库存出入库和失败回滚如何定义？（影响：影响跨模块写入和异常恢复。）
- 出雏任务取消入口、权限、取消后出雏器库存与照蛋结果如何处理？（影响：影响已取消详情和状态机。）
- 保存是草稿还是仅前端临时状态，保存后是否允许继续编辑、谁可见、何时持久化？（影响：影响页面状态和权限设计。）
entry_criteria:
- DOCX、对应分析 YAML 和项目配置可读取，且 REQ-ID、平台和模块身份一致。
- 范围、页面/板块、依赖、风险和待确认项已记录；未确认事实不得用猜测替代。
- 测试环境、角色、数据和证据保存方式已准备，或阻塞项已明确登记。
exit_criteria:
- 范围/非范围、策略、环境、数据、角色、依赖、优先级、风险和证据要求完整。
- Smoke、Targeted、Full 三类套件建议完整，且不包含测试用例步骤或测试点编号。
- YAML 已通过 test-plan.schema.json 校验，Markdown 与 YAML 的关键内容一致。
- 未解决的高风险开放问题已确认、转为阻塞或在阶段交接中保留。
evidence:
- 执行阶段保留与 REQ、页面/板块和运行标识可追溯的截图、结果、DOM/网络/控制台/Trace 证据（按需）。
- 证据脱敏，不保存账号、密码、Token、Cookie 或持久化登录状态。
- 写操作如获授权，记录前后状态、清理状态和清理回读；本阶段不执行写操作。
suites:
  Smoke: 规划模块入口、核心页面/板块、主链路和最高风险状态的快速可达性。
  Targeted: 规划受变更影响的页面板块、字段、查询/筛选、边界、异常、权限、依赖和数据回读。
  Full: 规划本 REQ 全部页面板块、字段、状态、正负向、边界、集成、兼容性和已确认的回归影响。
next_stage: testcase-generation-agent
