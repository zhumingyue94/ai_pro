priority: P0-P2（按核心入口、主链路、数据风险和待确认项分级）
risks:
- 开放问题风险：库存、盘点数量、差异数量的计算时点、精度、负数和并发规则是什么？（影响：high）
- 开放问题风险：确认盘点是否触发库存调整、复核或状态流转，是否允许撤销？（影响：high）
- 开放问题风险：次品库、次品类型、盘点记录和库存的隔离键及一致性规则是什么？（影响：high）
- 开放问题风险：P083 应使用哪些次品字段，样例中的种蛋字段是否为复用占位？（影响：high）
- 开放问题风险：搜索、日期、是否差异、分页排序、空结果、失败、权限不足如何处理？（影响：medium）
- 开放问题风险：盘点确认、库存调整和详情是否受角色权限控制，操作人/备注是否可修改？（影响：medium）
open_questions:
- 库存、盘点数量、差异数量的计算时点、精度、负数和并发规则是什么？（影响：high）
- 确认盘点是否触发库存调整、复核或状态流转，是否允许撤销？（影响：high）
- 次品库、次品类型、盘点记录和库存的隔离键及一致性规则是什么？（影响：high）
- P083 应使用哪些次品字段，样例中的种蛋字段是否为复用占位？（影响：high）
- 搜索、日期、是否差异、分页排序、空结果、失败、权限不足如何处理？（影响：medium）
- 盘点确认、库存调整和详情是否受角色权限控制，操作人/备注是否可修改？（影响：medium）
entry_criteria:
- DOCX、对应分析 YAML 和项目配置可读取，且 REQ-ID、平台和模块身份一致。
- 范围、页面/板块、依赖、风险和待确认项已记录；未确认事实不得用猜测替代。
- 测试环境、角色、数据和证据保存方式已准备，或阻塞项已明确登记。
exit_criteria:
- 范围/非范围、策略、环境、数据、角色、依赖、优先级、风险和证据要求完整。
- Smoke、Targeted、Full 三类套件建议完整，且不包含测试用例步骤或测试点编号。
- YAML 已通过 test-plan.schema.json 校验，Markdown 与 YAML 的关键内容一致。
- 未解决的高风险开放问题已确认、转为阻塞或在阶段交接中保留。
evidence:
- 执行阶段保留与 REQ、页面/板块和运行标识可追溯的截图、结果、DOM/网络/控制台/Trace 证据（按需）。
- 证据脱敏，不保存账号、密码、Token、Cookie 或持久化登录状态。
- 写操作如获授权，记录前后状态、清理状态和清理回读；本阶段不执行写操作。
suites:
  Smoke: 规划模块入口、核心页面/板块、主链路和最高风险状态的快速可达性。
  Targeted: 规划受变更影响的页面板块、字段、查询/筛选、边界、异常、权限、依赖和数据回读。
  Full: 规划本 REQ 全部页面板块、字段、状态、正负向、边界、集成、兼容性和已确认的回归影响。
