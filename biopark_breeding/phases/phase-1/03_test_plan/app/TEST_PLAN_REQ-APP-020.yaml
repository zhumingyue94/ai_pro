objective: 基于 App 端原型需求说明书、REQ-APP-020 分析 YAML 和项目配置，规划 次品库 / 盘点记录 的测试范围、策略、环境、数据、风险、准入/准出、证据和 Smoke/Targeted/Full 套件；不生成测试点或测试用例。
scope:
  in_scope:
  - P074、P081-P085 的盘点表单字段和只读记录查询契约；不执行确认盘点。
  - 页面板块规划：P074 次品盘点（证据：static,inferred,open_question）；入口/返回：入口 由 P072 次品库列表进入；静态链接返回 P072。；返回 返回次品库列表；确认结果未验证。；列表/卡片：盘点时间、操作人、孵化场/次品库、当前库存、次品类型；表单：盘点数量（必填）、当前库存（默认库存数字）、盘点备注、次品类型；按钮/动作：确认盘点、调整盘点数量、返回次品库列表；状态：默认库存、盘点数量、确认盘点
  - 页面板块规划：P081 盘点记录列表（证据：static,inferred,open_question）；入口/返回：入口 由首页或 P072 进入；可进入搜索、筛选、详情。；返回 可返回首页；返回栈未确认。；查询区：次品库一号/二号/三号、今日/昨日/近一周/近一个月/近3个月/近1年、次品类型、是否差异：是/否、搜索、筛选；列表/卡片：数量、盘点时间、差异数量、次品类型；按钮/动作：搜索、筛选、进入盘点详情、返回首页；状态：有差异、无差异、是、否
  - 页面板块规划：P082 盘点记录搜索（证据：static,inferred,open_question）；入口/返回：入口 由 P081 搜索进入。；返回 可返回列表或详情。；查询区：关键词、次品类型、养殖场、批次、品种、代孵/树田代孵历史词、搜索；表单：关键词输入框；按钮/动作：搜索、选择历史词、进入详情、返回列表；状态：搜索有结果、搜索无结果
  - 页面板块规划：P083 盘点记录筛选（证据：static,inferred,open_question）；入口/返回：入口 由 P081/P082 筛选进入。；返回 确认进入 P084；重置行为未明确。；查询区：次品库、盘点日期、次品类型、养殖场、品种、是否差异：全部/是/否、确认、重置；表单：库选择、盘点日期、次品类型、养殖场、批次、品种、是否差异；按钮/动作：确认、重置、进入筛选结果、返回列表/搜索；状态：全部、是、否
  - 页面板块规划：P084 筛选结果（证据：static,inferred,open_question）；入口/返回：入口 由 P083 确认进入。；返回 可回列表、搜索、筛选或详情；条件回显未确认。；查询区：搜索、筛选；列表/卡片：盘点时间、差异数量、次品类型；按钮/动作：搜索、筛选、进入盘点详情、返回列表；状态：有差异、无差异
  - 页面板块规划：P085 盘点详情（证据：static,inferred,open_question）；入口/返回：入口 由 P081-P084 记录卡片进入。；返回 返回盘点记录列表。；列表/卡片：种蛋/次品信息：养殖场/批次/品种/种蛋类型/周龄/蛋重/产蛋日期（有则显示）、仓库信息：孵化场/次品库、盘点信息：库存/盘点数量/差异数量/盘点时间/备注/操作人/是否差异、次品类型；按钮/动作：返回盘点记录列表；状态：是否差异：是
  - 按 L1 页面/弹窗/Tab、L2 字段/列/按钮/状态、L3 可观察值/计算关系/跨模块一致性规划覆盖。
  out_scope:
  - 确认盘点、库存调整、记录写入、入库/出库、任务执行、接口实现、权限实现和持久化实现。
  - 未由需求文档、分析 YAML 或可验证证据确认的接口、权限、异常、状态和持久化结论。
  - 测试点、测试用例、CSV、禅道数据、注册表、UI 脚本和本阶段实际业务写入。
strategy:
- 以需求文档和分析 YAML 的页面契约及证据等级为基线，采用黑盒测试规划。
- 按页面/板块覆盖入口与返回、字段/列/指标、按钮/动作、状态、空态、异常和跨模块一致性；不把 inferred/open_question 写成确认事实。
- 结合正向、负向、边界、查询/搜索/筛选、权限和回读方向；真实写操作仅在后续授权和契约确认后规划。
environment:
  client: App
  os: 以项目测试环境实际配置为准
  browser: 使用项目指定的移动端运行容器/浏览器，执行前记录版本
  base_url: ${UI_TEST_URL}
  page_path: 次品库 / 盘点记录
  portal_entry: 种禽孵化管理系统
  login: 使用测试账号登录；凭据仅从项目根目录 .env 或系统环境读取，不写入计划
data:
  required:
  - 与分析页面/板块对应的正常、空结果、边界、状态和跨模块关联数据
  - 执行前批准的测试角色与只读数据；不在计划中写入真实账号或敏感值
  - 写操作边界数据仅用于确认不可执行范围：新增、编辑、删除、确认盘点、库存调整、入库、出库、任务执行、远程数据写入
  preparation: 执行前准备自然唯一键和可回读数据；数据清理遵循 config.yaml 的 cleanup_status= pending_user_confirmation；不得在计划中写入账号、密码、Token、Cookie
    或持久化登录状态。
roles:
- 测试：按计划执行并保存脱敏证据。
- 产品/研发：确认接口、权限、状态、异常、字段和持久化待确认项。
- 测试设计：在计划通过后生成后续测试设计产物。
