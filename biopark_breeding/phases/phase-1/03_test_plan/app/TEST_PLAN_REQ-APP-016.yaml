  - P099-P103 的列表、搜索、筛选、筛选结果、详情只读契约。
  - 页面板块规划：P099 出入库记录列表（证据：static,inferred,open_question）；入口/返回：入口 页面表和静态链接显示由首页进入；基线把该通用页面归属存发苗间。；返回 可返回首页、搜索、筛选或详情；返回栈和返回按钮样式未确认。；查询区：存发苗间一号/二号/三号、出入库方式：自动/手动、出入库原因：种蛋出雏/销售、时间快捷项：今日/昨日/近一周/近一个月/近3个月/近1年、出/入库：入库/出库、搜索、筛选；列表/卡片：数量、入库或出库、鸡苗平均苗重、出苗日期、入库/出库时间、原因、养殖场-批次-品种、自动/手动、计划号（样例存在）；按钮/动作：搜索、筛选、进入出入库详情、返回首页；状态：入库、出库、自动、手动
  - 页面板块规划：P100 出入库记录搜索（证据：static,inferred,open_question）；入口/返回：入口 由 P099 搜索进入。；返回 可返回列表或详情；实际跳转未补充复现。；查询区：关键词输入、计划号、养殖客户、养殖场、批次、品种、代孵/树田代孵历史词、搜索；表单：关键词输入框；按钮/动作：搜索、选择历史搜索词、进入详情、返回列表；状态：搜索有结果、搜索无结果
  - 页面板块规划：P101 出入库记录筛选（证据：static,inferred,open_question）；入口/返回：入口 由 P099/P100 的筛选入口进入。；返回 确认进入 P102；重置后默认值和返回列表行为未确认。；查询区：存发苗间、出入库日期范围、养殖场、品种、平均苗重、操作类型：全部/入库/出库、出入库方式：全部/自动/手动、出入库原因：全部/种蛋出雏/其他、确认、重置；表单：仓库选择、日期范围、养殖场、品种、平均苗重、操作类型、出入库方式、出入库原因；按钮/动作：确认、重置、进入筛选结果、返回列表/搜索；状态：全部、入库、出库、自动、手动
  - 页面板块规划：P102 筛选结果（证据：static,inferred,open_question）；入口/返回：入口 由 P101 确认进入。；返回 可回到列表/搜索/筛选或详情；筛选条件是否回显未确认。；查询区：搜索、筛选；列表/卡片：鸡苗平均苗重、出苗日期、入库/出库时间、原因、养殖场-批次-品种、自动/手动、计划号；按钮/动作：搜索、筛选、进入详情、返回列表；状态：入库、出库、自动、手动
  - 页面板块规划：P103 出入库详情（证据：static,inferred,open_question）；入口/返回：入口 由 P099/P100/P101/P102 的记录卡片进入。；返回 静态链接返回出入库记录列表；返回栈未确认。；列表/卡片：出/入库、数量、方式、原因、时间、计划号（出库场景有则显示并可复制）、备注、操作人、养殖客户（出库场景可能有）、鸡苗信息：养殖场/养殖批次/品种/出苗日期/平均苗重/库存/鸡苗类型、仓库信息：孵化场/存发苗间；按钮/动作：复制计划号（有计划号时）、返回出入库记录列表；状态：入库、出库、自动、手动
