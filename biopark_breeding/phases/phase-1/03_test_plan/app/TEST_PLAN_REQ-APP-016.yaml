- 开放问题风险：入库原因“种蛋出雏”、出库原因和自动/手动方式的完整枚举及来源是什么？（影响：high）
- 开放问题风险：记录与出雏任务、库存和盘点记录的关联键及一致性规则是什么？（影响：high）
- 开放问题风险：关键词搜索、历史词、日期/平均苗重条件、分页排序和空结果/异常如何处理？（影响：medium）
- 开放问题风险：是否允许撤销/冲正或导出，详情和计划号复制是否受权限控制？（影响：medium）
