trace:
  story: null
  req: REQ-APP-015
  project: 种禽孵化管理系统
  version: 1
  status: draft
objective: 基于 App 端原型需求说明书、REQ-APP-015 分析 YAML 和项目配置，规划 存发苗间 / 库存查询 的测试范围、策略、环境、数据、风险、准入/准出、证据和 Smoke/Targeted/Full 套件；不生成测试点或测试用例。
scope:
  in_scope:
  - 存发苗间对象下的鸡苗库存列表、详情、搜索、筛选、筛选结果及只读入口。
  - 页面板块规划：P086 苗间列表（证据：未提供）；入口/返回：入口 observed/static：首页、存发苗间入口。；返回 static：首页、鸡苗搜索、鸡苗筛选、鸡苗详情、确认出库/盘点和批量操作候选。
  - 页面板块规划：P087 鸡苗详情（证据：未提供）；入口/返回：入口 observed/static：从苗间列表或搜索结果鸡苗卡片进入。；返回 static：苗间列表、确认出库-单库位、确认盘点-单库位。
  - 页面板块规划：P088 鸡苗搜索（证据：未提供）；入口/返回：入口 observed/static：从苗间列表进入。；返回 static：苗间列表、鸡苗详情、确认出库/盘点候选。
  - 页面板块规划：P089 鸡苗筛选（证据：未提供）；入口/返回：入口 observed/static：从苗间列表或鸡苗搜索进入。；返回 static：鸡苗搜索、上孵/出雏任务页、苗间列表、筛选结果、鸡苗筛选。
  - 页面板块规划：P090 筛选结果（证据：未提供）；入口/返回：入口 observed/static：由鸡苗筛选确认进入；上下文显示存发苗间一号。；返回 static：证据链接摘要复用蛋库/种蛋任务页面，真实返回应绑定存发苗间待确认。
  - 按 L1 页面/弹窗/Tab、L2 字段/列/按钮/状态、L3 可观察值/计算关系/跨模块一致性规划覆盖。
  out_scope:
  - 出库、入库、盘点、批量操作、任务执行、接口实现、权限和持久化实现。
  - 未由需求文档、分析 YAML 或可验证证据确认的接口、权限、异常、状态和持久化结论。
  - 测试点、测试用例、CSV、禅道数据、注册表、UI 脚本和本阶段实际业务写入。
strategy:
- 以需求文档和分析 YAML 的页面契约及证据等级为基线，采用黑盒测试规划。
- 按页面/板块覆盖入口与返回、字段/列/指标、按钮/动作、状态、空态、异常和跨模块一致性；不把 inferred/open_question 写成确认事实。
- 结合正向、负向、边界、查询/搜索/筛选、权限和回读方向；真实写操作仅在后续授权和契约确认后规划。
environment:
  client: App
  os: 以项目测试环境实际配置为准
  browser: 使用项目指定的移动端运行容器/浏览器，执行前记录版本
  base_url: ${UI_TEST_URL}
  page_path: 存发苗间 / 库存查询
  portal_entry: 种禽孵化管理系统
  login: 使用测试账号登录；凭据仅从项目根目录 .env 或系统环境读取，不写入计划
data:
  required:
  - 与分析页面/板块对应的正常、空结果、边界、状态和跨模块关联数据
  - 执行前批准的测试角色与只读数据；不在计划中写入真实账号或敏感值
  - 本阶段仅规划验证，不执行远程业务写入
  preparation: 执行前准备自然唯一键和可回读数据；数据清理遵循 config.yaml 的 cleanup_status= pending_user_confirmation；不得在计划中写入账号、密码、Token、Cookie
    或持久化登录状态。
roles:
- 测试：按计划执行并保存脱敏证据。
- 产品/研发：确认接口、权限、状态、异常、字段和持久化待确认项。
- 测试设计：在计划通过后生成后续测试设计产物。
dependencies:
- 首页（关系：entry；证据：static）
- 种蛋出雏（关系：upstream_context；证据：static）
- 存发苗间 / 出入库记录（关系：adjacent_module；证据：static）
- 确认出库-单库位、确认盘点-单库位（关系：write_entry_boundary；证据：static）
- 接口/交互 存发苗间库存查询导航（方向：未提供；证据：observed）
- 接口/交互 存发苗间鸡苗库存查询（方向：未提供；证据：open_question）
- 接口/交互 出库/盘点入口（方向：未提供；证据：observed）
priority: P0-P2（按核心入口、主链路、数据风险和待确认项分级）
risks:
- 开放问题风险：P089 的满容/空位/种蛋信息/合格蛋仓库等控件是否为原型复用残留，鸡苗筛选的正式字段和状态是什么？（影响：影响筛选契约、对象隔离和测试范围。）
- 开放问题风险：P090 static 链接混有蛋库/种蛋任务页面，筛选结果真实返回路径是否应固定为存发苗间？（影响：影响路由和模块边界。）
- 开放问题风险：鸡苗库存字段、数量口径、刷新/分页/排序和异常处理是什么？（影响：影响库存查询接口和一致性验收。）
- 开放问题风险：鸡苗类型除健雏外是否有其他枚举，关联计划与出雏任务如何关联？（影响：影响详情字段和跨模块追溯。）
open_questions:
- P089 的满容/空位/种蛋信息/合格蛋仓库等控件是否为原型复用残留，鸡苗筛选的正式字段和状态是什么？（影响：影响筛选契约、对象隔离和测试范围。）
- P090 static 链接混有蛋库/种蛋任务页面，筛选结果真实返回路径是否应固定为存发苗间？（影响：影响路由和模块边界。）
- 鸡苗库存字段、数量口径、刷新/分页/排序和异常处理是什么？（影响：影响库存查询接口和一致性验收。）
- 鸡苗类型除健雏外是否有其他枚举，关联计划与出雏任务如何关联？（影响：影响详情字段和跨模块追溯。）
entry_criteria:
- DOCX、对应分析 YAML 和项目配置可读取，且 REQ-ID、平台和模块身份一致。
- 范围、页面/板块、依赖、风险和待确认项已记录；未确认事实不得用猜测替代。
- 测试环境、角色、数据和证据保存方式已准备，或阻塞项已明确登记。
exit_criteria:
- 范围/非范围、策略、环境、数据、角色、依赖、优先级、风险和证据要求完整。
- Smoke、Targeted、Full 三类套件建议完整，且不包含测试用例步骤或测试点编号。
- YAML 已通过 test-plan.schema.json 校验，Markdown 与 YAML 的关键内容一致。
- 未解决的高风险开放问题已确认、转为阻塞或在阶段交接中保留。
evidence:
- 执行阶段保留与 REQ、页面/板块和运行标识可追溯的截图、结果、DOM/网络/控制台/Trace 证据（按需）。
- 证据脱敏，不保存账号、密码、Token、Cookie 或持久化登录状态。
- 写操作如获授权，记录前后状态、清理状态和清理回读；本阶段不执行写操作。
suites:
  Smoke: 规划模块入口、核心页面/板块、主链路和最高风险状态的快速可达性。
  Targeted: 规划受变更影响的页面板块、字段、查询/筛选、边界、异常、权限、依赖和数据回读。
  Full: 规划本 REQ 全部页面板块、字段、状态、正负向、边界、集成、兼容性和已确认的回归影响。
