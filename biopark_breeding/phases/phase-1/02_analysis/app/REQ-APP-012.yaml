business_rules:
  - id: BR-012-01
    statement: "记录列表、搜索、筛选结果和详情均应绑定孵化器/库位对象。"
    evidence_level: inferred
    source: "模块拆分清单 REQ-APP-012"
  - id: BR-012-02
    statement: "记录卡片展示入库/出库方向、自动/手动方式、原因、数量、时间及种蛋/库位信息。"
    evidence_level: observed
    source: "P057/P058/P059/P060/P061 live DOM 和 DOCX 页面表"
  - id: BR-012-03
    statement: "计划号在详情中有则显示并提供复制入口；页面未明确无计划号时的字段占位方式。"
    evidence_level: observed
    source: "P061 页面内容"
  - id: BR-012-04
    statement: "搜索历史最多三行、输入后自动查询是页面注释建议，不能直接当作正式性能或持久化要求。"
    evidence_level: inferred
    source: "P058 页面注释"
  - id: BR-012-05
    statement: "入库/出库和自动/手动是记录属性；未观察到可从本模块触发的状态转换。"
    evidence_level: observed
    source: "P057/P059/P061"
open_questions:
  - id: OQ-012-01
    question: "P060 static 链接出现蛋库/种蛋任务页面，筛选结果是否错误复用通用页面，真实返回和对象绑定如何定义？"
    evidence_level: open_question
    impact: "影响模块隔离、路由和验收。"
  - id: OQ-012-02
    question: "正式记录字段、方向/原因枚举、时间时区、分页排序和接口错误处理是什么？"
    evidence_level: open_question
    impact: "影响接口契约和查询测试。"
  - id: OQ-012-03
    question: "记录是否允许撤销、冲正或修改，权限和审计字段如何定义？"
    evidence_level: open_question
    impact: "影响状态/权限边界；当前未执行任何写操作。"
  - id: OQ-012-04
    question: "搜索历史和复制计划号是否落本地，是否涉及敏感数据处理？"
    evidence_level: open_question
    impact: "影响客户端持久化和隐私检查。"
