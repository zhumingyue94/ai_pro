  safety_boundary: "只读核验；未点击或提交任何业务写操作。"
pages:
  - id: P057
    name: "出入库记录列表"
    page_file: "出入库记录列表_1.html"
    evidence_path: "01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/{screenshots/page-057.png,dom/page-057.html,page_text/page-057.txt}"
    entry_and_return:
      entry: "observed/static：首页、孵化器列表/库存结果的出入库记录入口。"
      return: "static：首页、出入库记录搜索、出入库记录筛选、出入库详情。"
    contract:
      query_area: "observed：顶部搜索、筛选；列表上下文提供孵化器一号/二号/三号、出入库原因、时间快捷项和入库/出库切换。"
      list_or_cards: "observed：记录卡片包含数量、方向、计划号、库位号、周龄、平均蛋重、产蛋日期、时间、原因、蛋类型、养殖场-批次-品种、自动/手动。"
      form: "未观察到新增记录表单；筛选和搜索为独立页面。"
      dialogs: "未观察到详情弹窗；记录详情为独立页面。"
      buttons_actions: "observed：搜索、筛选、记录卡片；点击记录进入 P061。未执行入库/出库动作。"
      state: "observed：方向为入库/出库，方式为自动/手动，原因出现种蛋上孵/销售等；未观察到记录状态转换。"
  - id: P058
    name: "出入库记录搜索"
    page_file: "出入库记录搜索_1.html"
    evidence_path: "01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/{screenshots/page-058.png,dom/page-058.html,page_text/page-058.txt}"
    entry_and_return:
      entry: "observed/static：从出入库记录列表进入。"
      return: "static：出入库记录列表、出入库详情。"
    contract:
      query_area: "observed：搜索输入和搜索按钮；字段提示为计划号、库位号、养殖场、批次、品种；有代孵/树田代孵等历史候选。"
      list_or_cards: "observed：搜索结果以记录卡片呈现，可同时展示入库与出库记录。"
      form: "observed：关键字输入；未观察到字段校验、长度限制或复杂搜索表单。"
      dialogs: "未观察到独立弹窗；有无结果为页面状态文案。"
      buttons_actions: "observed：搜索、历史项、结果卡片；页面注释提出输入后自动查询，但实现状态需确认。"
      state: "observed：没有找到相关的记录、搜索有结果、搜索无结果；历史最多三行来自注释。"
  - id: P059
    name: "出入库记录筛选"
    page_file: "出入库记录筛选_1.html"
    evidence_path: "01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/{screenshots/page-059.png,dom/page-059.html,page_text/page-059.txt}"
    entry_and_return:
      entry: "observed/static：从记录列表或记录搜索进入。"
      return: "static：记录搜索、记录筛选、记录详情、相关上孵任务、记录列表和筛选结果。"
    contract:
      query_area: "observed：库位/仓库候选、出入库方式自动/手动、原因、时间范围、操作类型入库/出库、种蛋信息筛选。"
      list_or_cards: "observed：页面展示筛选前的记录卡片预览，含方向、方式、库位、时间和原因。"
      form: "observed：选择类筛选项、时间快捷项/日期范围、养殖场、品种、蛋重类型、种蛋类型、周龄和平均蛋重候选；必填和单多选未确认。"
      dialogs: "未观察到独立弹窗；筛选为独立页面。"
      buttons_actions: "observed：确认、重置、筛选项选择；确认后进入 P060。"
      state: "observed：方向、方式和原因是记录维度，不代表可操作状态机。"
  - id: P060
    name: "筛选结果"
    page_file: "筛选结果_4.html"
    evidence_path: "01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/{screenshots/page-060.png,dom/page-060.html,page_text/page-060.txt}"
    entry_and_return:
      entry: "observed/static：由记录筛选确认进入。"
      return: "static：当前证据的链接摘要混有蛋库/种蛋任务页面，需确认实际返回应绑定孵化器记录列表。"
    contract:
      query_area: "observed：顶部搜索、筛选、孵化器/仓库上下文；未观察到新增筛选字段。"
      list_or_cards: "observed：展示入库/出库记录卡片，含方向、计划号、库位、种蛋信息、时间、原因和方式。"
      form: "未观察到独立表单。"
      dialogs: "未观察到独立弹窗；有无结果文案显隐条件未确认。"
      buttons_actions: "observed/static：搜索、筛选、记录卡片/详情入口；未执行写操作。"
      state: "observed：记录方向入库/出库、方式自动/手动、原因种蛋上孵/种蛋照蛋等；未观察到转换。"
  - id: P061
    name: "出入库详情"
    page_file: "出入库详情_1.html"
    evidence_path: "01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/{screenshots/page-061.png,dom/page-061.html,page_text/page-061.txt}"
    entry_and_return:
      entry: "observed/static：从记录列表、搜索、筛选结果的记录项进入。"
      return: "static：出入库记录列表。"
    contract:
      query_area: "不适用；详情页未观察到查询区。"
      list_or_cards: "observed：种蛋信息、出/入库信息、数量、方式、原因、时间、计划号（有则显示并可复制）、备注、操作人、库位信息（孵化器、库位、孵化场）。"
      form: "未观察到编辑表单。"
      dialogs: "未观察到独立弹窗。"
      buttons_actions: "observed：关联计划复制、返回记录列表；复制后的反馈未观察到。"
      state: "observed：方向入库/出库，方式手动/自动；未观察到记录状态转换或撤销。"
