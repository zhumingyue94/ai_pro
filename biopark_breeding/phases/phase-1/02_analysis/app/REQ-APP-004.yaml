    name: 出雏任务列表
    source: observed+static
    entry: 首页“种蛋出雏”入口。
    query_area: 搜索种蛋出雏任务、筛选入口、待执行/已完成/已取消/已超期状态切换。
    list_or_cards: 养殖场-批次-品种、计划出雏日期、出雏数量、种蛋类型、周龄、平均蛋重/蛋重类型、产蛋日期、出雏器名称、状态；待执行出雏数按照蛋任务受精结果展示的注释为 static。
