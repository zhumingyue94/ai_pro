interfaces:
  - id: APP-HATCH-TASK-QUERY
    type: data_query
    evidence: observed+static
    target: P018-P021
    contract: 返回出雏任务卡片、计划日期/数量、出雏器及状态；接口、分页、排序协议未提供。
  - id: APP-HATCH-RESULT-READ
    type: cross_module_read
    evidence: observed+static
    target: REQ-APP-003 / 照蛋结果、app / 出雏器、app / 存发苗间、app / 次品库
    contract: 读取受精蛋结果和出雏目标；真实接口与一致性策略未确认。
  - id: APP-HATCH-EXECUTE
    type: business_write
    evidence: static+open_question
    target: 出雏器出库、存发苗间/次品库入库、出雏结果和任务状态
    contract: 原型描述执行后更新结果和库存；本次未执行。
cross_module_refs:
  - ref: REQ-APP-001
    relation: 首页入口
    evidence: observed+static
  - ref: REQ-APP-003
    relation: 出雏数量来自照蛋任务受精蛋结果
    evidence: static+inferred
  - ref: app / 出雏器 / 库存查询
    relation: 出雏来源设备/库位
    evidence: observed+static
  - ref: app / 存发苗间 / 库存查询
    relation: 健雏入库目标
    evidence: observed+static
  - ref: app / 次品库 / 库存查询
    relation: 弱雏/淘汰等次品去向展示
    evidence: observed+static
business_rules:
  - id: BR-APP-004-01
    evidence: static
    rule: 列表展示计划出雏日期；待执行出雏数量为照蛋任务执行结果中的受精蛋数，作为实际待出雏数量。
  - id: BR-APP-004-02
    evidence: static
    rule: 出雏执行需录入健雏、平均苗重、存发苗间、弱雏、毛蛋、次品库、淘汰雏；数值初始为 0，最大不能超过待出雏数量总量。
  - id: BR-APP-004-03
    evidence: static
    rule: 损失=出雏数-健雏-弱雏-毛蛋-淘汰雏；入健率、受健率、淘汰率、毛蛋率、达成率按原型公式展示；受健率标准处于待定状态。
  - id: BR-APP-004-04
    evidence: static
    rule: 健雏目标为存发苗间，弱雏/相关次品进入次品库的页面选择；淘汰雏是否入库以原型页面呈现和开放问题为准，不补充后端规则。
  - id: BR-APP-004-05
    evidence: static+open_question
    rule: 保存/立即执行后的提示、库存变化、任务完成和返回路径为原型契约，因未执行不视为实现事实。
open_questions:
  - id: OQ-APP-004-01
    evidence: open_question
    question: 受健率标准由哪个模块/接口提供，标准按养殖场、品种、批次还是其他维度匹配？
    impact: 影响受健率、达成率和页面计算。
  - id: OQ-APP-004-02
    evidence: open_question
    question: 健雏、弱雏、毛蛋、淘汰雏的数量上限、合计约束、平均苗重单位/精度和负数/空值校验是什么？
    impact: 影响执行表单与结果一致性。
  - id: OQ-APP-004-03
    evidence: open_question
    question: 存发苗间/次品库多行分配、库位容量、库存出入库和失败回滚如何定义？
    impact: 影响跨模块写入和异常恢复。
  - id: OQ-APP-004-04
    evidence: open_question
    question: 出雏任务取消入口、权限、取消后出雏器库存与照蛋结果如何处理？
    impact: 影响已取消详情和状态机。
  - id: OQ-APP-004-05
    evidence: open_question
    question: 保存是草稿还是仅前端临时状态，保存后是否允许继续编辑、谁可见、何时持久化？
    impact: 影响页面状态和权限设计。
out_of_scope:
  - 不执行保存、立即执行、出雏器出库、苗间/次品入库、任务状态变更或任何业务写入。
  - 不创建测试点、用例、脚本、截图、Trace 或 CSV。
handoff:
  agent: analyze-agent
  outputs: [02_analysis/app/REQ-APP-004.yaml, 02_analysis/app/REQ-APP-004_种蛋出雏.md]
  next_gate: 需求/测点评审通过后再进入下游阶段。
  verification_status: P018-P025 原型存在性、渲染文本和控件已核对；真实执行、接口和回读未验证。
