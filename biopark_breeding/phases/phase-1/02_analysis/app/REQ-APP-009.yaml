  - {page_id: P044, name: 出入库记录筛选, status: 正常, evidence: [{level: observed, path: "http://127.0.0.1:5500/出入库记录筛选.html"}, {level: static, path: 01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/page_text/page-044.txt}, {level: static, path: 01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/dom/page-044.html}]}
