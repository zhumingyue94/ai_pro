  - {id: "OQ-017-02", question: "库存、盘点数量、差异数量的计算时点、精度和负数规则是什么？", impact: "high"}
  - {id: "OQ-017-03", question: "盘点是否需要确认、复核、库存调整或可撤销，相关权限如何定义？", impact: "high"}
  - {id: "OQ-017-04", question: "关键词、日期、平均苗重、是否差异筛选及分页排序、空结果、异常如何处理？", impact: "medium"}
  - {id: "OQ-017-05", question: "盘点记录与库存、出入库、出雏任务的关联键及一致性规则是什么？", impact: "medium"}
