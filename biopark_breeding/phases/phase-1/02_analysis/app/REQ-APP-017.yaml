business_rules:
  - {id: "BR-017-01", rule: "盘点卡片展示鸡苗平均苗重、出苗日期、盘点时间、差异数量和养殖场-批次-品种。", evidence_level: "static"}
  - {id: "BR-017-02", rule: "P106 提供存发苗间、日期、鸡苗信息和是否差异筛选，存在确认和重置动作。", evidence_level: "static"}
  - {id: "BR-017-03", rule: "详情展示库存、盘点数量和差异数量，并展示操作人、备注和是否差异；差异值不自动等同于已调整。", evidence_level: "static"}
  - {id: "BR-017-04", rule: "存发苗间对象边界来自基线，通用页面字段未单独证明数据隔离。", evidence_level: "inferred"}
  - {id: "BR-017-05", rule: "本分析只读，不确认盘点、不调整库存、不执行入库/出库。", evidence_level: "observed"}
  - {id: "BR-017-06", rule: "盘点生成、确认、调整、撤销、权限、异常、接口和持久化未确认。", evidence_level: "open_question"}
open_questions:
