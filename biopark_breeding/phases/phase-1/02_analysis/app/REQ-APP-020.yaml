business_rules:
  - {id: "BR-020-01", rule: "次品盘点表单展示默认库存、盘点数量、盘点时间、操作人、仓库、备注和次品类型，并有确认盘点动作。", evidence_level: "static"}
  - {id: "BR-020-02", rule: "盘点记录列表支持按次品库、时间、次品类型、是否差异查询，并展示盘点时间和差异数量。", evidence_level: "static"}
  - {id: "BR-020-03", rule: "详情展示库存、盘点数量、差异数量、操作人、备注、是否差异及次品信息。", evidence_level: "static"}
  - {id: "BR-020-04", rule: "差异是结果属性，不自动等同于盘点确认或库存调整完成。", evidence_level: "inferred"}
  - {id: "BR-020-05", rule: "次品库对象边界来自基线，通用页面字段未证明库隔离规则。", evidence_level: "inferred"}
  - {id: "BR-020-06", rule: "本分析只读，不确认盘点、不调整库存、不执行入库/出库。", evidence_level: "observed"}
  - {id: "BR-020-07", rule: "差异计算、确认、复核、调整、撤销、权限、接口、异常和持久化未确认。", evidence_level: "open_question"}
open_questions:
  - {id: "OQ-020-01", question: "库存、盘点数量、差异数量的计算时点、精度、负数和并发规则是什么？", impact: "high"}
  - {id: "OQ-020-02", question: "确认盘点是否触发库存调整、复核或状态流转，是否允许撤销？", impact: "high"}
  - {id: "OQ-020-03", question: "次品库、次品类型、盘点记录和库存的隔离键及一致性规则是什么？", impact: "high"}
  - {id: "OQ-020-04", question: "P083 应使用哪些次品字段，样例中的种蛋字段是否为复用占位？", impact: "high"}
  - {id: "OQ-020-05", question: "搜索、日期、是否差异、分页排序、空结果、失败、权限不足如何处理？", impact: "medium"}
  - {id: "OQ-020-06", question: "盘点确认、库存调整和详情是否受角色权限控制，操作人/备注是否可修改？", impact: "medium"}
