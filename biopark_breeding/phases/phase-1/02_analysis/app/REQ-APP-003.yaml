interfaces:
  - id: APP-CANDLE-TASK-QUERY
    type: data_query
    evidence: observed+static
    target: P010-P013
    contract: 返回照蛋任务列表/搜索/筛选结果；接口、分页、排序协议未提供。
  - id: APP-CANDLE-INCUBATOR-READ
    type: cross_module_read
    evidence: observed+static
    target: app / 孵化器 / 库存查询
    contract: 展示实际照蛋来源的孵化器/库位信息；数据一致性和权限未明确。
  - id: APP-CANDLE-EXECUTE
    type: business_write
    evidence: static+open_question
    target: 孵化器出库、出雏器入库、照蛋结果和任务状态
    contract: 原型描述执行会保存结果并形成后续出雏器数据；本次未执行。
cross_module_refs:
  - ref: REQ-APP-001
    relation: 首页入口
    evidence: observed+static
  - ref: REQ-APP-002
    relation: 照蛋数量来自种蛋上孵实际执行结果
    evidence: static+inferred
  - ref: app / 孵化器 / 库存查询
    relation: 照蛋来源库位与出库展示
    evidence: observed+static
  - ref: app / 出雏器 / 库存查询
    relation: 照蛋后出雏器库位分配目标
    evidence: observed+static
  - ref: REQ-APP-004
    relation: 受精蛋结果作为出雏任务数量来源
    evidence: static+inferred
business_rules:
  - id: BR-APP-003-01
    evidence: static
    rule: 列表显示计划照蛋日期；待执行照蛋数按上孵任务实际执行数展示，具体字段来源以原型注释为准。
  - id: BR-APP-003-02
    evidence: static
    rule: 照蛋执行输入包括无精蛋、死胚蛋、次品库、臭蛋；受精蛋=照蛋数-无精蛋-死胚蛋-臭蛋，受精率/死胚率/臭蛋率按原型公式展示。
  - id: BR-APP-003-03
    evidence: static
    rule: 结果数值初始为 0，原型注释要求不得超过待照蛋数量总量；具体整数/空值/负数校验未定义。
  - id: BR-APP-003-04
    evidence: static
    rule: 根据孵化器库位数量预设同等数量的出雏器库位行，可选择、删除和新增；默认不填充出雏器内容。
  - id: BR-APP-003-05
    evidence: static+open_question
    rule: 保存和立即执行的结果提示、状态刷新与后续出雏数据写入只作为原型契约，未经执行不可视为已实现。
open_questions:
  - id: OQ-APP-003-01
    evidence: open_question
    question: 无精蛋、死胚蛋、臭蛋与次品蛋的分类及是否入次品库，最终业务口径是什么？
    impact: 影响结果校验、库存去向和接口分录。
  - id: OQ-APP-003-02
    evidence: open_question
    question: 出雏器/库位选择是否必须全部填满，库位容量、重复选择和数量分配规则是什么？
    impact: 影响执行表单可提交条件。
  - id: OQ-APP-003-03
    evidence: open_question
    question: 受精蛋、受精率等计算的分母、舍入规则、超量/小于 0 提示和保存草稿机制是什么？
    impact: 影响结果准确性和异常态。
  - id: OQ-APP-003-04
    evidence: open_question
    question: 照蛋任务取消入口、权限和取消后的库存/结果处理未在本分片明确，如何定义？
    impact: 影响已取消详情和跨模块回滚。
out_of_scope:
  - 不执行保存、立即执行、库存出入库、任务状态变更或任何业务写入。
  - 不创建测试点、用例、脚本、截图、Trace 或 CSV。
handoff:
  agent: analyze-agent
  outputs: [02_analysis/app/REQ-APP-003.yaml, 02_analysis/app/REQ-APP-003_种蛋照蛋.md]
  next_gate: 需求/测点评审通过后再进入下游阶段。
  verification_status: P010-P017 原型存在性、渲染文本和控件已核对；真实执行、接口和回读未验证。
