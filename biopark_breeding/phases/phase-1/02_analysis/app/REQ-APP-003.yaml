pages:
  - id: P010
    name: 照蛋任务列表
    source: observed+static
    entry: 首页“种蛋照蛋”入口。
    query_area: 搜索种蛋照蛋任务、筛选入口、待执行/已完成/已取消/已超期状态切换。
    list_or_cards: 养殖场-批次-品种、计划照蛋日期、照蛋数量、种蛋类型、周龄、平均蛋重/蛋重类型、产蛋日期、状态、孵化器名称；已超期提示。
    forms: 不适用。
    popups: 筛选入口可进入 P012；实际弹窗形态未确认。
    buttons_actions: 搜索、筛选、执行、查看、任务卡片查看、孵化器全景入口。
    states_transitions: 待执行/已完成/已取消；待执行超时为已超期告警。
    return_path: 首页→列表；进入搜索、筛选、详情、执行，返回来源列表。
  - id: P011
    name: 照蛋任务搜索
    source: observed+static
    entry: P010 搜索入口。
    query_area: 计划号/任务号/养殖场/批次/品种关键字；历史搜索和搜索按钮。
    list_or_cards: 照蛋任务结果卡片，显示待执行、已超期、已完成、已取消及执行/查看。
    forms: 搜索输入；历史最多三行、最近优先的注释为 static。
    popups: 未观察到。
    buttons_actions: 搜索、历史项、垃圾筐删除、执行/查看、卡片查看。
    states_transitions: 搜索结果排序与空结果文案可见；排序算法未验证。
    return_path: 返回 P010；结果进入 P014/P015/P016/P017。
  - id: P012
    name: 照蛋任务筛选
    source: observed+static
    entry: P010 筛选入口。
    query_area: 计划照蛋日期快捷范围/日期项、养殖场、种蛋类型、品种、蛋重类型、周龄、平均蛋重、任务状态、告警状态。
    list_or_cards: 背景任务卡片；确认后结果在 P013。
    forms: 选择项和周龄/平均蛋重录入；平均蛋重匹配蛋重类型为 static 注释。
    popups: 未确认是弹层还是独立页。
    buttons_actions: 确认、重置、返回列表/搜索。
    states_transitions: 全部/待执行/已完成/已取消与正常/已超期组合。
    return_path: 确认→P013；重置清空项；返回 P010/P011。
  - id: P013
    name: 照蛋任务筛选结果
    source: observed+static
    entry: P012 确认后。
    query_area: 搜索、筛选入口。
    list_or_cards: 按条件调整的照蛋任务卡片，含执行/查看与已超期。
    forms: 不适用。
    popups: 未观察到。
    buttons_actions: 搜索、筛选、执行/查看、卡片查看、孵化器入口。
    states_transitions: 与 P010 状态规则相同。
    return_path: 返回 P010/P011/P012 或进入详情/执行。
