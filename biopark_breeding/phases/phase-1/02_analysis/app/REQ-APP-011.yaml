scope:
  baseline_statement: "孵化器 / 库存查询（573）；P052–P056：孵化器列表、库位详情、搜索、筛选、结果存在。验收需区分孵化器库位与蛋库库位。"
  included: "孵化器库位库存列表、库位详情、搜索、筛选、筛选结果及入口/返回关系。"
  excluded: "新增、编辑、删除、入库、出库、盘点、任务执行、接口实现、权限实现和持久化实现。"
  safety_boundary: "本次仅打开页面并读取渲染 DOM/文本/控件；未执行业务写操作。"
pages:
  - id: P052
    name: "孵化器列表"
    page_file: "孵化器列表.html"
    evidence_path: "01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/{screenshots/page-052.png,dom/page-052.html,page_text/page-052.txt}"
    entry_and_return:
      entry: "observed/static：首页、种蛋上孵/照蛋/出雏相关任务页可进入孵化器列表；具体按钮权限未确认。"
      return: "static：首页、孵化器搜索、孵化器筛选、孵化器库位详情、上孵任务详情-待执行、出入库记录列表。"
    contract:
      query_area: "observed：顶部有搜索、筛选、全景入口；状态摘要显示全部（66）、空位（5）、未满（53）、满容（53）、超容（3），页面另显示停用等状态。"
      list_or_cards: "observed：按孵化器/库位展示种蛋卡片，含数量、周龄、平均蛋重及类型、产蛋日期、养殖场-批次-品种、库位号、库位状态、孵化状态；有拼车/子库位展示。"
      form: "未观察到独立录入表单；搜索和筛选分别进入独立页面。"
      dialogs: "未观察到独立弹窗；详情为独立页面。"
      buttons_actions: "observed：搜索、筛选、全景、状态切换、库位/记录卡片入口；static：进入库位详情、任务详情和出入库记录。未点击写操作。"
      state: "observed：库位状态至少有空位、未满、满容、超容、停用；种蛋/任务语义出现孵化中、待照蛋、已超期。未观察到状态转换触发条件。"
  - id: P053
    name: "孵化器库位详情"
    page_file: "孵化器库位详情.html"
    evidence_path: "01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/{screenshots/page-053.png,dom/page-053.html,page_text/page-053.txt}"
    entry_and_return:
      entry: "observed/static：从孵化器列表或搜索结果的库位项进入。"
      return: "static：孵化器列表。"
    contract:
      query_area: "不适用；详情页未观察到查询控件。"
      list_or_cards: "observed：库位信息、当前库存、托盘数、散装数、库位状态、孵化器、库位、孵化场；种蛋信息含养殖场、批次、品种、种蛋类型、周龄、蛋重类型、平均蛋重、产蛋日期、种蛋状态。"
      form: "未观察到录入表单。"
      dialogs: "未观察到独立弹窗；信息区默认收缩的语义来自页面注释。"
      buttons_actions: "observed：详情展开/收缩、关联计划复制；具体复制后的持久化行为未观察到。"
      state: "observed：库位状态未满、空位、满容、超容；种蛋状态待照蛋；页面注释称单库位关联计划只有一个。未观察到状态转换操作。"
  - id: P054
    name: "孵化器搜索"
    page_file: "孵化器搜索.html"
    evidence_path: "01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/{screenshots/page-054.png,dom/page-054.html,page_text/page-054.txt}"
    entry_and_return:
      entry: "observed/static：从孵化器列表进入搜索页。"
      return: "static：孵化器列表、孵化器库位详情、上孵任务详情-待执行、出入库记录列表及任务详情页候选。"
    contract:
      query_area: "observed：搜索输入/搜索按钮；字段提示为计划号、库位号、养殖场、批次、品种；页面展示代孵/树田代孵等历史候选。"
      list_or_cards: "observed：搜索结果复用孵化器库位卡片，包含库存数量、库位状态、种蛋和任务语义。"
      form: "observed：关键字输入；未观察到字段级校验或复杂组合表单。"
      dialogs: "未观察到独立弹窗；空结果提示为没有找到相关的库存，另有搜索有结果/无结果文案。"
      buttons_actions: "observed：搜索、历史搜索项、结果卡片；页面注释提出输入后可自动触发查询，但是否实现需确认。"
      state: "observed：结果可呈现有结果/无结果；历史最多三行是页面注释，不等同于持久化规则。"
  - id: P055
    name: "孵化器筛选"
    page_file: "孵化器筛选.html"
    evidence_path: "01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/{screenshots/page-055.png,dom/page-055.html,page_text/page-055.txt}"
    entry_and_return:
      entry: "observed/static：从孵化器列表或搜索页进入筛选页。"
      return: "static：孵化器搜索、上孵任务筛选、任务详情、出雏任务列表、孵化器列表、出雏任务筛选结果、孵化器筛选。具体返回按钮未确认。"
    contract:
      query_area: "observed：状态标签/选项含全部、空位、满容、超容、停用、待上孵、已超期、待孵期、待排期；种蛋信息筛选含上孵日期、照蛋日期、养殖场、品种、蛋重类型、种蛋状态、种蛋类型；另有库位/仓库、周龄、平均蛋重等候选。"
      list_or_cards: "observed：筛选页仍显示孵化器库位卡片预览，含库位、种蛋和任务状态。"
      form: "observed：选择类筛选项、日期范围/快捷时间项、周龄和平均蛋重等候选输入；字段是否必填、单多选未完全明确。"
      dialogs: "未观察到独立弹窗；筛选是独立页面。"
      buttons_actions: "observed：确认、重置、筛选项选择；确认后的结果页为 P056。"
      state: "observed：筛选维度展示库位状态和种蛋/任务状态；未观察到状态之间的业务转换。"
  - id: P056
    name: "筛选结果"
    page_file: "筛选结果_3.html"
    evidence_path: "01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/{screenshots/page-056.png,dom/page-056.html,page_text/page-056.txt}"
    entry_and_return:
      entry: "observed/static：由孵化器筛选确认进入；页面标题仅为筛选结果。"
      return: "static：证据中的页面链接混有蛋库/种蛋任务页面及出入库记录，需确认产品实际返回孵化器列表还是通用结果入口。"
    contract:
      query_area: "observed：顶部仍有搜索、筛选、全景及孵化器名称上下文；未观察到新的查询字段。"
      list_or_cards: "observed：展示孵化器库位筛选结果卡片，与 P052 的库位/种蛋字段一致。"
      form: "未观察到独立表单。"
      dialogs: "未观察到独立弹窗；有无结果文案同时存在于渲染文本中，具体显隐条件未确认。"
      buttons_actions: "observed/static：搜索、筛选、全景、结果卡片及记录入口。"
      state: "observed：结果卡片显示满容、超容、空位、未满、停用及孵化/待照蛋/已超期语义；未观察到状态转换。"
