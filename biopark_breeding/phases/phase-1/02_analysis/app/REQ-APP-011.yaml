cross_module_refs:
  - ref: "首页"
    relation: "entry"
    evidence_level: static
    note: "基线列为入口；账号菜单权限未确认。"
  - ref: "种蛋上孵/照蛋/出雏"
    relation: "related_task_context"
    evidence_level: static
    note: "基线依赖模块；页面链接可达不表示业务数据已联通。"
  - ref: "孵化器 / 出入库记录"
    relation: "record_link"
    evidence_level: static
    note: "由 P052/P054/P056 的记录入口关联，本分片不实现写操作。"
  - ref: "合格蛋库、二级蛋库、蛋库库存查询"
    relation: "boundary_comparison"
    evidence_level: inferred
    note: "用于区分孵化器库位与蛋库库位；实际对象主键和接口未确认。"
business_rules:
  - id: BR-011-01
    statement: "孵化器库存应按孵化器库位解释，不应直接当作蛋库库位。"
    evidence_level: inferred
    source: "模块拆分清单 D-02/D-04、P052/P053 页面内容"
  - id: BR-011-02
    statement: "同一孵化器中因上孵计划不同可展示为不同子库位，详情关联计划在原型注释中描述为一个。"
    evidence_level: observed
    source: "P052/P053 页面注释"
  - id: BR-011-03
    statement: "库位详情默认收缩，展开后显示计划相关信息；若任务已下发，计划区可能显示任务号。"
    evidence_level: observed
    source: "P053 页面注释"
  - id: BR-011-04
    statement: "搜索页的搜索历史最多三行、输入后自动触发查询是原型注释建议；是否作为正式产品规则需确认。"
    evidence_level: inferred
    source: "P054 页面注释"
  - id: BR-011-05
    statement: "状态标签的展示不等同于状态机；本次未观察到状态转换按钮、触发条件或持久化结果。"
    evidence_level: observed
    source: "P052/P055/P056 live DOM 与页面证据"
open_questions:
  - id: OQ-011-01
    question: "P056 的 static 链接混有蛋库/种蛋任务页面，筛选结果的真实返回入口和对象绑定是否应固定为孵化器？"
    evidence_level: open_question
    impact: "影响路由、对象隔离和验收边界。"
  - id: OQ-011-02
    question: "孵化器库存列表的正式字段、分页/排序、实时刷新、空结果和接口错误处理是什么？"
    evidence_level: open_question
    impact: "影响查询接口契约和异常测试。"
  - id: OQ-011-03
    question: "库位状态、种蛋状态和任务状态之间是否存在正式状态机及转换规则？"
    evidence_level: open_question
    impact: "影响状态验收；当前只能验证展示。"
  - id: OQ-011-04
    question: "搜索历史、自动查询和复制计划号是否需要本地持久化或权限控制？"
    evidence_level: open_question
    impact: "影响客户端行为和隐私边界。"
handoff:
  next_stage: "03_testpoints"
  status: "analysis_complete_candidate"
  review_gate: "需产品确认开放问题后再进入测点设计；本文件不表示已评审或已实现。"
