    relation: "write_entry_boundary"
    evidence_level: static
    note: "页面可达候选不表示已授权执行。"
business_rules:
  - id: BR-015-01
    statement: "苗间列表应按存发苗间对象解释，卡片主体为鸡苗库存，不应直接当作蛋库或设备库位列表。"
    evidence_level: inferred
    source: "模块拆分清单 REQ-APP-015、P086-P090"
  - id: BR-015-02
    statement: "鸡苗详情展示鸡苗信息、当前库存、关联计划、鸡苗类型和存发苗间仓库信息；关联计划默认收缩。"
    evidence_level: observed
    source: "P087 页面注释与 live DOM"
  - id: BR-015-03
    statement: "列表/搜索/结果卡片可出现出库、盘点、记录入口；本次只记录导航，不执行库存变化。"
    evidence_level: observed
    source: "P086/P088/P090"
  - id: BR-015-04
    statement: "搜索历史最多三行和输入后自动查询属于注释建议，是否作为正式规则需确认。"
    evidence_level: inferred
    source: "P088 页面注释"
  - id: BR-015-05
    statement: "P089 的筛选控件同时出现鸡苗字段和蛋库/种蛋/库位式状态，不能据此推断正式筛选模型。"
    evidence_level: observed
    source: "P089 DOCX、axure_map 和 live DOM"
open_questions:
  - id: OQ-015-01
    question: "P089 的满容/空位/种蛋信息/合格蛋仓库等控件是否为原型复用残留，鸡苗筛选的正式字段和状态是什么？"
    evidence_level: open_question
    impact: "影响筛选契约、对象隔离和测试范围。"
  - id: OQ-015-02
    question: "P090 static 链接混有蛋库/种蛋任务页面，筛选结果真实返回路径是否应固定为存发苗间？"
    evidence_level: open_question
    impact: "影响路由和模块边界。"
  - id: OQ-015-03
    question: "鸡苗库存字段、数量口径、刷新/分页/排序和异常处理是什么？"
    evidence_level: open_question
    impact: "影响库存查询接口和一致性验收。"
  - id: OQ-015-04
    question: "鸡苗类型除健雏外是否有其他枚举，关联计划与出雏任务如何关联？"
    evidence_level: open_question
    impact: "影响详情字段和跨模块追溯。"
handoff:
  next_stage: "03_testpoints"
  status: "analysis_complete_candidate"
  review_gate: "先确认存发苗间对象、鸡苗筛选字段和跨模块写入口边界，再进入测点设计。"
  prohibited_next_actions: "未经授权不得出库、入库、盘点、批量操作、执行任务或远程写入。"
