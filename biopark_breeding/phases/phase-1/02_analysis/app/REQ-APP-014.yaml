    statement: "列表、搜索、筛选结果和详情必须绑定出雏器及其库位对象。"
    evidence_level: inferred
    source: "模块拆分清单 REQ-APP-014"
  - id: BR-014-02
    statement: "记录方向为入库/出库，方式为自动/手动，出雏器场景的原因出现种蛋照蛋/种蛋出雏。"
    evidence_level: observed
    source: "P067-P071"
  - id: BR-014-03
    statement: "详情中计划号有则显示并提供复制；备注、操作人和出雏器库位信息为可见字段。"
    evidence_level: observed
    source: "P071"
