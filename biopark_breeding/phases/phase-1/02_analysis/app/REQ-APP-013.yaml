      form: "未观察到录入表单。"
      dialogs: "未观察到独立弹窗；信息区默认收缩语义来自注释。"
      buttons_actions: "observed：详情展开/收缩、关联计划复制；复制反馈未观察到。"
      state: "observed：库位状态占用、空位、停用；种蛋状态待出雏；计划区可显示任务号/出雏数量的说明。未观察到状态转换。"
