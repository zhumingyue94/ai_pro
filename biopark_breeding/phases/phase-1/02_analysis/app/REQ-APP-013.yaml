    contract:
      query_area: "observed：搜索、筛选、全景入口；摘要含全部（66）、空位（5）、占用（53）、停用（2）。"
      list_or_cards: "observed：按出雏器/库位展示种蛋卡片，含周龄、平均蛋重及类型、产蛋日期、养殖场-批次-品种、库位号、占用/空位/停用、孵化中/待出雏/已超期等语义。"
      form: "未观察到独立录入表单。"
      dialogs: "未观察到独立弹窗；详情为独立页面。"
      buttons_actions: "observed：搜索、筛选、全景、状态切换、库位卡片；未执行出雏或出库动作。"
      state: "observed：库位状态为空位、占用、停用；任务/种蛋语义含孵化中、待出雏、已超期；未观察到状态转换。"
