business_rules:
  - id: BR-013-01
    statement: "出雏器库存必须按出雏器库位解释，不能直接复用其他设备或蛋库对象。"
    evidence_level: inferred
    source: "模块拆分清单 D-02/D-04、P062/P063"
  - id: BR-013-02
    statement: "同一出雏器中不同上孵计划可展示为不同子库位；页面注释要求详情关联计划保持区分。"
    evidence_level: observed
    source: "P062/P063 页面注释"
  - id: BR-013-03
    statement: "出雏器详情默认收缩；任务已下发时计划区可能展示任务号和出雏数量，并需展示实际待出雏数量。"
    evidence_level: observed
    source: "P063 页面注释"
  - id: BR-013-04
    statement: "搜索历史和自动查询行为是原型注释建议；是否正式实现及持久化待确认。"
    evidence_level: inferred
    source: "P064 页面注释"
  - id: BR-013-05
    statement: "占用、空位、停用与待出雏等标签是展示状态，不构成已确认状态机。"
    evidence_level: observed
    source: "P062/P065/P066 live DOM"
open_questions:
  - id: OQ-013-01
    question: "P066 static 链接复用蛋库/种蛋任务页面，筛选结果的对象绑定和返回路径是否正确？"
    evidence_level: open_question
    impact: "影响路由和模块隔离。"
  - id: OQ-013-02
    question: "出雏器库位的正式字段、实际待出雏数量来源、刷新时机和接口错误规则是什么？"
    evidence_level: open_question
    impact: "影响库存契约和数据一致性验证。"
  - id: OQ-013-03
    question: "库位/种蛋/任务状态之间是否有正式转换及权限？"
    evidence_level: open_question
    impact: "当前只能验证静态展示。"
handoff:
  next_stage: "03_testpoints"
  status: "analysis_complete_candidate"
  review_gate: "产品确认出雏器对象、待出雏字段和结果返回路径后再进入测点设计。"
  prohibited_next_actions: "未经授权不得执行出雏、出库、入库、盘点、任务提交或远程写入。"
