schema_version: "1.0"
req_id: REQ-APP-006
module_name: "合格蛋库 / 出入库记录"
zentao_module_id: 568
platform: app
analysis_status: analyzed_from_docx_baseline_and_readonly_prototype
scope:
  object_scope: 合格蛋库
  object_scope_evidence: inferred
  object_scope_basis: "基线将通用出入库记录页面分配到合格蛋库；页面文本同时出现合格蛋、二级蛋，实际对象隔离需确认。"
  included: "出入库记录列表、搜索、筛选、筛选结果、详情的只读查询契约。"
  excluded: "出入库写入、入库/出库确认、P027/P041 作废页、接口实现和权限实现。"
evidence_legend:
  observed: "实时原型在 networkidle 后的渲染 DOM、页面文本和控件。"
  static: "DOCX 页面表、Axure 页面树、静态页面链接或保存的 DOM/page_text。"
  inferred: "按基线和页面语义归纳，需业务确认。"
  open_question: "输入材料未明确，不能当作事实。"
inputs:
  - path: 01_requirements/app/种禽孵化管理系统-APP端原型需求说明书.docx
    type: docx
    sections: ["5.42 出入库记录列表", "5.43 出入库记录搜索", "5.44 出入库记录筛选", "5.45 筛选结果", "5.46 出入库详情"]
    evidence_level: static
  - path: 01_requirements/app/模块拆分清单.md
    type: baseline
    sections: ["REQ-APP-006", "D-04", "实施边界"]
    evidence_level: static
  - path: 01_requirements/app/axure_map.md
    type: axure_map
    sections: ["P042", "P043", "P044", "P045", "P046", "页面内导航边界"]
    evidence_level: static
  - path: 01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/
    type: readonly_evidence_run
    evidence_level: static
  - path: http://127.0.0.1:5500/
    type: live_prototype
    viewport: "430x932"
    wait: networkidle
    browser_mode: "headless=False"
    evidence_level: observed
source_pages:
  - page_id: P042
    name: 出入库记录列表
    status: 正常
    evidence: [{level: observed, path: "http://127.0.0.1:5500/出入库记录列表.html"}, {level: static, path: 01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/page_text/page-042.txt}, {level: static, path: 01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/dom/page-042.html}]
  - page_id: P043
    name: 出入库记录搜索
    status: 正常
    evidence: [{level: observed, path: "http://127.0.0.1:5500/出入库记录搜索.html"}, {level: static, path: 01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/page_text/page-043.txt}, {level: static, path: 01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/dom/page-043.html}]
  - page_id: P044
    name: 出入库记录筛选
    status: 正常
    evidence: [{level: observed, path: "http://127.0.0.1:5500/出入库记录筛选.html"}, {level: static, path: 01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/page_text/page-044.txt}, {level: static, path: 01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/dom/page-044.html}]
  - page_id: P045
    name: 筛选结果
    status: 正常
    evidence: [{level: observed, path: "http://127.0.0.1:5500/筛选结果_1.html"}, {level: static, path: 01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/page_text/page-045.txt}, {level: static, path: 01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/dom/page-045.html}]
  - page_id: P046
    name: 出入库详情
    status: 正常
    evidence: [{level: observed, path: "http://127.0.0.1:5500/出入库详情.html"}, {level: static, path: 01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/page_text/page-046.txt}, {level: static, path: 01_requirements/app/axure_evidence/RUN_20260824_AXURE_APP_172511/dom/page-046.html}]
page_contracts:
  - page_id: P042
    name: 出入库记录列表
    evidence_levels: [observed, static, inferred, open_question]
    entry_and_return:
      entry: {level: static, detail: "首页合格蛋蛋库-出入库记录入口及 P026 库位记录动作指向该记录流程。"}
      return: {level: static, detail: "静态页面链接返回首页/搜索/筛选或详情；实时未观察到可复现页面内导航。"}
    query_area:
      level: observed
      items: [搜索, 筛选, "合格蛋库一号/二号/三号", "出入库方式：自动/手动", "出入库原因：种蛋上孵/销售", "时间：今日/昨日/近一周/近一个月/近3个月/近1年", "出/入库：入库/出库"]
      open_question: "默认库、默认时间、组合筛选逻辑、分页和排序未明确。"
    list_or_cards:
      level: observed
      items: [数量, 入库或出库, 计划号（出库示例）, 库位号, 周龄, 平均蛋重/类型, 产蛋日期, 入库/出库时间, 入库/出库原因, 种蛋类型, 养殖场-批次-品种, 出入库方式]
      detail: "实时列表展示手动入库、自动出库示例；静态注释称一期入库都为手动、出库都为自动，但该规则需确认。"
    form: {level: observed, detail: "未观察到列表页内联编辑表单；筛选在 P044。"}
    dialogs: {level: observed, detail: "未观察到业务弹窗。"}
    actions: {observed: [搜索, 筛选], static: [点击记录进入详情, 返回首页]}
    status_and_transitions:
      observed: [入库, 出库, 自动, 手动]
      inferred: "入库/出库是记录类型，自动/手动是记录方式，不等同于库存状态机。"
      open_question: "记录生成时机、撤销/冲正、同一记录与库存的关联规则未明确。"
  - page_id: P043
    name: 出入库记录搜索
    evidence_levels: [observed, static, inferred, open_question]
    entry_and_return:
      entry: {level: static, detail: "由 P042 搜索入口进入。"}
      return: {level: static, detail: "搜索结果复用记录卡片，可返回记录列表或详情；实际点击未验证。"}
    query_area:
      level: observed
      items: [搜索输入框, 搜索, 历史搜索, 计划号, 任务号, 库位号, 养殖场, 批次, 品种]
      rules: [{level: static, detail: "原型注释提出可按输入关键字查找当前账户现存任务，搜索算法可一期简化。"}, {level: open_question, detail: "历史搜索保存数量、匹配优先级和关键词规范未明确。"}]
    list_or_cards: {level: observed, detail: "有结果/无结果文本及出入库记录卡片可见；实时 DOM 存在 search input。"}
    form: {level: observed, detail: "搜索输入；未观察到写入表单。"}
    dialogs: {level: observed, detail: "未观察到业务弹窗。"}
    actions: {observed: [搜索, "选择历史搜索词"], static: [进入记录详情, 返回记录列表]}
    status_and_transitions: {observed: [搜索有结果, 搜索无结果], open_question: "查询异常、权限不足和网络失败提示未明确。"}
  - page_id: P044
    name: 出入库记录筛选
    evidence_levels: [observed, static, inferred, open_question]
    entry_and_return:
      entry: {level: static, detail: "由 P042 筛选入口进入。"}
      return: {level: static, detail: "确认进入 P045，重置恢复默认；实际点击未执行。"}
    query_area:
      level: observed
      items: [库, 出入库日期, 养殖场, 品种, 蛋重类型, 出/入库, 出入库方式, 出入库原因, 确认, 重置]
      detail: "实时 DOM 存在日期、文本和选择控件；页面显示近1周、近1个月、近3个月、近1年等日期快捷项。"
      open_question: "筛选条件是否全部组合、日期闭区间和默认值未明确。"
    list_or_cards: {level: observed, detail: "筛选页面展示记录卡片预览；结果为 P045。"}
    form: {level: observed, items: [库选择, 日期范围, 养殖场选择, 品种选择, 蛋重类型选择, 出入库选择, 出入库方式选择, 出入库原因选择]}
    dialogs: {level: observed, detail: "未观察到业务弹窗。"}
    actions: {observed: [确认, 重置], static: [进入筛选结果, 返回记录列表/搜索]}
    status_and_transitions: {observed: [全部, 入库, 出库, 自动, 手动], open_question: "筛选标签与业务状态的关系、空筛选行为未明确。"}
  - page_id: P045
    name: 筛选结果
    evidence_levels: [observed, static, inferred, open_question]
    entry_and_return:
      entry: {level: static, detail: "由 P044 确认进入。"}
      return: {level: static, detail: "静态链接可返回列表/搜索/筛选或进入详情；实时未验证。"}
    query_area: {level: observed, items: [搜索, 筛选, "合格蛋库一号"], detail: "未观察到可编辑筛选表单。"}
    list_or_cards: {level: observed, detail: "复用 P042 记录卡片，并展示无结果文本。"}
    form: {level: observed, detail: "未观察到内联编辑表单。"}
    dialogs: {level: observed, detail: "未观察到业务弹窗。"}
    actions: {observed: [搜索, 筛选], static: [进入出入库详情, 返回记录列表]}
    status_and_transitions: {observed: [入库, 出库, 自动, 手动], open_question: "筛选条件回退和结果分页未明确。"}
  - page_id: P046
    name: 出入库详情
    evidence_levels: [observed, static, inferred, open_question]
    entry_and_return:
      entry: {level: static, detail: "由记录列表、搜索或筛选结果进入详情。"}
      return: {level: static, detail: "返回出入库记录列表；实时未观察到可复现点击。"}
    query_area: {level: observed, detail: "未观察到查询区。"}
    list_or_cards: {level: observed, items: [出入库信息, 种蛋信息, 出/入库, 数量, 方式, 原因, 时间, 计划号, 备注, 操作人, 仓库, 库位, 孵化场]}
    form: {level: observed, detail: "未观察到可编辑字段。"}
    dialogs: {level: observed, detail: "未观察到业务弹窗。"}
    actions: {observed: [复制], static: ["复制计划号（有计划号时）", 返回记录列表]}
    status_and_transitions:
      observed: [入库, 出库, 自动, 手动]
      open_question: "计划号可空、备注、操作人及记录不可篡改规则未明确。"
interfaces:
  - name: movement_record_query
    direction: read
    evidence_level: open_question
    observed_contract: "列表/详情需要记录类型、数量、库位、蛋信息、时间、原因、方式、计划号、操作人等。"
    endpoint_or_protocol: "未观察到接口地址、协议、鉴权、分页或排序定义。"
    candidate_inputs: [合格蛋库标识, 关键词, 计划号, 任务号, 库位号, 养殖场, 批次, 品种, 日期范围, 出入库类型, 方式, 原因]
    candidate_outputs: [记录列表, 记录详情, 空结果状态]
  - name: movement_record_detail
    direction: read
    evidence_level: open_question
    observed_contract: "P046 读取单条出入库记录及关联种蛋、库位信息。"
    endpoint_or_protocol: "未观察到接口定义。"
cross_module_refs:
  - {ref: REQ-APP-001, module: 首页, zentao_module_id: 556, relation: entry, evidence_level: observed, detail: "首页实时文本显示合格蛋蛋库-出入库记录。"}
  - {ref: REQ-APP-005, module: 合格蛋库 / 库存查询, zentao_module_id: 567, relation: source_navigation, evidence_level: static}
  - {ref: REQ-APP-002, module: 孵化任务 / 种蛋上孵, zentao_module_id: 564, relation: possible_outbound_reason, evidence_level: inferred, detail: "记录示例出现种蛋上孵；是否由该任务实际生成需确认。"}
  - {ref: REQ-APP-007, module: 合格蛋库 / 盘点记录, zentao_module_id: 569, relation: sibling_record, evidence_level: static}
business_rules:
  - {id: BR-006-01, rule: "记录至少区分入库和出库，并显示自动/手动方式。", evidence_level: observed}
  - {id: BR-006-02, rule: "记录卡片展示数量、库位、蛋信息、时间和原因；详情补充计划号、备注、操作人和场区。", evidence_level: observed}
  - {id: BR-006-03, rule: "原型示例中入库记录为手动、出库记录为自动且可能带计划号；这是示例/注释，不足以确认系统强制规则。", evidence_level: inferred}
  - {id: BR-006-04, rule: "合格蛋库对象边界来自基线，页面同时出现二级蛋标签，必须确认数据隔离。", evidence_level: inferred}
  - {id: BR-006-05, rule: "记录查询不等同于入库/出库执行；本次未执行任何写操作。", evidence_level: observed}
  - {id: BR-006-06, rule: "记录生成、冲正、删除、权限、异常和持久化未定义。", evidence_level: open_question}
open_questions:
  - {id: OQ-006-01, question: "合格蛋库与二级蛋库是否共用记录页面并通过库 ID/类型隔离？", impact: high}
  - {id: OQ-006-02, question: "入库/出库记录与任务、库存、盘点的关联键及一致性规则是什么？", impact: high}
  - {id: OQ-006-03, question: "自动/手动、原因枚举、计划号必填条件和记录可见权限是什么？", impact: high}
  - {id: OQ-006-04, question: "日期范围、分页、排序、模糊搜索、空结果和接口异常如何处理？", impact: medium}
  - {id: OQ-006-05, question: "是否允许撤销/冲正记录，详情是否可导出或复制全部字段？", impact: medium}
analysis_boundary:
  read_only: true
  prohibited_actions: [新增, 编辑, 删除, 入库, 出库, 盘点确认, 任务执行, 远程数据写入]
  not_claimed: [接口已实现, 权限已实现, 记录生成规则已确认, 页面内导航已真实点击验证]
handoff:
  next_owner: 产品/研发/测试设计
  deliverable_use: "确认对象隔离和记录生成规则后，补齐接口/权限/异常契约再进入测试点设计。"
  generated_files: [02_analysis/app/REQ-APP-006.yaml, 02_analysis/app/REQ-APP-006_合格蛋库-出入库记录.md]
