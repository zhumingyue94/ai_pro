    - 1、出雏数：照蛋任务执行结果，出雏数； 2、出雏车数：照蛋任务执行结果，出雏车数；为出雏器中现存库存数。
    - 执行任务： 1、待执行状态任务，有此操作按钮，已完成状态没有此操作按钮； 2、点击页面刷新，本页页内跳转为执行任务页面，可进行执行任务确认提交操作。
    - 返回：返回任务列表页，页面返回时，任务列表页筛选查询条件保持，保持原页面状态。
