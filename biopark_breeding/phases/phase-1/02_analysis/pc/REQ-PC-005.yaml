    editable: false
  - name: 原型派生/回填字段
    formula: 1、出雏数： ①受精蛋数，执行照蛋任务时产生的结果数据，计划进度为，出雏器’中，才有此数据； ②出雏任务待执行状态，一定有此数据； 3、出雏器： 执行照蛋任务时回填结果，系统上可能会有多个出雏器，均展示，超出部分….，鼠标移上去展示全部；
      4、操作人、操作时间： 为提交执行任务的账号信息和时间。 计划号： 孵化场： 全部孵化场 孵化一场 孵化二场 养殖场： 全部养殖场 宜兴一场 宜兴二场 养殖批次： 品种： 全部品种 AA 利丰 蛋重类型： 请选择蛋重类型 大 中 小
      特小 任务状态： 请选择任务状态 待执行 已完成 已终止 出雏日期： 搜索 重置 种蛋类型： 全部种蛋类型 合格蛋 二级蛋 出雏任务号： 操作日期： 产蛋日期： ~ ~ ~ 平均蛋重： 周龄： 操作人：
    editable: false
  - name: 原型派生/回填字段
    formula: 1、健雏： 入库存发苗间； 2、平均苗重： 入库存发苗间时，在存发苗间、出入库记录、盘点记录展示； 3、存发苗间： ①只展示并可选该计划孵化场下的存发苗间，如果只有一个存发苗间，默认选择该仓库； ②单选，只可选择一个存发苗间；
      ③健雏自动入库该存发苗间； 4、弱雏： 入次品库； 5、毛蛋： 入库次品库； 6、次品库： ①只展示并可选该计划孵化场下的次品库，如果只有一个次品库，默认选择该仓库； ②单选，只可选择一个次品库； ③弱雏、毛蛋自动入库该次品库； 7、淘汰雏：
      数据记录，不入任何仓库，系统中用于生产数据统计，业务中会做无害化处理销毁； 8、损失： ①数据记录，不入任何仓库，系统中用于生产数据统计； ②损失=出雏数-健雏-弱雏-毛蛋-淘汰雏； 9、入健率=健雏➗实际上孵数量； 10、受健率=健雏➗出雏数；
      11、淘汰率=淘汰雏➗实际上孵数； 12、毛蛋率=毛蛋➗实际上孵数； 13、受健率标准：（待定，规则需调研）； 14、达成率=受健率➗受健率标准。
    editable: false
  save_validations:
  - rule: 关于确认执行时，出库出雏器，入库存发苗间的说明： 1、确认执行时，同时进行两个出入库操作： ①被选中的鸡苗（计划）从出雏器对应库位出库并生成出库记录； ②被分配的健雏（计划）入库存发苗间；毛蛋、弱雏入库次品库，并生成入库记录；
      2、确认提交时，判断，选择出库的出雏器中是否存在，数量是否足够，如果不存在或不够，则弹框提示，无法提交成功，确认关闭弹框时，页面刷新，展示最新出雏器数据，二次提交时再次提示出雏数量不符，确认后可以提交成功；（此种情况当前系统逻辑流程中不可能出现，主要为系统校错的处理，视研发情况是否处理）。
    when:
    - 保存
    - 确认
    - 提交
    message: 需求/原型规则，具体错误文案需确认
  - rule: 确认执行，操作后： 一、操作数据均符合条件时，弹框进行二次确认操作； 二、执行成功后，任务详情页刷新： 1、任务状态：变为已完成； 2、展示执行人、操作时间、备注； 3、出雏结果功能区域根据提交结果展示相关信息，不可修改；
      三、确认执行按钮消失，至剩返回按钮，点击返回至任务列表页。
    when:
    - 保存
    - 确认
    - 提交
    message: 需求/原型规则，具体错误文案需确认
