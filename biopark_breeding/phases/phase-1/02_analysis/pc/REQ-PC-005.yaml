  - id: NOTES
    name: 原型注释
    fields:
    - 健雏入库存发苗间，弱雏进次品蛋库，毛蛋入库次品蛋库，淘汰雏和损失只做统计
    - 1、出雏数：照蛋任务执行结果，出雏数； 2、出雏车数：照蛋任务执行结果，出雏车数；为出雏器中现存库存数。
    - 1、健雏： 入库存发苗间； 2、平均苗重： 入库存发苗间时，在存发苗间、出入库记录、盘点记录展示； 3、存发苗间： ①只展示并可选该计划孵化场下的存发苗间，如果只有一个存发苗间，默认选择该仓库； ②单选，只可选择一个存发苗间； ③健雏自动入库该存发苗间；
      4、弱雏： 入次品库； 5、毛蛋： 入库次品库； 6、次品库： ①只展示并可选该计划孵化场下的次品库，如果只有一个次品库，默认选择该仓库； ②单选，只可选择一个次品库； ③弱雏、毛蛋自动入库该次品库； 7、淘汰雏： 数据记录，不入任何仓库，系统中用于生产数据统计，业务中会做无害化处理销毁；
      8、损失： ①数据记录，不入任何仓库，系统中用于生产数据统计； ②损失=出雏数-健雏-弱雏-毛蛋-淘汰雏； 9、入健率=健雏➗实际上孵数量； 10、受健率=健雏➗出雏数； 11、淘汰率=淘汰雏➗实际上孵数； 12、毛蛋率=毛蛋➗实际上孵数；
      13、受健率标准：（待定，规则需调研）； 14、达成率=受健率➗受健率标准。
    - 关于确认执行时，出库出雏器，入库存发苗间的说明： 1、确认执行时，同时进行两个出入库操作： ①被选中的鸡苗（计划）从出雏器对应库位出库并生成出库记录； ②被分配的健雏（计划）入库存发苗间；毛蛋、弱雏入库次品库，并生成入库记录； 2、确认提交时，判断，选择出库的出雏器中是否存在，数量是否足够，如果不存在或不够，则弹框提示，无法提交成功，确认关闭弹框时，页面刷新，展示最新出雏器数据，二次提交时再次提示出雏数量不符，确认后可以提交成功；（此种情况当前系统逻辑流程中不可能出现，主要为系统校错的处理，视研发情况是否处理）。
    - 执行出雏任务时，出雏器出库，存发苗间入库。
    - 确认执行，操作后： 一、操作数据均符合条件时，弹框进行二次确认操作； 二、执行成功后，任务详情页刷新： 1、任务状态：变为已完成； 2、展示执行人、操作时间、备注； 3、出雏结果功能区域根据提交结果展示相关信息，不可修改； 三、确认执行按钮消失，至剩返回按钮，点击返回至任务列表页。
