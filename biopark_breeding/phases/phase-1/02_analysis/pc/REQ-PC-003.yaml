- id: BR-017
  rule: 1、计划上孵数：取计划设置中的计划上孵数量数值； 2、预计孵化车数：为计划上孵数根据孵化器库位容量计算，预计需要多少车辆数，预计孵化车数=计划上孵数➗孵化器库位容量；
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-018
  rule: 1、获取该库位种蛋存储信息，总蛋数、托盘数、散装数，预填全部数量，用户可修改； 2、每个库位上，托盘数、散装数、总蛋数三数据联动，修改其中一个数据后，其他数据根据重新计算调整；修改数量需要与种蛋仓库库存比较判断，超出库存无法修改；
    3、托盘数、散装数、总蛋数：三数据联动计算规则，①如果散装数不为0，总蛋数=（托盘数-1）*预设的托盘容量+散装数；②如果散装数为0，总蛋数=托盘数*预设的托盘容量；③填写/修改总蛋数，根据托盘容量自动计算填写托盘数、散装数；填写/修改托盘数、散装数自动计算总蛋数并填写；
    4、托盘数、散装数、总蛋数，均不受库位预设总容量限制，根据实际数据进行展示。
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-019
  rule: 关于孵化器上孵数的说明： 1、待分配： ①初始总数，为上面种蛋仓库操作列表中，操作的实际种蛋上孵数总和数； ②显示数=种蛋仓库选择上孵总数-已分配数； 2、已分配： ①为下方孵化器中操作进入孵化器的上孵数总和数； ②初始总数，为0；
    3、实际孵化车数： 为下方孵化器分配了多少库位行数（车辆数）总和； 4、一键分配： ①手动触发将全部种蛋仓库上孵数总和数，自动分配孵化器库位行数(车辆数）的操作，每次点击一键分配即按照系统分配逻辑自动分配，无需考虑现已编辑过的内容； ②根据预设孵化器库位容量进行自动分配，库位行数（车辆数）=种蛋仓库上孵总数➗孵化器库位容量；
    ③一键分配时，无需考虑孵化器现有库位库存情况，仅按照库位最大容量，进行满容量计算分配库位行数（车辆数）； 5、手动编辑修改： ①用户可以通过修改每个库位行内的托盘数、散装数，来修改调整该车辆上实际准备放多少数量； ②用户可以手动增加、删除库位行数（车辆数）；
    ③根据用户数量的修改，实时计算修改待分配、已分配、实际车辆数； ④托盘数不受限最大库位容量限制，散装数＜托盘容量。
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-020
  rule: 理论上不可能出现别的种类种蛋，种蛋仓库表格里每个库位显示种蛋信息，仅为了帮助用户进行信息核对使用，防止系统匹配出错，用户可以甄别。
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-021
  rule: 关于孵化器选择的说明： 1、孵化场： 只可入孵本计划/任务的孵化场； 2、孵化器： 根据选中的孵化场，匹配孵化器可选项，如果该孵化场下只有一个孵化器，则默认选择该孵化器； 3、孵化器库位： 根据选中的孵化器，匹配孵化器库位选项，如果该孵化器下只有一个库位，则默认选择该库位；
    4、每行车辆只能单选一个库位，不可多选； 5、关于孵化器库位筛选组件的用户以操作性说明： 通常情况下，孵化器库位均较多，不宜用下拉列表形式进行选择，建议弹框铺列选择，类似孵化器库存查询页列表；支持批量操作，即一次性选择多行的库位。 （此选择组件，视研发情况而定，可沟通讨论优化，为用户体验优化问题）。
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-022
  rule: 点击“+”，新增一行 空白计划，待编辑。
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-023
  rule: 1、复制：点击根据该行复制并新增一行，可编辑； 2、删除：如果删除该行，则该行上孵数量回退为待分配数量，实际车辆数减少1。
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-024
  rule: 关于确认执行时，出库种蛋仓库，入 库孵化器的说明： 1、确认执行时，同时进行两个出入库操作： ①被选中的蛋从种蛋仓库对应库位出库并生成出库记录； ②被分配的蛋入库孵化器对应库位并生成入库记录； 2、确认提交时，判断，待分配数量必须为0，既待分配数量需要全部分配完，否则弹框提示，无法提交成功；
    3、确认提交时，判断，选择出库的种蛋仓库中是否存在，数量是否足够，如果不存在或不够，则弹框提示，无法提交成功，确认关闭弹框时，页面刷新，展示最新种蛋仓库数据； 4、确认提交时，判断，如果实际上孵数量与预计上孵数不符时，弹框提示，进行二次确认；（此处分为多种情况，少了一定提示，多了是否提示或多多少比例提示，本次不做处理，以后优化再说）
    5、入库孵化器时，无需判断该库位当前情况，可超容量入库； 6、实际车辆数与预计车辆数： 没有核验关系，两者可能存在不一样，可多可少可相同。
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-025
  rule: 备注：非必填项，如果填写，则展示在 1、任务详情页； 2、孵化器库存查询库位列表页； 3、种蛋仓库出库记录备注； 4、孵化器入库记录备注。
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-026
  rule: 确认执行，操作后： 一、操作数据均符合条件时，弹框进行二次确认操作； 二、执行成功后，任务详情页刷新： 1、任务状态：变为已完成； 2、展示实际上孵数、执行人、操作时间、备注； 3、种蛋仓库： ①种蛋数，为确认操作时记录的当时种蛋仓库该库位的种蛋数量，非当前浏览时实时数据；
    ②上孵托盘数、上孵散装数、上孵数：为确认操作的实际上孵数量； ③预计上孵数、预计车辆数：均为原预计数量，取决于计划信息，不变； 4、孵化器： ①：实际上孵数：为确认执行时，实际确认入孵化器的上孵数总和； ②：实际车辆数：为确认执行时，实际确认入孵化器的库位行数（车辆数）总和；
    三、确认执行按钮消失，至剩返回按钮，点击返回至任务列表页。
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-027
  rule: 执行上孵任务时，种蛋仓库出库，孵化器入库。
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
