- id: BR-002
  rule: 一、执行： 1、待执行状态有此操作按钮，点击跳转执行页进行执行任务操作； 2、已终止状态下无此操作按钮； 二、详情： 点击跳转进入该任务详情页面，所有状态下均有此操作按钮； 三、关联任务： 根据该上孵计划已下发任务展现任务选项（不包括本任务），没有下发的任务不展示，点击跳转至该对应任务详情页。
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-003
  rule: 任务状态：一下说明均以已经生成任务为前提 1、待执行：任务已经生成并下发，尚未执行； 2、已完成：任务已经执行并确认提交操作； 3、已终止：任务对应计划进行了终止操作，任务跟随变为已终止状态；
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-004
  rule: 关于种蛋类型、鸡苗类型及对应出入库的划分说明： （一）种蛋： 1、种蛋类型：合格蛋（入）、二级蛋（脏蛋）（入）、次品蛋（入）、臭蛋（不入）； 2、次品蛋（入）：无精蛋、死胚蛋、大蛋、小蛋、毛蛋、破损蛋； 3、出入库划分： ①合格蛋：合格蛋蛋库；
    ②二级蛋（脏蛋）：二级蛋蛋库； ③次品蛋：次品库； ④臭蛋：不入库，直接淘汰，无害化处理； （二）鸡苗： 1、健雏（入）、弱雏（入）、淘汰雏（殘雏）（不入）； 2、出入库划分： ①健雏：鸡苗库； ②弱雏：次品库； ③淘汰雏（殘雏）：不入库，直接淘汰，无害化处理；
    （三）次品： 次品蛋、弱雏。
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-005
  rule: 关于批量操作按钮的说明： 1、导出： 导出计划列表，如果勾选导出勾选项，如果不勾选，默认导出全部；
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-006
  rule: 1、计划上孵数量：新建计划时录入的上孵数量，数值固定不变； 2、实际上孵数量：计划进度为，孵化器中，才有此数据，执行上孵任务时回填的数值； 3、孵化器：新建计划时为非必填项，执行上孵任务时回填结果，任务状态为，已完成，才有此数据，系统上可能会有多个孵化器，均展示，超出部分….，鼠标移上去展示全部；
    4、操作人、操作时间：为提交执行任务的账号信息和时间。
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-007
  rule: 关于种蛋、计划、任务的关系说明： 1、确定一个种蛋的关键字段包括： 养殖场、养殖批次、种蛋类型、品种、周龄、平均蛋重、蛋重类型、产蛋日期； 2、新建计划时，每条计划只能创建一种蛋，不会出现一条计划中有多种蛋要上孵； 3、每条任务对应唯一一条计划，及计划号，一条计划一条任务，任务的区分与什么种类的种蛋无关；
    4、但执行任务时，因为要匹配种蛋仓库、孵化器、出雏器、存发苗间，所以与种蛋的种类有强关联关系。
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋上孵任务
  - 上孵任务详情
  - 执行上孵任务
- id: BR-008
  rule: 每天凌晨零点，生成并下发当日上孵任务。
  source: live prototype annotation / related requirement page
