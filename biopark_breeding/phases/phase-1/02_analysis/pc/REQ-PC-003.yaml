  - rule: 关于确认执行时，出库种蛋仓库，入 库孵化器的说明： 1、确认执行时，同时进行两个出入库操作： ①被选中的蛋从种蛋仓库对应库位出库并生成出库记录； ②被分配的蛋入库孵化器对应库位并生成入库记录； 2、确认提交时，判断，待分配数量必须为0，既待分配数量需要全部分配完，否则弹框提示，无法提交成功；
      3、确认提交时，判断，选择出库的种蛋仓库中是否存在，数量是否足够，如果不存在或不够，则弹框提示，无法提交成功，确认关闭弹框时，页面刷新，展示最新种蛋仓库数据； 4、确认提交时，判断，如果实际上孵数量与预计上孵数不符时，弹框提示，进行二次确认；（此处分为多种情况，少了一定提示，多了是否提示或多多少比例提示，本次不做处理，以后优化再说）
      5、入库孵化器时，无需判断该库位当前情况，可超容量入库； 6、实际车辆数与预计车辆数： 没有核验关系，两者可能存在不一样，可多可少可相同。
