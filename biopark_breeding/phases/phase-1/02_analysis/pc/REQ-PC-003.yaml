  computed_fields:
  - name: 原型派生/回填字段
    formula: 关于筛选条件的说明： 1、孵化场、仓库可多选（待研发情况定）； 2、孵化场、养殖场为树形结构选择； 3、养殖批次为关键字查询，输入过程中查询现有关键字匹配养殖批次，下拉推荐选择项，可快速选择； 4、种蛋类型：默认只有合格蛋、二级蛋；
    editable: false
  - name: 原型派生/回填字段
    formula: 1、计划上孵数量：新建计划时录入的上孵数量，数值固定不变； 2、实际上孵数量：计划进度为，孵化器中，才有此数据，执行上孵任务时回填的数值； 3、孵化器：新建计划时为非必填项，执行上孵任务时回填结果，任务状态为，已完成，才有此数据，系统上可能会有多个孵化器，均展示，超出部分….，鼠标移上去展示全部；
      4、操作人、操作时间：为提交执行任务的账号信息和时间。
    editable: false
  - name: 原型派生/回填字段
    formula: 关于种蛋、计划、任务的关系说明： 1、确定一个种蛋的关键字段包括： 养殖场、养殖批次、种蛋类型、品种、周龄、平均蛋重、蛋重类型、产蛋日期； 2、新建计划时，每条计划只能创建一种蛋，不会出现一条计划中有多种蛋要上孵； 3、每条任务对应唯一一条计划，及计划号，一条计划一条任务，任务的区分与什么种类的种蛋无关；
      4、但执行任务时，因为要匹配种蛋仓库、孵化器、出雏器、存发苗间，所以与种蛋的种类有强关联关系。
    editable: false
  - name: 原型派生/回填字段
    formula: 1、根据计划信息生成任务，获取任务中种蛋的关键字段，查询种蛋仓库，匹配符合条件的种蛋，展示其所在仓库、库位、数量； 2、种蛋的关键字段包括：养殖场、养殖批次、种蛋类型、品种、周龄、平均蛋重、蛋重类型、产蛋日期；
    editable: false
  - name: 原型派生/回填字段
    formula: 1、计划上孵数：取计划设置中的计划上孵数量数值； 2、预计车辆数：为计划上孵数根据孵化器库位容量计算，预计需要多少车辆数，预计车辆数=计划上孵数➗孵化器库位容量；
    editable: false
  - name: 原型派生/回填字段
    formula: 1、计划上孵数：取计划设置中的计划上孵数量数值； 2、预计孵化车数：为计划上孵数根据孵化器库位容量计算，预计需要多少车辆数，预计孵化车数=计划上孵数➗孵化器库位容量；
    editable: false
  - name: 原型派生/回填字段
    formula: 1、获取该库位种蛋存储信息，总蛋数、托盘数、散装数，预填全部数量，用户可修改； 2、每个库位上，托盘数、散装数、总蛋数三数据联动，修改其中一个数据后，其他数据根据重新计算调整；修改数量需要与种蛋仓库库存比较判断，超出库存无法修改；
      3、托盘数、散装数、总蛋数：三数据联动计算规则，①如果散装数不为0，总蛋数=（托盘数-1）*预设的托盘容量+散装数；②如果散装数为0，总蛋数=托盘数*预设的托盘容量；③填写/修改总蛋数，根据托盘容量自动计算填写托盘数、散装数；填写/修改托盘数、散装数自动计算总蛋数并填写；
      4、托盘数、散装数、总蛋数，均不受库位预设总容量限制，根据实际数据进行展示。
    editable: false
  - name: 原型派生/回填字段
    formula: 关于孵化器上孵数的说明： 1、待分配： ①初始总数，为上面种蛋仓库操作列表中，操作的实际种蛋上孵数总和数； ②显示数=种蛋仓库选择上孵总数-已分配数； 2、已分配： ①为下方孵化器中操作进入孵化器的上孵数总和数； ②初始总数，为0；
      3、实际孵化车数： 为下方孵化器分配了多少库位行数（车辆数）总和； 4、一键分配： ①手动触发将全部种蛋仓库上孵数总和数，自动分配孵化器库位行数(车辆数）的操作，每次点击一键分配即按照系统分配逻辑自动分配，无需考虑现已编辑过的内容；
      ②根据预设孵化器库位容量进行自动分配，库位行数（车辆数）=种蛋仓库上孵总数➗孵化器库位容量； ③一键分配时，无需考虑孵化器现有库位库存情况，仅按照库位最大容量，进行满容量计算分配库位行数（车辆数）； 5、手动编辑修改： ①用户可以通过修改每个库位行内的托盘数、散装数，来修改调整该车辆上实际准备放多少数量；
      ②用户可以手动增加、删除库位行数（车辆数）； ③根据用户数量的修改，实时计算修改待分配、已分配、实际车辆数； ④托盘数不受限最大库位容量限制，散装数＜托盘容量。
    editable: false
  - name: 原型派生/回填字段
    formula: 理论上不可能出现别的种类种蛋，种蛋仓库表格里每个库位显示种蛋信息，仅为了帮助用户进行信息核对使用，防止系统匹配出错，用户可以甄别。
    editable: false
  - name: 原型派生/回填字段
    formula: 关于孵化器选择的说明： 1、孵化场： 只可入孵本计划/任务的孵化场； 2、孵化器： 根据选中的孵化场，匹配孵化器可选项，如果该孵化场下只有一个孵化器，则默认选择该孵化器； 3、孵化器库位： 根据选中的孵化器，匹配孵化器库位选项，如果该孵化器下只有一个库位，则默认选择该库位；
      4、每行车辆只能单选一个库位，不可多选； 5、关于孵化器库位筛选组件的用户以操作性说明： 通常情况下，孵化器库位均较多，不宜用下拉列表形式进行选择，建议弹框铺列选择，类似孵化器库存查询页列表；支持批量操作，即一次性选择多行的库位。
      （此选择组件，视研发情况而定，可沟通讨论优化，为用户体验优化问题）。
    editable: false
