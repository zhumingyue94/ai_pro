- 真实接口/数据库/权限实现
- 原型未确认的业务事实
business_rules:
- id: BR-001
  rule: 该页面为登录账号权限范围下所有出雏器，出入库记录页。
  source: live prototype annotation / related requirement page
  applies_to:
  - 出入库记录
- id: BR-002
  rule: 出雏器的出入库均为自动出入库，入库：种蛋照蛋；出库：种蛋出雏。
  source: live prototype annotation / related requirement page
  applies_to:
  - 出入库记录
- id: BR-003
  rule: 库位号：出入库记录如果是因为同一个库位号同时混装了多种蛋，产生了虚拟库位的记录，则此处记录的库位号为当时的虚拟库位号，并且标记“混”。
  source: live prototype annotation / related requirement page
  applies_to:
  - 出入库记录
- id: BR-004
  rule: 关于操作类型、方式、原因的说明： 1、操作类型：入库、出库； 2、方式：自动；出雏器只有自动出入库，没有手动出入库，自动盘点及任务执行过程中系统自动进行的出入库操作数据； 3、原因：出入库的原因，不同操作类型、方式对应的原因不同：
    ①入库——自动：种蛋照蛋； ②出库——自动：种蛋出雏。
  source: live prototype annotation / related requirement page
  applies_to:
  - 出入库记录
- id: BR-005
  rule: 上孵计划号：所有出入库记录均来自上孵计划的任务，所有总有上孵计划号。
  source: live prototype annotation / related requirement page
  applies_to:
  - 出入库记录
- id: BR-006
  rule: 出入库记录，按照出入库类型、时间、种蛋、库位号独立生成操作记录。 搜索 重置 平均蛋重： 出雏器： 全部出雏器 北一号出雏器 北二号出雏器 南一号出雏器 库位号： 养殖场： 全部养殖场 养殖场一 养殖场二 养殖场三 品种： 全部品种
    AA 利丰 种蛋类型： 全部种蛋类型 合格蛋 二级蛋 周龄： 蛋重类型： 全部蛋重类型 大 中 小 产蛋日期： ~ 计划号： 出入库日期： 操作人： 孵化场： 全部孵化场 孵化一场 孵化二场 养殖批次： ~ 出/入库： 全部类型 入库
    出库 方式： 全部方式 自动 原因： 全部原因 种蛋照蛋 种蛋出雏
  source: live prototype annotation / related requirement page
  applies_to:
  - 出入库记录
- id: BR-007
  rule: 方式：只有一种自动。
  source: live prototype annotation / related requirement page
  applies_to:
  - 出入库记录
