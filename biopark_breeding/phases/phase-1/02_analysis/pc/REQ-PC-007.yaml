- id: BR-001
  rule: 原因，根据类型、方式对应变动选项。 搜索 重置 出/入库： 全部类型 入库 出库 方式： 全部方式 自动 手动 出入库日期： ~ 出入库记录 原因： 全部原因 种蛋上孵 鸡苗挑选 销售 操作人： 计划号：
  source: live prototype annotation / related requirement page
  applies_to:
  - 库位出入库记录
- id: BR-002
  rule: 库位号：出入库记录如果是因为同一个库位号同时混装了多种蛋，产生了虚拟库位的记录，则此处记录的库位号为当时的虚拟库位号，并且标记“混”。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库位出入库记录
- id: BR-003
  rule: 关于操作类型、方式、原因的说明： 1、操作类型：入库、出库； 2、方式：手动、自动；①手动：在仓库中点击出入库进行的入库操作数据；②自动：盘点及任务执行过程中系统自动进行的出入库操作数据； 3、原因：出入库的原因，不同操作类型、方式对应的原因不同：
    ①入库——手动：种蛋挑选、其他； ②入库——自动：盘点；（目前功能范围中，没有任务过程中的自动入库） ③出库——手动：种蛋上孵、销售、更换仓库、其他； ④出库——自动：种蛋上孵、盘点。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库位出入库记录
- id: BR-004
  rule: 上孵计划号：如果是来自计划任务的地总出入库，有上孵计划号，否则没有上孵计划号。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库位出入库记录
- id: BR-005
  rule: 出入库记录，按照出入库类型、时间、种蛋、库位号独立生成操作记录。
  source: live prototype annotation / related requirement page
