      ①入库——手动：种蛋挑选、其他； ②入库——自动：盘点；（目前功能范围中，没有任务过程中的自动入库） ③出库——手动：种蛋上孵、销售、更换仓库、其他； ④出库——自动：种蛋上孵、盘点。
    - 上孵计划号：如果是来自计划任务的地总出入库，有上孵计划号，否则没有上孵计划号。
    - 出入库记录，按照出入库类型、时间、种蛋、库位号独立生成操作记录。
    - 该页面为某一库位出入库记录页。
