  computed_fields:
  - name: 原型派生/回填字段
    formula: 1、复选框； 2、勾选主库位，会自动勾选全部虚拟库位。
    editable: false
  - name: 原型派生/回填字段
    formula: 关于库位的说明： 1、库位号系统根据规则自动生成，此处暂不详述生成规则； 2、仓库列表展示顺序遵循：①孵化场③仓库④库位号顺序； 3、库位分为①主库位②虚拟副库位； 4、主库位即为仓库新建时根据排列参数设置，自动生成的带有库位号的实际库位；
      5、虚拟副库位：当一个主库位上入库了不同种类的蛋时，自动生成虚拟库位，有N种蛋即生成N个虚拟库位，此时主库位上不挂任何一种蛋的库存数据，即主库位不显示库存；
    editable: false
  - name: 原型派生/回填字段
    formula: 关于筛选条件的说明： 1、孵化场、仓库可多选（待研发情况定）； 2、孵化场、养殖场为树形结构选择； 3、库位号、养殖批次为关键字查询，输入过程中查询现有关键字匹配库位号、养殖批次，下拉推荐选择项，可快速选择； 4、种蛋类型：默认只有二级蛋（此处待研发情况确定，如果入库时不做明确限制，此处可保留筛选，如果做了明确限制，则无种蛋类型筛选）；
    editable: false
  - name: 原型派生/回填字段
    formula: 操作按钮，为选择车位后，根据选择车位数量、类型、状态，自动判断，进行相应弹框操作。
    editable: false
  - name: 原型派生/回填字段
    formula: 有多个虚拟车位时，标识显示数量，自动轮转滚动显示信息。
    editable: false
  - name: 原型派生/回填字段
    formula: 如果该种类的蛋当日有匹配到待执行的上孵任务，在任务执行前，有特殊提示。 上孵日期： ~
    editable: false
  save_validations:
  - rule: 关于批量操作的说明： 1、批量入库时，最多只能勾选30个库位； 2、入库：①此为多库位批量入库操作，只有选择了库位，才会点击有弹框入库操作，即使只选择了一个库位，也可触发同样的弹框操作，否则弹框提示“请选择库位”；②只可选择同一个仓库的库位，只可入一种种蛋，否则则弹框提示“只可批量入库同一个仓库的库位”；③入库操作只会默认操作在主库位上，无视虚拟车位；
      3、出库：①此为多库位批量出库操作，只有选择了库位，才会点击有弹框出库操作，即使只选择了一个库位，也可触发同样的弹框操作，否则弹框提示“请选择库位”；②批量出库操作不区分孵化场、仓库； 4、盘点：①此为多库位批量出库操作，只有选择了库位，才会点击有弹框盘点操作，即使只选择了一个库位，也可触发同样的弹框操作，否则弹框提示“请选择库位”；②批量盘点操作不区分孵化场、仓库；
      5、启用/停用：①批量启用/停用操作，只有选择了库位，才会惦记有弹框操作，否则弹框提示“请选择库位”；②操作时，进行判断所选库位是否符合条件，如果不符合，则无法操作并弹框提示； 6、导出：导出选中库位的库位信息表，如果没有选中也可导出，默认全选操作。
    when:
    - 保存
    - 确认
    - 提交
    message: 需求/原型规则，具体错误文案需确认
  - rule: 如果该种类的蛋当日有匹配到待执行的上孵任务，在任务执行前，有特殊提示。 上孵日期： ~
    when:
    - 保存
    - 确认
    - 提交
    message: 需求/原型规则，具体错误文案需确认
