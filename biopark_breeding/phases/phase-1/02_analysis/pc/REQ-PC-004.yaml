- id: BR-012
  rule: 1、照蛋数：实际上孵数量，执行上孵任务时回填的数值，计划进度为，孵化器中，才有此数据，一定有此数据； 2、执行人、操作时间、备注：任务执行确认提交时，提交账号信息及提交时间、填写的备注信息，只有已完成状态下有此信息；
  source: live prototype annotation / related requirement page
  applies_to:
