  computed_fields:
  - name: 原型派生/回填字段
    formula: 关于筛选条件的说明： 1、孵化场、仓库可多选（待研发情况定）； 2、孵化场、养殖场为树形结构选择； 3、养殖批次为关键字查询，输入过程中查询现有关键字匹配养殖批次，下拉推荐选择项，可快速选择； 4、种蛋类型：默认只有合格蛋、二级蛋；
    editable: false
  - name: 原型派生/回填字段
    formula: 1、照蛋数量： ①实际上孵数量，执行上孵任务时回填的数值，计划进度为，孵化器中，才有此数据； ②照蛋任务待执行状态，一定有此数据； 3、孵化器： 执行上孵任务时回填结果，系统上可能会有多个孵化器，均展示，超出部分….，鼠标移上去展示全部；
      4、操作人、操作时间： 为提交执行任务的账号信息和时间。
    editable: false
  - name: 原型派生/回填字段
    formula: 关于种蛋、计划、任务的关系说明： 1、确定一个种蛋的关键字段包括： 养殖场、养殖批次、种蛋类型、品种、周龄、平均蛋重、蛋重类型、产蛋日期； 2、新建计划时，每条计划只能创建一种蛋，不会出现一条计划中有多种蛋要照蛋； 3、每条任务对应唯一一条计划，及计划号，一条计划一条任务，任务的区分与什么种类的种蛋无关；
      4、但执行任务时，因为要匹配种蛋仓库、孵化器、出雏器、存发苗间，所以与种蛋的种类有强关联关系。 计划号： 孵化场： 全部孵化场 孵化一场 孵化二场 养殖场： 全部养殖场 宜兴一场 宜兴二场 养殖批次： 品种： 全部品种 AA 利丰
      蛋重类型： 请选择蛋重类型 大 中 小 特小 任务状态： 请选择任务状态 待执行 已完成 已终止 照蛋日期： 搜索 重置 种蛋类型： 全部种蛋类型 合格蛋 二级蛋 照蛋任务号： 操作日期： 产蛋日期： ~ ~ ~ 平均蛋重： 周龄：
      操作人：
    editable: false
  - name: 原型派生/回填字段
    formula: 1、照蛋数：实际上孵数量，执行上孵任务时回填的数值，计划进度为，孵化器中，才有此数据，一定有此数据； 2、执行人、操作时间、备注：任务执行确认提交时，提交账号信息及提交时间、填写的备注信息，只有已完成状态下有此信息；
    editable: false
  - name: 原型派生/回填字段
    formula: 理论上不可能出现别的种类种蛋，孵化器表格里每个库位显示种蛋信息，仅为了帮助用户进行信息核对使用，防止系统匹配出错，用户可以甄别。
    editable: false
  - name: 原型派生/回填字段
    formula: 1、受精蛋：根据填写数据计算得出，初始为0； 受精蛋=照蛋数-无精蛋-死胚蛋-臭蛋； 2、受精率：根据填写数据计算得出，初始为0%； 受精率=受精蛋➗照蛋数； 3、次品库： ①只展示并可选该计划孵化场下的次品库，如果只有一个次品库，默认选择该仓库；
      ②单选，只可选择一个次品库； ③无精蛋、死胚蛋自动入库该次品库； 4、臭蛋： 数据记录，不入任何仓库，系统中用于生产数据统计，业务中会做无害化处理销毁； 5、死胚率： 死胚率=死胚蛋➗照蛋数； 6、臭蛋率： 臭蛋率=臭蛋➗照蛋数。
    editable: false
