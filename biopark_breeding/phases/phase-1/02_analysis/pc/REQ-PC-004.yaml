    annotations:
    - 任务当前状态
    - 种蛋相关信息，根据现有信息，有什么展示什么
    - 任务关联计划相关信息，根据现有信息，有什么展示什么
    - 理论上不可能出现别的种类种蛋，孵化器表格里每个库位显示种蛋信息，仅为了帮助用户进行信息核对使用，防止系统匹配出错，用户可以甄别。
    - 执行照蛋任务时，孵化器出库，出雏器入库。
    - 1、照蛋数：实际上孵数量，执行上孵任务时回填的数值，计划进度为，孵化器中，才有此数据，一定有此数据； 2、执行人、操作时间、备注：任务执行确认提交时，提交账号信息及提交时间、填写的备注信息，只有已完成状态下有此信息；
    - 1、照蛋数：既上孵任务实际上孵数； 2、孵化车数：上孵任务执行结果，既上孵任务实际车辆数；为孵化器中现存库存数。
    - 1、受精蛋：根据填写数据计算得出，初始为0； 受精蛋=照蛋数-无精蛋-死胚蛋-臭蛋； 2、受精率：根据填写数据计算得出，初始为0%； 受精率=受精蛋➗照蛋数； 3、次品库： ①只展示并可选该计划孵化场下的次品库，如果只有一个次品库，默认选择该仓库；
      ②单选，只可选择一个次品库； ③无精蛋、死胚蛋自动入库该次品库； 4、臭蛋： 数据记录，不入任何仓库，系统中用于生产数据统计，业务中会做无害化处理销毁； 5、死胚率： 死胚率=死胚蛋➗照蛋数； 6、臭蛋率： 臭蛋率=臭蛋➗照蛋数。
    - 关于出雏器列表相关说明： 1、此操作为编辑出雏车推进出雏器、出雏器库位的位置信息； 2、出雏器入库，只记录入库总数（受精蛋数），不记录每个库位具体数量； 3、出雏车数、列表库位行数： ①出雏车数=列表库位行数； ②默认等于孵化车数，可以通过新增、删除列表库位行数进行调整；
      4、出雏器： 每行库位行出雏器，单选，只展示并可选该计划孵化场下的出雏器，如果只有一个出雏器，默认选择该出雏器； 5、出雏器库位： 每行库位行出雏器库位，单选，只展示并可选该出雏器下的库位，如果只有一个库位，默认选择该库位。 6、关于出雏器库位筛选组件的用户以操作性说明：
      通常情况下，出雏器库位均较多，不宜用下拉列表形式进行选择，建议弹框铺列选择，类似出雏器库存查询页列表；支持批量操作，即一次性选择多行的库位。 （此选择组件，视研发情况而定，可沟通讨论优化，为用户体验优化问题）。
    - 点击“+”，新增一行 空白计划，待编辑。
    - 1、复制：点击根据该行复制并新增一行，可编辑； 2、删除：如果删除该行，出雏车数减少1。
    - 备注：非必填项，如果填写，则展示在 1、任务详情页； 2、出雏器库存查询库位列表页； 3、孵化器出库记录备注； 4、出雏器入库记录备注。
    - 确认执行，操作后： 一、操作数据均符合条件时，弹框进行二次确认操作； 二、执行成功后，任务详情页刷新： 1、任务状态：变为已完成； 2、展示执行人、操作时间、备注； 3、照蛋结果、出雏器功能区域根据提交结果展示相关信息，不可修改；
      三、确认执行按钮消失，至剩返回按钮，点击返回至任务列表页。
    - 关于确认执行时，出库孵化器，入库出雏器的说明： 1、确认执行时，同时进行两个出入库操作： ①被选中的蛋（计划）从孵化器对应库位出库并生成出库记录； ②被分配的受精蛋（计划）入库出雏器对应库位，无精蛋、死胚蛋入库次品库，并生成入库记录；
      2、确认提交时，判断，选择出库的孵化器中是否存在，数量是否足够，如果不存在或不够，则弹框提示，无法提交成功，确认关闭弹框时，页面刷新，展示最新孵化器数据，二次提交时再次提示照蛋数量不符，确认后可以提交成功；（此种情况当前系统逻辑流程中不可能出现，主要为系统校错的处理，视研发情况是否处理）；
      3、入库出雏器时，无需判断该库位当前情况，已占用的库位依然可以入库； 4、出雏车数与孵化车数： 没有核验关系，两者可能存在不一样，可多可少可相同。
