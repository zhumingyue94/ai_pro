    message: 需求/原型规则，具体错误文案需确认
  - rule: 备注：非必填项，如果填写，则展示在 1、任务详情页； 2、出雏器库存查询库位列表页； 3、孵化器出库记录备注； 4、出雏器入库记录备注。
    when:
    - 保存
    - 确认
    - 提交
    message: 需求/原型规则，具体错误文案需确认
  - rule: 确认执行，操作后： 一、操作数据均符合条件时，弹框进行二次确认操作； 二、执行成功后，任务详情页刷新： 1、任务状态：变为已完成； 2、展示执行人、操作时间、备注； 3、照蛋结果、出雏器功能区域根据提交结果展示相关信息，不可修改；
      三、确认执行按钮消失，至剩返回按钮，点击返回至任务列表页。
    when:
    - 保存
    - 确认
    - 提交
    message: 需求/原型规则，具体错误文案需确认
  - rule: 关于确认执行时，出库孵化器，入库出雏器的说明： 1、确认执行时，同时进行两个出入库操作： ①被选中的蛋（计划）从孵化器对应库位出库并生成出库记录； ②被分配的受精蛋（计划）入库出雏器对应库位，无精蛋、死胚蛋入库次品库，并生成入库记录；
      2、确认提交时，判断，选择出库的孵化器中是否存在，数量是否足够，如果不存在或不够，则弹框提示，无法提交成功，确认关闭弹框时，页面刷新，展示最新孵化器数据，二次提交时再次提示照蛋数量不符，确认后可以提交成功；（此种情况当前系统逻辑流程中不可能出现，主要为系统校错的处理，视研发情况是否处理）；
      3、入库出雏器时，无需判断该库位当前情况，已占用的库位依然可以入库； 4、出雏车数与孵化车数： 没有核验关系，两者可能存在不一样，可多可少可相同。
    when:
    - 保存
    - 确认
    - 提交
    message: 需求/原型规则，具体错误文案需确认
