  - 执行照蛋任务
- id: BR-013
  rule: 根据计划信息生成任务，获取上孵任务执行结果信息，展示其所在孵化器、库位、数量；
  source: live prototype annotation / related requirement page
  applies_to:
  - 种蛋照蛋任务
  - 照蛋任务详情
  - 执行照蛋任务
- id: BR-014
  rule: 1、照蛋数：既上孵任务实际上孵数； 2、孵化车数：上孵任务执行结果，既上孵任务实际车辆数；为孵化器中现存库存数。
  source: live prototype annotation / related requirement page
  applies_to:
