  - 照蛋任务详情
  - 执行照蛋任务
- id: BR-015
  rule: 执行任务： 1、待执行状态任务，有此操作按钮，已完成状态没有此操作按钮； 2、点击页面刷新，本页页内跳转为执行任务页面，可进行执行任务确认提交操作。
  source: live prototype annotation / related requirement page
