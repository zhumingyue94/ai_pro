business_rules:
- id: BR-001
  rule: 1、新建：操作与复选框无关，点击有弹框； 2、启用、停用：操作需选中，否则弹框提示；点击有弹框，确认是否启用/停用，无论选中项为什么状态，统一执行操作并生效； 3、删除：操作需选中，否则弹框提示；点击有弹框，确认是否删除，逻辑删除，删除的同时状态改为停用状态；
    4、导出：导出筛选条件下的列表内容。
  source: live prototype annotation / related requirement page
  applies_to:
  - 存发苗间管理
- id: BR-002
  rule: 关键字查询
  source: live prototype annotation / related requirement page
  applies_to:
  - 存发苗间管理
- id: BR-003
  rule: 1、复选框； 2、仓库编号，系统规则自动生成，规则此处不做特殊限制说明； 3、仓库名称，手动输入；
  source: live prototype annotation / related requirement page
  applies_to:
  - 存发苗间管理
- id: BR-004
  rule: 1、存发苗间只有一种类型； 2、存发苗间没有库位区分； 3、箱容量：为装鸡苗的单个箱子的容量，无托盘层数划分。
  source: live prototype annotation / related requirement page
  applies_to:
  - 存发苗间管理
- id: BR-005
  rule: 1、状态：启用、停用两种状态，停用操作时，后续系统操作中不再出现该停用状态选项，已存在数据不受影响； 2、启用/停用操作：停用状态下为启用操作按钮，启用状态下为停用操作按钮；单行操作，相当于选中改行数据进行操作，点击有弹框，确认是否启用/停用；
    3、删除：该条数据，逻辑删除，停用状态下，有删除操作，启用状态下无操作按钮； 4、修改：全部状态下可修改，修改只会影响修改后的新建项，不影响已经使用的数据。
  source: live prototype annotation / related requirement page
  applies_to:
  - 存发苗间管理
