  - name: 原型派生/回填字段
    formula: 1、复选框； 2、勾选主库位，会自动勾选全部虚拟库位。
    editable: false
  - name: 原型派生/回填字段
    formula: 关于库位的说明： 1、库位号系统根据规则自动生成，此处暂不详述生成规则； 2、孵化器列表展示顺序遵循：①孵化场②孵化器③库位号顺序； 3、库位分为①主库位②虚拟副库位； 4、主库位即为孵化器新建时根据排列参数设置，自动生成的带有库位号的实际库位；
      5、虚拟副库位：当一个主库位上入库了不同的计划号时，自动生成虚拟库位，有N种计划号即生成N个虚拟库位，此时主库位上不挂任何一种蛋的库存数据，即主库位不显示库存；
    editable: false
  - name: 原型派生/回填字段
    formula: 关于筛选条件的说明： 1、孵化场、孵化器可多选（待研发情况定）； 2、孵化场、养殖场为树形结构选择； 3、库位号、养殖批次为关键字查询，输入过程中查询现有关键字匹配库位号、养殖批次，下拉推荐选择项，可快速选择； 4、种蛋类型：合格蛋、二级蛋；
    editable: false
  save_validations:
  - rule: 关于批量操作的说明： 1、启用/停用：①批量启用/停用操作，只有选择了库位，才会惦记有弹框操作，否则弹框提示“请选择库位”；②操作时，进行判断所选库位是否符合条件，如果不符合，则无法操作并弹框提示； 2、导出：导出选中库位的库位信息表，如果没有选中也可导出，默认全选操作。
    when:
    - 保存
    - 确认
    - 提交
