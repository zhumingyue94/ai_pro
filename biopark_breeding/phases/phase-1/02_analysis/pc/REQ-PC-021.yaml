business_rules:
- id: BR-001
  rule: 备注，每次完成上孵任务入库时，可以备注，取最新备注信息展示； 1、如果多次入库均为同一类型种蛋，则取最新备注信息展示在主库位； 2、如果多次入库为不同类型种蛋，则生成虚拟库位，每个虚拟库位独立展示备注信息，虚拟库位中的备注信息同样各自遵循取最新展示原则。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-002
  rule: 1、复选框； 2、勾选主库位，会自动勾选全部虚拟库位。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-003
  rule: 1、孵化器只有一种类型； 2、根据登录账号权限范围不同，展示不同孵化场下的孵化器； 3、确定一种蛋的字段包括：养殖场、养殖批次、品种、产蛋日期、蛋重类型、平均蛋重、周龄、种蛋类型； 4、孵化器库存中种蛋类型：合格蛋、二级蛋；
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-004
  rule: 关于库位的说明： 1、库位号系统根据规则自动生成，此处暂不详述生成规则； 2、孵化器列表展示顺序遵循：①孵化场②孵化器③库位号顺序； 3、库位分为①主库位②虚拟副库位； 4、主库位即为孵化器新建时根据排列参数设置，自动生成的带有库位号的实际库位；
    5、虚拟副库位：当一个主库位上入库了不同的计划号时，自动生成虚拟库位，有N种计划号即生成N个虚拟库位，此时主库位上不挂任何一种蛋的库存数据，即主库位不显示库存；
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-005
  rule: 库位状态： 1、库位状态只展示在主库位上； 2、全部状态包括：空位、未满、满容、超容、停用； 3、空位：该库位当前没有存放种蛋，无数据； 4、未满：该库位当前种蛋存放数据，没有达到库位容量； 5、满容：该库位当前种蛋存放数据，且刚好达到库位容量；
    6、超容：该库位当前种蛋存放数据，且超过了库位容量； 7、停用：该库位当前被操作了停用操作。 孵化器容量：30000 库位数：30 库位托盘数：10 托盘容量：100 库位容量：1000
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-006
  rule: 孵化器标准容量信息展示，取自基础数据配置，此部分内容，只有筛选一个孵化器的时候显示，如果是多个孵化器，则不展示数据，展示“- -”。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-007
  rule: 种蛋状态+上孵日期、照蛋日期： 1、上孵日期、照蛋日期：为该种蛋在上孵计划中已经定下来的计划上孵日期、照蛋日期，实时更新，同一计划，取最新一次计划上孵日期、照蛋日期； 2、如果还没有关联上孵计划，则不展示上孵日期、照蛋日期；如果关联多个上孵计划，则展示多个上孵日期、照蛋日期；
    3、种蛋状态：孵化中、待照蛋、已超期； 4、孵化中：当前种蛋已经关联了上孵计划，完成了上孵任务，正在孵化器中孵化，但是还没有到照蛋日期，还没有生成并下发照蛋任务； 5、待照蛋：当前种蛋已经关联了上孵计划，并且当日已经是照蛋日期，已经下发了照蛋任务，并且还没有执行完成照蛋任务；
    6、已超期：当前种蛋已经关联了上孵计划，并且已经下发了照蛋任务，且过了照蛋日期还没有执行完成照蛋任务； 7、系统上可能会出现同一种蛋关联多个不同的上孵计划的可能性，关于种蛋状态展示优先级顺序：待照蛋——已超期——孵化中； 9、种蛋状态，展示在有种蛋存储数据的库位上，无数据的为空。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-008
  rule: 关于每行操作的说明： 1、每行的操作（记录、停用、启用），仅针对并涉及该行数据/库位进行操作； 2、孵化器没有入库、出库、盘点操作； 3、记录：①记录操作，是该主库位的历史出入库记录，点击跳转该库位的历史出入库记录页；②主库位有记录操作，虚拟库位没有记录操作；
    4、停用：只有空位状态下的主库位，才有停用操作； 5、启用：只有停用状态下的主库位，才有启用操作。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-009
  rule: 关于批量操作的说明： 1、启用/停用：①批量启用/停用操作，只有选择了库位，才会惦记有弹框操作，否则弹框提示“请选择库位”；②操作时，进行判断所选库位是否符合条件，如果不符合，则无法操作并弹框提示； 2、导出：导出选中库位的库位信息表，如果没有选中也可导出，默认全选操作。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-010
  rule: 关于筛选条件的说明： 1、孵化场、孵化器可多选（待研发情况定）； 2、孵化场、养殖场为树形结构选择； 3、库位号、养殖批次为关键字查询，输入过程中查询现有关键字匹配库位号、养殖批次，下拉推荐选择项，可快速选择； 4、种蛋类型：合格蛋、二级蛋；
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-011
  rule: 关于种蛋类型、鸡苗类型及对应出入库的划分说明： （一）种蛋： 1、种蛋类型：合格蛋（入）、二级蛋（脏蛋）（入）、次品蛋（入）、臭蛋（不入）； 2、次品蛋（入）：无精蛋、死胚蛋、大蛋、小蛋、毛蛋、破损蛋； 3、出入库划分： ①合格蛋：合格蛋蛋库；
    ②二级蛋（脏蛋）：二级蛋蛋库； ③次品蛋：次品库； ④臭蛋：不入库，直接淘汰，无害化处理； （二）鸡苗： 1、健雏（入）、弱雏（入）、淘汰雏（殘雏）（不入）； 2、出入库划分： ①健雏：鸡苗库； ②弱雏：次品库； ③淘汰雏（殘雏）：不入库，直接淘汰，无害化处理；
    （三）次品： 次品蛋、弱雏。 启用 停用
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
