business_rules:
- id: BR-001
  rule: 鸡苗库存 1、鸡苗类型：健雏； 2、确定一种鸡苗的字段包括：鸡苗类型、养殖场、养殖批次、品种、出苗日期、平均苗重； 3、以孵化场、仓库、鸡苗类型、养殖场、养殖批次、品种、出苗日期、平均苗重为维度铺列仓库，每种类型合并计数及操作；
    4、鸡苗库存没有库位概念； 5、存发苗间的鸡苗类型是不断在变动的，只要有数量就会出现展示，没有数量不展示，不同于次品库，没有固定的类型。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-002
  rule: 平均苗重：来自种蛋出雏任务执行时填写。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-003
  rule: 数据可能来自多个上孵计划，则展示多个上孵计划号。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-004
  rule: 关于每行操作的说明： 1、每行的操作（出库、盘点），仅针对并涉及该行数据/类型进行操作； 2、出库：如果有健雏数据，则有出库操作按钮，点击弹框/跳转进行出库操作； 3、盘点：点击弹框进行盘点操作，盘点对应生成盘点出库和盘点入库记录；
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-005
  rule: 关于批量操作的说明： 1、入库：①此为入库操作，不需要选择某类鸡苗就可以操作，如果选择，则选择为无效操作；②点击有弹框入库操作，统一的入库弹框； 2、出库：①此为多类型鸡苗批量出库操作，只有选择了鸡苗，才会点击有弹框出库操作，即使只选择了一个鸡苗，也可触发同样的弹框操作，否则弹框提示“请选择鸡苗”；②批量出库操作可跨孵化场、仓库；
    3、盘点：①此为多鸡苗批量出库操作，只有选择了鸡苗，才会点击有弹框盘点操作，即使只选择了一个鸡苗，也可触发同样的弹框操作，否则弹框提示“请选择鸡苗”；②批量盘点操作可跨孵化场、仓库； 5、导出：导出选中鸡苗的仓库信息表，如果没有选中也可导出，默认全选操作。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-006
  rule: 鸡苗类型：只有健雏。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
