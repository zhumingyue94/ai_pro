    - 库位状态： 1、库位状态只展示在主库位上； 2、全部状态包括：空位、占用、停用； 3、空位：该库位当前没有存放种蛋，无数据； 4、占用：该库位当前有存放种蛋； 5、停用：该库位当前被操作了停用操作。 出雏器容量：30000 库位数：30
      库位托盘数：10 托盘容量：100 库位容量：1000
    - 出雏器标准容量信息展示，取自基础数据配置，此部分内容，只有筛选一个出雏器的时候显示，如果是多个出雏器，则不展示数据，展示“- -”。
    - 种蛋状态+照蛋日期、出雏日期： 1、照蛋日期、出雏日期：为该种蛋在上孵计划中已经定下来的计划上照蛋日期、出雏日期，实时更新，同一计划，取最新一次计划照蛋日期、出雏日期； 2、如果还没有关联上孵计划，则不展示照蛋日期、出雏日期；如果关联多个上孵计划，则展示多个照蛋日期、出雏日期；
      3、种蛋状态：孵化中、待出雏、已超期； 4、孵化中：当前种蛋已经关联了上孵计划，完成了照蛋任务，正在出雏器中孵化，但是还没有到出雏日期，还没有生成并下发出雏任务； 5、待出雏：当前种蛋已经关联了上孵计划，并且当日已经是出雏日期，已经下发了出雏任务，并且还没有执行完成出雏任务；
      6、已超期：当前种蛋已经关联了上孵计划，并且已经下发了出雏任务，且过了出雏日期还没有执行完成出雏任务； 7、系统上可能会出现同一种蛋关联多个不同的上孵计划的可能性，关于种蛋状态展示优先级顺序：待出雏——已超期——孵化中； 9、种蛋状态，展示在有种蛋存储数据的库位上，无数据的为空。
    - 关于每行操作的说明： 1、每行的操作（记录、停用、启用），仅针对并涉及该行数据/库位进行操作； 2、出雏器没有入库、出库、盘点操作； 3、记录：①记录操作，是该主库位的历史出入库记录，点击跳转该库位的历史出入库记录页；②主库位有记录操作，虚拟库位没有记录操作；
      4、停用：只有空位状态下的主库位，才有停用操作； 5、启用：只有停用状态下的主库位，才有启用操作。
    - 关于批量操作的说明： 1、启用/停用：①批量启用/停用操作，只有选择了库位，才会惦记有弹框操作，否则弹框提示“请选择库位”；②操作时，进行判断所选库位是否符合条件，如果不符合，则无法操作并弹框提示； 2、导出：导出选中库位的库位信息表，如果没有选中也可导出，默认全选操作。
    - 关于筛选条件的说明： 1、孵化场、出雏器可多选（待研发情况定）； 2、孵化场、养殖场为树形结构选择； 3、库位号、养殖批次为关键字查询，输入过程中查询现有关键字匹配库位号、养殖批次，下拉推荐选择项，可快速选择； 4、种蛋类型：合格蛋、二级蛋；
    - 关于种蛋类型、鸡苗类型及对应出入库的划分说明： （一）种蛋： 1、种蛋类型：合格蛋（入）、二级蛋（脏蛋）（入）、次品蛋（入）、臭蛋（不入）； 2、次品蛋（入）：无精蛋、死胚蛋、大蛋、小蛋、毛蛋、破损蛋； 3、出入库划分： ①合格蛋：合格蛋蛋库；
      ②二级蛋（脏蛋）：二级蛋蛋库； ③次品蛋：次品库； ④臭蛋：不入库，直接淘汰，无害化处理； （二）鸡苗： 1、健雏（入）、弱雏（入）、淘汰雏（殘雏）（不入）； 2、出入库划分： ①健雏：鸡苗库； ②弱雏：次品库； ③淘汰雏（殘雏）：不入库，直接淘汰，无害化处理；
      （三）次品： 次品蛋、弱雏。 启用 停用 库位状态： 全部状态 空位 未满 满容 超容 停用 搜索 重置 平均蛋重： 出雏器： 全部出雏器 北一号出雏器 北二号出雏器 南一号出雏器 库位号： 养殖场： 全部养殖场 养殖场一 养殖场二
      养殖场三 品种： 全部品种 AA 利丰 种蛋类型： 全部种蛋类型 合格蛋 二级蛋 周龄： 蛋重类型： 全部蛋重类型 大 中 小 产蛋日期： ~ 计划号： 照蛋日期： 出雏日期： 操作人： 孵化场： 全部孵化场 孵化一场 孵化二场 种蛋状态：
      全部状态 孵化中 待照蛋 已超期 养殖批次： ~ ~
