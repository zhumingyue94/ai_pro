business_rules:
- id: BR-001
  rule: 库位号：盘点记录如果是因为同一个库位号同时混装了多种蛋，产生了虚拟库位的，则此处记录的库位号为当时的虚拟库位号，并且标记“混”。
  source: live prototype annotation / related requirement page
  applies_to:
  - 盘点记录
- id: BR-002
  rule: 该页面为登录账号权限范围下所有仓库，盘点记录页。
  source: live prototype annotation / related requirement page
  applies_to:
  - 盘点记录
- id: BR-003
  rule: 是否差异、差异数量： 1、是否差异：展示盘点数量与库存数量是否有差异； 2、差异数量：比较盘点数量与库存数量之间的差异值，盘点入库为正数，盘点出库为负数，盘点一致为0.
  source: live prototype annotation / related requirement page
  applies_to:
  - 盘点记录
- id: BR-004
  rule: 关于筛选条件的说明： 1、孵化场、仓库可多选（待研发情况定）； 2、孵化场、养殖场为树形结构选择； 3、库位号、养殖批次为关键字查询，输入过程中查询现有关键字匹配库位号、养殖批次，下拉推荐选择项，可快速选择； 4、种蛋类型：默认只有合格蛋（此处待研发情况确定，如果入库时不做明确限制，此处可保留筛选，如果做了明确限制，则无种蛋类型筛选）；
    是否差异： 全部 是 否 搜索 重置 养殖场： 全部养殖场 养殖场一 养殖场二 养殖场三 养殖批次： 品种： 全部品种 AA 利丰 周龄： 产蛋日期： ~ 盘点日期： ~ 操作人： 孵化场： 全部孵化场 孵化一场 孵化二场 仓库类型：
    全部仓库类型 二级蛋蛋库 种蛋类型： 全部种蛋类型 二级蛋 蛋重类型： 全部蛋重类型 大 中 小 平均蛋重： 仓库： 全部仓库 北一号仓库 北二号仓库 南一号仓库 库位号：
  source: live prototype annotation / related requirement page
  applies_to:
  - 盘点记录
