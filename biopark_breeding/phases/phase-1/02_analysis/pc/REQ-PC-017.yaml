    - 关于批量操作的说明： 1、批量入库时，最多只能勾选30条入库； 2、入库：①此为多次品批量入库操作，只有选择了次品，才会点击有弹框入库操作，即使只选择了一个次品，也可触发同样的弹框操作，否则弹框提示“请选择种蛋”；②可选择不孵化场，不同一个仓库的不同次品；
