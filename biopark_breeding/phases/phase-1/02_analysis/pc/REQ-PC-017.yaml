business_rules:
- id: BR-001
  rule: 次品库存 1、仓库类型：次品库； 2、种蛋/鸡苗类型：（次品蛋）无精蛋、死胚蛋、大蛋、小蛋、毛蛋、破损蛋、（鸡苗）弱雏；这些类型的种蛋/鸡苗出入库次品库； 3、以孵化场、仓库、种蛋/鸡苗类型为维度铺列仓库，每种类型合并计数及操作；
    4、次品库没有库位概念； 5、次品库中的次品类型是固定的，没有数量的类型的次品，数量为0展示。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-002
  rule: 关于种蛋类型、鸡苗类型及对应出入库的划分说明： （一）种蛋： 1、种蛋类型：合格蛋（入）、二级蛋（脏蛋）（入）、次品蛋（入）、臭蛋（不入）； 2、次品蛋（入）：无精蛋、死胚蛋、大蛋、小蛋、毛蛋、破损蛋； 3、出入库划分： ①合格蛋：合格蛋蛋库；
    ②二级蛋（脏蛋）：二级蛋蛋库； ③次品蛋：次品库； ④臭蛋：不入库，直接淘汰，无害化处理； （二）鸡苗： 1、健雏（入）、弱雏（入）、淘汰雏（殘雏）（不入）； 2、出入库划分： ①健雏：鸡苗库； ②弱雏：次品库； ③淘汰雏（殘雏）：不入库，直接淘汰，无害化处理；
    （三）次品： 次品蛋、弱雏。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-003
  rule: 关于每行操作的说明： 1、每行的操作（入库、出库、记录、盘点），仅针对并涉及该行数据/类型进行操作； 2、入库：①点击弹框/跳转进行入库操作；②入库操作时，已经指定次品类型及孵化场和仓库； 3、出库：如果有次品数据，则有出库操作按钮，点击弹框/跳转进行出库操作；如果没有种蛋数据，则没有出库操作按钮，不能进行出库操作；
    4、盘点：始终有盘点操作，点击弹框进行盘点操作，盘点对应生成盘点出库和盘点入库记录； 5、记录：记录操作，是该次品的历史出入库记录，点击跳转该次品的历史出入库记录页；
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-004
  rule: 关于批量操作的说明： 1、批量入库时，最多只能勾选30条入库； 2、入库：①此为多次品批量入库操作，只有选择了次品，才会点击有弹框入库操作，即使只选择了一个次品，也可触发同样的弹框操作，否则弹框提示“请选择种蛋”；②可选择不孵化场，不同一个仓库的不同次品；
    3、出库：①此为多次品批量出库操作，只有选择了次品，才会点击有弹框出库操作，即使只选择了一个次品，也可触发同样的弹框操作，否则弹框提示“请选择种蛋”；②批量出库操作可跨孵化场、仓库； 4、盘点：①此为多次品批量出库操作，只有选择了次品，才会点击有弹框盘点操作，即使只选择了一个次品，也可触发同样的弹框操作，否则弹框提示“请选择种蛋”；②批量盘点操作可跨孵化场、仓库；
    5、导出：导出选中次品的仓库信息表，如果没有选中也可导出，默认全选操作。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
- id: BR-005
  rule: 种蛋/鸡苗类型包括： 无精蛋、死胚蛋、大蛋、小蛋、毛蛋、破损蛋、弱雏。
  source: live prototype annotation / related requirement page
  applies_to:
  - 库存查询
