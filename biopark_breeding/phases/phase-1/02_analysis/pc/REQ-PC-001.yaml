    message: 按任务联动规则执行
  button_semantics:
    新建:
      action: create_or_add
      summary: 打开新建上孵计划页面，无需勾选
    导出:
      action: export_selected_or_all
      summary: 勾选时导出选中计划，未勾选导出全部
    模版下载:
      action: download_import_template
      summary: 下载计划导入模板
    导入:
      action: batch_create_only
      summary: 按模板批量新建计划，不做历史修改
    终止:
      action: terminate_with_state_validation
      summary: 按计划状态/进度终止，非法选择阻止
    删除:
      action: logical_delete_with_state_validation
      summary: 仅终止计划可逻辑删除并同步任务
    草稿:
      action: open_latest_draft
      summary: 打开最近一次草稿
    下发任务:
      action: manual_dispatch_due_tasks
      summary: 手动下发达到节点时间的任务
    修改:
      action: state_progress_dependent_edit
      summary: 按状态/进度开放字段
    关联任务:
      action: open_related_task_detail
      summary: 仅展示已下发任务并打开对应详情
    +:
      action: add_subtable_row
      summary: 新增空白计划行
    复制:
      action: duplicate_subtable_row
      summary: 复制当前计划行
    保存:
      action: save_latest_draft
      summary: 保存最近一次草稿
    确认:
      action: confirm_create_or_edit
      summary: 确认当前表单/弹窗动作
    取消:
      action: cancel_without_writeback
      summary: 关闭且不回写未确认数据
