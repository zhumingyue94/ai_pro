  - 新建上孵计划
- id: BR-020
  rule: 孵化器：为非必填项。 请选择种蛋类型 合格蛋 二级蛋
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
