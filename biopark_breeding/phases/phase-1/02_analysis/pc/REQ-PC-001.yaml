open_questions:
- id: OQ-001
  question: 孵化周期管理页面已存在于 PC 原型但未在范围基线分配 REQ-ID，是否补充独立需求？
  impact: 影响照蛋/出雏日期计算依赖追踪
  owner: 产品/项目经理
  blocking: true
- id: OQ-002
  question: 孵化场、仓库是否支持多选；原型注释写待研发情况定，最终交互是什么？
  impact: 影响查询控件和接口参数
  owner: 产品/研发
  blocking: true
- id: OQ-003
  question: P001与P002中计划进度枚举文案是否统一为同一状态字典？
  impact: 影响状态过滤和按钮显隐
  owner: 产品
  blocking: true
- id: OQ-004
  question: 导入模板字段、错误回显、部分成功和幂等策略是什么？
  impact: 影响导入操作契约
  owner: 产品/研发
  blocking: true
