business_rules:
- id: BR-001
  rule: 一、修改： 1、计划状态为正常的计划有修改操作，终止状态无修改操作； 2、正常状态下的计划，根据计划进度区分是否有修改操作，待孵期、待上孵、孵化器中、待照蛋、出雏器中、待出雏有修改操作，已完成无修改操作； 3、“待孵期”、“待上孵”进度计划可以修改所有信息；
    4、其他部分进度，只能根据所处计划进度，对应修改计划照蛋时间、出雏时间： ①孵化器中、待照蛋：照蛋时间；②出雏器中、待出雏：出雏时间； 5、已完成：无修改操作； 二、终止： 1、计划状态为正常的计划，可以终止操作，终止状态下无终止操作；
    2、计划进度为待孵期、待上孵、孵化器中、待照蛋、出雏器中、待出雏，有终止操作；已完成进度，无终止操作，不可终止； 3、终止的计划，不可恢复启用； 三、删除： 1、终止状态的计划，有删除操作，逻辑删除，其他状态无删除操作； 2、删除计划，同步删除任务；
    四、关联任务： 根据该上孵计划已下发任务展现任务选项，没有下发的任务不展示，点击跳转至该对应任务详情页。
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-002
  rule: 新建计划，未填数据为空，后续计划执行过程中回填数据，对应展示； 产蛋日期： ~ 计划状态： 全部状态 正常 终止 智孵管家管理平台 计划管理 上孵计划 孵化管理 种蛋上孵 种蛋照蛋 种蛋出雏 库存管理 品种管理 蛋重类型管理 合格蛋蛋库
    次品库 生产报表 仓库管理 存发苗间管理 孵化器管理 出雏器管理 孵化周期管理 养殖场管理 孵化场管理 组织管理 用户管理 存发苗间 孵化器管理 库存查询 出入库记录 孵化器全景 出雏器管理 库存查询 出入库记录 出雏器全景 基础数据
    受健率标准管理 二级蛋蛋库 首页/一级菜单/二级菜单/三级菜单…
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-003
  rule: 计划进度： 1、待孵期；已创建上孵计划，上孵任务未进入待执行状态； 2、待上孵：上孵任务待执行状态； 3、孵化器中：上孵任务已完成状态，照蛋任务未进入待执行状态； 4、待照蛋：照蛋任务待执行状态； 5、出雏器中：照蛋任务已完成状态，种蛋出雏任务还未进入待执行状态；
    6、待出雏：种蛋出雏任务待执行状态； 7、已完成：种蛋出雏任务已完成状态。 创建人： 新建 导出 模版下载 导入 终止 删除 草稿 下发任务
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-004
  rule: 关于种蛋类型、鸡苗类型及对应出入库的划分说明： （一）种蛋： 1、种蛋类型：合格蛋（入）、二级蛋（脏蛋）（入）、次品蛋（入）、臭蛋（不入）； 2、次品蛋（入）：无精蛋、死胚蛋、大蛋、小蛋、毛蛋、破损蛋； 3、出入库划分： ①合格蛋：合格蛋蛋库；
    ②二级蛋（脏蛋）：二级蛋蛋库； ③次品蛋：次品库； ④臭蛋：不入库，直接淘汰，无害化处理； （二）鸡苗： 1、健雏（入）、弱雏（入）、淘汰雏（殘雏）（不入）； 2、出入库划分： ①健雏：鸡苗库； ②弱雏：次品库； ③淘汰雏（殘雏）：不入库，直接淘汰，无害化处理；
    （三）次品： 次品蛋、弱雏。 平均蛋重： 养殖批次： 周龄： ~ ~ ~
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-005
  rule: 关于批量操作按钮的说明： 1、新建： 为新建计划操作按钮，无需勾选计划进行操作； 2、导出： 导出计划列表，如果勾选导出勾选项，如果不勾选，默认导出全部； 3、导入： 根据模版导入计划表格，进行批量新建计划，无需勾选可以操作；
    4、模版下载： 点击下载批量导入模版计划表格，无需勾选可以操作； 5、终止、删除： 勾选后，批量操作终止、删除操作；批量操作时，需做判断，选中项存在不符合状态的计划时，弹框提示并不可操作； 6、草稿： 只保存最近一次草稿，且点击后打开最近一次保存的草稿，无需勾选可操作；
    7、下发任务： 点击进行手动触发跑计划数据，达到任务时间的计划，下发任务，无需勾选可操作。
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-006
  rule: 关于计划区分、新建、导入： 1、决定是否为独立的一个计划，取决于新建/导入时的计划行数，每一行为一个新计划，生成一个上孵计划号，根据上孵计划号区分计划； 2、新建：新建时没新增一行录入项为一个独立计划； 3、导入：导入只执行新建计划操作，不做历史检索及修改功能，导入表格中，每一行为一个新的独立计划；
    4、如果要做批量修改或者删除操作，需要在系统计划表中进行删除和修改操作。
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-007
  rule: 计划状态： 1、正常：上孵计划正常进行状态； 2、终止：上孵计划被终止状态。
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-008
  rule: 1、计划上孵数量：新建计划时录入的上孵数量，数值固定不变； 2、实际上孵数量：计划进度为，孵化器中，才有此数据，执行上孵任务时回填的数值； 3、孵化器：新建计划时维非必填项，执行上孵任务时回填结果，计划进度为，孵化器中，才有此数据，系统上可能会有多个孵化器，均展示，超出部分….，鼠标移上去展示全部；
    4、修改人、修改时间：仅取最近一次修改人和修改时间展示。
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-009
  rule: 关于筛选条件的说明： 1、孵化场、仓库可多选（待研发情况定）； 2、孵化场、养殖场为树形结构选择； 3、养殖批次为关键字查询，输入过程中查询现有关键字匹配养殖批次，下拉推荐选择项，可快速选择； 4、种蛋类型：默认只有合格蛋、二级蛋；
    种蛋类型： 全部种蛋类型 合格蛋
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-010
  rule: 每天凌晨零点，跑计划数据，匹配当日任务时间的计划，生成并下发当日节点任务。
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-011
  rule: 照蛋日期、出雏日期： 1、根据上孵日期选择，根据“孵化周期管理”中的天数配置，自动计算生成； 2、支持修改，只有修改上孵日期时，照蛋日期与出雏日期联动修改，修改照蛋日期、出雏日期不会使其他两个日期联动修改；
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-012
  rule: 计划建到单一孵化场，默认选择该账号权限所属孵化场第一个，切换孵化场不会清空下方已填数据。
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-013
  rule: 点击“+”，新增一行 空白计划，待编辑。
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-014
