  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-015
  rule: 最小为1
  source: live prototype annotation / related requirement page
  applies_to:
  - 上孵计划列表
  - 新建上孵计划
- id: BR-016
