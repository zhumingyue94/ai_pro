- id: BR-022
  rule: 确定一个种蛋的关键字段包括： 养殖场、养殖批次、种蛋类型、品种、周龄、平均蛋重、蛋重类型、产蛋日期； 新建计划时，每条计划只能创建一种蛋，不会出现一条计划中有多种蛋要上孵。 计划号： 孵化场： 全部孵化场 孵化一场 孵化二场 养殖场：
    全部养殖场 益兴一场 益兴二场 品种： 全部品种 AA 利丰 蛋重类型： 全部蛋重类型 大 中 小 特小 计划进度： 全部计划进度 待上孵 上孵中 待照蛋 出雏中 待选苗 已选苗 计划状态： 全部状态 正常 终止 创建人：
  source: live prototype annotation / related requirement page
