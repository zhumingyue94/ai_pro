[pytest]
# 测试文件命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 自定义标签（用于精准回归）
markers =
    smoke: 冒烟测试
    module: 业务模块标签
    dependency: 代码依赖标签

# 命令行默认参数
addopts = -v --tb=short --strict-markers

# 忽略目录
norecursedirs = .git .venv __pycache__ reports

filterwarnings = ignore::pytest.PytestReturnNotNoneWarning
