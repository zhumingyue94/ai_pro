id: REQ-001
title: 养殖端首页
zentao_module_id: 650
page_url: /biopark-poultry/dashboard/farm
module_complexity: query_report
testpoint_template: 查询报表
summary: 养殖员登录系统后的默认工作台（原型页面主标题 heading 实为「物联网监控中心」，浏览器/系统标题为「智慧园区管理平台」）。以栋舍为行的环境监控大表实时展示温湿度/通风/料塔等环控指标（原型可见23列），并提供列配置、按段区/栋舍排序切换、全屏等展示能力。需求
  3.1.4 消息中心已明确「暂不加」，当前版本不建独立入口。
in_scope:
- 栋舍环境监控表（栋舍/段区/日龄/温湿度/通风/料塔余量/湿帘状态等环控与养殖指标实时展示）
- 列配置（拖拽调整列表项显示顺序、自定义显示/隐藏列）
- 切换排序（按段区排序/按栋舍排序）
- 全屏/退出全屏（环境监控表全屏展示）
out_scope:
- 数据颜色预警规则（需求标注「待定，先不加颜色标识」）
- 体感温度实际计算（需求标注「先留位不用计算」，计算方式在垂直/纵向通风方案下不一定适用）
business_rules:
- 平均温差 = 平均温度 - 目标温度
- 前后温差 = 前区温度 - 后区温度
- 体感温度 = 平均温度 + (平均湿度-目标湿度)*湿热系数 - 风速*风冷系数；风速=栋舍内每秒排风量/栋舍截面积；每秒排风量=运行风机数量*风机功率(h)/3600；截面积=栋舍宽*屋檐高+栋舍宽*(屋顶高-屋檐高)/2；需求注明当前「先留位不用计算」
- 目标温度、目标湿度、湿热系数、风冷系数取自养殖标准（REQ-007，按品种+日龄匹配）
- 平均温度、平均湿度、舍外温度等为采集数据，来自环控系统上传；舍外温度亦可取官方天气数据
- 运行风机数量、风机功率、栋舍宽/屋檐高/屋顶高等来自园区基础信息-栋舍信息（用于风速计算，当前未启用）
- 段区标签（1段/2段/3段）按段区着色
- 数据颜色预警规则待定，暂不加颜色标识
- 消息中心（需求3.1.4）已明确「暂不加」，当前版本首页不含独立消息中心入口
roles:
- 养殖技术人员
- 养殖场长/养殖主管
- 饲养人员
interfaces:
- 养殖标准（REQ-007）：按品种+日龄提供目标温度/目标湿度/湿热系数/风冷系数，供本页体感温度公式与段区着色使用
- 环控系统（IoT，外部）：栋舍环境采集数据上传（温度/湿度/CO2/负压/通风级别/运行风机/料塔余量/湿帘状态）
- 官方天气数据接口（外部）：舍外温度备选来源
- 园区基础信息-栋舍信息：风机功率、栋舍宽/屋檐高/屋顶高（体感温度风速计算用，当前未启用）
risks:
- 体感温度公式在园区垂直通风+纵向通风方案下「不一定适用」，存在计算失真风险
- 数据颜色预警规则未定，验收口径不明确
- 原型表头「舍内外温差」「温控｜上限」「开｜关」与需求文字字段命名不完全一致，存在字段口径歧义风险
open_questions:
- 消息中心（3.1.4）虽标注「暂不加」，后续是否补建及验收范围需产品确认
- 数据颜色预警规则（待定）的具体阈值与颜色标准未明确
- 原型列「舍内外温差」「温控｜上限」「开｜关」未见于需求文字说明，含义需与开发/产品确认，不脑补
- 体感温度当前是页面留空还是不展示该列，需现场核对（需求仅说明「先留位不用计算」）
test_scope_suggestion:
- P2：环控监控表列字段展示与数据来源一致性（采集/计算/取标准值）
- P2：列配置（拖拽排序、显示/隐藏列）
- P2：切换排序（按段区排序/按栋舍排序）
- P3：全屏/退出全屏
- P3：段区标签按段区着色
- 待定：数据颜色预警规则、体感温度展示口径（需求未定，暂不设计强验收点）
