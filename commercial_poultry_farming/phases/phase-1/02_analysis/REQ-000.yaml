  不写「角色可查看」灌水测点。
in_scope:
- 补栏计划（REQ-002）
- 补栏确认（REQ-003）
- 死淘巡检（REQ-004）
- 饲养日志（REQ-005）
- 出栏结算（REQ-006）
- 养殖标准（REQ-007）
out_scope:
- REQ-001 养殖端首页
- REQ-008～012 生产报表
- 平台侧角色/菜单配置本身（仅验收商品禽养殖页面与接口表现）
- 提交/审核/复制（本期 002～007 无对应写路径）
- 各模块导入（除 REQ-007 养殖标准明细导入外均不存在）
business_rules:
- 菜单权限：有菜单权限可进入页面，无菜单权限不可进入
- 接口权限：各页面按实际存在的操作逐项校验；菜单权限与查询权限分开验证
- 权限专项测点索引 TP-000-16；菜单正反例 TP-000-17/18；接口逐项 TP-000-19~37
permission_notes:
- 各角色菜单与按钮权限在平台其他系统中配置
- 权限专项测点/用例统一在 REQ-000（TP-000-16~37），业务模块通过 permission_scope 引用
- 需准备多账号：无菜单 / 有菜单无某接口 / 全权限对照
roles:
- 养殖场长/养殖主管
- 养殖技术人员
- 智控中心小组成员（查看）
interfaces:
- 产业链生产排程系统（补栏计划下推）
- 孵化发货系统（补栏确认发货明细）
- 平台权限系统（菜单与接口权限配置）
risks:
- 角色权限依赖平台配置；需多账号/多角色准备
- 接口权限与 UI 按钮隐藏/禁用表现可能不一致，需同时观察页面与接口响应
