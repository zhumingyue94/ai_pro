summary: '养殖管理下的出栏结算页。数据由财务系统推送（云星瀚食品结算单、成品入库），页面无新增/编辑。 按栋舍养殖批次、出栏月份查询；列表展示结算指标与自动计算列（均重/饲养天数=出栏日龄/日增重/成活率/料肉比/欧指）； 工具栏/行内「详情」只读查看结算头信息与「成品入库明细」子表；支持导出。
  结算日期取自结算表推送字段，与补栏计划出栏日期无关；饲养天数/出栏日龄=结算日期−补栏日期； 总料量取补栏日～结算日饲养日志日吃料累计；不强制结算只数≤上苗数量。

  '
in_scope:
- 查询（栋舍养殖批次、出栏月份）；查询 / 重置
- 结算列表（含计算列与关联列）
- 详情弹窗（只读：结算指标 + 成品入库明细）
- 导出
out_scope:
- 云星瀚/财务同步机制本体与接口联调
- 批次复盘（REQ-012）、批次统计（REQ-008）等本次不测报表
- 结算审核/审批流（需求未提及）
- 新增/编辑结算登记及成品入库明细增删（财务推送、无入口；将来手工登记异常处理不在本版）
- 将来手工 vs 同步冲突优先级（当前无手工入口）
business_rules:
- 均重(kg) = 结算重量(kg) / 结算只数
- 饲养天数 = 结算日期 - 补栏日期
- 日增重(g) = 均重(kg) × 1000 / 饲养天数
- 成活率(%) = 结算只数 / 上苗数量 × 100%
- 料肉比 = 总料量(kg) / 结算重量(kg)
- 欧指 = (均重 × 成活率) / (料肉比 × 出栏日龄) × 10000
- 出栏日龄 = 结算日期 − 补栏日期（与列表「饲养天数」同一量；结算日期取自出栏结算表推送字段）
- 饲养天数 = 结算日期 − 补栏日期（结算日期取自出栏结算表，与补栏计划出栏日期无关）
- 结算日期 = 出栏结算表格中的结算日期（外系统推送），与补栏计划的出栏日期无关，二者可不一致
- 上苗数量关联 REQ-003 补栏确认初始进苗数量
- 总料量(kg) = 补栏日期～结算日期（结算表推送字段）区间内 REQ-005 饲养日志日吃料量累计
- 数据来源：财务系统推送（云星瀚食品结算单、成品入库）；页面无新增/编辑手工登记
- 不强制校验结算只数 ≤ 上苗数量（结算只数可大于上苗数量；成活率可 >100%）
- 成品入库明细列：产品编号、产品名称、规格、数量、单价（详情内只读展示）
- 将来若开通手工登记异常处理：以手工点击落库数据为主（当前无入口，不测）
roles:
- 养殖场长/养殖主管（报表查看）
interfaces:
- 依赖 REQ-003：栋舍养殖批次、上苗数量、补栏日期（饲养天数/出栏日龄）
- 依赖 REQ-005：总料量(kg)（补栏日～结算日累计吃料）
- 流向 REQ-008 / REQ-012（本次不测）
- 外部：财务/云星瀚系统推送（食品结算单、成品入库）
risks:
- 样例详情中部分关联字段（如上苗数量、均重、饲养天数）可能为空，需区分「未同步」与「计算失败」
- 将来手工登记入口若上线，须重新 Analyze 并上调模板；冲突规则以手工数据为主
open_questions: []
clarifications:
- topic: 新增/编辑入口
  resolved: 出栏结算由财务系统推送，无新增/编辑功能
- topic: 出栏日龄 vs 饲养天数
  resolved: 出栏日龄 = 饲养天数 = 结算日期 − 补栏日期；结算日期取自结算表推送字段，与补栏计划出栏日期无关（2026-7-21）
- topic: 总料量取数时点
  resolved: 补栏日期～结算日期（结算表字段）累计的日吃料量（关联饲养日志 REQ-005）
- topic: 结算只数 vs 上苗数量
  resolved: 不强制校验结算只数 ≤ 上苗数量
- topic: 同步与手工登记冲突
  resolved: 当前无手工登记；以后异常手工登记时以手工点击数据为主
test_scope_suggestion:
- P1：列表计算列（均重/饲养天数=出栏日龄/日增重/成活率/料肉比/欧指）对照公式
- P1：详情打开与只读展示（头信息 + 成品入库明细列）
- P1：总料量按补栏日～结算日累计吃料对账
- P1：结算日期可与补栏计划出栏日期不一致仍正常展示
- P2：查询（批次 × 出栏月份）与重置；总料量为空时料肉比/欧指为空；结算只数>上苗数量仍展示
- P3：导出、分页、单元格省略
- 禁止：生成「新增/编辑结算」「成品入库增删行」测点（财务推送、无入口）
