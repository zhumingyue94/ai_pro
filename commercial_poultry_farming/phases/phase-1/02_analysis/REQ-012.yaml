id: REQ-012
title: 批次复盘
zentao_module_id: 661
page_url: /biopark-poultry/report/batch-review
trace:
  story: null
  req: "2.3(流程⑦)"
  tp: null
  project: 商品禽养殖
  version: 1
  status: draft

module_complexity: query_report
testpoint_template: 查询报表

summary: >
  【本次测试范围外·不生成测点】
  选择批次后以 KPI 卡片 + 图表（进苗/出栏/成活率/料肉比/栋舍趋势）呈现批次整体
  评价，无标准表格列，属仪表盘型查询报表。需求 2.3 总体业务流程环节⑦“批次复盘”
  有输入/输出/负责人描述，但无 3.x 详述章节，本分析以原型实测（禅道模块 661、
  原型 /biopark-poultry/report/batch-review）+ 流程表为准，需求缺口记入
  open_questions，不脑补业务口径。按项目要求本模块仍归类为 query_report
  （非看板双视图），因页面无日历视图+列表视图并存的双视图结构。

in_scope:
  - 按批次选择查询批次整体评价
  - KPI 卡片展示（进苗、出栏、成活率、料肉比等汇总指标）
  - 图表展示（栋舍趋势等）

out_scope:
  - 批次复盘数据的新增/编辑/删除（本模块为只读聚合报表）
  - 出栏结算（REQ-006）、饲养日志（REQ-005）、死淘巡检（REQ-004）原始数据录入
  - 复盘报告的导出（原型未见导出按钮，见 open_questions）

business_rules:
  - 查询条件仅“批次”（下拉选择）
  - 页面聚合展示该批次的进苗（补栏）、出栏、成活率、料肉比等 KPI 卡片指标，及“栋舍趋势”图表
  - 成活率(%)、料肉比 引用需求第4章公共公式（成活率=结算只数/上苗数量×100%；料肉比=单只累计采食量(g)/单只当前体重(g)），取值节点（是否取出栏结算最终值）需人工核实
  - 需求 2.3 流程⑦“批次复盘”：输入=全批次生产数据，输出=复盘报告、趋势图表，负责人=园区管理人员

roles:
  - 园区管理人员
  - 养殖场长/养殖主管

interfaces:
  - 补栏确认（REQ-003）：进苗（补栏）数量数据来源
  - 出栏结算（REQ-006）：出栏数量/重量、成活率、料肉比、欧指等经营指标来源
  - 饲养日志（REQ-005）/ 死淘巡检（REQ-004）：栋舍趋势图表的逐日指标序列来源（推测）
  - 全链路：本模块聚合“进苗 → 日常饲养/死淘 → 出栏结算”全过程数据形成批次复盘结论

risks:
  - 需求说明书无本模块详述章节，全部依赖原型静态抓取（原型抓取仅到页面标题“批次整体评价”与图表标记，未展开卡片/图表具体文案），业务口径理解偏差风险较高
  - KPI 卡片与图表的具体计算口径、数据来源节点未明确，可能导致测点预期结果无法判定
  - 页面无标准表格列，测点设计需依赖人工进入原型核实卡片/图表的具体呈现内容

open_questions:
  - 需求说明书无 3.8 批次复盘章节，仅 2.3 流程⑦提及“批次结束复盘分析”，业务口径以原型仪表盘为准，需人工进入原型逐项核实
  - KPI 卡片具体展示的指标名称、单位、计算口径未能通过原型静态抓取确认（原型仅抓取到页面标题与 chart 标记），需人工核实卡片文案与取数规则
  - “栋舍趋势”图表的 X/Y 轴、时间粒度（按日/按周）、对比栋舍范围未定义
  - 查询“批次”是单选还是可多选对比未明确；选择批次后 KPI 是否仅展示该批次单值还是含环比/对比未定义
  - 是否提供导出/打印复盘报告的入口，原型静态抓取未发现导出按钮，需人工核实
  - 图表数据来源链路（进苗←补栏确认、出栏←出栏结算、成活率/料肉比←出栏结算或饲养日志累计、栋舍趋势←饲养日志/死淘巡检按日序列）为分析推断，需人工原型核实后收窄

test_scope_suggestion:
  - 本次测试范围外：生产报表模块，本轮不生成测点/用例/执行；分析保留供跨模块引用
  - 查询条件覆盖：批次选择（有数据批次/无数据批次/未选择时的默认展示）
  - KPI 卡片数值与出栏结算/补栏确认等上游数据的一致性核对（待取数节点确认后细化）
  - 栋舍趋势图表展示的正确性（待轴/粒度确认后细化，如坐标轴、图例、多栋舍对比）
  - 无数据批次的空态展示（卡片显示0/图表显示空态）
  - "不生成“角色可查看”类测点（role_coverage=skip）"

prototype_verification:
  query_field_specs:
    - name: 批次
      control: select
      editable: true
      required: false
      options_source: 补栏确认（REQ-003）生成的栋舍养殖批次编号
      notes: 原型抓取为下拉单选，是否支持多选对比未核实
  table_column_specs: []
  computed_fields:
    - name: 成活率(%)
      formula: 结算只数/上苗数量×100%（需求第4章“成活率”），取值节点需人工核实
      editable: false
    - name: 料肉比
      formula: 单只累计采食量(g)/单只当前体重(g)（需求第4章“料肉比”），取值节点需人工核实
      editable: false
  save_validations: []
  ui_components: []
  button_semantics:
    查询:
      action: query
      summary: 按所选批次刷新 KPI 卡片与图表
    重置:
      action: reset
      summary: 清空批次选择并恢复默认展示
  page_chrome:
    title: 批次整体评价
    view_tabs: []
    notes:
    - 无标准表格列，KPI卡片+图表仪表盘布局
    - KPI卡片（原型可见）：进苗数量、出栏数量、成活率、料肉比
    - 图表区（原型可见）：栋舍出栏数量、栋舍出栏料肉比、栋舍出栏体重、栋舍指标趋势分析(天)
    - 栋舍指标切换维度（原型可见）：死淘、日采食、日饮水、水料比、周体重、料肉比、外界气温、目标温度、舍内湿度、二氧化碳
    - 栋舍选择多选（原型可见：1栋~N栋）
  role_coverage: skip

design_artifacts:
  decision_tables:
    - name: 批次复盘查询
      conditions: [批次是否选择, 批次是否有出栏结算]
      rules:
        - 未选择批次 → 空态或默认批次展示（原型行为需核实）
        - 已选择有数据批次 → 展示 KPI+图表
        - 已选择无数据批次 → 空态/零值（需核实）
  combinatorial_blocks: []
