id: REQ-008
title: 批次统计
zentao_module_id: 657
page_url: /biopark-poultry/report/batch-stats
trace:
  story: null
  req: "3.8.1"
  tp: null
  project: 商品禽养殖
  version: 1
  status: draft

module_complexity: query_report
testpoint_template: 查询报表

summary: >
  【本次测试范围外·不生成测点】
  以栋舍养殖批次为维度，汇总该批次从补栏到出栏全过程的统计指标（累计死淘、累计吃料、
  累计饮水等），供养殖场长/生产主管核查批次整体生产表现。需求 3.8.1 有详述，但原型
  实测列（17列）多于需求原文列出的 9 个字段，新增“计划补栏量/达成率/转运成活率/
  转运体重/转运料比”等字段的口径未在需求中定义，以原型展示为准，缺口记入
  open_questions。

in_scope:
  - 按补栏日期范围 + 栋舍养殖批次编号查询批次统计列表
  - 补栏日期范围默认最近一个月内数据
  - 17 列统计字段展示（含分段养殖统计数据与批次全程汇总数据）
  - 导出当前查询结果

out_scope:
  - 批次统计数据的新增/编辑/删除（本模块为只读报表，不提供写路径）
  - 转运称重环节本身的记录功能（流程⑤存在但原型无独立菜单，见 open_questions）
  - 补栏确认/死淘巡检/饲养日志/出栏结算等上游模块的原始数据录入（分别见 REQ-003～REQ-006）

business_rules:
  - 查询条件：补栏日期范围查询 + 栋舍养殖批次编号，补栏日期范围默认最近一个月内数据（需求 3.8.1 明确）
  - 展示信息分两层：批次对应的每段养殖统计数据、该批次从补栏到出栏全过程汇总数据（原型未见明显的父子行/分组视觉区分，需人工核实实际展示形态，见 open_questions）
  - 累计死淘（量）= 累计死亡 + 累计淘汰（引用需求第 4 章公共公式“累计死淘”）
  - 只累计吃料量(g)/累计吃料量(kg)/只累计饮水量(ml)/累计饮水量(L) 为饲养日志（REQ-005）逐日数据的累计值
  - 达成率(%)、当前成活率(%)、转运成活率(%)、转运体重(kg)、转运料比 为原型新增列，需求未定义计算口径，暂以原型展示为准（见 open_questions）

roles:
  - 养殖场长/养殖主管
  - 生产主管

interfaces:
  - 补栏确认（REQ-003）：栋舍养殖批次编号、补栏（上苗）时点数据来源
  - 死淘巡检（REQ-004）/ 饲养日志（REQ-005）：累计死淘量、只累计吃料/饮水量数据来源
  - 出栏结算（REQ-006）：转运体重/转运成活率/转运料比疑似关联该模块或“转运称重”环节（流程⑤，原型无独立菜单）
  - 全链路：本报表汇总消费“补栏确认 → 死淘巡检/饲养日志 → 出栏结算”全过程数据

risks:
  - 计划补栏量/达成率、转运成活率、转运体重、转运料比等字段公式未在需求中定义，可能导致测点判定标准与实际系统口径不一致
  - 需求 3.8.1 列出字段（9 个）少于原型实测列（17 个），存在需求文档滞后于原型的风险
  - 测试环境当前批次统计页可能暂无真实数据，需在执行阶段自建测试数据以验证列展示与导出

open_questions:
  - 达成率(%) 计算口径未在需求中定义（推测为“实际补栏量/计划补栏量×100%”，需人工核实原型或产品确认）
  - 转运成活率(%)、转运体重(kg)、转运料比 疑似来自“转运称重”环节（流程⑤有描述但原型无独立菜单），生成时点与计算公式均未定义
  - “累计死淘量”与 3.5 饲养日志“累计死淘”是否为同一指标（含死亡+淘汰）需确认口径一致性
  - 展示信息“每段养殖统计数据”与“全过程汇总数据”在列表中的呈现形式（分组行/独立行/切换视图）原型静态抓取未能确认，需人工进入原型核实
  - 当前测试环境批次统计页可能暂无数据，无法核实分页、空态展示及导出文件内容的实际表现，需执行阶段自建数据验证

test_scope_suggestion:
  - 本次测试范围外：生产报表模块，本轮不生成测点/用例/执行；分析保留供跨模块引用
  - 查询条件覆盖：补栏日期范围默认值、边界值（月初/月末）、栋舍养殖批次模糊/精确匹配、单独或组合查询
  - 17 列字段显示准确性，尤其 4 个计算列（达成率/当前成活率/转运成活率/转运料比）与上游数据的一致性核对
  - 段区维度数据与全程汇总数据的对应关系是否正确（若原型确认为分组展示）
  - 导出功能：导出文件内容与当前查询筛选结果一致
  - 分页、单元格省略号等通用列表组件
  - 无匹配数据时的空态展示
  - "不生成“角色可查看”类测点（role_coverage=skip）"

prototype_verification:
  query_field_specs:
    - name: 补栏日期
      control: input
      editable: true
      required: false
      notes: 日期范围选择器；默认最近一个月内数据（需求 3.8.1 明确）
    - name: 栋舍养殖批次
      control: select
      editable: true
      required: false
      options_source: 补栏确认（REQ-003）生成的栋舍养殖批次编号
      notes: 原型为下拉选择，需核实是否支持模糊搜索
  table_column_specs:
    - name: 序号
      order: 1
    - name: 栋舍养殖批次
      order: 2
    - name: 栋舍
      order: 3
    - name: 计划补栏量
      order: 4
      notes: 需求未定义，来源疑似补栏计划（REQ-002），见 open_questions
    - name: 实际补栏量
      order: 5
    - name: 达成率(%)
      order: 6
      notes: 计算口径未定义，见 open_questions
    - name: 当前成活率(%)
      order: 7
    - name: 段区
      order: 8
    - name: 养殖天数
      order: 9
    - name: 累计死淘量
      order: 10
    - name: 转运成活率(%)
      order: 11
      notes: 计算口径未定义，见 open_questions
    - name: 只累计吃料量(g)
      order: 12
    - name: 累计吃料量(kg)
      order: 13
    - name: 只累计饮水量(ml)
      order: 14
    - name: 累计饮水量(L)
      order: 15
    - name: 转运体重(kg)
      order: 16
      notes: 计算口径未定义，见 open_questions
    - name: 转运料比
      order: 17
      notes: 计算口径未定义，见 open_questions
  computed_fields:
    - name: 累计死淘量
      formula: 累计死亡 + 累计淘汰（需求第4章“累计死淘”）
      editable: false
    - name: 只累计吃料量(g)
      formula: 饲养日志逐日“只日吃料量(g)”累计
      editable: false
    - name: 累计吃料量(kg)
      formula: 饲养日志逐日“日吃料量(kg)”累计
      editable: false
    - name: 只累计饮水量(ml)
      formula: 饲养日志逐日“只日饮水量(ml)”累计
      editable: false
    - name: 累计饮水量(L)
      formula: 饲养日志逐日“日饮水量(L)”累计
      editable: false
    - name: 达成率(%)
      formula: 未定义（推测 实际补栏量/计划补栏量×100%），见 open_questions
      editable: false
    - name: 当前成活率(%)
      formula: 引用第4章“成活率”公式，具体取数节点未定义
      editable: false
  save_validations: []
  ui_components:
    - pagination
    - cell_ellipsis_tooltip
    - export
  button_semantics:
    导出:
      action: export_list
      summary: 按当前查询条件（补栏日期范围+栋舍养殖批次）导出批次统计列表，文件格式/内容未在原型核实
  page_chrome:
    title: 批次统计
    view_tabs: []
    notes: []
  role_coverage: skip

design_artifacts:
  bva_fields:
    - field: 补栏日期范围
      type: date_range
      boundaries: [最近一个月首日, 最近一个月末日, 超出一个月范围]
      notes: 默认最近一个月内数据；边界为“恰好一个月前”与“超出一个月”两侧
