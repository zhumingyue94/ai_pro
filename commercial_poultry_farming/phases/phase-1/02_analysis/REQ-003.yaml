    - 数量
    - 苗重
    - 笼子列号
    - 笼子层号
    external_data:
    - 孵化系统-发货
  ui_components:
  - pagination
  - cell_ellipsis_tooltip
  - export
  role_coverage: skip
design_artifacts:
  state_transitions:
  - name: 补栏确认状态
    states:
    - 待发货
    - 待确认
    - 部分确认
    - 已完成
    legal:
    - from: 待发货
      to: 待确认
      trigger: 发货单状态变为发货中/已发货且尚无已确认明细（系统自动）
    - from: 待确认
      to: 部分确认
      trigger: 确认任意一个发货明细
    - from: 部分确认
      to: 部分确认
      trigger: 继续确认其他明细但未全部确认
    - from: 部分确认
      to: 已完成
      trigger: 发货单已发货且发货明细全部确认
    - from: 待确认
      to: 已完成
      trigger: 发货单已发货且一次性全部确认
    illegal:
    - from: 已完成
      action: 再次确认/重新编辑明细
      expected: 需求未说明是否允许，暂列为待确认边界（见open_questions）
  decision_tables:
  - name: 确认状态推导
    conditions:
    - 发货单状态
    - 是否存在已确认明细
    - 是否全部确认
    rules:
    - when: 发货单状态=待发货
      then: 确认状态=待发货
    - when: 发货单状态=发货中 且不存在已确认明细
      then: 确认状态=待确认
    - when: 发货单状态=发货中 且存在已确认明细且未全部确认
      then: 确认状态=部分确认
    - when: 发货单状态=已发货 且不存在已确认明细
      then: 确认状态=待确认
    - when: 发货单状态=已发货 且存在已确认明细且未全部确认
      then: 确认状态=部分确认
    - when: 发货单状态=已发货 且发货明细全部确认
      then: 确认状态=已完成
    - when: 发货单状态=已签收
      then: 确认状态=已完成
  - name: 列表查询组合
    conditions:
    - 上苗日期
    - 状态
    rules:
    - when: 仅上苗日期
      then: 按日期过滤
    - when: 上苗日期+状态
      then: AND组合过滤，无匹配时列表空态
  bva_fields:
  - field: 雏苗数量(上苗数量)
    type: number
    boundaries:
    - 0
    notes: 需求未给出数量上下限
  - field: 苗重(g)
    type: number
    boundaries:
    - 0
    notes: 需求未给出上限
  - field: 笼子列号/笼子层号
    notes: 需求未给出取值范围边界，暂不虚构（见open_questions）
  combinatorial_blocks:
  - name: 确认操作组合
    pict_eligible: true
    parameters:
      发货单状态:
      - 待发货
      - 发货中
      - 已发货
      - 已签收
      已确认明细数:
      - '0'
      - 部分
      - 全部
      确认方式:
      - 单个确认
      - 批量确认
      上孵明细波次:
      - 单波
      - 多波
    constraints:
    - IF 发货单状态=待发货 THEN 无可确认明细
    - IF 已确认明细数=全部 且 发货单状态=已发货 THEN 确认状态=已完成
    - IF 确认方式=批量确认 THEN 一次操作覆盖多条上孵计划明细
