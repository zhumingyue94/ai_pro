id: REQ-003
title: 补栏确认
zentao_module_id: 652
page_url: /biopark-poultry/production/chick-sign
module_complexity: compound_form
testpoint_template: 复合表单CRUD审核
summary: 对孵化场送达养殖栋舍雏苗进行签收确认（附录仍残留「雏苗签收」命名，页面URL仍含 chick-sign，以本模块「补栏确认」状态口径为准）。补栏确认主数据按补栏计划日期提前生成（计划编号/上苗日期/栋舍/品种，确认状态默认「待发货」），生成时即分配「栋舍养殖批次」编号（PC-yyyy-栋舍编号-xx），无需等首次确认上孵明细。孵化端发货确认后回填上苗数量/平均苗重并更新确认状态。孵化发货单分三层；支持按发货明细单个确认、批量确认。批次供死淘巡检、饲养日志等下游模块引用。
in_scope:
- 按补栏计划日期提前生成补栏确认主数据
- 查询（上苗日期/状态）
- 列表展示（栋舍养殖批次/计划编号/上苗日期/栋舍/确认状态/蛋源/品种/雏苗数量/苗重/免疫信息/孵化批次/发货单号）
- 确认弹窗（左侧上孵计划明细列表 + 右侧笼位明细列表）
- 单个确认、批量确认
- 确认状态自动流转（待发货/待确认/部分确认/已完成）
- 栋舍养殖批次编号在生成补栏确认时分配
out_scope:
- 补栏计划的制定与下推（REQ-002/产业链生产排程系统职责）
- 孵化端发货单据的制单与发货操作（孵化系统职责，本模块仅接收/展示/确认）
- 转运称重（需求2.3流程⑤提及，原型无对应菜单、无禅道三级模块，暂不建验收范围，记为流程缺口）
business_rules:
- 补栏确认根据补栏计划日期提前生成；与是否已确认上孵明细无关
- 生成补栏确认时即分配栋舍养殖批次（PC-yyyy-栋舍编号-xx）；待发货阶段列表批次列已有值
- 数据生成方式：排程计划下推后生成补栏计划及补栏确认部分主数据：补栏计划编号、上苗日期、栋舍、品种、确认状态(待发货)
- 孵化端发货确认后生成/更新：上苗数量（实际发货量）、平均苗重（实际苗均重）、确认状态
- 孵化发货单分3层：第一层发货单主信息（订单号=补栏计划号、发苗数量、苗重等）；第二层发货明细（对应孵化端上孵明细计划）；第三层每个发货明细数据对应的苗放置具体位置记录
- 孵化发货单状态：待发货/发货中/已发货/已签收
- 确认状态推导：发货单=待发货 → 确认状态=待发货；发货单=发货中 且不存在已确认明细 → 待确认；发货单=发货中 且存在已确认明细且未全部确认 → 部分确认；发货单=已发货 且不存在已确认明细 → 待确认；发货单=已发货 且存在已确认明细且未全部确认
  → 部分确认；发货单=已发货 且发货明细全部确认 → 已完成；发货单=已签收 → 已完成
- 点击「确认」：只要存在任意一个发货明细被确认，即更新主表状态为部分确认（批次已在生成补栏确认时分配，确认不再新建批次）
- 若发货单状态为已发货 且发货明细数据全部确认后，更新主表状态为已完成，并推送消息到孵化端，孵化端据此更新发货状态为已签收
roles:
- 养殖技术人员（确认操作）
- 孵化端人员（发货，外部系统角色）
interfaces:
- 补栏计划（REQ-002）：主数据来源（计划编号/上苗日期/栋舍/品种，确认状态默认待发货）
- 孵化发货系统（外部）：发货单主信息/发货明细/苗放位置明细提供；确认完成后回推「已签收」状态
- 死淘巡检（REQ-004）/饲养日志（REQ-005）：消费本模块生成补栏确认时分配的「栋舍养殖批次」编号作为下游记录主键
- 出栏结算（REQ-006）/生产报表-批次统计/批次复盘（REQ-008/REQ-012）：全链路下游按栋舍养殖批次追溯数据
risks:
- 三层发货单据（主信息/发货明细/苗放位置）与确认状态推导规则组合复杂，易漏测状态边界组合
- 生成补栏确认时分配批次；若多人并发触发提前生成，需保证同计划批次号唯一（需求未描述并发处理策略）
open_questions:
- 已完成状态的记录是否仍允许查看明细，是否支持重新打开确认弹窗，需求未明确
- 多人并发确认同一发货明细时的加锁/冲突处理策略，需求未描述
- 笼子列号/层号的取值范围、栋舍养殖批次编号「xx」序号的具体生成规则（如是否按栋舍月度递增），需求未给出边界
- 批量确认在弹窗内的具体交互方式（勾选/全选），需求仅提及「支持单个确认、批量确认」，未描述交互细节
- 工具栏「明细」按钮的具体触发范围与「确认」弹窗内左右列表的关系，原型探测未展开，需与开发确认，不脑补
test_scope_suggestion:
- P1：按计划日期提前生成补栏确认，且生成时批次已分配
- P1：确认弹窗打开、单个确认、批量确认、确认后状态更新；批次在生成确认单时已分配
- P1：确认状态推导（发货单状态×明细确认情况→确认状态）逐组合验证
- P2：查询（上苗日期/状态）
- P2：列表字段与发货数据一致性
- P3：分页、单元格省略提示、导出
- 待定：并发确认冲突处理（需求未描述）
