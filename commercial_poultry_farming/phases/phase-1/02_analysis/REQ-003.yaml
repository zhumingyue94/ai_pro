      dialog: 补栏确认
      summary: 打开确认弹窗，展示左侧上孵计划明细列表与右侧笼位明细列表，支持单个/批量确认发货明细
    导出:
      action: export_list
      summary: 按当前查询条件导出列表（原型工具栏可见，需求文字未详述导出列范围）
    明细:
      action: view_detail
      summary: 查看发货明细/苗放位置只读明细，具体触发范围与「确认」弹窗关系需与开发确认（见open_questions）
  nested_dialogs:
  - id: 补栏确认
    type: input
    trigger: 列表行「确认」按钮 / 工具栏「确认」按钮（批量）
    title: 补栏确认
    buttons:
    - 确认
    - 取消
    field_specs: []
    data_source: 原型探测显示该弹窗无独立表单字段，仅确认/取消按钮；左右两侧明细列表见 sub_tables
    on_confirm: 按确认状态推导规则更新主表确认状态；栋舍养殖批次已在生成补栏确认时分配，确认不新建批次
