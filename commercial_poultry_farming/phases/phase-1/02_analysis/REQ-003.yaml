  - name: 状态
    control: select
    editable: true
    validation: 待发货/待确认/部分确认/已完成
  table_column_specs:
  - name: 序号
    order: 1
    notes: 行序号
  - name: 栋舍养殖批次
    order: 2
    notes: 生成补栏确认时已分配 PC-yyyy-栋舍编号-xx；待发货行亦非空
  - name: 计划编号
    order: 3
    notes: 排程下推生成
  - name: 上苗日期
    order: 4
    notes: 排程下推生成
  - name: 栋舍
    order: 5
    notes: 排程下推生成
  - name: 确认状态
    order: 6
    notes: 待发货/待确认/部分确认/已完成，排程下推生成状态默认待发货
  - name: 蛋源
    order: 7
