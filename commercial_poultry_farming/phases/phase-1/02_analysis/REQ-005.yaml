generation_rules:
  mode: scheduled
  toolbar_no_add: true
  row_no_delete: true
  rules:
  - 有批次的栋+段才生成日志；无批次段区不生成
  - 补栏确认发货状态已发货/已签收才生成；待发货/发货中不生成
  - 变为已发货当日可补从补栏日期0日龄至当日的历史日志
  - 已有出栏结算单的栋舍养殖批次（补栏计划已完成）不再定时生成新日志
  - 已发货时 0 日龄存栏=发货总量（不论是否确认）
  - 变已发货当日补齐从补栏日期0日龄至当日的历史日志；补历史死淘按对应日巡检，无则0
  - 存栏递推：0日龄=上苗数；n日龄=前一日存栏−前一日死淘
  - 死亡/淘汰/日吃料量/日饮水量统计截止到本次生成时刻，之后数据计入次日
