summary: 养殖管理下的饲养日志页。日志由定时任务按栋舍段区自动生成（无「新增记录」「删除」）；按养殖日期范围/栋舍/段区查询；树形列表按「养殖日期+栋舍」父行汇总、段区子行展开，行内仅编辑。「编辑饲养日志」头区批次/栋舍/段区/日期只读；死亡/淘汰从死淘巡检同步不可改；转运体重/当日饮水/吃料量可由机器读取并可修改；饲料表名称/配比/单位只读。「注释说明」展示欧指/料肉比/水料比公式；「日报表导出」按查询条件导出。
in_scope:
- 查询区：养殖日期（范围，默认当日）、栋舍、段区；查询 / 重置
- 树形列表：父行日期+栋舍汇总，子行段区；展开/折叠；分页
- 工具栏：注释说明、日报表导出（无新增记录）
- 行操作：仅编辑（无删除）
- 定时任务生成饲养日志（有批次的栋+段；发货状态已发货/已签收等，见 generation_rules）
- 编辑饲养日志弹窗（头区只读 + 取消/确定；死淘只读同步；机读字段可改）
- 饲料吃料量子表（饲料名称/配比/吃料量/单位；总吃料量展示）
- 注释说明（公式只读）
- 日报表导出
out_scope:
- 移动端录入交互本体
- 手工「新增记录」/「删除」入口与流程（已移除）
- 养殖标准明细维护（REQ-007）
- 批次统计（REQ-008）、养殖日报（REQ-009）等生产报表（本次不测）
- 出栏结算自身结算逻辑（REQ-006）
- 列表不再展示的 V1.1 已移除累计列
business_rules:
- 日志由定时任务生成：有批次的栋舍+段区才生成；无批次段区不生成
- 发货状态为已发货、已签收才生成日志；待发货/发货中不生成；变为已发货当日补齐补栏日期～今日历史日龄日志（见需求变动）
- 已有出栏结算单的栋舍养殖批次（补栏计划已完成）→ 定时任务不再生成新日志（2026-7-21）
- 已发货时 0 日龄存栏数取发货总量（不论是否确认）
- 补历史日死淘取对应日巡检实际值，无巡检则死淘=0
- 存栏递推：0日龄存栏=上苗数；n日龄存栏=前一日存栏−前一日死淘
- 统计截止（统一）：死亡数量、淘汰数量、日吃料量、日饮水量均以本条日志生成时间为界；生成时间之后的巡检或机读推送计入次日日志
- 日死淘数量 = 日死亡数量 + 日淘汰数量
- 存栏只数 = 上苗量 - 累计死淘（列表展示口径；补历史日另按日龄递推）
- 成活率(%) = 存栏只数 / 上苗量
- 料肉比 = 只累计吃料量 / 转运体重；转运体重为空则料肉比显示空；为0则显示0或空且不报错
- 日吃料量(kg) = 各料号吃料量之和（弹窗「总吃料量」）
- 只日吃料量(g) = 日吃料量(kg) / 存栏只数 × 1000
- 只日饮水量(ml) = 日饮水量(L) / 存栏只数 × 1000
- 饲料名称/配比按审核通过排程的三段养殖标准-日龄采食计划带出；吃料量机读可改；单位 kg；不可手动增删行
- 编辑历史日志改吃料量会影响日累计采食量，进而影响料肉比
- 关联补栏计划状态为「已完成」（已收到出栏结算单）时，饲养日志不允许编辑：子行「编辑」不可用（禁用或隐藏）
- 关联补栏计划为「执行中」/「待执行」（未结算）时，饲养日志仍可编辑保存
- 无删除入口
- V1.1：列表无累计死淘/累计吃料/累计饮水等列
roles:
- 养殖技术人员（录入、栋舍日常饲养管理）
- 养殖场长/养殖主管（死淘异常处理、数据查看）
interfaces:
- 依赖 REQ-002 补栏计划：计划状态「已完成」=已收到出栏结算单；已完成时锁定本模块编辑
- 依赖 REQ-003 补栏确认：栋舍养殖批次、上苗量/发货量（存栏）、生成触发相关发货状态
- 依赖 REQ-004 死淘巡检：日死亡/淘汰同步到日志（只读）
- 饲料名称、配比：排程系统审核通过排程 → 三段养殖标准日龄采食计划
- 转运体重/当日饮水/吃料量：机器/接口推送可读，编辑可改（计划未完成时）
- 数据被 REQ-006 出栏结算消费（累计吃料等）
- 数据被 REQ-008/REQ-009 等报表消费（本次不测）
risks:
- 定时任务触发时点与「生成时刻」统计窗口需与环境配置一致
- 料肉比体重=0 时展示 0 或空，产品展示口径需与实现一致
- 空与 0 在死亡/淘汰/饮水/吃料上的展示（空或者0）需与实现一致
- 已完成锁定依赖出栏结算单回写补栏计划状态；状态延迟可能导致短暂仍可编
open_questions:
- 死亡/淘汰/饮水/吃料「空」与「0」在列表上的最终展示是否统一为单一口径
- 转运体重=0 时料肉比显示 0 还是空（测点保留双可选时需产品钉死）
test_scope_suggestion:
- P1：定时生成可见；编辑打开/保存；树汇总；日死淘公式；巡检同步一致；日吃料汇总；补栏计划已完成时编辑不可用；有结算单批次不再定时生成
- P2：查询组合/重置；机读字段可改与空零；饲料表；料肉比公式与空体重；执行中计划仍可编辑；并发编辑
- P3：注释说明；日报表导出；分页；省略号；小数位一致
- 禁止：生成「新增记录」「删除」入口测点；禁止把死亡/淘汰写成可编辑必填清空拦截
- 禁止：保留「结算后仍可编辑」旧口径测点
