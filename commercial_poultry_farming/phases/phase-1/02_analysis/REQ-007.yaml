id: REQ-007
title: 养殖标准
source_inputs:
- 01_requirements/商品禽养殖管理系统_需求说明书.docx（§3.7）
- 01_requirements/模块拆分清单.md（REQ-007）
- 01_requirements/目标明细导入模板.xlsx
- 原型 http://43.143.148.114:18885/biopark-poultry/portal → 商品禽养殖管理系统 → /biopark-poultry/basic/target
zentao_module_id: 656
page_url: /biopark-poultry/basic/target
module_complexity: compound_form
testpoint_template: 复合表单CRUD审核
summary: '标准管理下的养殖标准库维护页。按「标准名称 + 适用品种（多选）+ 适用月份（多选）+ 启用/禁用」维护标准主记录； 通过行内「目标明细」打开 0–42 日龄（固定 43 行）×17 列标准参数表（日龄只读，其余 16 维可编辑
  number）， 支持弹窗内「Excel导入」三步向导（下载模板→上传→结果）与弹窗内「导出」当前标准目标明细。 下游：养殖端首页（REQ-001）按品种+日龄取目标温度/目标湿度/湿热系数/风冷系数； 饲养日志（REQ-005）与标准值对照关系需求未写死，记
  open_questions。

  '
in_scope:
- 查询区：标准名称（模糊）、状态（启用/禁用）；查询 / 重置
- 列表：标准名称 / 适用品种 / 适用月份 / 状态 / 操作；分页
- 工具栏：新增目标（无列表导出）
- 行操作：目标明细、编辑、删除（删除二次确认）
- 新增目标 / 编辑目标弹窗（主记录四字段；按钮取消/确定）
- 目标明细弹窗：43×17 可编辑表 + 导出 / Excel导入 / 取消 / 保存明细
- 目标明细弹窗内「导出」→ 下载当前标准明细 Excel（文件名 {标准名称}.xlsx）
- Excel 导入向导（导入目标明细）：下载模板、字段说明、上传 .xlsx/.xls、导入结果
- 本地模板文件约定（与 01_requirements/目标明细导入模板.xlsx 列一致）
out_scope:
- 首页体感温度公式落地与段区着色实现（REQ-001）
- 饲养日志吃料/指标计算实现（REQ-005）
- 审核流（暂存/待审/通过/驳回）— 需求与原型均仅启用/禁用，不脑补
- 生产报表模块（REQ-008～012，本次不测）
business_rules:
- 主记录维度：标准名称 + 适用品种（多选标签）+ 适用月份（多选标签，1–12 月）+ 状态（启用/禁用）
- 品种+月份组合唯一：任一「品种×月份」对在全库标准间不可重叠（例：标准A含AA+1–6月，标准B含AA+4/8/10/12月 → AA+4月冲突，不允许保存）
- 明细主键：日龄整数 0–42，共 43 行；日龄不可重复；日龄列只读；标准名称可含「45日龄」等文案，明细行仍固定 0–42
- 明细 17 列 = 日龄 + 16 维参数（精度/上限见 form_field_specs）；「累计*」为纯手工输入，非系统自动累加，供其他系统/模块作达成判断标准
- Excel 导入：校验日龄范围 0–42；仅「日龄」必填，其余 16 维非必填；仅 .xlsx/.xls；页面录入与导入的必填规则一致
- 明细允许保存 0 / 空（与导入非必填统一）
- 导入文件格式：仅支持 .xlsx、.xls
- 删除：二次确认文案「确定要删除目标\"{标准名称}\"吗？」（标题「提示」）；删除不影响已被引用的历史数据
- 已禁用标准不可被新引用；禁用前已引用的历史数据不受影响
- 主记录写路径与明细写路径分离：新增/编辑只维护主字段；明细仅在「目标明细」保存或 Excel 导入回写
- 导出：入口在目标明细弹窗；仅导出已保存内容（未点「保存明细」的新输入不导出）；文件名完整显示标准名称（「{标准名称}.xlsx」）；sheet「目标明细」；43×17，表头与导入模板同构
roles:
- 养殖场长/养殖主管（标准维护，原型当前登录角色展示为管理员/运营总监）
interfaces:
- REQ-001 养殖端首页：澄清口径为现场设备监测数据仅展示，与本模块养殖标准无匹配/引用关系（需求 3.1.3 旧述取标准值的口径以本澄清为准，不在本模块测跨页匹配）
- REQ-005 饲养日志：「累计*」等标准值可作为其他模块达成判断输入；具体引用链路不在本模块展开
- 本地 Excel：下载模板 / 上传导入 / 目标明细导出（已保存的当前标准 0–42×17）
cross_module_refs:
- module: REQ-001
  relation: none
  notes: 澄清后与养殖标准无关；不测月份匹配
- module: REQ-005
  relation: possible_consumer
  notes: 累计*等可作为达成判断标准；链路不在本模块展开
risks:
- 43×16 可编辑单元格量大，手工录入与 Excel 导入两条路径一致性风险高
- 品种+月份多选组合唯一性校验组合爆炸，易漏测交叉重叠边界
- 导出仅已保存内容，易与「导出当前网格所见」预期混淆
open_questions: []
resolved_clarifications:
- topic: 品种+月份唯一
  conclusion: 品种×月份对全库不可重叠，冲突则不允许
- topic: REQ-001匹配
  conclusion: REQ-001仅现场监测展示，与养殖标准无关
- topic: 累计字段
  conclusion: 纯输入，非自动累加
- topic: 导出内容与文件名
  conclusion: 仅已保存内容；文件名完整标准名称
- topic: 禁用与删除引用
  conclusion: 禁用后不可新引用，历史引用不受影响；删除不影响历史引用数据
- topic: 0/空与必填一致
  conclusion: 允许0/空；页面与导入必填规则统一
- topic: 名称与日龄行
  conclusion: 明细固定0–42，与标准名称文案无关
test_scope_suggestion:
- P1：新增/编辑主记录；品种+月份唯一拦截；目标明细录入保存；导入成功；明细内导出已保存数据；删除确认
- P2：查询组合与重置；导入/模板结构边界（PICT+模板）；日龄只读与 BVA；导出不含未保存修改
- P3：状态标签、单元格省略、分页；列表工具栏无导出
- 禁止脑补：审核流；REQ-001 按月份匹配养殖标准
