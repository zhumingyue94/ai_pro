design_artifacts:
  state_transitions:
  - name: 标准启用状态
    states:
    - 启用
    - 禁用
    legal:
    - - 启用
      - 禁用
    - - 禁用
      - 启用
    illegal: []
    notes: 仅主记录状态切换；无审核态
  decision_tables:
  - name: 列表查询组合
    conditions:
    - 标准名称关键字
    - 状态
    rules:
    - when: 仅名称有值
      expect: 列表名称模糊匹配
    - when: 仅状态=启用或禁用
      expect: 列表状态精确过滤
    - when: 名称+状态同时有值
      expect: 同时满足
    - when: 重置
      expect: 条件清空，列表恢复默认
  - name: 导入日龄合法性（摘要）
    conditions:
    - 日龄范围
    - 日龄重复
    - 数值格式
    rules:
    - when: 全部合法且含 0–42
      expect: 导入成功可回写
    - when: 存在>42或负数
      expect: 导入失败并提示（需求明确范围校验）
    - when: 存在重复日龄
      expect: 失败或提示（与「不可重复」一致，具体文案待观察）
    - when: 非数字
      expect: 导入失败并提示
  bva_fields:
  - field: 日龄
    type: integer
    min: 0
    max: 42
    boundaries:
    - -1
    - 0
    - 1
    - 41
    - 42
    - 43
  - field: 日死淘率(%)
    type: decimal
    max: 100
    precision: 2
    boundaries:
    - -0.01
    - 0
    - 100
    - 100.01
  - field: 成活率(%)
    type: decimal
    max: 100
    precision: 2
    boundaries:
    - -0.01
    - 0
    - 100
    - 100.01
  - field: 目标湿度(%)
    type: number
    max: 100
    boundaries:
    - -1
    - 0
    - 100
    - 101
  - field: 日采食量(g)/日增重(g)/目标温度(℃)
    notes: precision=1；需求未给数值上下限，不虚构 max
  - field: 料肉比/水料比/风冷系数/湿热系数/成本类
    notes: precision=2；需求未给上下限，不虚构
  combinatorial_blocks:
  - name: Excel导入校验
    pict_eligible: true
    parameters:
      日龄范围:
      - 0-42合法
      - 存在超出42
      - 存在负数
      重复日龄行:
      - 无重复
      - 存在重复
      行数完整性:
      - 43行完整
      - 缺行
      - 多行
      数值格式:
      - 全部合法
      - 存在非数字
      - 存在负数值
    constraints:
    - IF 日龄范围=存在超出42 THEN 导入失败
    - IF 日龄范围=存在负数 THEN 导入失败
    - IF 重复日龄行=存在重复 THEN 导入失败
    - IF 数值格式=存在非数字 THEN 导入失败
  - name: 列表查询
    pict_eligible: false
    notes: 仅 2 个查询条件，用 decision_tables 即可，不跑 PICT
