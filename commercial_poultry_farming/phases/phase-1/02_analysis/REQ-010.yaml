id: REQ-010
title: 死淘统计
zentao_module_id: 659
page_url: /biopark-poultry/report/death-stats
trace:
  story: null
  req: null
  tp: null
  project: 商品禽养殖
  version: 1
  status: draft

module_complexity: query_report
testpoint_template: 查询报表

summary: >
  【本次测试范围外·不生成测点】
  按栋舍 + 上苗日期查询，以“栋舍养殖批次”为行、“0-42 日龄”为列展示死淘矩阵，
  支持色阶切换与“显示用药”开关，行尾含合计/死淘数/死淘率，支持导出。需求说明书
  3.8 无本模块专章，本分析以原型实测（禅道模块 659、原型 /biopark-poultry/report/death-stats）
  为准，需求缺口记入 open_questions，不脑补业务口径。

in_scope:
  - 按栋舍 + 上苗日期查询死淘矩阵
  - “显示用药”开关控制矩阵是否叠加展示用药信息
  - 0-42 日龄矩阵单元格数值展示 + 色阶视觉切换
  - 合计、死淘数、死淘率列展示
  - 导出当前查询结果

out_scope:
  - 死淘数据的新增/编辑/删除（本模块为只读报表）
  - 死淘巡检（REQ-004）、饲养日志（REQ-005）原始死淘记录的录入
  - 用药记录本身的管理功能（未见独立菜单，本模块仅涉及“显示”）

business_rules:
  - 查询条件：栋舍（下拉）+ 上苗日期（日期）+ 显示用药（勾选开关）
  - 矩阵按“栋舍养殖批次”为行、“0～42 日龄”为列（共 43 个日龄列），每格数值语义（当日死淘数 or 累计死淘数）需人工核实，见 open_questions
  - 死淘率(%) 疑似引用需求第4章“日死淘率”类似口径，但矩阵展示可能为批次累计口径，需澄清（见 open_questions）
  - 死淘数据来源：死淘巡检（REQ-004）逐日记录 / 饲养日志（REQ-005）逐日死亡淘汰数
  - “色阶”按钮用于切换矩阵单元格的颜色分档视觉展示，具体阈值规则未在需求中定义

roles:
  - 生产主管
  - 养殖场长/养殖主管

interfaces:
  - 死淘巡检（REQ-004）：逐日死亡/淘汰/死淘数量数据来源
  - 饲养日志（REQ-005）：逐日死淘数据来源之一（与死淘巡检数据关系需人工核实是否有合并/去重逻辑）
  - 养殖标准（REQ-007）：0-42 日龄标准矩阵结构参考（列维度设计可能借鉴养殖标准的日龄行结构）

risks:
  - 需求说明书未编写本模块章节，业务口径全部依赖原型静态抓取，存在理解偏差风险
  - 矩阵单元格数值语义（当日值/累计值）不明确，直接影响测点的预期结果判定
  - “显示用药”开关叠加展示的具体交互方式未确认，可能低估或高估测点覆盖范围
  - 色阶阈值规则未定义，视觉类测点可能无法给出可判定的预期结果

open_questions:
  - 需求说明书 3.8 未编写死淘统计章节，本分析业务口径以原型能力为界，需人工进入原型核实后收窄结论
  - “显示用药”勾选后矩阵单元格如何展示用药信息（叠加图标/文字/独立行），原型静态抓取未能确认，需人工验证
  - “色阶”按钮具体色阶阈值规则（如死淘率分档对应的颜色区间）未定义
  - 矩阵单元格数值语义未确认：是“该日龄当日死淘数”还是“该日龄累计死淘数”，需人工核实（结合第4章“日死淘率”倾向为当日值，但需确认）
  - “合计”列与右侧“死淘数”列是否为同一指标（是否重复展示）需确认
  - 死淘巡检（REQ-004）与饲养日志（REQ-005）两处均记录死淘数据，本报表取数来源及去重/合并规则未定义

test_scope_suggestion:
  - 本次测试范围外：生产报表模块，本轮不生成测点/用例/执行；分析保留供跨模块引用
  - 查询条件覆盖：栋舍单选/全部、上苗日期边界（有数据日/无数据日）、显示用药开/关组合
  - 0-42 日龄矩阵列完整性（共43列）与合计/死淘数/死淘率的一致性核对
  - 色阶切换后视觉展示变化（若阈值规则确认后可细化判定）
  - 显示用药开关切换后矩阵展示内容差异
  - 导出功能：导出文件内容与当前查询筛选及矩阵列一致
  - 无匹配数据（如所选栋舍无批次）时的空态展示
  - "不生成“角色可查看”类测点（role_coverage=skip）"

prototype_verification:
  query_field_specs:
    - name: 栋舍
      control: select
      editable: true
      required: false
      options_source: 系统栋舍主数据
    - name: 上苗日期
      control: input
      editable: true
      required: false
      notes: 日期选择器
    - name: 显示用药
      control: radio
      editable: true
      required: false
      notes: 原型为勾选开关（checkbox），schema 无 checkbox 枚举，以 radio 近似记录，实际渲染以原型为准
  table_column_specs:
    - { name: 栋舍, order: 1 }
    - { name: 栋舍养殖批次, order: 2 }
    - { name: 合计, order: 3, notes: 与“死淘数”列关系待人工核实是否重复 }
    - { name: 0日龄, order: 4, group: 日龄矩阵(0-42) }
    - { name: 1日龄, order: 5, group: 日龄矩阵(0-42) }
    - { name: 2日龄~41日龄, order: 6, group: 日龄矩阵(0-42), notes: 中间日龄列（2～41）按序展开，此处合并记录以省略重复条目 }
    - { name: 42日龄, order: 7, group: 日龄矩阵(0-42) }
    - { name: 死淘数, order: 8 }
    - { name: 死淘率, order: 9 }
  computed_fields:
    - name: 死淘率
      formula: 死淘数/上苗数量×100%（推测引用第4章“日死淘率”类似口径，累计/当日口径未定义）
      editable: false
  save_validations: []
  ui_components:
    - pagination
    - cell_ellipsis_tooltip
    - export
  button_semantics:
    导出:
      action: export_list
      summary: 按当前查询条件导出死淘统计矩阵，是否保留色阶/用药标识未核实
    色阶:
      action: toggle_view
      summary: 切换矩阵单元格颜色分档视觉展示，阈值规则未定义（见 open_questions）
  page_chrome:
    title: 死淘统计
    view_tabs: []
    notes: [0-42日龄横向矩阵，含色阶视觉]
  role_coverage: skip

design_artifacts:
  decision_tables:
    - name: 死淘统计查询组合
      conditions: [栋舍, 上苗日期, 显示用药]
      rules: []
  bva_fields:
    - field: 日龄
      type: integer
      min: 0
      max: 42
      boundaries: [-1, 0, 1, 41, 42, 43]
      notes: 矩阵列维度为0-42日龄（43列），边界外日龄不应出现列
