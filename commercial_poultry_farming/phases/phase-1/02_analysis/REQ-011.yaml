id: REQ-011
title: 周内死淘
zentao_module_id: 660
page_url: /biopark-poultry/report/death-analysis
trace:
  story: null
  req: null
  tp: null
  project: 商品禽养殖
  version: 1
  status: draft

module_complexity: query_report
testpoint_template: 查询报表

summary: >
  【本次测试范围外·不生成测点】
  按“养殖批次”查询，以“日龄”为行、栋舍（及对应批次号）为列展示死淘透视表，支持
  导出。需求说明书 3.8 无本模块专章，本分析以原型实测（禅道模块 660、原型
  /biopark-poultry/report/death-analysis）为准，需求缺口记入 open_questions，
  不脑补业务口径。

in_scope:
  - 按养殖批次查询周内死淘透视表
  - 日龄 × 栋舍（批次）透视矩阵展示
  - 导出当前查询结果

out_scope:
  - 死淘数据的新增/编辑/删除（本模块为只读报表）
  - 死淘巡检（REQ-004）、饲养日志（REQ-005）原始死淘记录的录入

business_rules:
  - 查询条件仅“养殖批次”（下拉单选），原型未见日期范围等其他查询条件
  - 透视表行维度为“日龄”，列维度为栋舍编号与批次号混合展示（如 1栋、2栋…及 25092、26000 等纯数字批次号并列），列的生成规则未在需求中定义，见 open_questions
  - 死淘数据来源同 REQ-010（死淘巡检/饲养日志）

roles:
  - 生产主管
  - 养殖场长/养殖主管

interfaces:
  - 死淘巡检（REQ-004）：逐日死亡/淘汰/死淘数量数据来源
  - 饲养日志（REQ-005）：逐日死淘数据来源之一
  - 补栏确认（REQ-003）：栋舍养殖批次编号/批次号数据来源

risks:
  - 需求说明书未编写本模块章节，业务口径全部依赖原型静态抓取，存在理解偏差风险
  - 列名同时出现“栋舍编号”（如1栋）与“纯数字批次号”（如25092），二者对应关系不明，可能导致列头测点判定错误
  - “周内”统计口径未定义，可能影响查询预期结果的判断

open_questions:
  - 需求说明书 3.8 未编写周内死淘章节，本分析业务口径以原型能力为界，需人工进入原型核实后收窄结论
  - 列名同时出现“栋舍编号”（如1栋）与“批次号”（如25092、26000）混合，具体每列对应关系（是否为选定批次下按栋舍展开，或不同栋舍展示各自当前批次号列）未在原型说明中明确，需人工核实动态列生成规则
  - “周内”具体统计口径（自然周/最近7天/当前批次第几周）未定义
  - 矩阵数值单元格语义（死淘数/死淘率/死淘只数百分比）未在原型列名中体现，需人工确认
  - 查询“养殖批次”是否支持多选批次对比未明确（原型抓取为单选下拉）
  - 行维度“日龄”的取值范围（是否限定0-42，与养殖标准/死淘统计一致）未确认

test_scope_suggestion:
  - 本次测试范围外：生产报表模块，本轮不生成测点/用例/执行；分析保留供跨模块引用
  - 查询条件覆盖：养殖批次单选、有数据批次/无数据批次
  - 透视表行（日龄）与列（栋舍/批次）完整性核对
  - 矩阵单元格数值与死淘巡检/饲养日志原始数据的一致性核对（待数值语义确认后细化）
  - 导出功能：导出文件内容与当前查询批次一致
  - 无匹配数据时的空态展示
  - "不生成“角色可查看”类测点（role_coverage=skip）"

prototype_verification:
  query_field_specs:
    - name: 养殖批次
      control: select
      editable: true
      required: false
      options_source: 补栏确认（REQ-003）生成的栋舍养殖批次编号
      notes: 原型为下拉单选，是否支持模糊搜索未核实
  table_column_specs:
    - { name: 日龄, order: 1, notes: 透视表行维度，取值范围（是否0-42）待人工核实 }
    - { name: 栋舍/批次列(动态), order: 2, notes: "列名混合栋舍编号（如1栋）与批次号（如25092），动态生成规则见 open_questions" }
  save_validations: []
  ui_components:
    - pagination
    - cell_ellipsis_tooltip
    - export
  button_semantics:
    导出:
      action: export_list
      summary: 按当前查询的养殖批次导出周内死淘透视表
  page_chrome:
    title: 周内死淘
    view_tabs: []
    notes: [栋舍×日龄透视布局，列名含栋舍编号与批次号混合]
  role_coverage: skip

design_artifacts:
  bva_fields:
    - field: 日龄
      type: integer
      min: 0
      max: 42
      boundaries: [-1, 0, 1, 41, 42, 43]
      notes: 取值范围沿用死淘统计（REQ-010）/养殖标准（REQ-007）的0-42日龄口径推测，需人工核实是否一致
