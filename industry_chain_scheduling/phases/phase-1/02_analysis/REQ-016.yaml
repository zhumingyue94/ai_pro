scope:
  in: [栋舍排程明细表, 栋舍排程甘特视图, 月度热力日历, 年/月筛选, 图例, 共N栋, 空态]
  out: [排程新增/编辑, 栋舍策略配置, 智能推荐得分入口, 图表直接编辑]
requirements:
  data_source: REQ-004/REQ-005栋舍占用与分段日期，结合REQ-015栋舍档案
  roles: [园区总经理, 智控中心小组成员, 养殖区负责人]
  filters: 年、月；默认与制定排程计划月份一致
  count: 当月明细无数据时共0栋；有明细时计数与行数据一致；甘特/热力可跨月有其他月份数据
  legend: [1段, 2段, 3段, 消杀]
  detail_table: [栋舍, 状态, 1段补栏/转出/释放日期, 2段转进/转出/释放日期, 3段转进/转出/释放日期]
  gantt: 查询月前后一个月；栋舍/段纵轴；月份刻度/今日线横轴；缩小/标准/放大；展示养殖/消杀/间隔天数
  heatmap: 上月/当月/下月；栋舍·段纵轴；1~31日横轴；tooltip含栋号、段次、日期
  date_baseline:
    - 1段转进=补栏日；1段转出=补栏日+1段养殖天数-1；1段释放=补栏日+1段养殖天数+1段空栏天数-1
    - 2段转进=1段转出；2段转出=补栏日+1段养殖天数+2段养殖天数-1；2段释放=补栏日+1段养殖天数+2段养殖天数+2段空栏天数-1
    - 3段转进=2段转出；3段转出/出栏=补栏日+1段养殖天数+2段养殖天数+3段养殖天数-1；3段释放再加3段空栏天数
    - 同一栋舍下一批计划按最新排程计算.xlsx的释放日次日可转进说明处理
