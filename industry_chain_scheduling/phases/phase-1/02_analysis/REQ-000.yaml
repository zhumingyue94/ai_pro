id: REQ-000
title: 产业链生产排程系统总览
parent_req: null
zentao_module_id: null
page_url: /biopark-poultry/schedule/introduction
source: 产业链生产排程系统_产品需求文档.docx V1.0 + 排程+商品禽养殖.xmind + 原型系统 + 待澄清项确认清单
summary: 面向肉禽/种禽全产业链的排程管理平台，覆盖目标设定、分段养殖模版、日排程制定与审批、四类业务计划下推及多维运营看板，实现宰杀→补栏→孵化→饲料倒推联动。
in_scope:
- 排程首页
- 目标制定
- 分段养殖模版
- 制定排程
- 排程审批
- 宰杀日看板
- 补栏日看板
- 孵化日看板
- 饲料日需求看板
- 栋舍补栏看板
- 达成看板
out_scope:
- 智慧园区门户其他子系统
- 移动端
- 商品禽养殖系统内部业务操作（仅作为数据源）
- 饲料生产计划、原料采购计划（由饲料系统结合库存与营养配比自行生成）
- 排程首页（REQ-001）本期测试范围外
- 已审核排程变更及跨系统工单删除（线下流程，系统内不实现）
business_rules:
- 主流程：目标制定→分段养殖模版→制定排程→排程审批→已下推→各看板
- 排程采用倒推：宰杀日期→补栏→孵化→饲料日需求
- 年出栏5000万只；单栋舍单批15万只；单宰杀线日宰杀15万只
- 排程编号：JH-YYYYMMDD-XX
- 审核通过自动下推四类计划
- 排程单据状态：暂存/待审核/已下推/驳回（「待排」为月度看板日历空位 UI 标签，非单据状态）
ui_copy_rules:
  dialog_title: 弹窗标题不做逐字强校验，语义等价即可（如审核/审批/审核年度目标）
  confirm_message: 确认框文案不做逐字强校验，语义通顺无歧义无错别字即可
audit_dialog_standard:
  initial_no_reason: true
  reject_confirm_reason_required: true
  approve_no_second_confirm: true
  applies_to:
  - REQ-002
  - REQ-003
  - REQ-005
roles:
- 园区总经理：目标/模版审核、统筹排程
- 智控中心小组成员：目标/模版/排程制定
- 宰杀场/养殖区/孵化场/饲料厂负责人：查看看板
permission_notes:
- 各角色菜单与按钮权限在平台其他系统中配置
- 权限专项测点/用例统一在 REQ-000（TP-000-17~56），业务模块仅引用
- 菜单权限与查询权限分开验证；各接口权限逐项单独建点
interfaces:
- 门户 http://43.143.148.114:18885/biopark-poultry/portal
- 商品禽养殖系统（养殖目标/标准数据；接收补栏/上苗下推；雏苗签收匹配）
- 各业务看板系统（接收宰杀/补栏/孵化/饲料日需求下推）
- 集团云星瀚（达成看板实际出栏数据来源之一）
- 平台其他系统（达成看板实际量数据推送）
risks:
- 跨系统数据依赖多，接口稳定性影响排程准确性
- 复杂日期/饲料计算公式回归成本高
- 角色权限依赖平台配置；总览要求专项校验页面按钮与接口权限（需多账号/多角色准备）
clarifications:
- id: Q-001
  question: 各角色菜单与按钮权限差异？
  conclusion: 平台其他系统中配置角色的菜单和接口权限；排程系统内按 REQ-000 权限契约专项校验菜单与各接口权限（见 TP-000-16 索引及 TP-000-17~56）
  date: '2026-07-14'
  revised_from: 原「本期不单独开展排程系统内角色权限矩阵测试」按人工调整版修订
- id: Q-002
  question: 首页「种禽养殖排程」卡片是否有对应功能？
  conclusion: 排除首页本期暂时不做，不纳入测试范围
  date: '2026-07-10'
- id: Q-003
  question: 已审核排程「提前2个月调整+删除已下推工单」如何操作？
  conclusion: 线下处理，不在系统测试范围
  date: '2026-07-10'
- id: Q-004
  question: 达成看板「实际量」取自哪个系统？刷新频率？
  conclusion: 实际量来自平台其他系统的数据推送，刷新频率待定
  date: '2026-07-10'
- id: Q-005
  question: 审批下推失败时状态回滚与重试机制？
  conclusion: 失败时按测试建议处理，测试点中标记（待定）
  date: '2026-07-10'
- id: Q-006
  question: 商品禽养殖接口异常时的降级策略？
  conclusion: 失败时按测试建议处理，测试点中标记（待定）
  date: '2026-07-10'
- id: Q-007
  question: 孵化周期读配置还是固定鸡21/鸭28天？
  conclusion: 孵化周期固定鸡21/鸭28天
  date: '2026-07-10'
- id: Q-008
  question: 月度看板「待排」与列表状态映射？
  conclusion: 该日期还没有任何宰杀线排程记录，只是日历上的「空位/未排产」展示，不是数据库里的单据状态
  date: '2026-07-10'
- id: Q-009
  question: 栋舍补栏看板甘特图交互与 tooltip 字段？
  conclusion: 暂定点击出现悬浮框展示补栏情况
  date: '2026-07-10'
- id: Q-010
  question: PRD 标注首页「待设计/二期」与原型已实现范围边界？
  conclusion: 排程首页本期不测试，本期只测试排程管理和排程看板下的菜单
  date: '2026-07-10'
open_questions:
- 达成看板实际量数据刷新频率？
- 下推失败、商品禽接口异常的具体实现细节（测试点标记待定）
- 模版审核通过后是否允许修订及历史版本引用规则（REQ-003）
- 批量审核与单日审核的权限是否一致（REQ-005）
- 首页统计指标计算口径与数据来源（REQ-001）
- 月度已分配超过年度目标时的展示与告警规则（REQ-011）
current_test_phase:
  in_scope_menus:
  - 排程管理（目标制定、分段养殖模版、制定排程、排程审批）
  - 排程看板（宰杀/补栏/孵化/饲料日需求/栋舍补栏/达成看板）
  out_of_scope_modules:
