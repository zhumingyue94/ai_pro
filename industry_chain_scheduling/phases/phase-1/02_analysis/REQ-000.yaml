organizational_context:
- 一园区仅一名总经理；养殖场/孵化场/饲料厂/食品厂无场区总经理，仅有生产主管/主任
- 园内：1个商品禽养殖场（多栋舍）、1个饲料厂、1个孵化场
- 园外：多个种禽养殖场、多条宰杀线
breed_constraints:
- 鸡品种最多2种
- 鸭固定樱桃谷
system_boundary:
- 产业链排程系统：负责园区级年度/月度/日计划制定、审批与下推
- 各业务系统：负责各中心详细生产排程的自行制定与执行
- 园区制定计划后，各中心严格按照计划执行
