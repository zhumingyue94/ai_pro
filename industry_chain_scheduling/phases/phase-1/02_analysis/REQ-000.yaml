- P1：排程管理主链路（目标→模版→制定→审批→下推）
- P1：各看板下推数据一致性
- P2：达成看板目标与实际对比
- 本期不测：排程首页（REQ-001）
- P3：按平台配置做角色权限专项校验（按钮/接口，见总览 TP-000-16）
