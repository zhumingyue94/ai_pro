  - field: 3段养殖天数
    type: computed
    formula: 整批-1段-2段
    notes: 弹窗内自动计算只读
  - field: 转运日龄
    type: computed
    formulas:
      1段: A1-1
      2段: A1+A2-1
      3段: A1+A2+A3-1
