    on_cancel: 关闭弹窗，不回填
  sub_tables:
  - id: 日龄采食计划
    parent: 新增模版弹窗
    columns:
    - 起
    - 止
    - 饲料
    - 占比
    row_ops:
    - 新增方案
    - 删除
    nested_rows:
