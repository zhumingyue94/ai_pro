design_artifacts:
  state_transitions:
  - name: 模版单据状态
    states:
    - 暂存
    - 待审核
    - 审核通过
    - 驳回
    legal:
    - from: 暂存
      to: 待审核
      trigger: 提交
    - from: 待审核
      to: 审核通过
      trigger: 审核通过
    - from: 待审核
      to: 驳回
      trigger: 驳回
    - from: 驳回
      to: 暂存
      trigger: 编辑后保存
    illegal:
    - from: 审核通过
      action: 编辑
      expected: 不可编辑
    - from: 审核通过
      action: 删除
      expected: 不可删除
    - from: 待审核
      action: 编辑
      expected: 非审核人仅查看
  decision_tables:
  - name: 列表查询
    conditions:
    - 模版名称
    - 品种
    - 补栏月份
    - 状态
    rules:
    - when: 单条件/多条件
      then: AND 组合过滤列表
  - name: 快速分配公式
    conditions:
    - A1
    - B1
    - A2
    - B2
    - A3
    - B3
    rules:
    - when: A1+B1=A2+B2=A3+B3
      then: 快速分配确认成功
    - when: 不相等
      then: 确认失败或提示调整
  - name: 日龄采食计划拓扑
    conditions:
    - 段区
    - 起
    - 止
    - 方案数
    rules:
    - when: 同段起止重叠
      then: 保存失败
    - when: 同段起止未连续覆盖
      then: 保存失败
    - when: 每段至少一方案且占比100%
      then: 校验通过
  - name: 品种月份唯一性
    conditions:
    - 品种
    - 补栏月份
    - 是否已存在
    rules:
    - when: 同品种同月已存在
      then: 保存/提交阻断
  bva_fields:
  - field: 饲料占比(%)
    type: percent
    boundaries:
    - 0
    - 0.01
    - 100
    - 100.01
    notes: 每方案合计100%
  - field: 日龄起/止
    type: integer_range
    boundaries:
    - 段边界
    - 重叠
    - 空档
  - field: 整批/各段养殖天数
