      - +增加
      - 删除
      options_filter: 仅启用饲料；同方案不可重复选同一饲料
    topology_rules:
    - 同段方案起止不重叠
    - 同段方案起止连续覆盖该段日龄采食周期
    - 1段：1≤起≤止≤1段养殖天数-1
    - 2段：1段养殖天数≤起≤止≤1段养殖天数+2段养殖天数-1
    - 3段：1段养殖天数+2段养殖天数≤起≤止≤1段+2段+3段养殖天数-1
  computed_fields:
  - name: 1段转运日龄
    formula: 1段养殖天数-1
  - name: 2段转运日龄
    formula: 1段养殖天数+2段养殖天数-1
  - name: 3段转运日龄
    formula: 1段+2段+3段养殖天数-1
