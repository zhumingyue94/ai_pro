id: REQ-003
title: 分段养殖模版
parent_req: REQ-000
zentao_module_id: 670
page_url: /biopark-poultry/schedule/template/feeding
module_complexity: compound_form
testpoint_template: 复合表单CRUD审核
summary: 定义不同品种、补栏月份的三段式养殖标准模版，含各段养殖/空栏天数、体重料比成活率及日龄采食计划（多饲料混合占比），供制定排程引用。
in_scope:
- 模版查询（名称/品种/补栏月份/状态）
- 新增/编辑/删除/提交/审核
- 审核通过模版复制（生成暂存副本）
- 快速分配（A1+B1=A2+B2=A3+B3）
- 从商品禽养殖系统带出体重/料比/成活率参考值
- 各段日龄采食计划（多方案、多饲料混合占比）
out_scope:
- 商品禽养殖系统内养殖目标数据的维护
business_rules:
- 状态：暂存/待审核/审核通过/驳回，操作规则同目标制定
- 最大养殖周期空栏天数=养殖天数最长一段的空栏天数
- 补栏当天为0日龄，满24小时计为1日龄
- 快速分配原则：A1+B1=A2+B2=A3+B3（A=养殖天数，B=空栏天数）
- 总养殖天数与各段养殖/空栏天数仅能通过快速分配填入，不可手工编辑
- 品种+补栏月份组合唯一，同组合已存在模版时不允许保存/提交
- 体重/料比/成活率带出值仅供参考，可手工调整
- 审核通过后原记录仅可查看与复制，不可编辑、不可删除、不可再次提交；复制生成新暂存模版
- 审核流多节点时列表展示全部审核人
interface_failure_handling:
- 引用/同步商品禽养殖数据失败时阻断保存或提交，提示错误
- 不允许静默使用空值、过期缓存或默认值继续计算
- 具体降级策略以开发为准，测试点标记「待定」
roles:
- 智控中心小组成员（制定）
- 园区总经理（审核）
interfaces:
- 页面 /biopark-poultry/schedule/template/feeding
- 商品禽养殖系统（品种+月份→养殖目标数据）
- 制定排程（引用模版自动计算各段日期）
risks:
- 与商品禽养殖系统数据同步失败或字段不一致
- 日龄采食计划配置复杂度高
clarifications:
- id: Q-006
  question: 商品禽养殖接口异常时的降级策略？
  conclusion: 失败时按测试建议处理，测试点中标记（待定）
  date: '2026-07-10'
open_questions:
- 模版审核通过后是否允许修订及历史版本引用规则？
test_scope_suggestion:
- P1：快速分配弹窗确认/取消、保存/提交/审核主流程
- P2：日龄采食计划拓扑、饲料占比、唯一性校验、转运日龄
- P2：引用商品禽养殖带出参考数据
- P3：分页、单元格省略悬浮、控件类型说明
- 待定：商品禽接口异常容错
