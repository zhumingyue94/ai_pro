      - 未分配
      - A+B不等
      日龄方案:
      - 完整覆盖
      - 缺方案
      - 占比非100%
    constraints:
    - IF 品种+月份冲突 THEN 保存<>成功
    - IF 未快速分配 THEN 保存<>成功
    - IF 占比非100% THEN 保存<>成功
