id: REQ-012
title: 品种管理
parent_req: REQ-000
zentao_module_id: null
page_url: /apm/bases/breed
module_complexity: standard_crud
testpoint_template: 标准CRUD审核
summary: '基础数据-品种管理：维护本系统品种主数据。支持按编码/名称/状态查询；手工新增与编辑； 行级/批量启用停用；批量删除（启用态不可删）；以及从数据中台「同步数据」引入源品种。
  无审核流、无独立查看页。当前中台同步接口异常导致同步弹窗无有效数据，同步主路径待接口恢复后验证。

  '
in_scope:
- 品种列表查询与重置
- 新增/编辑品种（弹窗确定/取消）
- 行级停用确认；批量启用/停用
- 批量删除及启用态拦截提示
- 同步数据弹窗壳层（关键字搜索/勾选/提交）；中台→本系统同步（依赖接口可用）
- 列表列展示（含源品种编码）、分页、刷新、表头设置
out_scope:
- 排程侧如何引用品种、停用品种对已有排程的联动规则（页面未提示，待确认后单列）
- 饲料/宰杀线/栋舍其它基础数据菜单（分属 REQ-013/014/015）
- 数据中台侧源数据维护本身
business_rules:
- 状态枚举：启用 / 停用
- 新增时品种编码系统预填（可改），品种名称必填；空提交时提示「品种名称不能为空」；状态默认启用（观察）
- 品种编码本表唯一：新增将编码改为库中已存在值时须唯一性拦截（文案待确认）
- 品种名称本表唯一：新增填已存在名称时须唯一性拦截（是否强制及文案待确认）
- 编辑时品种编码只读不可改；名称/状态/备注可改
- 行状态=启用时操作：编辑、停用；停用弹确认「确定要停用该品种吗？」
- 未勾选行时批量「删除/启用/停用」disabled；勾选后可点
- 批量删除：若所选均为启用状态 → toast「选择的数据均为启用状态，无法删除」（无确认框）；停用后是否可删待确认
- 「同步数据」：从数据中台选择源数据同步到本系统品种档案；未勾选时提交 disabled
- 中台「源数据编码」在本系统唯一（对应列表源品种编码）：已同步源再提交须冲突/跳过，不重复写入
- 同步批量勾选含新源与已存在源时：新源可写入、已存在源不重复（细则待确认）
- 同步结果与手工已存在品种编码冲突时按产品规则拦截或映射（待确认）
- 列表「源品种编码」预期与中台「源数据编码」回填相关（待接口恢复验证）
roles:
- 管理员账户（本次侦察唯一角色；其它角色矩阵未测）
interfaces:
- 页面 /apm/bases/breed
- 数据中台（同步数据弹窗拉源列表并提交写入本系统）
risks:
- 中台同步接口异常 → 同步有数路径无法验证，易漏测冲突/重复同步
- 启停后下游排程/模版是否仍可选停用品种：页面无提示
- 编码手工修改与自动生成规则冲突、唯一性校验文案未观察完整
open_questions:
- 中台接口修复后：同步成功/失败/已存在冲突文案与源品种编码回填规则？
- 同步混合勾选、与手工编码冲突时的精确产品规则？
- 停用后删除确认文案、是否物理删除？
- 新增/编辑弹窗正式标题文案？
- 品种名称唯一性是否强制及前后端文案？
- 多角色权限差异？
- 停用品种是否仍出现在排程「选择品种」等下游选项？
test_scope_suggestion:
- P1：新增保存成功；编辑编码只读；停用确认；启用态删除拦截
- P1：同步弹窗打开/关键字/未选提交 disabled（壳层）；接口恢复后补 P1 勾选提交与源编码回填（depends_on_data_hub）
- P2：查询组合（编码/名称/状态）与重置；批量启停；列表源品种编码展示
- P3：分页、刷新、表头设置、备注超长展示
- 禁止：虚构审核流/查看页；勿因接口异常删除同步测点
