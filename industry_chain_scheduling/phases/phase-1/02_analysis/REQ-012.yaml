design_artifacts:
  state_transitions:
  - name: 品种启用状态
    states:
    - 启用
    - 停用
    legal:
    - from: 启用
      to: 停用
      trigger: 行停用确认确定 / 批量停用
    - from: 停用
      to: 启用
      trigger: 批量启用（及预期行启用，待实察）
    illegal:
    - from: 启用
      action: 批量删除
      expected: toast 拦截，不可删
  decision_tables:
  - name: 列表查询
    conditions:
    - 品种编码
    - 品种名称
    - 状态
    rules:
    - when: 仅编码
      then: 按编码过滤
    - when: 仅名称
      then: 按名称过滤
    - when: 仅状态
      then: 按状态过滤
    - when: 多条件
      then: AND 组合过滤（以实现为准）
    - when: 重置
      then: 条件清空，列表恢复默认查询结果
  - name: 删除可否
    conditions:
    - 所选行状态集合
    rules:
    - when: 全为启用
      then: toast「选择的数据均为启用状态，无法删除」
    - when: 含停用
      then: 删除确认或成功路径（未观察，待测）
  - name: 工具栏批量按钮
    conditions:
    - 勾选条数
    rules:
    - when: 已选 0 条
      then: 删除/启用/停用 disabled
    - when: 已选 ≥1 条
      then: 删除/启用/停用可点
  - name: 同步提交
    conditions:
    - 是否勾选中台行
    - 中台接口状态
    rules:
    - when: 未勾选
      then: 提交 disabled
    - when: 已勾选且接口正常
      then: 提交写入本系统（待接口恢复验证）
    - when: 接口异常
      then: 弹窗无有效数据，无法完成有数同步
  bva_fields:
  - field: 品种名称
    type: string
    notes: 列表存在超长名称样例；空串触发必填校验
    boundaries:
    - 空
    - 1字符
    - 常规长度
    - 超长
  - field: 品种编码
    type: string
    notes: 新增预填可改；编辑只读；唯一性边界待确认
    boundaries:
    - 系统预填值
    - 手工修改值
    - 空（若允许清空时的校验，待测）
  - field: 备注
    type: string
    notes: 非必填；列表有超长备注样例
    boundaries:
    - 空
    - 常规
    - 超长
  combinatorial_blocks:
  - name: 列表查询三条件
    pict_eligible: false
    notes: 仅 3 个查询参数，未达 pict 阈值 4；TestPoint 用决策表/等价类即可
    parameters:
      品种编码:
      - 有匹配
      - 无匹配
      - 空
      品种名称:
      - 有匹配
      - 无匹配
      - 空
      状态:
      - 启用
      - 停用
      - 空
  - name: 同步数据弹窗（接口可用时）
    pict_eligible: true
    notes: 依赖中台接口恢复；参数≥4 且交互，建议 PICT
    parameters:
      关键字:
      - 空
      - 有匹配编码或名称
      - 无匹配
      勾选行数:
      - 0
      - 1
      - 多行
      源是否已在本系统:
      - 新源
      - 已同步过
      操作:
      - 搜索
      - 重置
      - 取消
      - 提交
    constraints:
    - IF 勾选行数=0 THEN 提交不可用
