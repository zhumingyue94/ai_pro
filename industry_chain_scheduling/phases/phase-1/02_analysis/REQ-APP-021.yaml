id: REQ-005
title: 排程审批
parent_req: REQ-000
zentao_module_id: null
page_url: /biopark-poultry/schedule/plan-schedule/approval
summary: 对已提交排程进行月度/按日审核；详情页查看日计划明细后执行审核，通过自动下推宰杀/补栏/孵化/饲料四类业务计划。
in_scope:
- 列表查询（计划月份/状态/宰杀线）
- 查看详情进入月度看板+日计划明细
- 批量审核/按日勾选审核
- 审核通过自动下推四类计划
- 驳回须填写原因；同日多条宰杀线一并驳回
out_scope:
- 列表行直接审核（须进详情页）
- 饲料生产计划（饲料系统自行生成）
- 饲料原料采购计划（饲料系统自行生成）
business_rules:
- 列表仅展示待审核/审核通过(已下推)/驳回状态
- 审核最小维度：天；同日任一条宰杀线驳回则当天全部驳回
- 审核通过自动下推：宰杀计划、补栏计划、孵化计划、饲料日需求计划
- 驳回必须说明具体原因
- 已下推计划变更须走「调整排程审批流程」（线下处理部分见 REQ-004 out_scope）
calendar_ui_rules:
- 单据状态枚举：暂存/待审核/已下推/驳回（与列表一致）
- 「待排」：该日期尚无宰杀线排程记录时的日历空位 UI 标签，非数据库单据状态
- 有排程记录时，看板显示对应单据状态
integration_failure_handling:
- 审核通过触发下推；任一下游失败时界面明确报错，不静默成功
- 排程状态保持「待审核」或进入可识别的失败态（不回滚为已通过/已下推）
- 支持人工重试下推；部分成功场景需人工核对下游工单
- 具体实现以开发为准，测试点标记「待定」
roles:
- 园区总经理（审核）
- 智控中心小组成员（查看）
interfaces:
- 页面 /biopark-poultry/schedule/plan-schedule/approval
- 详情页 /plan-schedule/approval/view
- 各日看板（下推目标）
risks:
- 同日多宰杀线联动驳回边界
- 下推失败回滚与幂等
clarifications:
- id: Q-005
  question: 审批下推失败时状态回滚与重试机制？
  conclusion: 失败时按测试建议处理，测试点中标记（待定）
  date: '2026-07-10'
- id: Q-008
  question: 月度看板「待排」与列表状态映射？
  conclusion: 该日期还没有任何宰杀线排程记录，只是日历上的「空位/未排产」展示，不是数据库里的单据状态
  date: '2026-07-10'
open_questions:
- 批量审核与单日审核的权限是否一致？
test_scope_suggestion:
- P1：详情页审核通过/驳回及下推
- P1：同日多宰杀线联动驳回
- P2：批量审核与勾选审核
- P2：详情页展示饲料需求明细
- P2：月度看板状态展示（含「待排」空位）
- 待定：下推失败容错（见 integration_failure_handling）
