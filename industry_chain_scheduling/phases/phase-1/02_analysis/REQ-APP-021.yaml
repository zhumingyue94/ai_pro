design_artifacts:
  state_transitions:
  - name: 排程审批状态（列表可见）
    states:
    - 待审核
    - 已下推
    - 驳回
    legal:
    - from: 待审核
      to: 已下推
      trigger: 审核通过+下推成功
    - from: 待审核
      to: 驳回
      trigger: 审核驳回
    notes: 列表不展示暂存；制定页暂存记录在审批列表不可见
  - name: 下推失败态
    states:
    - 待审核
    - 下推失败
    notes: Q-005 待定：失败保持待审核或可识别失败态，禁止静默成功
  decision_tables:
  - name: 列表查询
    conditions:
    - 计划月份
    - 计划状态
    - 宰杀线
    rules:
    - when: 多条件
      then: AND 过滤；默认仅待审核/已下推/驳回
  - name: 同日多宰杀线驳回
    conditions:
    - 当日宰杀线条数
    - 驳回操作
    rules:
    - when: 同日任一条驳回
      then: 当天全部宰杀线一并驳回
  - name: 审核方式
    conditions:
    - 批量审核
    - 按日勾选
    - 全选
    rules:
    - when: 批量审核
      then: 选中多日/多线一并处理
    - when: 按日勾选
      then: 最小审核维度=天
  - name: 下推四类计划
    conditions:
    - 审核结果
    rules:
    - when: 通过
      then: 下推宰杀/补栏/孵化/饲料日需求
    - when: 驳回
      then: 须填原因，不下推
  - name: 批量审核弹窗
    conditions:
    - 操作
    rules:
    - when: 点击驳回
      then: 弹出驳回确认框，原因必填
    - when: 点击通过
      then: 无二次确认，直接下推
  bva_fields:
  - field: 驳回原因
    type: text
    boundaries:
    - 空
    - 最短有效
    - 超长文本
  - field: 勾选审核日数
    type: integer
    boundaries:
    - 0
    - 1
    - 当月全部
  combinatorial_blocks:
  - name: 列表查询
    pict_eligible: true
    parameters:
      计划月份:
      - 有数据月
      - 无匹配月
      - 空
      计划状态:
      - 待审核
      - 已下推
      - 驳回
      - 空
      宰杀线:
      - 线A
      - 线B
      - 空
  - name: 详情页审核
    pict_eligible: true
    parameters:
      审核动作:
      - 通过
      - 驳回
      同日宰杀线数:
      - '1'
      - '2'
      - 多
      下推结果:
      - 全部成功
      - 部分失败
      - 全部失败
      驳回原因:
      - 已填
      - 未填
    constraints:
    - IF 驳回且原因未填 THEN 提交<>成功
    - IF 下推失败 THEN 状态<>已下推
