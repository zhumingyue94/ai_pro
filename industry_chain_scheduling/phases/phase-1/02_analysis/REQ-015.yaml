id: REQ-015
title: 栋舍管理
parent_req: REQ-000
zentao_module_id: null
page_url: /apm/bases/house
module_complexity: standard_crud
testpoint_template: 标准CRUD审核
summary: '基础数据-栋舍管理：维护栋舍主数据。支持按编码/名称/状态查询；手工新增与编辑（类型、关联线体、面积、设计容量等）； 行级停用与批量启停删；以及从数据中台「同步数据」引入源栋舍。无审核流、无独立查看。
  关联线体当前为手输，未开引用弹窗。中台同步接口异常致弹窗无有效数据；同步表头实察含「品种名称」，接口恢复后需复核是否缺陷。

  '
in_scope:
- 栋舍列表查询与重置
- 新增/编辑栋舍（弹窗确定/取消）
- 行级停用确认；批量启用/停用/删除（启用态拦截按同类推断，待复核）
- 同步数据弹窗壳层；中台→本系统同步（依赖接口可用）
- 列表列展示、分页、刷新、表头设置
out_scope:
- 宰杀线主数据维护本身（REQ-014）
- 品种/饲料其它基础数据（REQ-012/013）
- 数据中台侧源数据维护
- 补栏看板对栋舍容量的消费细则（下游）
business_rules:
- 状态枚举：启用 / 停用
- 新增时栋舍编码系统预填（可改，前缀 DS…），栋舍名称必填；空提交提示「栋舍名称不能为空」
- 栋舍编码本表唯一：改为库中已存在编码须唯一性拦截（文案待确认）
- 栋舍名称本表唯一：填已存在名称须唯一性拦截（是否强制及文案待确认）
- 栋舍类型、关联线体编码/名称、面积(㎡)、设计容量(万只)：可编辑、非必填（观察）；类型为普通 input 非下拉
- 关联线体：手工输入，未观察到选择弹窗
- 编辑时栋舍编码只读；其余业务字段可改
- 行状态=启用时操作：编辑、停用；停用确认「确定要停用该栋舍吗？」
- 未勾选行时批量删除/启用/停用 disabled
- 批量删除启用态拦截：同类 toast 预期（本页未重复点删，待复核）
- 「同步数据」：从数据中台选源同步到本系统栋舍；未勾选提交 disabled；当前接口异常无有效行数据
- 中台「源数据编码」在本系统唯一：已同步源再提交须冲突/跳过，不重复写入
- 同步批量勾选含新源与已存在源时：新源可写入、已存在源不重复（细则待确认）
- 同步结果与手工已存在栋舍编码冲突时按产品规则拦截或映射（待确认）
roles:
- 管理员账户（本次侦察唯一角色；其它角色矩阵未测）
interfaces:
- 页面 /apm/bases/house
- 数据中台（同步数据弹窗）
- 宰杀线管理（关联线体手输对齐，待确认）
risks:
- 中台接口异常 → 同步有数路径无法验证；表头「品种名称」可能掩盖真实列结构
- 关联线体手输无校验 → 与宰杀线主数据不一致
- 停用栋舍对补栏/排程影响未提示
open_questions:
- 中台接口修复后：栋舍同步列是否应为栋舍字段？当前「品种名称」是否缺陷？
- 同步混合勾选、与手工栋舍编码冲突时的精确产品规则？
- 关联线体是否应改为引用宰杀线选择器？
- 栋舍类型取值规范（自由文本 vs 字典）？
- 同步成功后源字段落在哪一列、备注是否自动写「数据同步」？
- 停用后删除确认文案与是否物理删除？
- 面积/设计容量精度、上下限？
- 栋舍名称唯一性是否强制及前后端文案？
- 多角色权限差异？
test_scope_suggestion:
- P1：新增保存成功；编辑编码只读；停用确认；启用态删除拦截（复核）
- P1：同步弹窗打开/关键字/未选提交 disabled；接口恢复后补勾选提交与列名/回填（depends_on_data_hub）
- P2：查询/重置；关联线体手输展示；面积/容量录入；批量启停
- P3：分页、刷新、表头、备注「数据同步」历史痕迹观察
- 禁止：虚构审核/查看；勿因接口异常删除同步测点；勿把关联线体写成已有引用弹窗列集
