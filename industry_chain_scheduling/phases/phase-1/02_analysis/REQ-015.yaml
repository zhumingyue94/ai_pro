design_artifacts:
  state_transitions:
  - name: 栋舍启用状态
    states:
    - 启用
    - 停用
    legal:
    - from: 启用
      to: 停用
      trigger: 行停用确认确定 / 批量停用
    - from: 停用
      to: 启用
      trigger: 批量启用（及预期行启用，待实察）
    illegal:
    - from: 启用
      action: 批量删除
      expected: toast 拦截（待复核）
  decision_tables:
  - name: 列表查询
    conditions:
    - 栋舍编码
    - 栋舍名称
    - 状态
    rules:
    - when: 单条件或组合
      then: AND 过滤
    - when: 重置
      then: 清空恢复
  - name: 删除可否
    conditions:
    - 所选行状态集合
    rules:
    - when: 全为启用
      then: toast 拦截（待复核）
    - when: 含停用
      then: 删除确认或成功（未观察）
  - name: 工具栏批量按钮
    conditions:
    - 勾选条数
    rules:
    - when: 已选 0 条
      then: 删除/启用/停用 disabled
    - when: 已选 ≥1 条
      then: 可点
  - name: 同步提交
    conditions:
    - 是否勾选中台行
    - 中台接口状态
    rules:
    - when: 未勾选
      then: 提交 disabled
    - when: 已勾选且接口正常
      then: 提交写入本系统（待验证）
    - when: 接口异常
      then: 无有效数据，无法完成有数同步
  bva_fields:
  - field: 栋舍名称
    type: string
    boundaries:
    - 空
    - 1字符
    - 常规
    - 超长
  - field: 面积(㎡)
    type: decimal
    notes: 非必填
    boundaries:
    - 空
    - 0
    - 正数
    - 极大值
    - 负数
  - field: 设计容量(万只)
    type: decimal
    notes: 非必填；样例 10.0000 / 100.0000
    boundaries:
    - 空
    - 0
    - 正数
    - 极大值
    - 负数
  - field: 栋舍编码
    type: string
    notes: 新增预填可改；编辑只读
    boundaries:
    - 系统预填
    - 手工修改
    - 空
  combinatorial_blocks:
  - name: 列表查询三条件
    pict_eligible: false
    notes: 仅 3 查询参数
    parameters:
      栋舍编码:
      - 有匹配
      - 无匹配
      - 空
      栋舍名称:
      - 有匹配
      - 无匹配
      - 空
      状态:
      - 启用
      - 停用
      - 空
  - name: 同步数据弹窗（接口可用时）
    pict_eligible: true
    notes: 依赖中台接口；≥4 参数交互建议 PICT
    parameters:
      关键字:
      - 空
      - 有匹配
      - 无匹配
      勾选行数:
      - 0
      - 1
      - 多行
      源是否已在本系统:
      - 新源
      - 已同步过
      操作:
      - 搜索
      - 重置
      - 取消
      - 提交
    constraints:
    - IF 勾选行数=0 THEN 提交不可用
  - name: 新增扩展字段
    pict_eligible: false
    notes: 类型/线体/面积/容量组合用等价类即可
    parameters:
      栋舍类型:
      - 空
      - 有值
      关联线体:
      - 空
      - 有编码名称
      面积与容量:
      - 皆空
      - 仅面积
      - 仅容量
      - 皆有
