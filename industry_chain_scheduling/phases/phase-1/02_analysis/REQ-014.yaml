id: REQ-014
title: 宰杀线管理
parent_req: REQ-000
zentao_module_id: null
page_url: /apm/bases/slaughter-line
module_complexity: simple_config
testpoint_template: 简单配置
summary: '基础数据-宰杀线管理：维护宰杀线主数据。支持按编码/名称/状态查询；手工新增与编辑（含单日产能、排序）； 行级停用与批量启用/停用；批量删除（启用态不可删，本页未重复点删，按同类模块推断待执行复核）。
  无审核流、无独立查看、无「同步数据」入口。编码前缀观察似 SL…（与饲料编号撞型）。栋舍「关联线体」疑似引用本实体。

  '
in_scope:
- 宰杀线列表查询与重置
- 新增/编辑（弹窗确定/取消），含单日产能(万只)、排序
- 行级停用确认；批量启用/停用
- 批量删除及启用态拦截（执行阶段复核 toast）
- 列表列展示、分页、刷新、表头设置
out_scope:
- 数据中台同步（本菜单无入口）
- 品种/饲料/栋舍其它基础数据（REQ-012/013/015）
- 排程看板对宰杀线产能/排序的消费规则（下游，页面未详述）
business_rules:
- 状态枚举：启用 / 停用
- 新增时宰杀线编码系统预填（可改），宰杀线名称必填；空提交提示「宰杀线名称不能为空」
- 宰杀线编码本表唯一：改为库中已存在编码须唯一性拦截（文案待确认；与饲料编号同前缀时仍仅本表内唯一）
- 宰杀线名称本表唯一：填已存在名称须唯一性拦截（是否强制及文案待确认）
- 单日产能(万只)、排序：number，非必填（观察）
- 编辑时宰杀线编码只读；名称/产能/排序/状态/备注可改
- 行状态=启用时操作：编辑、停用；停用确认「确定要停用该宰杀线吗？」
- 未勾选行时批量「删除/启用/停用」disabled；勾选后可点
- 批量删除启用态拦截：同类 toast「选择的数据均为启用状态，无法删除」（本页未重复点删，待执行复核）
- 无「同步数据」按钮
roles:
- 管理员账户（本次侦察唯一角色；其它角色矩阵未测）
interfaces:
- 页面 /apm/bases/slaughter-line
- 潜在引用方：栋舍管理「关联线体编码/名称」；排程/看板选线（页面未展示完整规则）
risks:
- 编码与饲料同为 SL… 前缀，规则不明易混淆
- 停用后栋舍/排程仍引用该线的处理未提示
- 删除拦截仅按同类推断，执行未复核可能漏差
open_questions:
- 编码生成规则与饲料编号前缀是否共用序列？
- 排序字段用途（列表展示序 vs 业务优先级）？
- 与栋舍「关联线体」是否同一实体？手输还是应对齐本模块编码/名称？
- 新增状态默认值是否恒为启用？
- 停用后删除确认文案与是否物理删除？
- 单日产能精度/上下限与排程校验关系？
- 宰杀线名称唯一性是否强制及前后端文案？
- 是否规划中台同步入口？（当前无）
- 多角色权限差异？
test_scope_suggestion:
- P1：新增保存成功；编辑编码只读；停用确认；启用态删除拦截（复核 toast）
- P2：查询组合与重置；单日产能/排序录入与列表展示；批量启停
- P3：分页、刷新、表头设置、备注
- 禁止：虚构同步弹窗、审核流、查看页；勿写成排程看板模块
