design_artifacts:
  state_transitions:
  - name: 宰杀线启用状态
    states:
    - 启用
    - 停用
    legal:
    - from: 启用
      to: 停用
      trigger: 行停用确认确定 / 批量停用
    - from: 停用
      to: 启用
      trigger: 批量启用（及预期行启用，待实察）
    illegal:
    - from: 启用
      action: 批量删除
      expected: toast 拦截（待执行复核）
  decision_tables:
  - name: 列表查询
    conditions:
    - 宰杀线编码
    - 宰杀线名称
    - 状态
    rules:
    - when: 单条件或组合
      then: AND 过滤（以实现为准）
    - when: 重置
      then: 条件清空，列表恢复
  - name: 删除可否
    conditions:
    - 所选行状态集合
    rules:
    - when: 全为启用
      then: toast 拦截（待复核）
    - when: 含停用
      then: 删除确认或成功（未观察）
  - name: 工具栏批量按钮
    conditions:
    - 勾选条数
    rules:
    - when: 已选 0 条
      then: 删除/启用/停用 disabled
    - when: 已选 ≥1 条
      then: 删除/启用/停用可点
