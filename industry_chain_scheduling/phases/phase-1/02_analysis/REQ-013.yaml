design_artifacts:
  state_transitions:
  - name: 饲料启用状态
    states:
    - 启用
    - 停用
    legal:
    - from: 启用
      to: 停用
      trigger: 行停用确认确定 / 批量停用
    - from: 停用
      to: 启用
      trigger: 批量启用（及预期行启用，待实察）
    illegal:
    - from: 启用
      action: 批量删除
      expected: toast 拦截，不可删
  decision_tables:
  - name: 列表查询
    conditions:
    - 饲料编号
    - 饲料名称
    - 状态
    rules:
    - when: 仅编号
      then: 按编号过滤
    - when: 仅名称
      then: 按名称过滤
    - when: 仅状态
      then: 按状态过滤
    - when: 多条件
      then: AND 组合过滤（以实现为准）
    - when: 重置
      then: 条件清空，列表恢复默认查询结果
  - name: 删除可否
    conditions:
    - 所选行状态集合
    rules:
    - when: 全为启用
      then: toast「选择的数据均为启用状态，无法删除」
    - when: 含停用
      then: 删除确认或成功路径（未观察，待测）
  - name: 工具栏批量按钮
    conditions:
    - 勾选条数
    rules:
    - when: 已选 0 条
      then: 删除/启用/停用 disabled
    - when: 已选 ≥1 条
      then: 删除/启用/停用可点
  bva_fields:
  - field: 饲料名称
    type: string
    notes: 空串触发必填校验
    boundaries:
    - 空
    - 1字符
    - 常规长度
    - 超长
  - field: 饲料编号
    type: string
    notes: 新增预填可改；编辑只读；唯一性边界待确认
    boundaries:
    - 系统预填值
    - 手工修改值
    - 空（若允许清空时的校验，待测）
  - field: 备注
    type: string
    notes: 非必填
    boundaries:
    - 空
    - 常规
    - 超长
  combinatorial_blocks:
  - name: 列表查询三条件
    pict_eligible: false
    notes: 仅 3 个查询参数，未达 pict 阈值 4；TestPoint 用决策表/等价类即可
    parameters:
      饲料编号:
      - 有匹配
      - 无匹配
      - 空
      饲料名称:
      - 有匹配
      - 无匹配
      - 空
      状态:
      - 启用
      - 停用
      - 空
  - name: 启停删操作组合
    pict_eligible: false
    notes: 参数未满 4 或强依赖状态前置；用决策表覆盖
    parameters:
      行状态:
      - 启用
      - 停用
      操作:
      - 编辑
      - 停用确认
      - 批量启用
      - 批量删除
