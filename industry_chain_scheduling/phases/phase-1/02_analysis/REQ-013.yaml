id: REQ-013
title: 饲料管理
parent_req: REQ-000
zentao_module_id: null
page_url: /apm/bases/forage
module_complexity: simple_config
testpoint_template: 简单配置
summary: '基础数据-饲料管理：维护本系统饲料主数据。支持按编号/名称/状态查询；手工新增与编辑； 行级停用与批量启用/停用；批量删除（启用态不可删）。无审核流、无独立查看、当前
  UI 无「同步数据」入口。 编号前缀观察似 SL…（与宰杀线编码前缀撞型，规则待确认）。

  '
in_scope:
- 饲料列表查询与重置
- 新增/编辑饲料（弹窗确定/取消）
- 行级停用确认；批量启用/停用
- 批量删除及启用态拦截提示
- 列表列展示、分页、刷新、表头设置
out_scope:
- 数据中台同步（本菜单无入口；是否规划待确认，见 open_questions）
- 品种/宰杀线/栋舍其它基础数据（REQ-012/014/015）
- 分段养殖模版日龄采食计划中饲料占比配置的业务细节（下游引用，本页仅主数据）
business_rules:
- 状态枚举：启用 / 停用
- 新增时饲料编号系统预填（可改），饲料名称必填；空提交提示「饲料名称不能为空」
- 饲料编号本表唯一：改为库中已存在编号须唯一性拦截（文案待确认）
- 饲料名称本表唯一：填已存在名称须唯一性拦截（是否强制及文案待确认）
- 新增状态默认值：侦察未再次核对，疑似同品种默认启用（待确认）
- 编辑时饲料编号只读；名称/状态/备注可改
- 行状态=启用时操作：编辑、停用；停用确认「确定要停用该饲料吗？」
- 未勾选行时批量「删除/启用/停用」disabled；勾选后可点
- 批量删除：所选均为启用 → toast「选择的数据均为启用状态，无法删除」（无确认框）；停用后删除路径待确认
- 无「同步数据」按钮（与品种/栋舍不同）
roles:
- 管理员账户（本次侦察唯一角色；其它角色矩阵未测）
interfaces:
- 页面 /apm/bases/forage
- 潜在下游：分段养殖模版日龄采食计划、饲料日需求等（页面未提示引用规则）
risks:
- 停用饲料后下游模版/排程是否仍可选用：页面无提示
- 编号与宰杀线同为 SL… 前缀，易混淆或规则冲突
- 查询区是否含「备注」未定，测点易多写或漏写
open_questions:
- 查询区是否包含「备注」条件？（DOM 曾出现「请输入备注」，可能为弹窗残留）
- 新增状态默认值是否恒为启用？
- 饲料是否规划「从数据中台同步」？当前仅手工新增是否最终形态？
- 停用后删除确认文案与是否物理删除？
- 饲料名称唯一性是否强制及前后端文案？
- 多角色权限差异？
- 停用饲料在分段养殖模版选料中是否仍可选？
test_scope_suggestion:
- P1：新增保存成功；编辑编号只读；停用确认；启用态删除拦截
- P2：查询组合（编号/名称/状态）与重置；批量启停
- P3：分页、刷新、表头设置、备注展示
- 禁止：虚构同步数据弹窗、审核流、查看页；勿套用品种「源编码」列
