barn_allocation:
  mode: 双策略智能推荐
  strategies:
  - id: barn_order
    name: 栋舍顺序优先
    default: true
    score: max(0, 100 - d×5), d=候选栋号-b_min
  - id: min_gap
    name: 最小空闲优先
    score: max(0, 100 - MinGap×5)×80% + SeqScore×20%
  entries:
  - 栋舍分配策略配置
  - 栋舍排程明细
  - 智能推荐
  editable_states:
  - 待排
  - 暂存
  - 驳回
  readonly_states:
  - 待审核
  - 已下推
  precondition: 须先选择养殖品种并生成补栏日期
  conflict_rules: 当前补栏日>上一计划1段结束日 且 本计划1段结束日<下一计划1段补栏日；同日多宰杀线栋舍占用不冲突
  verification_entry: 智能分配弹窗
  score_doc: 01_requirements/栋舍分配最小缓冲与推荐得分逻辑说明.docx
  follow_up: 可在智能推荐中手动选择栋舍；保存默认策略作用于后续新增宰杀线
design_artifacts:
  state_transitions:
  - name: 排程单据状态流转
    states:
    - 暂存
    - 待审核
    - 已下推
    - 驳回
    legal:
    - from: 暂存
      to: 待审核
      trigger: 提交月度审核
    - from: 待审核
      to: 已下推
      trigger: 审批通过（排程审批模块，REQ-005）
    - from: 待审核
      to: 驳回
      trigger: 审批驳回（排程审批模块，REQ-005）
    - from: 驳回
      to: 暂存
      trigger: 编辑后再次保存
    - from: 驳回
      to: 待审核
      trigger: 提交月度审核
    illegal:
    - from: 已下推
      action: 编辑
      expected: 列表/详情不可进入编辑或保存被阻断
    - from: 已下推
      action: 删除
      expected: 删除不可用或操作被阻断
    - from: 待审核
      action: 编辑
      expected: 仅可查看，不可修改字段
    - from: 待审核
      action: 删除
      expected: 删除不可用或操作被阻断
  - name: 月度看板日历展示
    states:
    - 待排
    - 暂存
    - 待审核
    - 已下推
    - 驳回
    notes: 「待排」= 该日无任何宰杀线排程记录时的日历空位标签（Q-008），非单据状态
    legal:
    - condition: 该日无排程记录
      display: 待排
    - condition: 该日有排程记录
      display: 对应单据状态
  decision_tables:
  - name: 列表查询条件组合
    conditions:
    - 计划月份
    - 计划状态
    - 宰杀线
    rules:
    - when: 仅月份有值
      then: 列表仅展示所选月份排程
    - when: 仅状态有值
      then: 列表仅展示所选状态排程
    - when: 仅宰杀线有值
      then: 列表仅展示所选宰杀线排程
    - when: 多条件均有值
      then: 列表按 AND 组合过滤
    - when: 全部为空后点查询
      then: 展示默认范围全部记录（或当月，以实现为准）
  - name: 列表行操作按钮显隐
    conditions:
    - 单据状态
    rules:
    - when: 暂存
      then: 查看、编辑、删除均可用
    - when: 驳回
      then: 查看、编辑、删除均可用
    - when: 待审核
      then: 仅查看可用
    - when: 已下推
      then: 仅查看可用
  - name: 栋舍自动分配条件
    conditions:
    - 上一计划1段结束日
    - 当前补栏日
    - 本计划1段结束日
    - 下一计划1段补栏日
    rules:
    - when: 当前补栏日 > 上一计划1段结束日 且 本计划1段结束日 < 下一计划1段补栏日
      then: 按栋舍顺序自动分配成功
    - when: 当前补栏日 <= 上一计划1段结束日
      then: 与上一计划冲突，分配失败或提示调整
    - when: 本计划1段结束日 >= 下一计划1段补栏日
      then: 与下一计划冲突，分配失败或提示调整
  - name: 引用模版后字段带出
    conditions:
    - 是否引用分段养殖模版
    - 品种
    - 补栏月份
    rules:
    - when: 已引用且品种/月份匹配
      then: 补栏量、养殖天数、3段标准、日龄采食计划等自动带出
    - when: 未引用模版
      then: 保存/提交应被阻断或提示必选模版
    - when: 引用后修改品种或补栏月份
      then: 模版关联字段重新匹配或清空后重选
  bva_fields:
  - field: 排程编号流水号
    type: integer
    format: JH-YYYYMMDD-XX
    min: 1
    max: 99
    boundaries:
    - 0
    - 1
    - 99
    - 100
    notes: 按宰杀线保存当日计划时生成，同一日期多条宰杀线递增
  - field: 宰杀量(万只)
    type: decimal
    default: 15
    boundaries:
    - 0
    - 0.01
    - 15
    - 极大值
    notes: 默认15万可修改；0或负值应校验失败
  - field: 成活率(%)
    type: percent
    boundaries:
    - 0
    - 0.01
    - 100
    - 100.01
    notes: 补栏量=宰杀量/成活率
  - field: 孵化率(%)
    type: percent
    boundaries:
    - 0
    - 0.01
    - 100
    - 100.01
    notes: 参与上孵数量计算
  - field: 健雏率(%)
    type: percent
    boundaries:
    - 0
    - 0.01
    - 100
    - 100.01
    notes: 上孵数量=补栏量/孵化率/健雏率，精确到只
  - field: 上孵数量/补栏量精度
    type: integer_precision
    unit: 只
    boundaries:
    - 小数第3位四舍五入
    - 整数只
    notes: PRD 要求精确到只
  - field: 孵化周期(天)
    type: enum
    values:
      鸡: 21
      鸭: 28
    notes: 固定值，非读取孵化系统配置（Q-007）
  - field: 补栏日期
    type: date_formula
    formula: 宰杀日期 - 批次养殖总天数
    notes: 补栏当天为0日龄
  - field: 上孵日期
    type: date_formula
    formula: 补栏日期 - 孵化周期(鸡21/鸭28)
  combinatorial_blocks:
  - name: 列表查询
    pict_eligible: true
    parameters:
      计划月份:
      - 有数据月
      - 无匹配月
      - 空
      计划状态:
      - 暂存
      - 待审核
      - 已下推
      - 驳回
      - 空
      宰杀线:
      - 线A
      - 线B
      - 空
    constraints:
    - IF [计划月份] = "无匹配月" THEN [结果] = "空列表"
  - name: 制定页保存当日计划
    pict_eligible: true
    parameters:
      养殖品种:
      - 鸡
      - 鸭
      分段养殖模版:
      - 已引用
      - 未引用
      同日宰杀线数:
      - 1条
      - 2条
      必填完整性:
      - 完整
      - 缺必填
      成活率:
      - 有效
      - 边界0
      - 无效大于100
    constraints:
    - IF [分段养殖模版] = "未引用" THEN [保存结果] <> "成功"
    - IF [必填完整性] = "缺必填" THEN [保存结果] <> "成功"
    - IF [成活率] IN ("边界0", "无效大于100") THEN [保存结果] <> "成功"
    - IF [同日宰杀线数] = "2条" THEN [排程编号流水] = "01与02递增"
  - name: 栋舍分配与前后计划
    pict_eligible: true
    parameters:
      与上一计划关系:
      - 不冲突
      - 补栏日重叠
      与下一计划关系:
      - 不冲突
      - 1段结束重叠
      同日多宰杀线:
      - 否
      - 是
    constraints:
    - IF [与上一计划关系] = "补栏日重叠" THEN [栋舍分配] <> "成功"
    - IF [与下一计划关系] = "1段结束重叠" THEN [栋舍分配] <> "成功"
  - name: 月度看板状态展示
    pict_eligible: false
    parameters:
      该日是否有排程:
      - 无
      - 有
      单据状态:
      - 暂存
      - 待审核
      - 已下推
      - 驳回
    notes: 仅2参数交互，已由 coverage 模板覆盖
