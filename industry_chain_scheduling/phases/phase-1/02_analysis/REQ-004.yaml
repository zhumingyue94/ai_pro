id: REQ-004
title: 制定排程
parent_req: REQ-000
zentao_module_id: null
page_url: /biopark-poultry/schedule/plan-schedule/make-plan
summary: 以日为维度制定月度宰杀排程，填写宰杀信息后引用分段养殖模版自动带出补栏/孵化/饲料需求；支持月内逐日保存并以月度形式提交审核。
in_scope:
- 月度看板（日期/状态/宰杀线/宰杀量/栋舍/节假日提醒）
- 新增/编辑/删除（删除以宰杀线维度）
- 暂存/提交月度审核
- 排程编号自动生成 JH-YYYYMMDD-XX
- 栋舍智能分配（双策略配置 / 智能推荐 / 栋舍排程明细；可选手动选栋）
- 栋舍分配冲突规则（前后计划、同日多宰杀线；在智能分配弹窗验证）
- 饲料日需求量后台生成（查看/审核页展示）
- 展示当月目标宰杀量及已分配量（只读）
- 宰杀量默认15万只（可修改）
out_scope:
- 已下推业务计划工单的跨系统删除联动
- 节假日自动改期（仅提醒，人工决策）
- 已审核排程变更及跨系统工单删除（线下流程，系统内不实现、不测）
business_rules:
- 状态：暂存/待审核/已下推/驳回
- 暂存/驳回：可编辑、删除；待审核/已下推：可查看
- 排程编号：JH+日期(YYYYMMDD)+当日流水(01~99)，按宰杀线保存时生成，不可修改
- 同一日期可多条宰杀线；1宰杀计划→1补栏→1孵化(到栋舍)→多饲料需求
- 栋舍分配：冲突规则不变（当前补栏日>上一计划1段结束日 且 本计划1段结束日<下一计划1段补栏日）；验证入口为智能分配弹窗
- 栋舍分配策略：栋舍顺序优先（默认）/ 最小空闲优先；策略配置弹窗保存默认方案
- 养殖栋舍：待排/暂存/驳回可编辑；待审核/已下推只读；须先选品种并生成补栏日期
- 智能推荐得分：见栋舍分配最小缓冲与推荐得分逻辑说明.docx
- 补栏日期=宰杀日期-批次养殖总天数；孵化日期=补栏日期-孵化周期
- 孵化周期：固定鸡21天/鸭28天（已确认，非读取孵化系统配置）
- 补栏量=宰杀量/成活率；上孵数量=补栏量/孵化率/健雏率（精确到只）
- 提交审批后锁定，驳回后可编辑
- PRD「已审核调整需至少提前2个月走审批并删除已下推工单」为线下流程，系统内不实现
- 补栏当天为0日龄
- 制定原则：前后计划不冲突，并兼顾高效实现养殖转运分配
calendar_ui_rules:
- 单据状态枚举：暂存/待审核/已下推/驳回（与列表一致）
- 「待排」：该日期尚无宰杀线排程记录时的日历空位 UI 标签，非数据库单据状态
- 有暂存/待审核/已下推/驳回记录时，看板显示对应单据状态
interface_failure_handling:
- 引用/同步商品禽养殖数据失败时阻断保存或提交，提示错误
- 不允许静默使用空值、过期缓存或默认值继续计算
- 具体降级策略以开发为准，测试点标记「待定」
roles:
- 智控中心小组成员（制定）
interfaces:
- 页面 /biopark-poultry/schedule/plan-schedule/make-plan
- 分段养殖模版
- 目标制定
- 商品禽养殖系统
- 排程审批（提交入口）
risks:
- 日期/饲料计算公式复杂，边界精度（到只）易错
- 栋舍自动分配与多宰杀线同日冲突
clarifications:
- id: Q-003
  question: 已审核排程「提前2个月调整+删除已下推工单」如何操作？
  conclusion: 线下处理，不在系统测试范围
  date: '2026-07-10'
- id: Q-006
  question: 商品禽养殖接口异常时的降级策略？
  conclusion: 失败时按测试建议处理，测试点中标记（待定）
  date: '2026-07-10'
- id: Q-007
  question: 孵化周期读配置还是固定鸡21/鸭28天？
  conclusion: 孵化周期固定鸡21/鸭28天
  date: '2026-07-10'
- id: Q-008
  question: 月度看板「待排」与列表状态映射？
  conclusion: 该日期还没有任何宰杀线排程记录，只是日历上的「空位/未排产」展示，不是数据库里的单据状态
  date: '2026-07-10'
open_questions:
- id: Q-SD-001
  question: 栋舍排程明细「共 N 栋」与明细表空态口径？
  conclusion: 明细表格当月无数据时显示「共 0 栋」；甘特/热力跨月仍有数据属预期；表格有数据时 N 与行数一致
  date: '2026-07-31'
- id: Q-SD-002
  question: 智能推荐是否存在「中间插入优先」第三策略？
  conclusion: 终稿仅栋舍顺序优先与最小空闲优先；探索期第三策略为过期界面，不纳入测试
  date: '2026-07-31'
test_scope_suggestion:
- P1：新增排程暂存/提交及编号生成
- P1：引用模版后补栏/孵化/饲料字段自动计算
- P1：栋舍自动分配与不冲突规则
- P2：月度看板日历切换与状态控制（含「待排」空位展示）
- P2：饲料日需求量生成与展示
- P3：节假日提醒展示
- 待定：商品禽接口异常容错
