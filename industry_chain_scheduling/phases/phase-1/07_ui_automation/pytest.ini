[pytest]
# 测试文件命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 把 07_ui_automation 加入 sys.path，使 config / pages / framework 可用绝对导入。
# 这一项替代了原先 tests/conftest.py、tests/run_case.py、tests/run_module.py 中
# 三处重复的 sys.path.insert 手工改路径写法。
pythonpath = .

# 自定义标签（用于精准回归）
markers =
    smoke: 冒烟测试
    module: 业务模块标签
    dependency: 代码依赖标签
    ui_case: 本框架 return-dict 用例（由 framework 自动标记）

# 命令行默认参数
# -p no:playwright 用于禁用 pytest-playwright 插件，原因有三：
#   1. 插件注册的 --headed 与本框架固定 headless=False 的硬约束语义冲突且会重复注册；
#   2. 插件的 autouse session fixture delete_output_dir 会对 --output 目录执行 shutil.rmtree；
#   3. 插件的 context/page 是 function 级，会破坏本框架 session 级共享登录态的设计。
# -p framework.plugin / -p framework.fixtures 加载本框架的钩子与夹具。
addopts = -v --tb=short --strict-markers -p no:playwright -p framework.plugin -p framework.fixtures

# 忽略目录
norecursedirs = .git .venv __pycache__ reports node_modules

filterwarnings = ignore::pytest.PytestReturnNotNoneWarning
