- id: TC-005-13
  tp_id: TP-005-13
  title: 统计卡片展示总计划数、待审核、驳回、审核通过数量
  type: auto
  auto: auto
  priority: P2
  feature: 统计卡片
  preconditions:
  - 使用智控中心测试账号登录系统
  - 进入「排程审批」页面（/biopark-poultry/schedule/plan-schedule/approval）
  - 按场景准备数据态（与验收点相关：统计卡片展示总计划数、待审核、驳回、审核通过数量）
  steps:
  - action: 选择月份，其他查询条件都留空，点击查询按钮然后查看统计区域
    expected: 统计卡片展示总计划数、待审核、驳回、已下推数量
  - action: 记录总计划数、待审核、驳回、审核通过的数量
    expected: 总计划数=N、待审核=D、驳回=F、审核通过=P
  - action: 进入[制定排程]菜单页，选择同月份，其他查询条件留空，点击查询按钮后查看表格数据。核对总计划数
    expected: 表格分页显示共N条=排程审批页面的总计划数N
  - action: 进入[制定排程]菜单页，[计划月份]选择同月份并且[计划状态]选待审核，其他查询条件留空，点击查询按钮后查看表格数据。核对待审核数量
    expected: 表格分页显示共D条=排程审批页面的待审核数D
  - action: 进入[制定排程]菜单页，[计划月份]选择同月份并且[计划状态]选驳回，其他查询条件留空，点击查询按钮后查看表格数据。核对驳回数量
    expected: 表格分页显示共F条=排程审批页面的驳回数F
  - action: 进入[制定排程]菜单页，[计划月份]选择同月份并且[计划状态]选审核通过，其他查询条件留空，点击查询按钮后查看表格数据。核对审核通过数量
    expected: 表格分页显示P条=排程审批页面的审核通过数P
